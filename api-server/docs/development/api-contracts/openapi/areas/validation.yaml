# Validation (contract validation.md; decision 081): the Validation Suite catalog (module-declared
# and user-defined suites), Validation Runs and their results, and Validation Schedules.
tags:
  - name: validation
    description: >-
      Validate deployed Servers and Platforms with Validation Suites: list the catalog, manage
      user-defined suites, start, list, read, and cancel Validation Runs, and manage Validation
      Schedules.
paths:
  /api/v1/validation/suites:
    get:
      tags: [validation]
      operationId: listValidationSuites
      summary: List the Validation Suite catalog.
      description: >-
        Reference: any authenticated User. Module suites first (by id), then user suites (by name); not
        paginated. Retired user suites are omitted unless `includeRetired=true`.
      parameters:
        - name: includeRetired
          in: query
          required: false
          description: Include retired user suites. Only the literal `true` enables it.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSuiteList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [validation]
      operationId: createValidationSuite
      summary: Create a user-defined Validation Suite (a script judged by its exit code).
      description: Requires the `admin` role. The suite starts at revision 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationUserSuiteRequest'
      responses:
        '201':
          description: The created suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSuite'
        '400':
          description: >-
            `validation_error`: the body is not valid JSON, the name or script is empty, the script
            is larger than 64 KiB, or `runAs`, `timeoutSeconds`, or `impact` is not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/validation/suites/{suiteId}:
    parameters:
      - $ref: '#/components/parameters/ValidationSuiteId'
    get:
      tags: [validation]
      operationId: getValidationSuite
      summary: Read one Validation Suite.
      description: 'Reference: any authenticated User. A retired user suite is still readable.'
      responses:
        '200':
          description: The suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSuite'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: no suite has this id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [validation]
      operationId: replaceValidationSuite
      summary: Replace a user-defined Validation Suite, creating its next revision.
      description: >-
        Requires the `admin` role. A change to the script, `runAs`, `timeoutSeconds`, or `impact`
        increments `revision`; runs already accepted keep the revision they ran.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationUserSuiteRequest'
      responses:
        '200':
          description: The replaced suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSuite'
        '400':
          description: '`validation_error`: as for create.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: no suite has this id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`conflict`: the suite is a module suite, which cannot be changed, or it is retired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [validation]
      operationId: deleteValidationSuite
      summary: Retire a user-defined Validation Suite.
      description: >-
        Requires the `admin` role. The suite leaves the catalog; its runs stay readable. Retiring a
        retired suite succeeds.
      responses:
        '204':
          description: The suite is retired.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: no suite has this id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`conflict`: the suite is a module suite, or a Validation Schedule names it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/validation/runs:
    get:
      tags: [validation]
      operationId: listValidationRuns
      summary: List Validation Runs, newest first.
      description: >-
        Pool read: any authenticated User; the result holds only what the caller may read. Runs sorted by `requestedAt` descending, paged, without their
        results (read a run for them). Every filter is optional and exact-match.
      parameters:
        - name: siteId
          in: query
          required: false
          description: Only runs belonging to this exact Site id. An unknown id returns an empty page.
          schema:
            type: string
        - name: suiteId
          in: query
          required: false
          schema:
            type: string
        - name: serverId
          in: query
          required: false
          description: Runs whose targets include this Server, or whose Platform has it as a member.
          schema:
            type: string
        - name: platformId
          in: query
          required: false
          schema:
            type: string
        - name: scheduleId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ValidationRunStatus'
        - name: verdict
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ValidationRunVerdict'
        - name: trigger
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ValidationTriggerKind'
        - name: active
          in: query
          required: false
          description: Only `pending` and `running` runs. Only the literal `true` constrains.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRunPage'
        '400':
          description: '`validation_error`: a `status`, `verdict`, or `trigger` value is not one of its values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [validation]
      operationId: startValidationRun
      summary: Start a Validation Run of a suite against deployed Servers or a Platform.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. Accepts the run and its `run-validation` Workflow in one
        transaction and returns 202 with the `pending` run; progress is read on the run (and its
        Workflow).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRunRequest'
      responses:
        '202':
          description: The run was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRun'
        '400':
          description: >-
            `validation_error`: the body is not valid JSON; `suiteId` is empty; a `servers` suite has
            no `serverIds`, a Server is listed twice, or `platformId` is set; a `platform` suite has no
            `platformId` or has `serverIds`; the parameters do not match the suite's schema; the
            Servers belong to more than one Site; or a `disruptive` suite is started without
            `confirm: true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: the suite (or a retired user suite), a target Server, or the Platform does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            `conflict`: a target Server is not `deployed`, is locked, or (for a `workload` or
            `disruptive` Servers suite) is claimed by a Platform; the Platform is not `active`, is not
            of the suite's Platform type, or has no access Server; or a target already has active
            durable work (another run's included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >-
            `provider_unavailable`: the targets' Site cannot run Ansible automation (no automation
            configuration, automation disabled, or no Deployment Key), or the Server Lock state of a
            target cannot be confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/validation/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/ValidationRunId'
    get:
      tags: [validation]
      operationId: getValidationRun
      summary: Read one Validation Run with its results.
      description: 'Pool read: an admin, or a User with any Pool Role in the Pool the resource belongs to.'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRun'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: no run has this id (it never existed or its retention ended).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/validation/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ValidationRunId'
    post:
      tags: [validation]
      operationId: cancelValidationRun
      summary: Cancel a report-mode Validation Run.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. Writes the cancel of the run's Workflow and returns 202 with the
        run; it ends `canceled` once the Workflow's cancel path finished.
      responses:
        '202':
          description: The cancel was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRun'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: no run has this id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`conflict`: the run already ended, or it is a gate run (cancel its deployment instead).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/validation/schedules:
    get:
      tags: [validation]
      operationId: listValidationSchedules
      summary: List Validation Schedules.
      description: Requires the `admin` role. Ordered by name; not paginated.
      parameters:
        - name: siteId
          in: query
          required: false
          description: Only schedules belonging to this exact Site id. An unknown id returns an empty list.
          schema:
            type: string
      responses:
        '200':
          description: Every schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationScheduleList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [validation]
      operationId: createValidationSchedule
      summary: Create a Validation Schedule.
      description: Requires the `admin` role. The schedule starts at generation 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationScheduleRequest'
      responses:
        '201':
          description: The created schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSchedule'
        '400':
          $ref: '#/components/responses/ValidationScheduleRejected'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: the suite, a target Server, or the Platform does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/validation/schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/ValidationScheduleId'
    get:
      tags: [validation]
      operationId: getValidationSchedule
      summary: Read one Validation Schedule.
      description: Requires the `admin` role.
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSchedule'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: no schedule has this id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [validation]
      operationId: replaceValidationSchedule
      summary: Replace a Validation Schedule's spec.
      description: >-
        Requires the `admin` role. Increments `generation`; with `generation` in the body the write
        applies only at that generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationScheduleRequest'
      responses:
        '200':
          description: The replaced schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSchedule'
        '400':
          $ref: '#/components/responses/ValidationScheduleRejected'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: the schedule, the suite, a target Server, or the Platform does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`conflict`: `generation` is not the schedule''s current generation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [validation]
      operationId: deleteValidationSchedule
      summary: Delete a Validation Schedule.
      description: Requires the `admin` role. Its runs stay readable.
      responses:
        '204':
          description: The schedule is deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: no schedule has this id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    ValidationSuiteId:
      name: suiteId
      in: path
      required: true
      description: A module suite's kebab-case id, or a user suite's UUID.
      schema:
        type: string
    ValidationRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ValidationScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationScheduleRejected:
      description: >-
        `validation_error`: the body is not valid JSON; the name or `suiteId` is empty; the targets do
        not fit the suite's target kind; the parameters do not match the suite's schema; the trigger
        kind is unknown, a `cron` trigger has an invalid expression or time zone, or an
        `after-deployment` trigger has a `cron`; or the Servers belong to more than one Site.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ValidationSuiteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValidationSuite'
    ValidationSuite:
      type: object
      description: >-
        A Validation Suite (glossary). A module suite's user-suite fields are null; a user suite's
        `module`, `platformType`, and `parameters` are null.
      required: [id, source, module, name, description, target, platformType, impact, checks, parameters,
        budgetSeconds, script, runAs, timeoutSeconds, revision, scriptSha256, experimental, retired, createdAt,
        updatedAt, createdBy]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [module, user]
        module:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ValidationSuiteModule'
        name:
          type: string
        description:
          type: string
        target:
          $ref: '#/components/schemas/ValidationTargetKind'
        platformType:
          type: string
          nullable: true
          description: The Platform type a `platform` suite validates.
        impact:
          type: string
          enum: [observe, workload, disruptive]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ValidationCheck'
        parameters:
          nullable: true
          description: The schema of the run parameters the suite accepts (the modules area's spec schema subset).
          allOf:
            - $ref: '#/components/schemas/ModuleSpecSchema'
        budgetSeconds:
          type: integer
          description: How long one report run may take before it is canceled.
        script:
          type: string
          nullable: true
        runAs:
          type: string
          nullable: true
          enum: [automation-user, root, null]
        timeoutSeconds:
          type: integer
          nullable: true
        revision:
          type: integer
          nullable: true
        scriptSha256:
          type: string
          nullable: true
        experimental:
          type: boolean
          description: >-
            A module suite offered as a preview whose checks may still change; it runs like any other.
            Always false for a user suite.
        retired:
          type: boolean
        createdAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        updatedAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdBy:
          type: string
          nullable: true
    ValidationSuiteModule:
      type: object
      required: [kind, id, version]
      properties:
        kind:
          type: string
          enum: [accelerator, platform, software, validation]
        id:
          type: string
        version:
          type: string
    ValidationCheck:
      type: object
      required: [id, title, description, gating]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        gating:
          type: boolean
          description: Whether a deployment that composes the suite as a gate fails when this check does not pass.
    ValidationTargetKind:
      type: string
      enum: [servers, platform]
    ValidationUserSuiteRequest:
      type: object
      additionalProperties: false
      required: [name, script]
      properties:
        name:
          type: string
        description:
          type: string
        script:
          type: string
          description: At most 64 KiB; run with its own interpreter line, or under /bin/sh without one.
        runAs:
          type: string
          enum: [automation-user, root]
          default: automation-user
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 600
        impact:
          type: string
          enum: [observe, workload, disruptive]
          default: workload
    ValidationRunRequest:
      type: object
      additionalProperties: false
      required: [suiteId]
      properties:
        suiteId:
          type: string
        serverIds:
          type: array
          items:
            type: string
          description: The target Servers of a `servers` suite.
        platformId:
          type: string
          description: The target Platform of a `platform` suite.
        parameters:
          type: object
          additionalProperties: true
          description: Run parameters, checked against the suite's `parameters` schema.
        confirm:
          type: boolean
          default: false
          description: Required to be true for a `disruptive` suite.
    ValidationRunStatus:
      type: string
      enum: [pending, running, completed, canceled]
    ValidationRunVerdict:
      type: string
      enum: [passed, failed, error]
    ValidationTriggerKind:
      type: string
      enum: [manual, schedule, deployment]
    ValidationRunSuite:
      type: object
      required: [id, source, name, version, revision, scriptSha256]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [module, user]
        name:
          type: string
        version:
          type: string
          nullable: true
          description: The declaring module's version, for a module suite.
        revision:
          type: integer
          nullable: true
          description: The revision a user suite ran.
        scriptSha256:
          type: string
          nullable: true
    ValidationRunTarget:
      type: object
      required: [kind, serverIds, platformId]
      properties:
        kind:
          $ref: '#/components/schemas/ValidationTargetKind'
        serverIds:
          type: array
          items:
            type: string
          description: The target Servers, or the Platform's access Servers the run entered through.
        platformId:
          type: string
          nullable: true
    ValidationRunTrigger:
      type: object
      required: [kind, scheduleId, workflowId]
      properties:
        kind:
          $ref: '#/components/schemas/ValidationTriggerKind'
        scheduleId:
          type: string
          nullable: true
        workflowId:
          type: string
          nullable: true
          description: The deployment Workflow that triggered the run (a gate, or a schedule after a deployment).
    ValidationRunCounts:
      type: object
      required: [passed, failed, error, skipped]
      properties:
        passed:
          type: integer
        failed:
          type: integer
        error:
          type: integer
        skipped:
          type: integer
    ValidationRunSummary:
      type: object
      description: A Validation Run without its results, as the list returns it.
      required: [id, siteId, suite, checks, target, parameters, mode, trigger, workflowId, status, statusReason,
        verdict, counts, requestedBy, requestedAt, startedAt, finishedAt]
      properties:
        id:
          type: string
        siteId:
          type: string
        suite:
          $ref: '#/components/schemas/ValidationRunSuite'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ValidationCheck'
        target:
          $ref: '#/components/schemas/ValidationRunTarget'
        parameters:
          type: object
          additionalProperties: true
        mode:
          type: string
          enum: [report, gate]
        trigger:
          $ref: '#/components/schemas/ValidationRunTrigger'
        workflowId:
          type: string
          description: The Workflow that executes the run (its own, or its deployment's in gate mode).
        status:
          $ref: '#/components/schemas/ValidationRunStatus'
        statusReason:
          type: string
          nullable: true
        verdict:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ValidationRunVerdict'
        counts:
          $ref: '#/components/schemas/ValidationRunCounts'
        requestedBy:
          type: string
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        finishedAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    ValidationRun:
      type: object
      description: A Validation Run (glossary) with every check's verdict on every target.
      required: [id, siteId, suite, checks, target, parameters, mode, trigger, workflowId, status, statusReason,
        verdict, counts, results, requestedBy, requestedAt, startedAt, finishedAt]
      properties:
        id:
          type: string
        siteId:
          type: string
        suite:
          $ref: '#/components/schemas/ValidationRunSuite'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ValidationCheck'
        target:
          $ref: '#/components/schemas/ValidationRunTarget'
        parameters:
          type: object
          additionalProperties: true
        mode:
          type: string
          enum: [report, gate]
        trigger:
          $ref: '#/components/schemas/ValidationRunTrigger'
        workflowId:
          type: string
        status:
          $ref: '#/components/schemas/ValidationRunStatus'
        statusReason:
          type: string
          nullable: true
        verdict:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ValidationRunVerdict'
        counts:
          $ref: '#/components/schemas/ValidationRunCounts'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        requestedBy:
          type: string
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        finishedAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    ValidationResult:
      type: object
      description: One check's verdict on one target.
      required: [check, target, verdict, summary, measurements, evidence, observedAt, taskId]
      properties:
        check:
          type: string
        target:
          $ref: '#/components/schemas/ValidationResultTarget'
        verdict:
          type: string
          enum: [passed, failed, error, skipped]
        summary:
          type: string
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/ValidationMeasurement'
        evidence:
          type: string
          description: A bounded, redacted excerpt of what the host printed; empty when there is none.
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        taskId:
          type: string
          nullable: true
          description: The Task that judged it; null for an `error` swallow recorded because no Task did.
    ValidationResultTarget:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [server, platform]
        id:
          type: string
    ValidationMeasurement:
      type: object
      required: [name, value, unit, expected]
      properties:
        name:
          type: string
        value:
          type: number
        unit:
          type: string
        expected:
          type: string
    ValidationRunPage:
      type: object
      description: The pagination envelope (conventions.md, Pagination) over Validation Runs.
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValidationRunSummary'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    ValidationScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValidationSchedule'
    ValidationScheduleTrigger:
      type: object
      required: [kind, cron, timezone]
      properties:
        kind:
          type: string
          enum: [cron, after-deployment]
        cron:
          type: string
          nullable: true
          description: Five fields (minute hour day-of-month month day-of-week), for a `cron` trigger.
        timezone:
          type: string
          nullable: true
          description: The IANA time zone the cron expression is read in; `UTC` when not set.
    ValidationScheduleSpec:
      type: object
      required: [name, suiteId, serverIds, platformId, parameters, trigger, enabled]
      properties:
        name:
          type: string
        suiteId:
          type: string
        serverIds:
          type: array
          items:
            type: string
        platformId:
          type: string
          nullable: true
        parameters:
          type: object
          additionalProperties: true
        trigger:
          $ref: '#/components/schemas/ValidationScheduleTrigger'
        enabled:
          type: boolean
    ValidationScheduleStatus:
      type: object
      required: [observedGeneration, nextRunAt, lastRunId, lastRunAt, lastSkipReason, conditions]
      properties:
        observedGeneration:
          type: integer
          format: int64
        nextRunAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        lastRunId:
          type: string
          nullable: true
        lastRunAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        lastSkipReason:
          type: string
          nullable: true
          description: Why the latest occurrence did not start a run (for example the target was busy).
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
    ValidationSchedule:
      type: object
      required: [id, siteId, generation, spec, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        siteId:
          type: string
        generation:
          type: integer
          format: int64
        spec:
          $ref: '#/components/schemas/ValidationScheduleSpec'
        status:
          $ref: '#/components/schemas/ValidationScheduleStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    ValidationScheduleRequest:
      type: object
      additionalProperties: false
      required: [name, suiteId, trigger]
      properties:
        name:
          type: string
        suiteId:
          type: string
        serverIds:
          type: array
          items:
            type: string
        platformId:
          type: string
        parameters:
          type: object
          additionalProperties: true
        trigger:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              type: string
              enum: [cron, after-deployment]
            cron:
              type: string
            timezone:
              type: string
        enabled:
          type: boolean
          default: true
        generation:
          type: integer
          format: int64
          description: On a replace, the generation the write expects (optional).
