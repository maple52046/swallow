                $ref: '#/components/schemas/WorkflowTaskRetryAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowTaskNotFound'
        '409':
          $ref: '#/components/responses/WorkflowTaskRetryConflict'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/operations/{id}/steps/{stepId}/logs:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/OperationStepId'
    get:
      tags: [workflows]
      operationId: getWorkflowTaskLogsViaDeprecatedAlias
      summary: Deprecated alias of GET /api/v1/workflows/{id}/tasks/{taskId}/logs.
      deprecated: true
      description: Requires the `admin` role. Identical to `getWorkflowTaskLogs`.
      responses:
        '200':
          description: The runner output.
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Link:
              $ref: '#/components/headers/SuccessorLink'
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/operations/{id}/steps/{stepId}/stderr:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/OperationStepId'
    get:
      tags: [workflows]
      operationId: getWorkflowTaskStderrViaDeprecatedAlias
      summary: Deprecated alias of GET /api/v1/workflows/{id}/tasks/{taskId}/stderr.
      deprecated: true
      description: Requires the `admin` role. Identical to `getWorkflowTaskStderr`.
      responses:
        '200':
          description: The error-only report.
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Link:
              $ref: '#/components/headers/SuccessorLink'
