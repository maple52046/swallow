          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Link:
              $ref: '#/components/headers/SuccessorLink'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyOperation'
        '400':
          $ref: '#/components/responses/WorkflowCreateRejected'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowCreateTargetNotFound'
        '409':
          $ref: '#/components/responses/WorkflowCreateConflict'
        '503':
          $ref: '#/components/responses/WorkflowCreateAutomationUnavailable'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [workflows]
      operationId: listWorkflowsViaDeprecatedAlias
      summary: Deprecated alias of GET /api/v1/workflows.
      deprecated: true
      description: Requires the `admin` role. Identical to `listWorkflows`.
      parameters:
        - $ref: '#/components/parameters/WorkflowSiteIdFilter'
        - $ref: '#/components/parameters/WorkflowPlatformIdFilter'
        - $ref: '#/components/parameters/WorkflowClusterIdFilter'
        - $ref: '#/components/parameters/WorkflowServerIdFilter'
        - $ref: '#/components/parameters/WorkflowKindFilter'
        - $ref: '#/components/parameters/WorkflowStatusFilter'
        - $ref: '#/components/parameters/WorkflowActiveFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of the merged history.
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Link:
              $ref: '#/components/headers/SuccessorLink'
          content:
            application/json:
