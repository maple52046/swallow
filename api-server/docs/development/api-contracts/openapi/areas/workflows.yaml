            Link:
              $ref: '#/components/headers/SuccessorLink'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOrLegacyOperation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowNotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/operations/{id}/timeline:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [workflows]
      operationId: getWorkflowTimelineViaDeprecatedAlias
      summary: Deprecated alias of GET /api/v1/workflows/{id}/timeline.
      deprecated: true
      description: Requires the `admin` role. Identical to `getWorkflowTimeline`.
      responses:
        '200':
