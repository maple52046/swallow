# Swallow-owned durable Workflows (decision 017): accept operator intent, observe a Workflow's
# Tasks, timeline, and Runner diagnostics, and control it (cancel, rerun, Task retry). Also the
# deprecated /operations alias, served by the same handlers for one release. Behavior semantics
# live in api-server/workflows.md and api-server/operations.md.
#
# Wire names still carry the pre-rename vocabulary (steps[], executor, operationId, the
# provisioner Runner serialized as `maas`); the schemas below describe that current wire.
tags:
  - name: workflows
    description: >-
      Durable Workflows (a DAG of Tasks run by Runners), their timeline and per-Task diagnostics,
      and the deprecated /operations alias.
paths:
  /api/v1/workflows:
    post:
      tags: [workflows]
      operationId: createWorkflow
      summary: Accept a single-Task Ansible Workflow against Servers of one Site.
      description: >-
        Requires the `admin` role. Persists the intent as a pending schema-v3 Workflow with one
        `ansible-playbook` Task and returns 202 before Temporal starts it. The response is the
        Workflow in the compatibility (Operation) shape, `LegacyOperation` with
        `schemaVersion` 3, not the full `Workflow` projection; read `GET /api/v1/workflows/{id}`
        for status, Tasks' live state, leases, and the Temporal reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '202':
          description: The intent was persisted; the Workflow starts asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyOperation'
        '400':
          $ref: '#/components/responses/WorkflowCreateRejected'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowCreateTargetNotFound'
        '409':
          $ref: '#/components/responses/WorkflowCreateConflict'
        '503':
          $ref: '#/components/responses/WorkflowCreateAutomationUnavailable'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [workflows]
      operationId: listWorkflows
      summary: List schema-v3 Workflows and schema-v2 history, newest first.
      description: >-
        Requires the `admin` role. Merges schema-v3 Workflows and historical schema-v2 records,
        sorted by `requestedAt` descending, then pages the merged list. Every filter is optional
        and exact-match; `total` counts both schema versions.
      parameters:
        - $ref: '#/components/parameters/WorkflowSiteIdFilter'
        - $ref: '#/components/parameters/WorkflowPlatformIdFilter'
        - $ref: '#/components/parameters/WorkflowClusterIdFilter'
        - $ref: '#/components/parameters/WorkflowServerIdFilter'
        - $ref: '#/components/parameters/WorkflowKindFilter'
        - $ref: '#/components/parameters/WorkflowStatusFilter'
        - $ref: '#/components/parameters/WorkflowActiveFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of the merged history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [workflows]
      operationId: getWorkflow
      summary: Read one Workflow, or one historical schema-v2 record.
      description: >-
        Requires the `admin` role. A schema-v3 Workflow is returned as `Workflow`, including the
        resources it currently owns; an ID that is only a schema-v2 record is returned as
        `LegacyOperation` with `schemaVersion` 2.
      responses:
        '200':
          description: The Workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOrLegacyOperation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowNotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}/timeline:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [workflows]
      operationId: getWorkflowTimeline
      summary: Read a Workflow's normalized, immutable state-transition events.
      description: >-
        Requires the `admin` role. Events are ordered by `createdAt`, then ID. A schema-v2
        record has no timeline and is `not_found`.
      responses:
        '200':
          description: The timeline; an empty array when nothing has been recorded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowTimelineEvent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowV3NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [workflows]
      operationId: cancelWorkflow
      summary: Cancel an unfinished Workflow.
      description: >-
        Requires the `admin` role. Returns 202 once the cancel request is stored; the worker delivers
        it, resuming the Workflow when its execution is gone, and the Workflow records `canceling`
        then `canceled`.
      responses:
        '202':
          description: The cancel request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowV3NotFound'
        '409':
          $ref: '#/components/responses/WorkflowControlConflict'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}/rerun:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [workflows]
      operationId: rerunWorkflow
      summary: Recover a Workflow that cannot advance by launching a new one for the same intent.
      description: >-
        Requires the `admin` role. Accepted for a `failed`, `partially_succeeded`, `canceled`, or
        `requires_attention` Workflow; the new Workflow's `retryOfOperationId` names the original.
        A `requires_attention` original is canceled in the same request. The new Workflow owns no
        resources yet, so `leases` is null in this response.
      responses:
        '202':
          description: The replacement Workflow was persisted and starts asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/WorkflowRerunRejected'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowV3NotFound'
        '409':
          $ref: '#/components/responses/WorkflowRerunConflict'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}/tasks/{taskId}/retry:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
    post:
      tags: [workflows]
      operationId: retryWorkflowTask
      summary: Retry one failed, retryable Task in place, at its next attempt.
      description: >-
        Requires the `admin` role. Accepted only when the Task is `failed` or
        `requires_attention` and its normalized error has `retryable` true. The retry is stored
        and applied by the Workflow, also after its execution was lost; a Task in a Job that
        retries as a whole runs that Job again.
      responses:
        '202':
          description: The retry was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskRetryAccepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowTaskNotFound'
        '409':
          $ref: '#/components/responses/WorkflowTaskRetryConflict'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}/tasks/{taskId}/logs:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
    get:
      tags: [workflows]
      operationId: getWorkflowTaskLogs
      summary: Read an Ansible Task's retained runner output.
      description: >-
        Requires the `admin` role. UTF-8 plain text; empty for a non-Ansible Task or one whose
        run has not started.
      responses:
        '200':
          description: The runner output.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}/tasks/{taskId}/stderr:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
    get:
      tags: [workflows]
      operationId: getWorkflowTaskStderr
      summary: Read an Ansible Task's error-only report.
      description: >-
        Requires the `admin` role. UTF-8 plain text with one block per failed or unreachable
        ansible task; empty when the Task recorded no failure or is not an Ansible Task.
      responses:
        '200':
          description: The error-only report.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}/tasks/{taskId}/events:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
    get:
      tags: [workflows]
      operationId: getWorkflowTaskEvents
      summary: Read an Ansible Task's per-host results, live while it runs.
      description: >-
        Requires the `admin` role. A non-Ansible Task, or one whose run has not started, returns
        an empty `events` list with an empty `runId`. Task output is never included.
      responses:
        '200':
          description: The per-host results and their counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskEvents'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/workflows/{id}/tasks/{taskId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
    get:
      tags: [workflows]
      operationId: listWorkflowTaskArtifacts
      summary: List a Task's retained artifact metadata.
      description: Requires the `admin` role. Metadata only; artifact bytes and server-side paths are never returned.
      responses:
        '200':
          description: The artifact metadata; an empty array when the Task retained none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowTaskArtifact'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'

  # Deprecated /operations alias (operations.md): the same handlers, plus the schema-v2
