# The Extension Modules compiled into the build and the spec schemas they declare (contract
# modules.md; decision 075).
tags:
  - name: modules
    description: >-
      Read the Extension Modules compiled into the running build, with the spec schema a module
      declares, so a client can render a generic settings form and details for a module it has no
      dedicated screens for.
paths:
  /api/v1/modules:
    get:
      tags: [modules]
      operationId: listModules
      summary: List the modules compiled into the running build.
      description: >-
        Requires the `admin` role. The list is fixed for the running build, ordered by kind and
        then id, and not paginated.
      responses:
        '200':
          description: Every module of the build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    ModuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Module'
    Module:
      type: object
      required: [kind, id, version, spec]
      properties:
        kind:
          type: string
          enum: [accelerator, platform, software, validation]
          description: What the module adds to swallow (glossary Extension Module).
        id:
          type: string
          description: >-
            The module's kebab-case id; a Software module's id is its Managed Software kind and a
            Platform module's id is its Platform type.
        version:
          type: string
          description: The module's SemVer version.
        spec:
          nullable: true
          description: >-
            The schema of the resource spec the module defines, as its manifest declares it, or
            null when it defines none. Properties keep the manifest's order.
          allOf:
            - $ref: '#/components/schemas/ModuleSpecSchema'
    ModuleSpecSchema:
      type: object
      description: >-
        The JSON Schema subset a module declares its spec with: one closed object of titled
        string, integer, boolean, and string-list settings. The server validates a spec against it;
        a blank string or an empty list counts as unset.
      required: [type, additionalProperties, properties]
      properties:
        type:
          type: string
          enum: [object]
        additionalProperties:
          type: boolean
          enum: [false]
        required:
          type: array
          description: Settings that must be set.
          items:
            type: string
        properties:
          type: object
          description: The settings, by spec key.
          additionalProperties:
            $ref: '#/components/schemas/ModuleSpecProperty'
    ModuleSpecProperty:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [string, integer, boolean, array]
        title:
          type: string
          description: The setting's label.
        description:
          type: string
          description: Help text for the setting.
        examples:
          type: array
          description: Sample values of the setting's type; a form shows the first as a placeholder.
          items: {}
        enum:
          type: array
          description: The values a string setting may take.
          items:
            type: string
        pattern:
          type: string
          description: >-
            A regular expression a non-blank string setting must match, in the syntax Go (RE2) and
            ECMAScript share.
        minimum:
          type: integer
          description: The smallest value of an integer setting.
        maximum:
          type: integer
          description: The largest value of an integer setting.
        items:
          type: object
          description: The item schema of a list setting; its items are strings.
          required: [type]
          properties:
            type:
              type: string
              enum: [string]
