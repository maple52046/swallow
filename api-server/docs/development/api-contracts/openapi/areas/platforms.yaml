components:
  parameters:
    PlatformId:
      name: id
      in: path
      required: true
      description: The Platform's opaque id.
      schema:
        type: string
    ApproveChange:
      name: approve
      in: query
      required: false
      description: >-
        `true` approves the Change Plan the write proposes with the write itself, unless the Change
        Plan policy requires a separate approval or the plan has blockers (change-plans.md,
        Approval On Submit). Ignored when the write proposes no plan.
      schema:
        type: boolean
    KubernetesNodeName:
      name: node
      in: path
      required: true
      description: The Kubernetes node name.
      schema:
        type: string
    KubernetesNamespaceName:
      name: namespace
      in: path
      required: true
      description: The Kubernetes namespace.
      schema:
        type: string
    KubernetesApplicationKind:
      name: kind
      in: path
      required: true
      description: The Kubernetes Application kind; any other value is 400.
      schema:
        $ref: '#/components/schemas/KubernetesApplicationKind'
    KubernetesObjectName:
      name: name
      in: path
      required: true
      description: The object's name within the namespace.
      schema:
        type: string
    KubernetesNamespaceScope:
      name: namespace
      in: query
      required: false
      description: >-
        Return only objects in this namespace. When omitted, every namespace is read and system
        namespaces are excluded unless `includeSystem` is true.
      schema:
        type: string
    KubernetesIncludeSystem:
      name: includeSystem
      in: query
      required: false
      description: >-
        Include system namespaces (`kube-system`, `kube-public`, `kube-node-lease`) when
        `namespace` is omitted. Only the literal `true` enables it.
      schema:
        type: boolean
        default: false
  schemas:
    PlatformType:
      type: string
      description: The kind of Platform.
      enum: [kubernetes, slurm]
    PlatformLifecycleState:
      type: string
      description: >-
        Platform Lifecycle State, derived by the API from durable Workflow history. `planned` is a
        Platform created from its spec whose install waits on its Change Plan. `registered` is the
        one-release compatibility state of records created before registration was removed.
      enum: [registered, planned, deploying, deploy_failed, active, uninstalling, uninstall_failed, uninstalled]
    NodeRole:
      type: string
      description: The part a Server plays in a Platform.
      enum: [control-plane, worker]
    KubernetesTopology:
      type: string
      description: >-
        The supported placement shape. For Slurm, one controller reads as `standalone` and more
        than one as `high-availability`.
      enum: [standalone, multi-node, high-availability]
    GPUStackOwner:
      type: string
      description: Which subsystem installs GPU drivers on the Platform's hosts.
      enum: [provisioning, gpu-operator]
    GPUAllocationMode:
      type: string
      description: How the GPU Operator exposes GPUs.
      enum: [device-plugin, dra]
    GPUResourceNaming:
      type: string
      description: >-
        Device plugin resource names: `single` always uses `amd.com/gpu`; `mixed` names
        partitioned GPUs per partition type.
      enum: [single, mixed]
    GPUOperatorState:
      type: string
      description: Where the latest swallow change to the GPU Operator stands.
      enum: [installing, ready, failed, uninstalling, absent]
    ObservabilityInstallMethod:
      type: string
      description: >-
        How a Slurm deploy installs the Platform's Grafana on the primary controller: `container`
        on its container runtime, or `native` from Grafana's package repository.
      enum: [container, native]
    OmnistatState:
      type: string
      description: Omnistat State.
      enum: [installing, ready, failed, absent]
    HardwareCounterState:
      type: string
      description: Whether a compute node collects the Omnistat Hardware Counters.
      enum: [collecting, unavailable]
    HardwareCounterReason:
      type: string
      description: Why a compute node does not collect the Omnistat Hardware Counters.
      enum: [no_gpu, rocm_unsupported, glibc_too_old, artifact_unavailable, probe_failed, exporter_failed]
    DeviceMetricsExporterState:
      type: string
      description: Device Metrics Exporter State; same meaning and fence as the Omnistat State.
      enum: [installing, ready, failed, absent]
    ContainerRuntime:
      type: string
      description: The container runtime a Slurm deploy installs on its compute and login nodes.
      enum: [docker-ce, podman]
    TimeSyncCheck:
      type: string
      description: >-
        What a node with an unsynchronized clock does to the install: `enforce` fails it before
        anything is installed, `warn` reports it and continues.
      enum: [enforce, warn]
    KubernetesApplicationKind:
      type: string
      description: The workload kind a Kubernetes Application aggregates; a bare Pod is `Pod`.
      enum: [Deployment, DaemonSet, StatefulSet, Pod]

    Platform:
      type: object
      description: A swallow-deployed (or legacy registered) Kubernetes or Slurm Platform.
      required:
        - id
        - siteId
        - name
        - type
        - integrationId
        - origin
        - lifecycleState
        - lifecycleOperationId
        - deployment
        - gpuStackOwner
        - monitoringLinks
        - gpuOperator
        - omnistat
        - deviceMetricsExporter
        - containerRuntime
        - gpuDriver
        - gpuGresType
        - ociContainers
        - pmix
        - sync
        - generation
        - spec
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        siteId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/PlatformType'
        integrationId:
          type: string
          nullable: true
          description: >-
            The credential Integration; null before a deployment produces one and again after a
            successful uninstall removes it.
        origin:
          type: string
          description: >-
            `deployed` for every new Platform; `registered` only for records created before the
            register-existing path was removed (decision 032).
          enum: [registered, deployed]
        lifecycleState:
          $ref: '#/components/schemas/PlatformLifecycleState'
        lifecycleOperationId:
          type: string
          nullable: true
          description: The newest deployment or uninstall Workflow, or null.
        deployment:
          nullable: true
          description: >-
            The non-secret topology intent of the latest deployment Workflow; null for registered
            Platforms and legacy history that cannot be projected completely.
          allOf:
            - $ref: '#/components/schemas/PlatformDeploymentIntent'
        gpuStackOwner:
          $ref: '#/components/schemas/GPUStackOwner'
        monitoringLinks:
          type: array
          description: User-registered Monitoring Links; always an array.
          items:
            $ref: '#/components/schemas/PlatformMonitoringLink'
        gpuOperator:
          nullable: true
          description: The swallow-managed GPU Operator; null when swallow never managed one here.
          allOf:
            - $ref: '#/components/schemas/PlatformGPUOperator'
        omnistat:
          nullable: true
          description: The swallow-managed Omnistat; null when never installed (always for Kubernetes).
          allOf:
            - $ref: '#/components/schemas/PlatformOmnistat'
        deviceMetricsExporter:
          nullable: true
          description: >-
            The swallow-managed Device Metrics Exporter; null when never installed (always for
            Kubernetes).
          allOf:
            - $ref: '#/components/schemas/PlatformDeviceMetricsExporter'
        containerRuntime:
          type: string
          nullable: true
          description: The Slurm container runtime feature; null when off (always for Kubernetes).
          enum: [docker-ce, podman, null]
        gpuDriver:
          nullable: true
          description: The user's amdgpu driver intent; null when the deploy requested none.
          allOf:
            - $ref: '#/components/schemas/PlatformGPUDriver'
        gpuGresType:
          type: string
          nullable: true
          description: >-
            The GRES type name a Slurm deploy gave every GPU node; null when it is derived per node
            from the GPU architecture (always for Kubernetes).
        ociContainers:
          type: boolean
          description: Whether a Slurm deploy set up native OCI containers; false for Kubernetes.
        pmix:
          type: boolean
          description: Whether a Slurm deploy installed the host MPI stack; false for Kubernetes.
        sync:
          $ref: '#/components/schemas/PlatformMembershipSync'
        generation:
          type: integer
          format: int64
          description: The spec generation; 0 before the Platform has a spec.
        spec:
          nullable: true
          description: >-
            The desired state; null until the platform controller adopts a Platform deployed before
            Platforms had specs.
          allOf:
            - $ref: '#/components/schemas/PlatformSpec'
        status:
          $ref: '#/components/schemas/PlatformStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PlatformSpec:
      type: object
      description: >-
        A Platform's desired state (platforms.md, Spec and status). Inline user data is never
        returned, only its mode.
      required: [desired, members, settings, machinePreparation, removal]
      properties:
        desired:
          type: string
          enum: [present, absent]
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlatformMember'
        settings:
          $ref: '#/components/schemas/PlatformSettings'
        machinePreparation:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlatformMachinePreparation'
        removal:
          nullable: true
          description: How an absent Platform's uninstall treats its members; null keeps them.
          allOf:
            - $ref: '#/components/schemas/PlatformRemovalChoice'
    PlatformMember:
      type: object
      description: >-
        One member and its roles in the type's vocabulary: `control-plane`, `worker`, and
        `workloads` (a control plane that also runs workloads) for Kubernetes; `controller`,
        `compute`, and `login` for Slurm.
      required: [serverId, roles]
      properties:
        serverId:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            type: string
    PlatformSettings:
      type: object
      additionalProperties: true
      description: >-
        The type's own fields: KubernetesPlatformSettings for `kubernetes`, SlurmPlatformSettings
        for `slurm`.
    PlatformRemovalChoice:
      type: object
      required: [releaseServers, erase, secureErase, quickErase, unbindStaticIps, cancelActiveWorkflows]
      properties:
        releaseServers:
          type: boolean
        erase:
          type: boolean
        secureErase:
          type: boolean
        quickErase:
          type: boolean
        unbindStaticIps:
          type: boolean
        cancelActiveWorkflows:
          type: boolean
    PlatformStatus:
      type: object
      description: >-
        What swallow realized and judged for the spec: the generation the applied spec realized,
        the shared Conditions (`realized`, `drifted`), the applied spec, and the Workflow realizing a
        newer one.
      required: [observedGeneration, conditions, applied, realizingWorkflowId, poolId]
      properties:
        observedGeneration:
          type: integer
          format: int64
        poolId:
          type: string
          nullable: true
          description: >-
            The Pool the Platform belongs to: the Pool every member of the spec (and every Server it
            still claims) is placed in; null when they are in different Pools or in none, and then
            only admins may manage it (identity-and-access.md §5).
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        applied:
          nullable: true
          description: The spec the last successful Workflow realized; null before the first install.
          allOf:
            - $ref: '#/components/schemas/PlatformSpec'
        realizingWorkflowId:
          type: string
          nullable: true
          description: The Workflow carrying out a newer generation, until it succeeds.
    PlatformSpecInput:
      type: object
      description: A spec as a client writes it; the settings follow the Platform's type.
      required: [members, settings]
      properties:
        members:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlatformMember'
        settings:
          $ref: '#/components/schemas/PlatformSettings'
        machinePreparation:
          $ref: '#/components/schemas/PlatformMachinePreparation'
    PlatformCreate:
      type: object
      required: [siteId, name, type, spec]
      properties:
        siteId:
          type: string
        name:
          type: string
          description: Unique within the Site.
        type:
          $ref: '#/components/schemas/PlatformType'
        spec:
          $ref: '#/components/schemas/PlatformSpecInput'
    PlatformSpecChange:
      type: object
      required: [generation, spec]
      properties:
        generation:
          type: integer
          format: int64
          description: The generation the spec was read at.
        spec:
          $ref: '#/components/schemas/PlatformSpecInput'
    PlatformSpecWrite:
      type: object
      description: A written spec and the Change Plan it waits on, null when no approval is needed.
      required: [platform, plan]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        plan:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChangePlan'
    PlatformDeploymentIntent:
      type: object
      description: The non-secret topology intent recovered from the latest deployment Workflow.
      required: [topology, roleAssignments]
      properties:
        topology:
          $ref: '#/components/schemas/KubernetesTopology'
        roleAssignments:
          type: array
          description: >-
            The original assignments. For Slurm a controller is `control-plane` (with
            `runWorkloads` when it also runs slurmd) and a compute-only node is `worker`; login
            nodes are not listed.
          items:
            $ref: '#/components/schemas/PlatformRoleAssignment'
        loginServerIds:
          type: array
          description: The Slurm login (submission) hosts; present only when the deploy assigned some.
          items:
            type: string
    PlatformRoleAssignment:
      type: object
      description: One deployment target's recorded Node Role and workload placement.
      required: [serverId, role, runWorkloads]
      properties:
        serverId:
          type: string
        role:
          $ref: '#/components/schemas/NodeRole'
        runWorkloads:
          type: boolean
          description: >-
            Whether a control-plane assignment also runs workloads; always false for a worker,
            which always runs workloads.
    PlatformMonitoringLink:
      type: object
      description: A Monitoring Link to the runtime's own monitoring UI; display data only.
      required: [name, url]
      properties:
        name:
          type: string
          maxLength: 64
          description: Trimmed, non-empty, unique within the Platform (case-insensitive).
        url:
          type: string
          maxLength: 2048
          description: An absolute `http` or `https` URL with a host.
    PlatformGPUOperator:
      type: object
      description: The latest requested GPU Operator settings and the state of the Workflow applying them.
      required:
        - enabled
        - version
        - allocationMode
        - draDriverVersion
        - resourceNaming
        - nodeLabeller
        - metricsExporter
        - state
        - lastWorkflowId
        - updatedAt
      properties:
        enabled:
          type: boolean
          description: The latest requested intent.
        version:
          type: string
        allocationMode:
          $ref: '#/components/schemas/GPUAllocationMode'
        draDriverVersion:
          type: string
          nullable: true
          description: Null unless `allocationMode` is `dra`.
        resourceNaming:
          $ref: '#/components/schemas/GPUResourceNaming'
        nodeLabeller:
          type: boolean
        metricsExporter:
          type: boolean
        state:
          $ref: '#/components/schemas/GPUOperatorState'
        lastWorkflowId:
          type: string
          nullable: true
          description: The Workflow applying, or last applying, the settings.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PlatformOmnistat:
      type: object
      description: The swallow-managed Omnistat of a Slurm Platform.
      required:
        - enabled
        - version
        - installMethod
        - observabilityServerId
        - state
        - hardwareCounters
        - lastWorkflowId
        - updatedAt
      properties:
        enabled:
          type: boolean
        version:
          type: string
        installMethod:
          $ref: '#/components/schemas/ObservabilityInstallMethod'
        observabilityServerId:
          type: string
          description: The primary controller, which hosts the Platform's Grafana.
        state:
          $ref: '#/components/schemas/OmnistatState'
        hardwareCounters:
          $ref: '#/components/schemas/PlatformOmnistatHardwareCounters'
        lastWorkflowId:
          type: string
          nullable: true
          description: The only Workflow that may move `state`.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PlatformOmnistatHardwareCounters:
      type: object
      description: >-
        The request for GPU hardware counters of the install `lastWorkflowId` names (a deployment, or a
        `configure-omnistat` Workflow that turned them on or off) and each compute node's outcome,
        recorded by that install once it succeeded.
      required: [requested, nodes]
      properties:
        requested:
          type: boolean
        nodes:
          type: array
          description: The compute nodes, sorted by `serverId`; empty until the install recorded them.
          items:
            $ref: '#/components/schemas/PlatformOmnistatHardwareCounterNode'
    PlatformOmnistatHardwareCounterNode:
      type: object
      required: [serverId, state, reason]
      properties:
        serverId:
          type: string
        state:
          $ref: '#/components/schemas/HardwareCounterState'
        reason:
          allOf:
            - $ref: '#/components/schemas/HardwareCounterReason'
          nullable: true
          description: Null while `collecting`.
    PlatformDeviceMetricsExporter:
      type: object
      description: The swallow-managed Device Metrics Exporter of a Slurm Platform.
      required:
        - enabled
        - version
        - installMethod
        - observabilityServerId
        - state
        - gpuIdentity
        - lastWorkflowId
        - updatedAt
      properties:
        enabled:
          type: boolean
        version:
          type: string
        installMethod:
          $ref: '#/components/schemas/ObservabilityInstallMethod'
        observabilityServerId:
          type: string
          description: The primary controller, which hosts the Platform's Grafana.
        state:
          $ref: '#/components/schemas/DeviceMetricsExporterState'
        gpuIdentity:
          type: string
          nullable: true
          description: >-
            Whether each GPU node's exporter reports one distinct `gpu_id` per GPU (`distinct`) or
            fewer (`collapsed`, per-GPU job attribution is wrong there); null until an install
            succeeded.
          enum: [distinct, collapsed, null]
        lastWorkflowId:
          type: string
          nullable: true
          description: The only Workflow that may move `state`.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PlatformGPUDriver:
      type: object
      description: >-
        The user's amdgpu module options for the Platform's GPU nodes. A name is lower-case
        letters, digits, and underscores (at most 64); a value is letters, digits, and `_.,:-` (at
        most 128); at most 16 options. Options a topology rule adds on a node are not listed.
      required: [moduleOptions]
      properties:
        moduleOptions:
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
    PlatformMembershipSync:
      type: object
      description: Membership read freshness.
      required: [lastStartedAt, lastSucceededAt, lastError, memberCount, matchedCount]
      properties:
        lastStartedAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        lastSucceededAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        lastError:
          type: string
          nullable: true
        memberCount:
          type: integer
        matchedCount:
          type: integer
          description: How many reported members matched a Server.
    PlatformMembershipReport:
      type: object
      description: The result of one membership read.
      required: [platformId, platformName, members, matched, cleared, unmatched, error]
      properties:
        platformId:
          type: string
        platformName:
          type: string
        members:
          type: integer
          description: How many members the Platform's API reported.
        matched:
          type: integer
          description: How many of them matched a Server.
        cleared:
          type: integer
          description: How many Servers lost a membership the Platform no longer reports.
        unmatched:
          type: array
          description: Names of members no Server matched.
          items:
            type: string
        error:
          type: string
          nullable: true
          description: Why the read failed; null on success.

    PlatformPoolMove:
      type: object
      description: A Platform's Pool after it was moved, with the placement spec of each of its Servers.
      required: [platformId, poolId, servers]
      properties:
        platformId:
          type: string
        poolId:
          type: string
          nullable: true
          description: The Pool every Server of the Platform is now in; `null` for no Pool.
        servers:
          type: array
          description: >-
            Every Server of the Platform (its spec's members and the Servers it still claims), ordered
            by `serverId`, with its placement spec after the request; a Server that was already in the
            Pool keeps its generation.
          items:
            $ref: '#/components/schemas/ServerPlacement'

    PlatformUpdate:
      type: object
      description: >-
        The mutable Platform fields; omitted (or null) fields do not change. There is no
        `integrationId`: a Platform's credential Integration is set only by its deployment.
      properties:
        name:
          type: string
          description: Trimmed; must not be empty.
        gpuStackOwner:
          $ref: '#/components/schemas/GPUStackOwner'
        monitoringLinks:
          type: array
          description: Replaces the whole list; `[]` clears it.
          maxItems: 10
          items:
            $ref: '#/components/schemas/PlatformMonitoringLink'
    PlatformRemoval:
      type: object
      description: The optional removal choices of a Delete; every field defaults to false.
      properties:
        releaseServers:
          type: boolean
          description: >-
            Release every member Server to the provider in the uninstall Workflow instead of removing
            the platform software first.
        releaseOptions:
          type: object
          description: Erase and static-IP options of each release; ignored unless `releaseServers`.
          properties:
            erase:
              type: boolean
            secureErase:
              type: boolean
            quickErase:
              type: boolean
            unbindStaticIps:
              type: boolean
        cancelActiveWorkflows:
          type: boolean
          description: Cancel every unfinished Workflow holding a member before the uninstall starts.

    KubernetesPlatformSettings:
      type: object
      description: >-
        The settings of a Kubernetes Platform. `podCidr`, `serviceCidr`, `apiVip`, and
        `apiVipPrefix` cannot change after creation; changing `k0sVersion`, `gpuStackOwner`, or
        `gpuDriver` is not carried out yet.
      required: [k0sVersion]
      properties:
        gpuStackOwner:
          allOf:
            - $ref: '#/components/schemas/GPUStackOwner'
          description: >-
            Defaults to `gpu-operator` when `gpuOperator.enabled` is true and to `provisioning`
            otherwise; `provisioning` with an enabled `gpuOperator` is 400.
        gpuOperator:
          $ref: '#/components/schemas/GPUOperatorSettings'
        gpuDriver:
          $ref: '#/components/schemas/PlatformGPUDriver'
        k0sVersion:
          type: string
          description: The k0s release to install, for example `v1.36.3+k0s.2`.
        podCidr:
          type: string
          default: 10.244.0.0/16
        serviceCidr:
          type: string
          default: 10.96.0.0/12
        apiVip:
          type: string
          description: The API virtual IP; required only for high availability.
        apiVipPrefix:
          type: integer
          minimum: 1
          maximum: 32
          description: >-
            The VIP's prefix length; for high availability it must equal the control-plane
            subnet's prefix and defaults to it (24 when the provisioner reports no subnet).
        timeSyncCheck:
          allOf:
            - $ref: '#/components/schemas/TimeSyncCheck'
          default: enforce
        monitoringDashboards:
          type: boolean
          default: true
          description: >-
            Give the Platform its own read-only Grafana in the cluster, at node port 30300 of the
            workload nodes, showing only its members' series through the Platform metrics gateway.
            Turning it on later is carried out; turning it off after deployment is 409.
    SlurmPlatformSettings:
      type: object
      description: >-
        The settings of a Slurm Platform. `slurm.clusterName` cannot change after creation. An
        enabled `gpuOperator` is 400 (Slurm has no in-platform GPU operator).
      properties:
        gpuStackOwner:
          allOf:
            - $ref: '#/components/schemas/GPUStackOwner'
          default: provisioning
        gpuDriver:
          $ref: '#/components/schemas/PlatformGPUDriver'
        slurm:
          $ref: '#/components/schemas/SlurmSettings'
        omnistat:
          allOf:
            - $ref: '#/components/schemas/SlurmOmnistatFeature'
          description: Install Omnistat; mutually exclusive with an enabled `deviceMetricsExporter`.
        deviceMetricsExporter:
          allOf:
            - $ref: '#/components/schemas/SlurmMonitoringFeature'
          description: >-
            Install AMD's Device Metrics Exporter on the GPU compute nodes; mutually exclusive
            with an enabled `omnistat`.
        containerRuntime:
          $ref: '#/components/schemas/SlurmContainerRuntime'
        timeSyncCheck:
          allOf:
            - $ref: '#/components/schemas/TimeSyncCheck'
          default: enforce
        monitoringDashboards:
          type: boolean
          default: true
          description: >-
            Give the Platform its own read-only Grafana on the primary controller, showing only its
            members' series through the Platform metrics gateway. Turning it on later is carried
            out; turning it off after deployment is 409.
    SlurmSettings:
      type: object
      description: >-
        The Slurm options; every field is optional. The members' roles are the topology: at least
        one controller and one compute member, and the first controller is the primary.
      properties:
        clusterName:
          type: string
          description: Defaults to a sanitized Platform name.
        apiVersion:
          type: string
          description: The slurmrestd endpoint version recorded in the credential, for example `v0.0.42`.
        stateSaveLocation:
          type: string
          description: Overrides the slurmctld state directory.
        workloadStorage:
          $ref: '#/components/schemas/SlurmWorkloadStorage'
        gpuGresType:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: The GRES type of every GPU node; omitted derives it from the GPU architecture.
        ociContainers:
          type: boolean
          default: false
        pmix:
          type: boolean
          default: false
    SlurmWorkloadStorage:
      type: object
      description: A shared filesystem for user and job data, mounted on every node.
      required: [mode]
      properties:
        mode:
          type: string
          description: >-
            `self-hosted` exports NFS from the login node (so it requires one); `external` mounts
            `nfs.url`.
          enum: [self-hosted, external]
        type:
          type: string
          enum: [nfs]
          default: nfs
        mountPath:
          type: string
          default: /shared
          description: An absolute path other than `/` and `/home`.
        nfs:
          type: object
          description: The NFS source; `url` is required for `external`.
          properties:
            url:
              type: string
              description: '`host:/path`.'
            mountOptions:
              type: string
    SlurmMonitoringFeature:
      type: object
      description: >-
        An optional Slurm monitoring feature; omitted or `enabled: false` installs nothing.
      properties:
        enabled:
          type: boolean
          default: false
        installMethod:
          allOf:
            - $ref: '#/components/schemas/ObservabilityInstallMethod'
          default: container
          description: >-
            How the Platform's Grafana is installed; without an enabled feature it uses `container`.
    SlurmOmnistatFeature:
      type: object
      description: >-
        Omnistat on a Slurm deploy; omitted or `enabled: false` installs nothing.
      properties:
        enabled:
          type: boolean
          default: false
        installMethod:
          allOf:
            - $ref: '#/components/schemas/ObservabilityInstallMethod'
          default: container
          description: >-
            How the Platform's Grafana is installed; without an enabled feature it uses `container`.
        hardwareCounters:
          type: boolean
          default: false
          description: >-
            Also collect GPU hardware counters (today `VALUBusy`) on each compute node that can; a node
            that cannot leaves them off and reports why, and the deployment does not fail.
    SlurmContainerRuntime:
      type: object
      description: The container runtime for every compute and login node; omitted installs none.
      properties:
        kind:
          $ref: '#/components/schemas/ContainerRuntime'
    PlatformMachinePreparation:
      type: object
      description: >-
        Whether the targets must already be deployed (`existing_os`) or the deploy provisions the
        `ready` ones first (`provision_os`). The provisioning fields follow the OS Deployment
        intent of provisioning.md and are read only in `provision_os` mode.
      properties:
        mode:
          type: string
          enum: [existing_os, provision_os]
          default: existing_os
        templateId:
          type: string
          description: A Deployment Template supplying defaults for the provisioned targets.
        settings:
          type: object
          properties:
            imageId:
              type: string
            deployTarget:
              type: string
              enum: [disk, ram]
              description: >-
                The deploy mode (matched case-insensitively). `ram` is a memory-backed root that
                leaves the disks untouched.
        userData:
          type: object
          description: Write-only user data for the provisioned targets.
          properties:
            mode:
              type: string
              enum: [inherit, replace, omit]
            value:
              type: string
              description: The user data for `replace`; never echoed.
        network:
          type: object
          description: >-
            The OS deployment network intent; a missing object or `mode` takes the Deployment
            Template's, or `automatic` without one.
          properties:
            mode:
              type: string
              enum: [automatic, dhcp, static]
            subnetId:
              type: string
            defaultGateway:
              type: boolean
            assignments:
              type: array
              items:
                type: object
                required: [serverId]
                properties:
                  serverId:
                    type: string
                  interfaceId:
                    type: string
                  subnetId:
                    type: string
                  ipAddress:
                    type: string

    GPUOperatorSettings:
      type: object
      description: >-
        The GPU Operator settings of a Kubernetes Platform; omitted or `enabled: false` installs no
        operator, and turning it off uninstalls it.
      properties:
        enabled:
          type: boolean
          description: True installs or changes the operator; false installs nothing or uninstalls it.
        version:
          type: string
          description: A `version` from the release catalog; defaults to the release marked `default`.
        allocationMode:
          allOf:
            - $ref: '#/components/schemas/GPUAllocationMode'
          default: device-plugin
        draDriverVersion:
          type: string
          description: >-
            Used only for `dra`; one of the release's `draDriverVersions`, defaulting to its
            `defaultDraDriverVersion`.
        resourceNaming:
          allOf:
            - $ref: '#/components/schemas/GPUResourceNaming'
          default: single
        nodeLabeller:
          type: boolean
          default: true
        metricsExporter:
          type: boolean
          default: false
          description: >-
            Run AMD's Device Metrics Exporter on the managed nodes' host network at port 5001,
            where the Site Prometheus scrapes it.
    GPUOperatorReleaseCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/GPUOperatorRelease'
    GPUOperatorRelease:
      type: object
      description: One AMD GPU Operator release swallow ships and has verified.
      required:
        - version
        - default
        - minKubernetesVersion
        - draMinKubernetesVersion
        - draDriverVersions
        - defaultDraDriverVersion
      properties:
        version:
          type: string
        default:
          type: boolean
          description: The release a setting without `version` uses.
        minKubernetesVersion:
          type: string
          description: The oldest Kubernetes minor version the release supports, for example `1.29`.
        draMinKubernetesVersion:
          type: string
          description: The oldest Kubernetes minor version `dra` supports.
        draDriverVersions:
          type: array
          items:
            type: string
        defaultDraDriverVersion:
          type: string

    MinimumResourceRequirement:
      type: object
      description: >-
        The system-wide Minimum Resource Requirement of a Platform type. While disabled,
        `minimumResources` is null; `updatedAt` is null only when it was never configured.
      required: [platformType, minimumResources, updatedAt]
      properties:
        platformType:
          type: string
          enum: [slurm]
        minimumResources:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MinimumResources'
        updatedAt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    MinimumResourceRequirementChange:
      type: object
      required: [minimumResources]
      properties:
        minimumResources:
          nullable: true
          description: The new thresholds, or null to disable the requirement.
          allOf:
            - $ref: '#/components/schemas/MinimumResources'
    MinimumResources:
      type: object
      description: Every threshold is greater than zero; equality is eligible.
      required: [cpuCores, memoryMiB, storageGB]
      properties:
        cpuCores:
          type: integer
        memoryMiB:
          type: integer
          format: int64
        storageGB:
          type: number

    SlurmClusterState:
      type: object
      description: A Slurm Platform's live state from slurmrestd; carries no monitoring health.
      required: [controllers, partitions, nodes]
      properties:
        controllers:
          type: array
          description: Each slurmctld in SlurmctldHost failover order.
          items:
            $ref: '#/components/schemas/SlurmController'
        partitions:
          type: array
          items:
            $ref: '#/components/schemas/SlurmPartition'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SlurmNode'
    SlurmController:
      type: object
      required: [hostname, primary, status]
      properties:
        hostname:
          type: string
        primary:
          type: boolean
          description: Marks the active controller.
        status:
          type: string
          description: RPC liveness from slurmrestd `ping`.
          enum: [up, down, unknown]
    SlurmPartition:
      type: object
      required: [name, state, nodeSpec, totalNodes]
      properties:
        name:
          type: string
        state:
          type: string
          description: The partition's state flags, lower-case and comma-separated.
        nodeSpec:
          type: string
          description: The configured node list, for example `compute[1-4]`.
        totalNodes:
          type: integer
    SlurmNode:
      type: object
      required: [name, state, cpus, realMemoryMiB, gres, partitions, address]
      properties:
        name:
          type: string
        state:
          type: string
          description: >-
            The collapsed scheduler state: a down, drain, or fail flag wins, otherwise the first
            flag (for example `idle`, `allocated`, `mixed`); `unknown` when Slurm reports none.
        cpus:
          type: integer
        realMemoryMiB:
          type: integer
          format: int64
        gres:
          type: string
          description: The node's GRES, for example `gpu:8`.
        partitions:
          type: array
          items:
            type: string
        address:
          type: string

    KubernetesClusterSummary:
      type: object
      required: [version, nodeCount, readyNodeCount, namespaceCount]
      properties:
        version:
          type: string
          description: The cluster's reported Kubernetes version; empty when it reported none.
        nodeCount:
          type: integer
        readyNodeCount:
          type: integer
        namespaceCount:
          type: integer
    KubernetesNodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesNode'
    KubernetesNode:
      type: object
      required: [name, role, ready, unschedulable, serverId, addresses, kubeletVersion, gpu]
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/NodeRole'
        ready:
          type: boolean
        unschedulable:
          type: boolean
          description: The cordon state.
        serverId:
          type: string
          nullable: true
          description: The matched Server; null when no Server matches the node's name or addresses.
        addresses:
          type: array
          items:
            type: string
        kubeletVersion:
          type: string
        gpu:
          $ref: '#/components/schemas/KubernetesNodeGPU'
    KubernetesNodeGPU:
      type: object
      description: The node's GPUs as Kubernetes exposes them.
      required: [allocatable, draDevices]
      properties:
        allocatable:
          type: object
          description: Every allocatable resource named `amd.com/*`; empty when the node has none.
          additionalProperties:
            type: integer
            format: int64
        draDevices:
          type: integer
          nullable: true
          description: >-
            Devices the `gpu.amd.com` DRA driver publishes for the node; null when the cluster has
            no `resource.k8s.io/v1` API or the slices could not be read.
    KubernetesNamespaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesNamespace'
    KubernetesNamespace:
      type: object
      required: [name, phase, system]
      properties:
        name:
          type: string
        phase:
          type: string
        system:
          type: boolean
          description: True for `kube-system`, `kube-public`, and `kube-node-lease`.
    KubernetesNamespaceCreation:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
    KubernetesApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesApplication'
    KubernetesApplication:
      type: object
      description: A Kubernetes Application, a live workload aggregation.
      required: [namespace, name, kind, images, replicas, readyReplicas, createdAt]
      properties:
        namespace:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/KubernetesApplicationKind'
        images:
          type: array
          items:
            type: string
        replicas:
          type: integer
          description: The desired count (for a DaemonSet the desired scheduled count; 1 for a bare Pod).
        readyReplicas:
          type: integer
        createdAt:
          type: string
          description: The object's creation time as the cluster reported it (RFC 3339).
        pods:
          type: array
          description: >-
            The Pods the Application owns; only in the single-Application read, and omitted when
            it owns none.
          items:
            $ref: '#/components/schemas/KubernetesPod'
    KubernetesApplicationScale:
      type: object
      required: [replicas]
      properties:
        replicas:
          type: integer
          minimum: 0
    KubernetesPodList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesPod'
    KubernetesPod:
      type: object
      required: [namespace, name, phase, ready, nodeName, restarts, containers, startedAt]
      properties:
        namespace:
          type: string
        name:
          type: string
        phase:
          type: string
        ready:
          type: boolean
        nodeName:
          type: string
        restarts:
          type: integer
        containers:
          type: array
          items:
            type: string
        startedAt:
          type: string
          description: >-
            The Pod's start time as the cluster reported it (RFC 3339); empty before the Pod
            started.
    KubernetesPodLogs:
      type: object
      required: [container, logs]
      properties:
        container:
          type: string
          description: The container the logs were read from.
        logs:
          type: string
    KubernetesServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesService'
    KubernetesService:
      type: object
      required: [namespace, name, type, clusterIP, ports, externalIPs]
      properties:
        namespace:
          type: string
        name:
          type: string
        type:
          type: string
        clusterIP:
          type: string
        ports:
          type: array
          description: Each port as `<port>/<protocol>`, for example `80/TCP`.
          items:
            type: string
        externalIPs:
          type: array
          items:
            type: string
    KubernetesIngressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesIngress'
    KubernetesIngress:
      type: object
      required: [namespace, name, hosts, ingressClass, addresses]
      properties:
        namespace:
          type: string
        name:
          type: string
        hosts:
          type: array
          items:
            type: string
        ingressClass:
          type: string
        addresses:
          type: array
          items:
            type: string
    KubernetesConfigMapList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesConfigMap'
    KubernetesConfigMap:
      type: object
      required: [namespace, name, type, keys, dataCount]
      properties:
        namespace:
          type: string
        name:
          type: string
        type:
          type: string
          description: Always empty for a ConfigMap (the field is shared with the Secret list).
        keys:
          type: array
          description: The data key names.
          items:
            type: string
        dataCount:
          type: integer
    KubernetesSecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesSecret'
    KubernetesSecret:
      type: object
      description: A Secret's metadata; values are never returned.
      required: [namespace, name, type, keys, dataCount]
      properties:
        namespace:
          type: string
        name:
          type: string
        type:
          type: string
          description: The Secret type, for example `Opaque`.
        keys:
          type: array
          description: The data key names only.
          items:
            type: string
        dataCount:
          type: integer
    KubernetesPersistentVolumeClaimList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesPersistentVolumeClaim'
    KubernetesPersistentVolumeClaim:
      type: object
      required: [namespace, name, phase, capacity, storageClass, accessModes]
      properties:
        namespace:
          type: string
        name:
          type: string
        phase:
          type: string
        capacity:
          type: string
          description: The claim's storage capacity, for example `10Gi`; empty until bound.
        storageClass:
          type: string
        accessModes:
          type: array
          items:
            type: string
    KubernetesManifestApply:
      type: object
      required: [manifest]
      properties:
        manifest:
          type: string
          description: One or more YAML documents.
        dryRun:
          type: boolean
          default: false
          description: Validate server-side without persisting.
    KubernetesManifestApplyResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/KubernetesManifestApplyResult'
    KubernetesManifestApplyResult:
      type: object
      required: [kind, namespace, name, action]
      properties:
        kind:
          type: string
        namespace:
          type: string
          description: Empty for a cluster-scoped object.
        name:
          type: string
        action:
          type: string
          description: >-
            `created` when the object did not exist, `configured` when it did, `validated` for a
            dry run.
          enum: [created, configured, validated]
