# swallow-deployed Kubernetes and Slurm Platforms: spec and status, lifecycle, membership, the
# Slurm deployment requirement, the GPU Operator releases, live Slurm state, and the live
# Kubernetes cluster explorer. Behavior semantics live in platforms.md and platforms-kubernetes.md.
tags:
  - name: platforms
    description: >-
      swallow-deployed Kubernetes and Slurm Platforms (platforms.md) and the live Kubernetes
      cluster explorer of a deployed Kubernetes Platform (platforms-kubernetes.md). Every
      operation requires the `admin` role.
paths:
  /api/v1/platforms:
    get:
      tags: [platforms]
      operationId: listPlatforms
      summary: List Platforms, optionally of one Site.
      description: >-
        Pool read: any authenticated User; the result holds only what the caller may read. Returns a plain array (Platforms are few, so the list is not
        paginated). Lifecycle fields are read for the whole list in one batch.
      parameters:
        - name: siteId
          in: query
          required: false
          description: Return only the Platforms of this Site.
          schema:
            type: string
      responses:
        '200':
          description: The Platforms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Platform'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [platforms]
      operationId: createPlatform
      summary: Create a Platform from its spec and propose its install as a Change Plan.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. The spec is validated as a deployment would be (the Deployment
        Key, topology, targets, network, and features) before anything is written; then the
        Platform is stored at generation 1 with its members claimed, and its install is the
        returned Change Plan (platforms.md, Create A Platform): approved with the request when it
        sends `approve=true` and the policy allows it, waiting for approval otherwise. Nothing
        touches a machine until the plan is approved. 400 for an invalid body, spec, topology,
        target, network, or feature; 404 for an unknown Site; 409 when the installation has no
        Deployment Key, the Site's Local Repository serves deployments and is not ready
        (local-repository.md), the name is
        taken, or a target is claimed, locked, or held by another Workflow; 503 when Site
        automation is not configured.
      parameters:
        - $ref: '#/components/parameters/ApproveChange'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformCreate'
      responses:
        '202':
          description: The Platform and the Change Plan that installs it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSpecWrite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/sync:
    post:
      tags: [platforms]
      operationId: syncAllPlatformMemberships
      summary: Read the membership of every Platform with a recorded Integration now.
      description: >-
        Requires the `admin` role. Platforms without a recorded Integration are skipped. One
        failing Platform does not stop the rest: its failure is reported in its own `error`.
      responses:
        '200':
          description: One membership report per synced Platform.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformMembershipReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/deployment-requirements/slurm:
    get:
      tags: [platforms]
      operationId: getSlurmDeploymentRequirement
      summary: Read the system-wide Slurm Minimum Resource Requirement.
      description: >-
        Reference: any authenticated User. A requirement that was never stored is returned as the disabled
        representation, not 404.
      responses:
        '200':
          description: The current requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimumResourceRequirement'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [platforms]
      operationId: replaceSlurmDeploymentRequirement
      summary: Replace or disable the system-wide Slurm Minimum Resource Requirement.
      description: >-
        Requires the `admin` role. `minimumResources: null` disables the requirement; omitting
        `minimumResources`, or a threshold that is not greater than zero, is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinimumResourceRequirementChange'
      responses:
        '200':
          description: The stored requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimumResourceRequirement'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/gpu-operator/releases:
    get:
      tags: [platforms]
      operationId: listGPUOperatorReleases
      summary: List the AMD GPU Operator releases swallow ships, newest first.
      description: >-
        Reference: any authenticated User. A GPU Operator setting's `version` and `draDriverVersion` must
        come from this catalog.
      responses:
        '200':
          description: The release catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GPUOperatorReleaseCatalog'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get:
      tags: [platforms]
      operationId: getPlatform
      summary: Read one Platform.
      description: 'Pool read: an admin, or a User with any Pool Role in the Pool the resource belongs to. 404 for an unknown Platform.'
      responses:
        '200':
          description: The Platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [platforms]
      operationId: updatePlatform
      summary: Change a Platform's name, ownership policies, or Monitoring Links.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. Omitted fields do not change; `monitoringLinks` replaces the
        whole list. Every field is validated before anything is written. 400 for an invalid value;
        404 for an unknown Platform; 409 when the name is taken at the Site, or when
        `gpuStackOwner` is set to `provisioning` while swallow manages a GPU Operator on the
        Platform. The GPU Operator and the credential Integration cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdate'
      responses:
        '200':
          description: The updated Platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [platforms]
      operationId: deletePlatform
      summary: Declare a Platform absent, proposing its uninstall as a Change Plan.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. Marks the spec absent with the optional removal choices and
        proposes the uninstall as a Change Plan, approved with the request when it sends
        `approve=true` and the policy allows it; the record is deleted once the uninstall succeeds
        (platforms.md, Delete A Platform). A Platform whose deployment runs or failed is uninstalled
        the same way. Deleting a Platform already marked absent returns the plan it waits on when the
        removal choices are the same, approving it when the request sends `approve=true`; different
        choices, or no plan waiting (it was rejected or expired, or the uninstall failed), propose the
        uninstall again. While the uninstall runs, the request changes nothing (200). A Platform with
        nothing installed (its install never started, or its uninstall succeeded) is deleted at once
        (204). With `recordOnly=true` only the record is removed: in-flight Workflows are canceled,
        then membership, Platform Claims, and a swallow-owned credential Integration are cleared, and
        hosts are never touched (204). 404 for an unknown Platform; 409 when the Platform has no spec
        yet.
      parameters:
        - $ref: '#/components/parameters/ApproveChange'
        - name: recordOnly
          in: query
          required: false
          description: Remove only the record, leaving the hosts as they are.
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRemoval'
      responses:
        '200':
          description: >-
            The Platform, already marked absent, whose uninstall runs; nothing changed and `plan` is
            null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSpecWrite'
        '202':
          description: The Platform marked absent and the Change Plan that uninstalls it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSpecWrite'
        '204':
          description: The Platform record is gone.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/spec:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    put:
      tags: [platforms]
      operationId: replacePlatformSpec
      summary: Replace a Platform's spec at the generation it was read.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. A non-destructive change (for example a new member) is written
        and converged by the platform controller (200); a destructive one is written with a Change
        Plan (202), approved with the request when it sends `approve=true` and the policy allows it,
        and carrying a blocker when swallow cannot carry the change out yet (platforms.md, Change A
        Platform). An omitted user data value keeps the stored one. 400 for
        an invalid body or spec; 404 for an unknown Platform; 409 when `generation` is no longer
        current, an immutable field changes, a non-destructive change cannot be carried out yet,
        the uninstall has started, the Platform has no spec yet, or a new member is claimed,
        locked, or busy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSpecChange'
      responses:
        '200':
          description: The Platform with its new spec; the controller converges it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSpecWrite'
        '202':
          description: The Platform with its new spec and the Change Plan it waits on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSpecWrite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/pool:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    put:
      tags: [platforms]
      operationId: movePlatformToPool
      summary: Move every Server of a Platform to one Pool together.
      description: >-
        Requires role `admin` (platforms.md, Move A Platform To Another Pool). Writes `poolId` into the
        placement spec of every Server in the Platform's spec and every Server it still claims, in one
        transaction and conditional on each Server's generation; Zones are kept, and a Server already in
        the Pool is not written. Access follows at once; nothing changes on the hosts, the Platform, or
        the provisioner. 400 for an invalid body; 404 for an unknown Platform or Pool; 409 when the
        Platform has no Servers, a Server's spec changed during the request, or a Server is not adopted
        yet, in which case nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poolId]
              properties:
                poolId:
                  type: string
                  nullable: true
                  description: The swallow id of the Pool; `null` takes every Server of the Platform out of every Pool.
      responses:
        '200':
          description: The Platform's Pool and its Servers' placement spec after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformPoolMove'
        '400':
          description: '`validation_error`: the body is not valid JSON, or `poolId` is missing or not a string or `null`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: '`not_found`: the Platform or the Pool does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            `conflict`: the Platform has no Servers, a Server's spec changed during the request, or a
            Server is not adopted yet. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    post:
      tags: [platforms]
      operationId: syncPlatformMembership
      summary: Read one Platform's membership now.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. A failure to read the Platform's API is reported in the
        report's `error` with status 200, not as an error status. 404 for an unknown Platform.
      responses:
        '200':
          description: The membership report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMembershipReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/slurm:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get:
      tags: [platforms]
      operationId: getSlurmClusterState
      summary: Read a Slurm Platform's live controllers, partitions, and nodes from slurmrestd.
      description: >-
        Pool read: an admin, or a User with any Pool Role in the Pool the resource belongs to. Read on demand; writes nothing. 400 for a Kubernetes Platform
        or a Slurm Platform without a recorded slurmrestd Integration; 404 for an unknown Platform
        or when the read is not wired; 503 when slurmrestd cannot be reached or rejects the
        credential.
      responses:
        '200':
          description: The live Slurm cluster state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlurmClusterState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  # Kubernetes cluster explorer (platforms-kubernetes.md). Every route reads or writes the
  # deployed cluster's own API on demand and persists nothing. The eligibility and cluster errors
  # are the same for every route: 404 for an unknown or non-Kubernetes Platform (or when the
  # explorer is not wired), 409 for a registered Platform or one without a recorded credential,
  # 404 and 409 also for an object the cluster API reports missing or already existing, 400 for
  # any other 4xx it answered (an invalid object), and 503 when the cluster API cannot be reached,
  # answers 5xx, or rejects the credential.
  /api/v1/platforms/{id}/kubernetes:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get:
      tags: [platforms]
      operationId: getKubernetesClusterSummary
      summary: Read the live summary of a deployed Kubernetes Platform.
      description: 'Pool operate: an admin, or an `owner` of the Pool the resource belongs to. Counts are observed at read time.'
      responses:
        '200':
          description: The cluster summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesClusterSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/nodes:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get:
      tags: [platforms]
      operationId: listKubernetesNodes
      summary: List the cluster's nodes correlated to Server identity.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. Separate from membership sync: it never writes the membership
        axis.
      responses:
        '200':
          description: The nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesNodeList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/nodes/{node}/cordon:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNodeName'
    post:
      tags: [platforms]
      operationId: cordonKubernetesNode
      summary: Mark a node unschedulable.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. Does not drain (evict) Pods. The returned node carries no Server
        correlation and no DRA count (`serverId` and `gpu.draDevices` are null).
      responses:
        '200': &updatedKubernetesNode
          description: The updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesNode'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/nodes/{node}/uncordon:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNodeName'
    post:
      tags: [platforms]
      operationId: uncordonKubernetesNode
      summary: Clear a node's unschedulable flag.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. The returned node carries no Server correlation and no DRA count
        (`serverId` and `gpu.draDevices` are null).
      responses:
        '200': *updatedKubernetesNode
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/namespaces:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get:
      tags: [platforms]
      operationId: listKubernetesNamespaces
      summary: List the cluster's namespaces, system namespaces flagged.
      description: 'Pool operate: an admin, or an `owner` of the Pool the resource belongs to.'
      responses:
        '200':
          description: The namespaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesNamespaceList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [platforms]
      operationId: createKubernetesNamespace
      summary: Create a namespace.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. A missing or blank name is 400 before any cluster call; a name
        the cluster refuses is 400 and one that already exists is 409, with the cluster's reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesNamespaceCreation'
      responses:
        '201':
          description: The created namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesNamespace'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/namespaces/{namespace}:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNamespaceName'
    delete:
      tags: [platforms]
      operationId: deleteKubernetesNamespace
      summary: Delete a namespace.
      description: >-
        Pool operate: an admin, or an `owner` of the Pool the resource belongs to. A system namespace (`kube-system`, `kube-public`,
        `kube-node-lease`) is refused with 409 before any cluster call.
      responses:
        '200': &successAcknowledgement
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAcknowledgement'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/applications:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get:
      tags: [platforms]
      operationId: listKubernetesApplications
      summary: List Kubernetes Applications (aggregated workloads).
      description: 'Pool operate: an admin, or an `owner` of the Pool the resource belongs to. The list items carry no `pods`.'
      parameters:
        - $ref: '#/components/parameters/KubernetesNamespaceScope'
        - $ref: '#/components/parameters/KubernetesIncludeSystem'
      responses:
        '200':
          description: The Applications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesApplicationList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/applications/{namespace}/{kind}/{name}:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNamespaceName'
      - $ref: '#/components/parameters/KubernetesApplicationKind'
      - $ref: '#/components/parameters/KubernetesObjectName'
    get:
      tags: [platforms]
      operationId: getKubernetesApplication
      summary: Read one Kubernetes Application with the Pods it owns.
