# Swallow-deployed Kubernetes and Slurm Platforms: deployment, lifecycle, membership, the Slurm
# deployment requirement, the GPU Operator, live Slurm state, and the live Kubernetes cluster
# explorer. Behavior semantics live in platforms.md and platforms-kubernetes.md.
#
# Every /api/v1/clusters operation is the deprecated one-release alias of the /api/v1/platforms
# operation it merges with `<<: *anchor`. Both are served by the same handler, so an alias overrides
# only operationId, deprecated, and description, and cannot drift from its canonical operation.
# The Slurm deployment requirement and GPU Operator routes have no alias.
tags:
  - name: platforms
    description: >-
      Swallow-deployed Kubernetes and Slurm Platforms (platforms.md) and the live Kubernetes
      cluster explorer of a deployed Kubernetes Platform (platforms-kubernetes.md). Every
      operation requires the `admin` role.
paths:
  /api/v1/platforms:
    get: &listPlatforms
      tags: [platforms]
      operationId: listPlatforms
      summary: List Platforms, optionally of one Site.
      description: >-
        Requires the `admin` role. Returns a plain array (Platforms are few, so the list is not
        paginated). Lifecycle fields are read for the whole list in one batch.
      parameters:
        - name: siteId
          in: query
          required: false
          description: Return only the Platforms of this Site.
          schema:
            type: string
      responses:
        '200':
          description: The Platforms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Platform'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/deploy:
    post: &deployPlatform
      tags: [platforms]
      operationId: deployPlatform
      summary: Create a Platform and start the Workflow that builds it.
      description: >-
        Requires the `admin` role. `type` selects the variant: `kubernetes` (the default when
        omitted) starts a `deploy-kubernetes` Workflow that builds k0s, `slurm` starts a
        `configure-slurm` Workflow. The Deployment Key check, validation, and the live target lock
        preflight all finish before the Platform or the Workflow is created (platforms.md, Deploy A
        New Platform). 400 for an invalid body, topology, target, network, or feature; 404 for an
        unknown Site; 409 when the installation has no Deployment Key, a target is locked or held
        by another Workflow, a custom image is not verified for the Deploy Target, a provision_os
        deploy has no NTP server, or composed Managed Software conflicts; 503 when Site automation
        is not configured or the release playbook is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformDeployRequest'
      responses:
        '202':
          description: The Platform and the Workflow building it are persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformWorkflowAcceptance'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/sync:
    post: &syncAllPlatformMemberships
      tags: [platforms]
      operationId: syncAllPlatformMemberships
      summary: Read the membership of every Platform with a recorded Integration now.
      description: >-
        Requires the `admin` role. Platforms without a recorded Integration are skipped. One
        failing Platform does not stop the rest: its failure is reported in its own `error`.
      responses:
        '200':
          description: One membership report per synced Platform.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformMembershipReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/deployment-requirements/slurm:
    get:
      tags: [platforms]
      operationId: getSlurmDeploymentRequirement
      summary: Read the system-wide Slurm Minimum Resource Requirement.
      description: >-
        Requires the `admin` role. A requirement that was never stored is returned as the disabled
        representation, not 404.
      responses:
        '200':
          description: The current requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimumResourceRequirement'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [platforms]
      operationId: replaceSlurmDeploymentRequirement
      summary: Replace or disable the system-wide Slurm Minimum Resource Requirement.
      description: >-
        Requires the `admin` role. `minimumResources: null` disables the requirement; omitting
        `minimumResources`, or a threshold that is not greater than zero, is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinimumResourceRequirementChange'
      responses:
        '200':
          description: The stored requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimumResourceRequirement'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/gpu-operator/releases:
    get:
      tags: [platforms]
      operationId: listGPUOperatorReleases
      summary: List the AMD GPU Operator releases Swallow ships, newest first.
      description: >-
        Requires the `admin` role. A GPU Operator setting's `version` and `draDriverVersion` must
        come from this catalog.
      responses:
        '200':
          description: The release catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GPUOperatorReleaseCatalog'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get: &getPlatform
      tags: [platforms]
      operationId: getPlatform
      summary: Read one Platform.
      description: Requires the `admin` role. 404 for an unknown Platform.
      responses:
        '200':
          description: The Platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch: &updatePlatform
      tags: [platforms]
      operationId: updatePlatform
      summary: Change a Platform's name, ownership policies, or Monitoring Links.
      description: >-
        Requires the `admin` role. Omitted fields do not change; `monitoringLinks` replaces the
        whole list. Every field is validated before anything is written. 400 for an invalid value;
        404 for an unknown Platform; 409 when the name is taken at the Site, or when
        `gpuStackOwner` is set to `provisioning` while Swallow manages a GPU Operator on the
        Platform. The GPU Operator and the credential Integration cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdate'
      responses:
        '200':
          description: The updated Platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete: &deletePlatform
      tags: [platforms]
      operationId: deletePlatform
      summary: Remove a Platform record without touching its hosts.
      description: >-
        Requires the `admin` role. Cancels the Platform's in-flight Workflows first, then clears
        membership, Platform Claims, and a Swallow-owned credential Integration, and removes the
        record. It never runs Ansible or changes hosts. 404 for an unknown Platform; a failed
        cancellation refuses the Delete and keeps the record.
      responses:
        '200': &successAcknowledgement
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAcknowledgement'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/uninstall:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    post: &uninstallPlatform
      tags: [platforms]
      operationId: uninstallPlatform
      summary: Start the Workflow that uninstalls a Swallow-deployed Platform from its targets.
      description: >-
        Requires the `admin` role. Starts `uninstall-kubernetes` or `uninstall-slurm` against the
        complete target snapshot of the latest deployment and keeps the record unless
        `deleteRecord` is true (platforms.md, Uninstall A Deployed Platform). The body is optional;
        an empty body removes the platform software only. 400 for an unparsable body; 404 for an
        unknown Platform; 409 for a registered Platform, a running or already successful
        uninstall, a deployment still running (without `cancelActiveWorkflows`), or a missing,
        absent, locked, or busy target; 503 when automation or durable orchestration is
        unavailable.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUninstall'
      responses:
        '202':
          description: The uninstall Workflow is persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformWorkflowAcceptance'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    post: &syncPlatformMembership
      tags: [platforms]
      operationId: syncPlatformMembership
      summary: Read one Platform's membership now.
      description: >-
        Requires the `admin` role. A failure to read the Platform's API is reported in the
        report's `error` with status 200, not as an error status. 404 for an unknown Platform.
      responses:
        '200':
          description: The membership report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMembershipReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/slurm:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get: &getSlurmClusterState
      tags: [platforms]
      operationId: getSlurmClusterState
      summary: Read a Slurm Platform's live controllers, partitions, and nodes from slurmrestd.
      description: >-
        Requires the `admin` role. Read on demand; writes nothing. 400 for a Kubernetes Platform
        or a Slurm Platform without a recorded slurmrestd Integration; 404 for an unknown Platform
        or when the read is not wired; 503 when slurmrestd cannot be reached or rejects the
        credential.
      responses:
        '200':
          description: The live Slurm cluster state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlurmClusterState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/gpu-operator:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    put:
      tags: [platforms]
      operationId: configureGPUOperator
      summary: Install, change, or uninstall the Swallow-managed GPU Operator of a Kubernetes Platform.
      description: >-
        Requires the `admin` role. Replaces the settings and starts a `configure-gpu-operator`
        Workflow; `enabled: false` uninstalls and keeps the other recorded settings
        (platforms.md, Manage The GPU Operator). 400 for invalid settings; 404 for an unknown
        Platform or when GPU Operator management is not wired; 409 when the Platform is not an
        active Swallow-deployed Kubernetes Platform, an uninstall finds no managed operator, a
        target is locked or held by another Workflow, or the installation has no Deployment Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GPUOperatorChange'
      responses:
        '202':
          description: The Workflow applying the change is persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GPUOperatorChangeAcceptance'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  # Kubernetes cluster explorer (platforms-kubernetes.md). Every route reads or writes the
  # deployed cluster's own API on demand and persists nothing. The eligibility and cluster errors
  # are the same for every route: 404 for an unknown or non-Kubernetes Platform (or when the
  # explorer is not wired), 409 for a registered Platform or one without a recorded credential,
  # 404 and 409 also for an object the cluster API reports missing or already existing, 400 for
  # any other 4xx it answered (an invalid object), and 503 when the cluster API cannot be reached,
  # answers 5xx, or rejects the credential.
  /api/v1/platforms/{id}/kubernetes:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get: &getKubernetesClusterSummary
      tags: [platforms]
      operationId: getKubernetesClusterSummary
      summary: Read the live summary of a deployed Kubernetes Platform.
      description: Requires the `admin` role. Counts are observed at read time.
      responses:
        '200':
          description: The cluster summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesClusterSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/nodes:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get: &listKubernetesNodes
      tags: [platforms]
      operationId: listKubernetesNodes
      summary: List the cluster's nodes correlated to Server identity.
      description: >-
        Requires the `admin` role. Separate from membership sync: it never writes the membership
        axis.
      responses:
        '200':
          description: The nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesNodeList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/nodes/{node}/cordon:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNodeName'
    post: &cordonKubernetesNode
      tags: [platforms]
      operationId: cordonKubernetesNode
      summary: Mark a node unschedulable.
      description: >-
        Requires the `admin` role. Does not drain (evict) Pods. The returned node carries no Server
        correlation and no DRA count (`serverId` and `gpu.draDevices` are null).
      responses:
        '200': &updatedKubernetesNode
          description: The updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesNode'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/nodes/{node}/uncordon:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNodeName'
    post: &uncordonKubernetesNode
      tags: [platforms]
      operationId: uncordonKubernetesNode
      summary: Clear a node's unschedulable flag.
      description: >-
        Requires the `admin` role. The returned node carries no Server correlation and no DRA count
        (`serverId` and `gpu.draDevices` are null).
      responses:
        '200': *updatedKubernetesNode
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/namespaces:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get: &listKubernetesNamespaces
      tags: [platforms]
      operationId: listKubernetesNamespaces
      summary: List the cluster's namespaces, system namespaces flagged.
      description: Requires the `admin` role.
      responses:
        '200':
          description: The namespaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesNamespaceList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post: &createKubernetesNamespace
      tags: [platforms]
      operationId: createKubernetesNamespace
      summary: Create a namespace.
      description: >-
        Requires the `admin` role. A missing or blank name is 400 before any cluster call; a name
        the cluster refuses is 400 and one that already exists is 409, with the cluster's reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesNamespaceCreation'
      responses:
        '201':
          description: The created namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesNamespace'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/namespaces/{namespace}:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNamespaceName'
    delete: &deleteKubernetesNamespace
      tags: [platforms]
      operationId: deleteKubernetesNamespace
      summary: Delete a namespace.
      description: >-
        Requires the `admin` role. A system namespace (`kube-system`, `kube-public`,
        `kube-node-lease`) is refused with 409 before any cluster call.
      responses:
        '200': *successAcknowledgement
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/applications:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get: &listKubernetesApplications
      tags: [platforms]
      operationId: listKubernetesApplications
      summary: List Kubernetes Applications (aggregated workloads).
      description: Requires the `admin` role. The list items carry no `pods`.
      parameters:
        - $ref: '#/components/parameters/KubernetesNamespaceScope'
        - $ref: '#/components/parameters/KubernetesIncludeSystem'
      responses:
        '200':
          description: The Applications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesApplicationList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/applications/{namespace}/{kind}/{name}:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNamespaceName'
      - $ref: '#/components/parameters/KubernetesApplicationKind'
      - $ref: '#/components/parameters/KubernetesObjectName'
    get: &getKubernetesApplication
      tags: [platforms]
      operationId: getKubernetesApplication
      summary: Read one Kubernetes Application with the Pods it owns.
      description: >-
        Requires the `admin` role. An unsupported `kind` is 400 before any cluster call; a workload
        the cluster reports missing is 404, with the cluster's reason.
      responses:
        '200':
          description: The Application, with `pods` when it owns at least one Pod.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesApplication'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete: &deleteKubernetesApplication
      tags: [platforms]
      operationId: deleteKubernetesApplication
      summary: Delete the workload object (or bare Pod) behind an Application.
      description: Requires the `admin` role. An unsupported `kind` is 400 before any cluster call.
      responses:
        '200': *successAcknowledgement
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/platforms/{id}/kubernetes/applications/{namespace}/{kind}/{name}/scale:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
      - $ref: '#/components/parameters/KubernetesNamespaceName'
      - $ref: '#/components/parameters/KubernetesApplicationKind'
      - $ref: '#/components/parameters/KubernetesObjectName'
    post: &scaleKubernetesApplication
      tags: [platforms]
      operationId: scaleKubernetesApplication
      summary: Set a Deployment's or StatefulSet's replica count.
      description: >-
        Requires the `admin` role. A missing `replicas` or an unsupported `kind` is 400 before any
        cluster call; a DaemonSet, a bare Pod, or a negative count is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesApplicationScale'
      responses:
        '200':
