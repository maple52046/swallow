    get:
      description: Requires role `admin`. Returns a plain array ordered by `name` (small and bounded).
      operationId: listPools
      parameters:
        - description: Restrict to one Site; omitted returns the Pools of every Site.
          in: query
          name: siteId
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Pool'
                type: array
          description: The matching Pools.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List Pools, optionally of one Site.
      tags:
        - sites
    post:
      description: Requires role `admin` (infrastructure.md). Stores the spec at generation 1 and answers at once; the Pool's conditions report when every grouping-capable provisioner of the Site holds it. No provisioner is called.
      operationId: createPool
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                name:
                  description: Unique within the Site; trimmed, and at most 100 characters after trimming.
                  maxLength: 100
                  minLength: 1
                  type: string
                siteId:
                  minLength: 1
                  type: string
              required:
                - siteId
                - name
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
          description: The created Pool.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON; `siteId` or `name` is missing, blank, or `name` is longer than 100 characters.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a Pool with this `name` already exists in the Site.'
        default:
          $ref: '#/components/responses/Error'
      summary: Create a Pool; the catalog controller creates it on the Site's provisioners.
      tags:
        - sites
  /api/v1/infrastructure/pools/{id}:
    delete:
      description: Requires role `admin`. Refused while a Server's placement spec names the Pool. Otherwise the resource pool is removed from every provisioner that holds it (a provisioner's default resource pool stays), then the record. A provisioner that refuses (for example one still holding machines) aborts the delete, so the record stays.
      operationId: deletePool
      responses:
        "204":
          description: The Pool was deleted.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the provisioner refused to delete the pool (the message carries its explanation).'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Pool does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a Server is still placed in it.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the Site''s provisioner could not be reached, refused the credential, or has no credential.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete a Pool, removing it from the provisioners that hold it first.
      tags:
        - sites
    get:
      description: Requires role `admin`.
      operationId: getPool
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
          description: The Pool.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Pool does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read one Pool.
      tags:
        - sites
    parameters:
      - description: The Pool's id.
        in: path
        name: id
        required: true
        schema:
          type: string
    patch:
      description: Requires role `admin`. Only present fields change, and a change increments the generation; a request that changes nothing answers the stored Pool. The catalog controller then renames the group on the Site's provisioners, so the machines in it stay there.
      operationId: updatePool
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                name:
                  maxLength: 100
                  minLength: 1
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
          description: The updated Pool.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, or a present `name` is blank or longer than 100 characters.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Pool does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: another Pool in the Site already has this `name`.'
        default:
          $ref: '#/components/responses/Error'
      summary: Rename a Pool or change its description.
      tags:
        - sites
  /api/v1/infrastructure/zones:
    get:
      description: Requires role `admin`. Returns a plain array ordered by `name` (small and bounded).
      operationId: listZones
      parameters:
        - description: Restrict to one Site; omitted returns the Zones of every Site.
          in: query
          name: siteId
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Zone'
                type: array
          description: The matching Zones.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List Zones, optionally of one Site.
      tags:
        - sites
    post:
      description: Requires role `admin` (infrastructure.md). Stores the spec at generation 1 and answers at once; the Zone's conditions report when every grouping-capable provisioner of the Site holds it. No provisioner is called.
      operationId: createZone
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                name:
                  description: Unique within the Site; trimmed, and at most 100 characters after trimming.
                  maxLength: 100
                  minLength: 1
                  type: string
                siteId:
                  minLength: 1
                  type: string
              required:
                - siteId
                - name
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
          description: The created Zone.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON; `siteId` or `name` is missing, blank, or `name` is longer than 100 characters.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a Zone with this `name` already exists in the Site.'
        default:
          $ref: '#/components/responses/Error'
      summary: Create a Zone; the catalog controller creates it on the Site's provisioners.
      tags:
        - sites
  /api/v1/infrastructure/zones/{id}:
    delete:
      description: Requires role `admin`. Refused while a Server's placement spec names the Zone. Otherwise the zone is removed from every provisioner that holds it (a provisioner's default zone stays), then the record. A provisioner that refuses (for example one still holding machines) aborts the delete, so the record stays.
      operationId: deleteZone
      responses:
        "204":
          description: The Zone was deleted.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the provisioner refused to delete the group (the message carries its explanation).'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Zone does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a Server is still placed in it.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the Site''s provisioner could not be reached, refused the credential, or has no credential.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete a Zone, removing it from the provisioners that hold it first.
      tags:
        - sites
    get:
      description: Requires role `admin`.
      operationId: getZone
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
          description: The Zone.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Zone does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read one Zone.
      tags:
        - sites
    parameters:
      - description: The Zone's id.
        in: path
        name: id
        required: true
        schema:
          type: string
    patch:
      description: Requires role `admin`. Only present fields change, and a change increments the generation; a request that changes nothing answers the stored Zone. The catalog controller then renames the group on the Site's provisioners, so the machines in it stay there.
      operationId: updateZone
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                name:
                  maxLength: 100
                  minLength: 1
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
          description: The updated Zone.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, or a present `name` is blank or longer than 100 characters.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Zone does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: another Zone in the Site already has this `name`.'
        default:
          $ref: '#/components/responses/Error'
      summary: Rename a Zone or change its description.
      tags:
        - sites
  /api/v1/integrations:
    get:
      description: Requires role `admin`. Returns a plain array ordered by `siteId`, then `name`. A `kind` value no Integration has (including an unknown one) returns `[]`; the deprecated alias `cluster` is read as `platform` and answered with a `Deprecation` header.
      operationId: listIntegrations
      parameters:
        - description: Restrict to the Integrations of this Site.
          in: query
          name: siteId
          required: false
          schema:
            type: string
        - description: 'Restrict to one Integration kind: `provisioner`, `metrics`, or `platform` (`cluster` is its deprecated alias). Not validated.'
          in: query
          name: kind
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Integration'
                type: array
          description: The matching Integrations.
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List Integrations, optionally of one Site and one kind.
      tags:
        - sites
    post:
      description: 'Requires role `admin`. `kind` and `providerKind` are validated together. `kind` `platform` (and its deprecated alias `cluster`, which also sets a `Deprecation` header) is refused: a platform Integration is created only by a successful Platform deployment (decision 032). `name` and `endpoint` are trimmed. `enabled` defaults to true. The credential is write-only and never returned.'
      operationId: createIntegration
      requestBody:
        content:
          application/json:
            schema:
              properties:
                credential:
                  description: Optional; omitted or empty stores no credential.
                  type: string
                  writeOnly: true
                enabled:
                  default: true
                  type: boolean
                endpoint:
                  minLength: 1
                  type: string
                kind:
                  enum:
                    - provisioner
                    - metrics
                  type: string
                name:
                  description: Unique within the Site.
                  minLength: 1
                  type: string
                providerKind:
                  description: '`maas` for `provisioner`; `prometheus` for `metrics`.'
                  enum:
                    - maas
                    - prometheus
                  type: string
                settings:
                  $ref: '#/components/schemas/IntegrationSettings'
                siteId:
                  minLength: 1
                  type: string
              required:
                - siteId
                - kind
                - providerKind
                - name
                - endpoint
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
          description: The created Integration.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON; `siteId`, `name`, or `endpoint` is missing or empty; `kind` is not a kind or is `platform`/`cluster`; or `providerKind` does not fit `kind` (the message names the valid values).'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Register a provisioner or metrics Integration for a Site.
      tags:
        - sites
  /api/v1/integrations/{id}:
    delete:
      description: Requires role `admin`. Refused while Servers are projected from the Integration or Deployment Templates reference it.
      operationId: deleteIntegration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAcknowledgement'
          description: The Integration was deleted.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: Servers are still projected from the Integration, or Deployment Templates still reference it.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete an Integration nothing depends on.
      tags:
        - sites
    get:
      description: Requires role `admin`.
      operationId: getIntegration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
          description: The Integration.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read one Integration (never its credential).
      tags:
        - sites
    parameters:
      - description: The Integration's `integrationId`.
        in: path
        name: id
        required: true
        schema:
          type: string
    patch:
      description: Requires role `admin`. Only present (non-null) fields change. `settings`, when present, replaces the whole map. The credential and the sync state are untouched; change the credential with `PUT .../credential`.
      operationId: updateIntegration
      requestBody:
        content:
          application/json:
            schema:
              properties:
                enabled:
                  type: boolean
                endpoint:
                  minLength: 1
                  type: string
                name:
                  minLength: 1
                  type: string
                settings:
                  $ref: '#/components/schemas/IntegrationSettings'
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
          description: The updated Integration.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, or a present `name` or `endpoint` is empty.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Change an Integration's name, endpoint, enabled flag, or settings.
      tags:
        - sites
  /api/v1/integrations/{id}/credential:
    parameters:
      - description: The Integration's `integrationId`.
        in: path
        name: id
        required: true
        schema:
          type: string
    put:
      description: Requires role `admin`. The only way a credential changes; no endpoint returns it in any form. A credential cannot be cleared.
      operationId: replaceIntegrationCredential
      requestBody:
        content:
          application/json:
            schema:
              properties:
                credential:
                  minLength: 1
                  type: string
                  writeOnly: true
              required:
                - credential
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAcknowledgement'
          description: The credential was replaced.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, or `credential` is missing or empty.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace an Integration's write-only credential.
      tags:
        - sites
  /api/v1/monitoring/alerts:
    get:
      description: 'Requires the `admin` role. Returns firing and suppressed (silenced or inhibited) alerts as a plain array, most severe first (`critical`, `warning`, `info`, then any other severity), then newest `startsAt` first. Filters are not validated: a value that matches no alert yields an empty array (monitoring-alerts.md).'
      operationId: listAlerts
      parameters:
        - description: Read the alert source of this Site's metrics Integration. Omit to use any.
          in: query
          name: siteId
          required: false
          schema:
            type: string
        - description: Keep only alerts correlated to this Server.
          in: query
          name: serverId
          required: false
          schema:
            type: string
        - description: Keep only alerts with this severity label (case-insensitive).
          in: query
          name: severity
          required: false
          schema:
            type: string
        - description: Keep only alerts in this state, compared exactly (`firing`, `suppressed`, or `unknown`). Omit for every state.
          in: query
          name: state
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MonitoringAlert'
                type: array
          description: The alerts; an empty array when none match.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Alertmanager rejected the request (validation_error).
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid credential (unauthorized).
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The caller is not an admin (forbidden).
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An unexpected failure (internal_error).
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No metrics Integration is registered, it sets no Alertmanager address, or Alertmanager cannot be read (provider_unavailable).
        default:
          $ref: '#/components/responses/Error'
      summary: List the alerts Alertmanager currently knows, correlated to swallow resources.
      tags:
        - monitoring
  /api/v1/monitoring/alerts/{fingerprint}/acknowledge:
    post:
      description: 'Requires the `admin` role. There is no swallow-side acknowledged flag: the silence lives in Alertmanager and matches `matchers` by exact label equality; the path fingerprint only names the alert being acknowledged. The caller''s username is recorded as the silence''s creator (monitoring-alerts.md).'
      operationId: acknowledgeAlert
      parameters:
        - description: Alertmanager's opaque fingerprint of the alert.
          in: path
          name: fingerprint
          required: true
          schema:
            type: string
        - description: Silence in this Site's Alertmanager. Omit to use any metrics Integration's.
          in: query
          name: siteId
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAcknowledgement'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSilence'
          description: The silence was created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The body is not valid JSON, `matchers` is missing or empty, `duration` is not a positive Go duration, or Alertmanager rejected the silence (validation_error).
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid credential (unauthorized).
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The caller is not an admin (forbidden).
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An unexpected failure (internal_error).
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No metrics Integration is registered, it sets no Alertmanager address, or Alertmanager cannot be reached (provider_unavailable).
        default:
          $ref: '#/components/responses/Error'
      summary: Acknowledge an alert by creating a label-matched Alertmanager silence.
      tags:
        - monitoring
  /api/v1/monitoring/metrics:
    get:
      description: Requires the `admin` role. Evaluates each requested named query at the current instant. `items` has one entry per requested Server in the requested order; a metric with no data is absent from that Server's `metrics`, never zero (server-metrics.md, Current Values).
      operationId: getMetricValues
      parameters:
        - description: Comma-separated Server ids, at most 200. Each id may contain only letters, digits, `-`, and `_`.
          explode: false
          in: query
          name: serverIds
          required: true
          schema:
            items:
              type: string
            maxItems: 200
            minItems: 1
            type: array
          style: form
        - $ref: '#/components/parameters/MetricNames'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricValues'
          description: The current values.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`serverIds` is missing, lists more than 200 Servers, or contains an id with characters outside the identifier set; a metric name is unknown; or the backend rejected the query (validation_error).'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid credential (unauthorized).
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The caller is not an admin (forbidden).
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An unexpected failure (internal_error).
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No metrics backend is registered, or it cannot be reached or rejects swallow's credential (provider_unavailable).
        default:
          $ref: '#/components/responses/Error'
      summary: Read the current value of named metrics for explicit Servers.
      tags:
        - monitoring
  /api/v1/monitoring/metrics/names:
    get:
      description: Requires the `admin` role. A plain array in operator scan order; the order is not significant to a consumer (server-metrics.md, Metric Names).
      operationId: listMetricNames
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MetricName'
                type: array
          description: The metric names.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid credential (unauthorized).
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The caller is not an admin (forbidden).
        default:
          $ref: '#/components/responses/Error'
      summary: List the fixed set of metric names a client may request.
      tags:
        - monitoring
  /api/v1/monitoring/metrics/range:
    get:
      description: Requires the `admin` role. Exactly one scope parameter (`serverIds`, `poolId`, `zoneId`, or `platformId`) must be sent; a grouping resolves to its current non-absent members when the request is served. swallow chooses the step (about 180 points, a multiple of 30 s). A scope resolving to zero Servers answers 200 without contacting the backend (server-metrics.md, Usage History).
      operationId: getMetricRange
      parameters:
        - description: 'Scope: comma-separated explicit Server ids, at most 200. Each id may contain only letters, digits, `-`, and `_`.'
          explode: false
          in: query
          name: serverIds
          required: false
          schema:
            items:
              type: string
            maxItems: 200
            minItems: 1
            type: array
          style: form
        - description: Scope the Servers currently placed in this Pool.
          in: query
          name: poolId
          required: false
          schema:
            type: string
        - description: Scope the Servers currently placed in this Zone.
          in: query
          name: zoneId
          required: false
          schema:
            type: string
        - description: Scope the Servers whose membership axis names this Platform.
          in: query
          name: platformId
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/MetricNames'
        - description: A named range ending now. Defaults to `1h` when neither `window` nor `start`/`end` is sent; mutually exclusive with `start`/`end`.
          in: query
          name: window
          required: false
          schema:
            enum:
              - 1h
              - 6h
              - 24h
              - 7d
            type: string
        - description: Explicit range start (RFC 3339); sent together with `end`. The span must be between 5 minutes and 7 days.
          in: query
          name: start
          required: false
          schema:
            format: date-time
            type: string
        - description: Explicit range end (RFC 3339); sent together with `start`, after it.
          in: query
          name: end
          required: false
          schema:
            format: date-time
            type: string
        - description: '`aggregate` combines the scope into one series per metric using the metric''s scope aggregate; `perServer` returns one series per metric and Server and allows at most 50 Servers.'
          in: query
          name: mode
          required: false
          schema:
            default: aggregate
            enum:
              - aggregate
              - perServer
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRange'
          description: The usage history.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
