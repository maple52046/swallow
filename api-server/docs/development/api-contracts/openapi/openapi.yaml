      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformDeployRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformWorkflowAcceptance'
          description: The Platform and the Workflow building it are persisted.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Create a Platform and start the Workflow that builds it.
      tags:
        - platforms
  /api/v1/platforms/deployment-requirements/slurm:
    get:
      description: Requires the `admin` role. A requirement that was never stored is returned as the disabled representation, not 404.
      operationId: getSlurmDeploymentRequirement
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimumResourceRequirement'
          description: The current requirement.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Read the system-wide Slurm Minimum Resource Requirement.
      tags:
        - platforms
    put:
      description: 'Requires the `admin` role. `minimumResources: null` disables the requirement; omitting `minimumResources`, or a threshold that is not greater than zero, is 400.'
      operationId: replaceSlurmDeploymentRequirement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinimumResourceRequirementChange'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimumResourceRequirement'
          description: The stored requirement.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace or disable the system-wide Slurm Minimum Resource Requirement.
      tags:
        - platforms
  /api/v1/platforms/gpu-operator/releases:
    get:
      description: Requires the `admin` role. A GPU Operator setting's `version` and `draDriverVersion` must come from this catalog.
      operationId: listGPUOperatorReleases
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GPUOperatorReleaseCatalog'
          description: The release catalog.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List the AMD GPU Operator releases Swallow ships, newest first.
      tags:
        - platforms
  /api/v1/platforms/sync:
    post:
      description: 'Requires the `admin` role. Platforms without a recorded Integration are skipped. One failing Platform does not stop the rest: its failure is reported in its own `error`.'
      operationId: syncAllPlatformMemberships
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlatformMembershipReport'
                type: array
          description: One membership report per synced Platform.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Read the membership of every Platform with a recorded Integration now.
      tags:
        - platforms
  /api/v1/provisioning/boot-isos:
    get:
      description: Requires role `admin`. Filters are conjunctive.
      operationId: listBootIsos
      parameters:
        - description: Only Boot ISOs of this Site's provisioner Integrations.
          in: query
          name: siteId
          required: false
          schema:
            type: string
        - description: Only Boot ISOs of this provisioner Integration.
          in: query
          name: integrationId
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootIsoList'
          description: The builder's availability and the matching Boot ISOs.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: `integrationId` names an Integration that is not a provisioner.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site or the Integration does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: List Boot ISOs and whether this installation can build them.
      tags:
        - provisioning
    post:
      description: Requires role `admin`. Builds in seconds; a failed build stores nothing. The caller's username is recorded as `createdBy`.
      operationId: createBootIso
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootIsoCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootIso'
          description: The built Boot ISO.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid; `name`, `integrationId`, or `rackAddress` is missing or invalid; or the Integration is not a provisioner.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the name is taken for the Integration (case-insensitive), or the builder is unavailable (the message says why).'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`internal_error`: building failed; the message carries the packaging tool''s summary.'
        default:
          $ref: '#/components/responses/Error'
      summary: Build a Boot ISO for one provisioner Integration's MAAS rack, synchronously.
      tags:
        - provisioning
  /api/v1/provisioning/boot-isos/{id}:
    delete:
      description: Requires role `admin`.
      operationId: deleteBootIso
      responses:
        "204":
          description: The Boot ISO was deleted.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Boot ISO does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a Server has Boot Media enabled with this Boot ISO.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete a Boot ISO and its file while no Server's Boot Media uses it.
      tags:
        - provisioning
    get:
      description: Requires role `admin`.
      operationId: getBootIso
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootIso'
          description: The Boot ISO.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Boot ISO does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read one Boot ISO.
      tags:
        - provisioning
    parameters:
      - description: The Boot ISO's opaque id.
        in: path
        name: id
        required: true
        schema:
          type: string
  /api/v1/provisioning/boot-isos/{id}/rebuild:
    parameters:
      - description: The Boot ISO's opaque id.
        in: path
        name: id
        required: true
        schema:
          type: string
    post:
      description: Requires role `admin`. Takes no body. `id` and `url` do not change; a failed rebuild keeps the previous file and record. Rebuilds run one at a time per installation. The caller's username is recorded as `rebuiltBy`.
      operationId: rebuildBootIso
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootIso'
          description: The rebuilt Boot ISO.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the stored rack address is refused by the current rules.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Boot ISO does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the builder is unavailable (the message says why).'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`internal_error`: building failed; the message carries the packaging tool''s summary.'
        default:
          $ref: '#/components/responses/Error'
      summary: Rebuild a Boot ISO in place from the current templates and its own rack address.
      tags:
        - provisioning
  /api/v1/provisioning/deployment-operations:
    post:
      description: Requires role `admin`. Takes the same request and runs the same side-effect-free preflight as the deprecated direct batch, then persists one Workflow (one `provision-os` Task per Server, plus its `configure-ntp` and, with Boot Media, `ensure-boot-media` Tasks). Progress is read through the Workflows contract.
      operationId: createDeploymentOperation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OsDeploymentRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
          description: The Workflow was created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: malformed input (see the deprecated batch), or the Workflow intent was refused as invalid.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: a Server or the template does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a preflight conflict as for the deprecated batch, a target already held by an unfinished Workflow, the installation has no Deployment Key, or it has no NTP server (`SWALLOW_API_NTP_SERVER`).'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: durable provisioning is not wired up, the provisioner cannot be reached, or the Site''s automation cannot run the `configure-ntp` Tasks.'
        default:
          $ref: '#/components/responses/Error'
      summary: Accept a multi-Server OS deployment as one durable Workflow.
      tags:
        - provisioning
  /api/v1/provisioning/deployments:
    post:
      deprecated: true
      description: 'Requires role `admin`. Kept for one release with its original wire behavior; every response carries `Deprecation: true` and a successor `Link` to `/api/v1/provisioning/deployment-operations`. Runs the complete preflight, then dispatches with at most four workers. The `202` body is an acceptance report, not a durable job, and there is no rollback.'
      operationId: deployServerBatchViaDeprecatedAlias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OsDeploymentRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OsDeploymentBatchResult'
          description: Every target was dispatched; each one was accepted or refused by the provider.
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Link:
              $ref: '#/components/headers/SuccessorLink'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: malformed input — the target list, an unknown `deployTarget`, a missing image without a template, an image not in the provisioner''s live catalog, or invalid user data or network intent.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: a Server or the template does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a target is absent, not ready, locked, of another Integration than the other targets or the template, or needs a new inspection before a disk deployment; the image is a custom image not verified for the deploy target, not fully staged, or of another architecture; the provisioner cannot deploy from memory or offers no network configuration; a network conflict; or the installation has no Deployment Key.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the provisioner cannot be reached before dispatch.'
        default:
          $ref: '#/components/responses/Error'
      summary: Deprecated direct multi-Server OS deployment; use createDeploymentOperation.
      tags:
        - provisioning
  /api/v1/provisioning/deployments/preflight:
    post:
      description: 'Requires role `admin`. Read-only: checks target identity, presence, Ready, same-Integration, and the live Server Lock; it does not inspect the network, validate an image, reserve a Server, or start a deployment. A completed check answers `200` even when targets are not ready. Names no deploy target, so it never reports `inspection_required`.'
      operationId: preflightOsDeploymentTargets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentTargetPreflightRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentTargetPreflight'
          description: The completed check.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid, or `serverIds` is empty, longer than 100, contains an empty id, or repeats an id.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: a Server is unknown to swallow.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the live lock state cannot be read from the provisioner.'
        default:
          $ref: '#/components/responses/Error'
      summary: Check, without side effects, whether Servers can be OS deployment targets now.
      tags:
        - provisioning
  /api/v1/provisioning/image-verifications:
    post:
      description: 'Requires role `admin`. Launches a durable `verify-os-image` Workflow: `provision-os`, one record Task (success or failure), and, unless `keepServer` is true, `recover-server` to return the borrowed Server.'
      operationId: createOsImageVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OsImageVerificationRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
          description: The Workflow was created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid; `integrationId`, `imageId`, `architecture`, or `serverId` is missing; `deployTarget` is not `disk` or `ram`; the Server is absent, not `ready`, of another Integration, or of another architecture; or the image is not in the provisioner''s live catalog.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Server or the Integration does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the Server is locked or held by an unfinished Workflow; the image is not fully staged or the provisioner cannot deploy it in the requested target; or the installation has no Deployment Key.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: durable provisioning is not wired up, or the provisioner cannot be reached.'
        default:
          $ref: '#/components/responses/Error'
      summary: Prove a custom OS Image for one Deploy Target by deploying it on a chosen ready Server.
      tags:
        - provisioning
  /api/v1/provisioning/images:
    delete:
      description: Requires role `admin`. The image is addressed by the identity the catalog returns, as query parameters, because an image id can contain a slash. Also removes swallow's metadata of the image.
      operationId: deleteOsImage
      parameters:
        - $ref: '#/components/parameters/OsImageIntegrationId'
        - $ref: '#/components/parameters/OsImageId'
        - $ref: '#/components/parameters/OsImageArchitecture'
      responses:
        "204":
          description: The image was deleted.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: a query parameter is missing, the Integration is not a provisioner, or the provisioner refused (a synced OS release, no matching deletable image, or no image-deletion capability) — the provider''s own wording is kept.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: a provider transport failure, or the Integration has no credential.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete one operator-uploaded custom OS Image from its provisioner.
      tags:
        - provisioning
    get:
      description: Requires role `admin`. Reads the provisioner's catalog live and merges swallow's OS Image metadata and verification records onto it. Returns a plain array; it contains only resources the provisioner accepts for OS deployment.
      operationId: listOsImages
      parameters:
        - $ref: '#/components/parameters/OsImageIntegrationId'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OsImage'
                type: array
          description: The provisioner's deployable OS Images.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: `integrationId` is missing, or the Integration is not a provisioner.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the provisioner cannot be reached or refused swallow''s credential, or the Integration has no credential.'
        default:
          $ref: '#/components/responses/Error'
      summary: List the OS Images one provisioner can deploy, with swallow's metadata merged.
      tags:
        - provisioning
    post:
      description: 'Requires role `admin`. The only multipart endpoint of this surface: the `content` part is streamed to the provider, and swallow keeps no copy. Whether the image is a custom image is decided by the provisioner, not by the caller. Not bounded by the short provider read timeout of catalog reads.'
      operationId: uploadOsImage
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OsImageUploadForm'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OsImage'
          description: The created image, in the shape of one catalog row. A freshly uploaded image has no metadata, so its spec is empty except `spec.defaultUser` when `defaultUser` was sent.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: `integrationId`, `name`, `architecture`, or `content` is missing, `content` is empty or unreadable, a text part is longer than 200 characters, `defaultUser` is not a POSIX login name, or the Integration is not a provisioner; or the provisioner refused the upload (unsupported `filetype`, duplicate name, no upload capability) — the provider''s own wording is kept.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`internal_error`: the provider accepted the artifact but storing its default user failed; the image exists and the default user can be set with its metadata.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: a provider transport failure or 5xx during the upload, or the Integration has no credential.'
        default:
          $ref: '#/components/responses/Error'
      summary: Upload a new provider-owned OS Image to one provisioner.
      tags:
        - provisioning
  /api/v1/provisioning/images/metadata:
    delete:
      description: 'Requires role `admin`. Idempotent: answers `204` even when no metadata existed.'
      operationId: clearOsImageMetadata
      parameters:
        - $ref: '#/components/parameters/OsImageIntegrationId'
        - $ref: '#/components/parameters/OsImageId'
        - $ref: '#/components/parameters/OsImageArchitecture'
      responses:
        "204":
          description: No metadata remains for the image.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: a query parameter is missing.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Remove swallow's metadata of one OS Image, reverting it to its provider values.
      tags:
        - provisioning
    put:
      description: 'Requires role `admin` (decision 071). Replaces the whole metadata: an empty or omitted field clears that value, and all-empty metadata is removed. The metadata needs no provider realization: it does not read the provider catalog and never returns `503`. The new effective name and default user are propagated to the Server projections best-effort.'
      operationId: setOsImageMetadata
      parameters:
        - $ref: '#/components/parameters/OsImageIntegrationId'
        - $ref: '#/components/parameters/OsImageId'
        - $ref: '#/components/parameters/OsImageArchitecture'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OsImageMetadataRequest'
        required: true
      responses:
        "204":
          description: The metadata was stored (or removed, when nothing remained after normalization).
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: a query parameter is missing, the body is invalid, a field or tag is longer than 200 characters, there are more than 50 tags, or `defaultUser` is not a POSIX login name.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace swallow's metadata (name, OS, release, tags, default user) of one OS Image.
      tags:
        - provisioning
  /api/v1/provisioning/integrations/{id}/enroll-bundle:
    parameters:
      - description: The provisioner Integration's swallow-issued id.
        in: path
        name: id
        required: true
        schema:
          type: string
    post:
      description: Requires role `admin`. The body is optional; without `swallowUrl` the command uses the scheme and host this request came in on. The response carries the provisioner's stored credential, so it is never cached and never logged.
      operationId: createServerEnrollmentBundle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerEnrollmentBundleRequest'
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerEnrollmentBundle'
          description: The enrollment bundle.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid; `swallowUrl` is not an absolute http(s) URL without path, query, or credentials; or the Integration is not a provisioner, or its provider has no existing-host enrollment.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the Integration has no stored credential, or Server Enrollment is not wired up.'
        default:
          $ref: '#/components/responses/Error'
      summary: Return the endpoint, credential, and command a host keeping its OS runs to enroll itself.
      tags:
        - provisioning
  /api/v1/provisioning/integrations/{id}/http-proxy:
    get:
      description: Requires role `admin` (provisioner-http-proxy.md). Returns swallow's stored setting; when swallow holds none yet, the provisioner's current configuration is read and adopted as the spec first, without writing to it. Needs the provisioner's HTTP Proxy capability.
      operationId: getProvisionerHttpProxy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionerHTTPProxy'
          description: The setting.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the Integration is not a `provisioner`, has no adapter, or its provisioner lacks the HTTP Proxy capability.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: an adopting read could not reach the provisioner, the Integration has no credential, or its credential may not read provisioner settings.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read a provisioner Integration's HTTP proxy setting for deployed machines.
      tags:
        - sites
    parameters:
      - description: The `integrationId` of a `provisioner` Integration.
        in: path
        name: id
        required: true
        schema:
          type: string
    put:
      description: Requires role `admin`. swallow validates the body and stores it as the spec (the generation increments), then answers without calling the provisioner; the HTTP Proxy controller writes it to the provisioner shortly after, and the setting's conditions report when it has. The change affects only deployments the provisioner starts afterwards.
      operationId: replaceProvisionerHttpProxy
      requestBody:
        content:
          application/json:
            schema:
              properties:
                httpProxy:
                  description: Required for `external` and `peer`, and must be absent or `""` for `none` and `builtin`. An absolute `http` or `https` URL with a host and an optional port (1-65535), reduced to `scheme://host[:port]`. Refused when it carries spaces, a user or password, a query, a fragment, or a path other than `/`.
                  type: string
                mode:
                  allOf:
                    - $ref: '#/components/schemas/ProvisionerHTTPProxyMode'
                  description: The mode to set. Matched case-insensitively and with surrounding whitespace removed; the response reports the lower-case value.
              required:
                - mode
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionerHTTPProxy'
          description: The stored setting with the new spec.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON; `mode` is missing or not a mode; `httpProxy` is missing, malformed, or does not apply to `mode`; or the Integration is not a `provisioner`, has no adapter, or its provisioner lacks the capability.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the Integration has no credential.'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace a provisioner Integration's HTTP proxy spec for deployed machines.
      tags:
        - sites
  /api/v1/provisioning/integrations/{id}/reconcile:
    parameters:
      - description: The provisioner Integration's swallow-issued id.
        in: path
        name: id
        required: true
        schema:
          type: string
    post:
      description: Requires role `admin`. Takes no body and runs whether or not the Integration is enabled. A provider failure is reported in the report's `error` with status `200`.
      operationId: reconcileProvisioner
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionerReconcileReport'
          description: The pass report.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the Integration is not a provisioner.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Run one inventory reconciliation pass over one provisioner now.
      tags:
        - provisioning
  /api/v1/provisioning/integrations/{id}/subnets:
    get:
      description: Requires role `admin` (provisioner-subnet-dns.md). The subnets are read live from the provisioner, which owns them; each subnet's DNS servers are swallow's stored setting, and a subnet swallow holds none for yet is adopted from this read, without writing to the provisioner. Needs the provisioner's Subnet DNS capability.
      operationId: listProvisionerSubnets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionerSubnetCatalog'
          description: The provisioner's subnets, in the provisioner's order.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the Integration is not a `provisioner`, has no adapter, or its provisioner lacks the Subnet DNS capability.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the provisioner could not be reached, the Integration has no credential, or its credential may not read subnets.'
        default:
          $ref: '#/components/responses/Error'
      summary: List a provisioner Integration's subnets with their Subnet DNS settings.
      tags:
        - sites
    parameters:
      - description: The `integrationId` of a `provisioner` Integration.
        in: path
        name: id
        required: true
        schema:
          type: string
  /api/v1/provisioning/integrations/{id}/subnets/{subnetId}/dns-servers:
    parameters:
      - description: The `integrationId` of a `provisioner` Integration.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The provisioner's own subnet id, as the subnet list reports it.
        in: path
        name: subnetId
        required: true
        schema:
          type: string
    put:
      description: Requires role `admin`. swallow validates the list, checks that the provisioner lists the subnet, stores the list as the spec (the generation increments), and answers without writing to the provisioner; the Subnet DNS controller writes it shortly after, and the setting's conditions report when it has. The change affects only `automatic` and `static` deployments the provisioner starts afterwards.
      operationId: replaceSubnetDnsServers
      requestBody:
        content:
          application/json:
            schema:
              properties:
                dnsServers:
                  description: IPv4 or IPv6 addresses in the order deployed machines should use them; `[]` clears the setting. Surrounding whitespace is removed and each address is stored in canonical form. Refused when an entry is empty, not an IP address, or carries a zone, or when two entries are the same address.
                  items:
                    type: string
                  maxItems: 8
                  type: array
              required:
                - dnsServers
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionerSubnet'
          description: The subnet with its new spec; `status.dnsServers` is still what the provisioner holds now.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON; `dnsServers` is missing, not an array, or breaks a rule above; or the Integration is not a `provisioner`, has no adapter, or its provisioner lacks the capability.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration does not exist, or the provisioner has no subnet `subnetId`.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the provisioner could not be reached to read its subnets, or the Integration has no credential.'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace one subnet's Subnet DNS spec.
      tags:
        - sites
  /api/v1/provisioning/networks/inspect:
    post:
      description: Requires role `admin`. Read-only and bounded independently from deployment preflight. Targets of different Integrations are reported as `integration_mismatch` issues with an empty `targets` list instead of being read.
      operationId: inspectDeploymentNetworks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInspectionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInspection'
          description: One observation per target, in request order, and the issues blocking a deployment.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid; `serverIds` is empty, longer than 100, contains an empty id, or repeats an id; or the Integration is not a provisioner.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: a Server, or its provider Machine, does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the provisioner offers no network configuration.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the provisioner cannot be reached.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read the live Network Configuration and a deployment suggestion for 1–100 Servers.
      tags:
        - provisioning
  /api/v1/provisioning/reconcile:
    post:
      description: 'Requires role `admin`. Takes no body. One provisioner failing does not stop the others: its failure is reported in its report''s `error`. Returns a plain array, one report per enabled provisioner Integration.'
      operationId: reconcileAllProvisioners
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProvisionerReconcileReport'
                type: array
          description: One report per enabled provisioner Integration.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Run one inventory reconciliation pass over every enabled provisioner now.
      tags:
        - provisioning
  /api/v1/provisioning/recover-operations:
    post:
      description: Requires role `admin`. Same validation as Release, then one `recover-server` Task per Server. Allowed from `failed`, `broken`, `rescue`, `deployed`, and `allocated`; a target already `ready` succeeds immediately. A `deployed` target a Platform claims is refused.
      operationId: createRecoverOperation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverOperationRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
          description: The Workflow was created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid; `serverIds` is empty or longer than 100; a target repeats, is in another Site, or is in a state Recover is not allowed from.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: a Server is unknown to swallow.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a target is inside an unfinished Workflow (without `cancelActiveWorkflows`), is locked, or is a `deployed` Server a Platform claims; or a requested cancel was refused for a running Workflow.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: durable provisioning is not wired up, or the live lock state is unavailable.'
        default:
          $ref: '#/components/responses/Error'
      summary: Accept a return to Ready of 1–100 Servers in a not-usable state as one durable Workflow.
      tags:
        - provisioning
  /api/v1/provisioning/release-operations:
    post:
      description: Requires role `admin`. Validates presence, recoverable state, Site, duplicates, active work, and the live Server Lock before persisting one `release-os` Task per Server. A Server a Platform claims is refused for the whole batch.
      operationId: createReleaseOperation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOperationRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
          description: The Workflow was created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid; `serverIds` is empty or longer than 100; a target repeats, is in another Site, or is in a state Release is not allowed from.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: a Server is unknown to swallow.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a target is inside an unfinished Workflow (without `cancelActiveWorkflows`), is locked, or is claimed by a Platform; or a requested cancel was refused for a running Workflow.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: durable provisioning is not wired up, or the live lock state is unavailable.'
        default:
          $ref: '#/components/responses/Error'
      summary: Accept a Release of 1–100 Servers as one durable Workflow.
      tags:
        - provisioning
  /api/v1/provisioning/tags:
    get:
      description: Requires role `admin`. A Site with no enabled provisioner, including an unknown Site, answers an empty `tags` array. 400 for a missing `siteId` or a provisioner refusal; 503 when the provisioner cannot be reached or has no credential.
      operationId: listServerTags
      parameters:
        - in: query
          name: siteId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTagCatalog'
          description: The Site's known tags.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List the tags known for a Site, with whether swallow may assign each.
      tags:
        - servers
    post:
      description: Requires role `admin`. Not gated on Server Lock. Atomic across the listed Servers; the provisioner converges asynchronously (the Servers' conditions report it). 400 for an invalid body, empty `serverIds`, no `add` or `remove`, or an invalid, contradictory, or automatic tag name; 404 for an unknown Server; 409 when a Server is not adopted yet or its spec changed during the edit.
      operationId: editServerTags
      requestBody:
        content:
          application/json:
            schema:
              properties:
                add:
                  description: Tags to apply to every listed Server; at least one of `add` and `remove` is non-empty.
                  items:
                    type: string
                  type: array
                remove:
                  description: Tags to unapply from every listed Server.
                  items:
                    type: string
                  type: array
                serverIds:
                  items:
                    type: string
                  minItems: 1
                  type: array
              required:
                - serverIds
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTagEditResult'
          description: Each listed Server's spec after the edit, in request order.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Write a tri-state tag edit into the spec of one or more Servers.
      tags:
        - servers
