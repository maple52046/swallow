    OverviewMonitoring:
      description: 'Firing-alert summary. Three states: read (`configured` and `available`, `error` null), not configured (neither, `error` null; a normal state), and unavailable (`configured`, not `available`, `error.code` provider_unavailable). In both non-read states counts are zero and `items` is empty, which a consumer must not present as "no alerts".'
