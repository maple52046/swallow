      enum:
        - pending
        - installed
        - failed
        - uninstalling
        - absent
      type: string
    SoftwareCatalog:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SoftwareCatalogEntry'
          type: array
      required:
        - items
      type: object
    SoftwareCatalogEntry:
