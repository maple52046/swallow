          nullable: true
          type: object
        state:
          $ref: '#/components/schemas/SoftwareAssignmentState'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - serverId
        - kind
        - roles
        - spec
        - state
        - lastWorkflowId
        - lastAppliedAt
        - createdAt
        - updatedAt
      type: object
    SoftwareAssignmentList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SoftwareAssignment'
          type: array
      required:
        - items
