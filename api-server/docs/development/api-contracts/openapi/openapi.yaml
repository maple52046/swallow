    SshKey:
      description: 'One swallow-owned SSH Key (glossary SSH Key) as a migrated resource (decision 071): the spec is the key swallow registers, and the status its realization in every provisioner. Public key material is not secret; no response ever carries a stored private key.'
      properties:
        generation:
          description: Counts spec changes; 1 when stored, and +1 each time the Deployment Key is replaced.
          format: int64
          type: integer
        id:
          type: string
        ownerUserId:
          description: The owning User of an Access Key; omitted for the Deployment Key.
          type: string
        spec:
          properties:
            fingerprint:
              description: OpenSSH SHA256 fingerprint (`SHA256:…`), unique across all SSH Keys.
              type: string
            keyType:
              description: The SSH algorithm name from the public key.
              enum:
                - ssh-ed25519
                - ssh-rsa
                - ecdsa-sha2-nistp256
                - ecdsa-sha2-nistp384
                - ecdsa-sha2-nistp521
              type: string
            name:
              type: string
            publicKey:
              description: One authorized_keys line, `<type> <base64> <comment>`.
              type: string
            purpose:
              enum:
                - deployment
                - access
              type: string
          required:
            - name
            - purpose
            - keyType
            - fingerprint
            - publicKey
          type: object
        status:
          properties:
            conditions:
              description: 'The summary over every provisioner: `realized` is `true` only when every enabled provisioner holds the current generation (and when there is none).'
              items:
                $ref: '#/components/schemas/Condition'
              type: array
            createdAt:
              $ref: '#/components/schemas/Timestamp'
            observedGeneration:
              description: The generation every provisioner holds.
              format: int64
              type: integer
            provisioners:
              description: One entry per enabled provisioner Integration across all Sites; always an array.
              items:
                $ref: '#/components/schemas/SshKeyRealization'
              type: array
            updatedAt:
              $ref: '#/components/schemas/Timestamp'
          required:
            - observedGeneration
            - conditions
            - provisioners
            - createdAt
            - updatedAt
          type: object
      required:
        - id
        - generation
        - spec
        - status
      type: object
    SshKeyGenerateRequest:
      properties:
        name:
          description: Same rules as import; also becomes the public key's comment.
          type: string
      required:
        - name
      type: object
    SshKeyImportRequest:
      properties:
        name:
          description: Trimmed, then 1–100 characters, unique (case-insensitively) among the caller's Access Keys.
          type: string
        publicKey:
          description: 'One authorized_keys line without options; the comment is preserved. Accepted types: ed25519, ECDSA (NIST P-256, P-384, P-521), and RSA of at least 2048 bits.'
          type: string
      required:
        - name
        - publicKey
      type: object
    SshKeyRealization:
      description: The realization of one SSH Key in one provisioner Integration.
      properties:
        conditions:
          description: Empty until the controller first judged the key here. `realized` is `false` with `capability_missing` for a provisioner that cannot hold SSH keys, `provider_unreachable` when it could not be reached, and `failed` when it refused the key (the message says why).
          items:
            $ref: '#/components/schemas/Condition'
          type: array
        integrationId:
          type: string
        observedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: When the controller last judged the key here; `null` before the first judgement.
          nullable: true
        observedGeneration:
          description: The generation this provisioner holds.
          format: int64
          type: integer
        siteId:
          type: string
      required:
        - integrationId
        - siteId
        - observedGeneration
        - observedAt
        - conditions
      type: object
    SuccessAcknowledgement:
      description: The body of a request that completed and has nothing else to report.
      properties:
        success:
          enum:
            - true
          type: boolean
      required:
        - success
      type: object
    TimeSyncCheck:
      description: 'What a node with an unsynchronized clock does to the install: `enforce` fails it before anything is installed, `warn` reports it and continues.'
      enum:
        - enforce
        - warn
      type: string
    Timestamp:
      description: ISO 8601 in UTC (conventions.md, Timestamps).
      format: date-time
      type: string
    VirtualMachineEnrollmentAccepted:
      properties:
        workflowId:
          type: string
      required:
        - workflowId
      type: object
    VirtualMachineEnrollmentRequest:
      properties:
        account:
          description: The login account on the Hypervisor; defaults to its effective Server Default User.
          type: string
        bootIsoId:
          description: A Boot ISO of the same provisioner to give each virtual machine libvirt Boot Media.
          type: string
        domains:
          items:
            description: A libvirt domain name without surrounding whitespace, `/`, or control characters.
            maxLength: 128
            minLength: 1
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        hypervisorServerId:
          type: string
        integrationId:
          description: The provisioner the virtual machines enroll into; it must be in the Hypervisor's Site.
          type: string
        powerOffRunning:
          description: Hard power-off a running domain instead of asking for attention; default false.
          type: boolean
      required:
        - integrationId
        - hypervisorServerId
        - domains
      type: object
    Workflow:
      description: 'The canonical projection of a schema-v3 Workflow: its frozen intent, status, Tasks (still serialized as `steps[]`), and Temporal correlation. Credential, cloud-init, and other secret values never appear: sensitive keys are removed from `intentSnapshot`, and Task parameters and secret references are not part of the projection.'
      properties:
        clusterId:
          deprecated: true
          description: Deprecated alias; always equal to `platformId`.
          nullable: true
          type: string
        definition:
          description: Name of the Workflow definition that executes the intent.
          type: string
        definitionVersion:
          description: Version of `definition`.
          type: integer
        execution:
          $ref: '#/components/schemas/WorkflowExecutionSummary'
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        id:
          description: Opaque Workflow ID (a UUID).
          type: string
        intent:
          description: Operator-facing summary of the intent; may be empty.
          type: string
        intentSnapshot:
          additionalProperties: true
          description: The frozen, non-secret intent the Workflow converges to. Its shape depends on `kind`; keys such as `extraVars`, `userData`, `password`, `token`, `credential`, and `privateKey` are removed at every depth. `summary` repeats `intent`.
          type: object
        kind:
          $ref: '#/components/schemas/WorkflowKind'
        leases:
          description: The resource leases the execution currently holds. Populated only by `GET /api/v1/workflows/{id}` (an empty array when none are held); null in listings and in create and rerun responses.
          items:
            $ref: '#/components/schemas/WorkflowResourceLease'
          nullable: true
          type: array
        platformId:
          nullable: true
          type: string
        requestCorrelation:
          description: The request ID of the HTTP request that accepted the intent, when known.
          nullable: true
          type: string
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        requestedBy:
          description: Username of the caller that requested the work; empty for system-launched work.
          type: string
        retryOfOperationId:
          description: The Workflow this one was created to rerun or retry, if any.
          nullable: true
          type: string
        schemaVersion:
          enum:
            - 3
          type: integer
        siteId:
          type: string
        startState:
          description: Whether the durable execution has been started yet.
          enum:
            - pending
            - started
          type: string
        startedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        statusReason:
          description: Operator-facing reason for the current status, when one was recorded.
          nullable: true
          type: string
        steps:
          description: The Workflow's Tasks (wire name `steps`). A Workflow is created with at least one Task, so this is null only for a record that holds none.
          items:
            $ref: '#/components/schemas/WorkflowTask'
          nullable: true
          type: array
        targetResources:
          description: Every resource the Workflow leases, sorted by kind then ID. Null when it has none.
          items:
            $ref: '#/components/schemas/WorkflowResourceReference'
          nullable: true
          type: array
        targetServerIds:
          description: The frozen target Servers. Null when the Workflow targets no Server.
          items:
            type: string
          nullable: true
          type: array
        temporal:
          $ref: '#/components/schemas/WorkflowTemporalReference'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - schemaVersion
        - kind
        - intent
        - intentSnapshot
        - definition
        - definitionVersion
        - status
        - statusReason
        - startState
        - temporal
        - siteId
        - platformId
        - clusterId
        - targetResources
        - targetServerIds
        - steps
        - leases
        - retryOfOperationId
        - requestedBy
        - requestCorrelation
        - requestedAt
        - startedAt
        - finishedAt
        - updatedAt
        - execution
      type: object
    WorkflowAccepted:
      description: Acknowledges a request that created or acted on a durable Workflow (cancel here; install, uninstall, and the provisioning *-operations elsewhere). Follow the Workflow through `GET /api/v1/workflows/{id}`.
      properties:
        operationId:
          description: The Workflow ID (wire name `operationId`).
          type: string
      required:
        - operationId
      type: object
    WorkflowExecutionSummary:
      description: The compatibility `execution` projection for clients written against Operation v2. It must not be used to infer Task state. For a schema-v3 Workflow, `status` repeats the Workflow status; `runId` is the single Task's external execution ID when the Workflow has exactly one Task that started, and the Temporal run ID otherwise; and `playbook` is the single Task's kind (not a playbook name), empty for a multi-Task Workflow.
      properties:
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        playbook:
          type: string
        runId:
          type: string
        startedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        status:
          description: A `WorkflowStatus`, or `indeterminate` for a schema-v2 run whose outcome cannot be proven.
          enum:
            - pending
            - running
            - waiting_external
            - waiting_dependency
            - canceling
            - succeeded
            - failed
            - partially_succeeded
            - canceled
            - requires_attention
            - indeterminate
          type: string
        statusReason:
          nullable: true
          type: string
      required:
        - runId
        - playbook
        - status
        - statusReason
        - startedAt
        - finishedAt
      type: object
    WorkflowKind:
      description: What a Workflow is for; selects its definition. Several kinds are launched only through their owning feature endpoint (for example `verify-os-image`, `inspect-hardware`) and appear here in listings.
      enum:
        - deploy-os
        - release-os
        - recover-server
        - verify-os-image
        - inspect-hardware
        - enroll-virtual-machines
        - install-gpu-driver
        - deploy-kubernetes
        - uninstall-kubernetes
        - configure-gpu-operator
        - configure-slurm
        - uninstall-slurm
        - install-exporters
        - uninstall-exporters
        - deploy-k8s-exporters
        - remove-k8s-exporters
        - configure-docker-ce
        - uninstall-docker-ce
        - configure-podman
        - uninstall-podman
        - configure-nfs
        - uninstall-nfs
        - configure-prometheus
        - uninstall-prometheus
        - configure-grafana
        - uninstall-grafana
        - configure-omnistat
        - configure-device-metrics-exporter
        - uninstall-device-metrics-exporter
        - configure-ntp
        - custom
      type: string
    WorkflowOrLegacyOperation:
      description: A schema-v3 `Workflow`, or a historical schema-v2 record as `LegacyOperation` (`schemaVersion` 2).
      oneOf:
        - $ref: '#/components/schemas/Workflow'
        - $ref: '#/components/schemas/LegacyOperation'
    WorkflowPage:
      description: The pagination envelope (conventions.md, Pagination) over the merged history.
      properties:
        items:
          items:
            $ref: '#/components/schemas/WorkflowOrLegacyOperation'
          type: array
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
        - items
        - total
        - page
        - pageSize
      type: object
    WorkflowResourceLease:
      description: A fencing lease that serializes mutations of one Server or Platform.
      properties:
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        fencingToken:
          description: Monotonically increasing per resource; verified before every side effect.
          format: int64
          type: integer
        owner:
          description: The Temporal workflow ID holding the lease.
          type: string
        resourceKey:
          description: '`server:<id>` or `platform:<id>`.'
          type: string
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - resourceKey
        - owner
        - fencingToken
        - expiresAt
        - updatedAt
      type: object
    WorkflowResourceReference:
      description: A resource a Workflow or Task targets, by kind and swallow ID.
      properties:
        id:
          type: string
        kind:
          description: The resource kind, for example `server` or `platform`.
          type: string
      required:
        - kind
        - id
      type: object
    WorkflowStatus:
      description: The canonical status of a schema-v3 Workflow. `succeeded`, `failed`, `partially_succeeded`, and `canceled` are terminal; `requires_attention` waits for an operator.
      enum:
        - pending
        - running
        - waiting_external
        - waiting_dependency
        - canceling
        - succeeded
        - failed
        - partially_succeeded
        - canceled
        - requires_attention
      type: string
    WorkflowTask:
      description: 'One Task (wire name: a step) of a Workflow: an atomic, idempotent unit run by one Runner. Its parameters and secret references never cross the API.'
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/WorkflowTaskArtifact'
          type: array
        attempt:
          description: The current attempt, incremented by a Task retry.
          type: integer
        continueOn:
          description: Extra dependency outcomes that still let this Task run; absent when it runs only after every dependency is satisfied.
          items:
            $ref: '#/components/schemas/WorkflowTaskStatus'
          type: array
        dependsOn:
          description: IDs of the Tasks this one waits for. An array on every schema-v3 Workflow; null only on the synthetic Task of a schema-v2 record.
          items:
            type: string
          nullable: true
          type: array
        error:
          allOf:
            - $ref: '#/components/schemas/WorkflowTaskError'
          description: The latest normalized error; null when the Task has none.
          nullable: true
        executor:
          description: The Runner (wire name `executor`). The `provisioner` Runner is still serialized as `maas`.
          enum:
            - internal
            - ansible
            - maas
          type: string
        externalExecution:
          allOf:
            - $ref: '#/components/schemas/WorkflowTaskExternalExecution'
          description: Correlation with the Runner's own execution, published as soon as it starts; null before then.
          nullable: true
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        id:
          description: Unique within the Workflow.
          type: string
        job:
          description: The Job grouping this Task; absent for a Task outside any Job.
          type: string
        kind:
          description: What the Task does, for example `provision-os`, `wait-for-ssh`, or `ansible-playbook`.
          type: string
        live:
          $ref: '#/components/schemas/WorkflowTaskLiveProgress'
        name:
          description: Operator-facing name.
          type: string
        progress:
          type: integer
        startedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        status:
          $ref: '#/components/schemas/WorkflowTaskStatus'
        targets:
          items:
            $ref: '#/components/schemas/WorkflowResourceReference'
          type: array
        waitingReason:
          description: Why the Task is waiting; absent when it is not.
          type: string
      required:
        - id
        - kind
        - name
        - executor
        - dependsOn
        - targets
        - status
        - attempt
        - progress
        - error
        - externalExecution
        - artifacts
        - startedAt
        - finishedAt
      type: object
    WorkflowTaskArtifact:
      description: Metadata of an output a Task retained; the bytes are not served here.
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        id:
          type: string
        mediaType:
          type: string
        name:
          type: string
        sizeBytes:
          format: int64
          type: integer
      required:
        - id
        - name
        - mediaType
        - sizeBytes
        - createdAt
      type: object
    WorkflowTaskError:
      description: The stable, operator-facing diagnostic of a Task failure.
      properties:
        code:
          description: Machine-readable failure code, for example `legacy_ansible_failed`.
          type: string
        message:
          type: string
        retryable:
          description: Whether a Task retry may be requested.
          type: boolean
        stage:
          description: Where the failure happened; absent when not recorded.
          type: string
      required:
        - code
        - message
        - retryable
      type: object
    WorkflowTaskEvents:
      description: The per-host Ansible results of one run, with counts derived from the list so the two never disagree. Task output is never included.
      properties:
        changedCount:
          description: Results with `changed` true, of any status.
          type: integer
        events:
          description: In the order the runner produced them; an empty array when there are none.
          items:
            $ref: '#/components/schemas/AnsibleTaskEvent'
          type: array
        failedCount:
          type: integer
        okCount:
          type: integer
        runId:
          description: The Ansible run ID; empty for a Task without an Ansible run.
          type: string
        skippedCount:
          type: integer
        status:
          description: The Task's status, or, on the deprecated schema-v2 events endpoint, the schema-v2 run status.
          enum:
            - pending
            - running
            - waiting_external
            - waiting_dependency
            - succeeded
            - failed
            - canceled
            - skipped
            - requires_attention
            - indeterminate
          type: string
        unreachableCount:
          type: integer
      required:
        - runId
        - status
        - okCount
        - changedCount
        - failedCount
        - unreachableCount
        - skippedCount
        - events
      type: object
    WorkflowTaskExternalExecution:
      description: Correlates a Task with its Runner's own execution.
      properties:
        generation:
          description: The Task attempt this execution belongs to.
          type: integer
        id:
          description: The execution's ID in that system.
          type: string
        provider:
          description: The executing system, for example `ansible-runner`.
          type: string
      required:
        - provider
        - id
        - generation
      type: object
    WorkflowTaskLiveProgress:
      description: Advisory, output-free progress of a running Ansible Task. Present only while a run is in flight; the authoritative outcome is the Task's `status` and `error`.
      properties:
        changed:
          description: A subset of `ok`.
          type: integer
        currentPlay:
          description: The play the runner last started; absent before the first one.
          type: string
        currentTask:
          description: The ansible task the runner last started; absent before the first one.
          type: string
        failed:
          type: integer
        ok:
          type: integer
        skipped:
          type: integer
        total:
          description: Cumulative host results.
          type: integer
        unreachable:
          type: integer
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - total
        - ok
        - changed
        - failed
        - unreachable
        - skipped
        - updatedAt
      type: object
    WorkflowTaskRetryAccepted:
      description: Acknowledges a delivered Task retry. Both the canonical and the deprecated names are sent.
      properties:
        operationId:
          description: Deprecated name of `workflowId`; always equal to it.
          type: string
        stepId:
          description: Deprecated name of `taskId`; always equal to it.
          type: string
        taskId:
          type: string
        workflowId:
          type: string
      required:
        - workflowId
        - operationId
        - taskId
        - stepId
      type: object
    WorkflowTaskStatus:
      description: The status of one Task.
      enum:
        - pending
        - running
        - waiting_external
        - waiting_dependency
        - succeeded
        - failed
        - canceled
        - skipped
        - requires_attention
      type: string
    WorkflowTemporalReference:
      description: Correlation with the durable Temporal execution.
      properties:
        runId:
          description: The Temporal run ID; absent until the execution starts.
          type: string
        workflowId:
          description: The stable Temporal workflow ID, `swallow-operation/<id>`.
          type: string
      required:
        - workflowId
      type: object
    WorkflowTimelineEvent:
      description: One immutable, secret-free event in a Workflow's timeline. Known types include `operation_requested`, `operation_status`, `step_status` (once per Task status per attempt), and the cancel outcomes `canceled_deployment_returned_to_ready`, `canceled_deployment_left_as_is`, and `canceled_deployment_return_failed`.
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        details:
          additionalProperties: true
          description: Type-specific structured data; absent when the event has none. A `step_status` event carries `status` and `attempt` and, when the Task had a normalized error, its `code`, `message`, `stage`, and `retryable`.
          type: object
        id:
          type: string
        message:
          description: Operator-facing; must not be parsed.
          type: string
        operationId:
          description: The Workflow ID (wire name `operationId`).
          type: string
        stepId:
          description: The Task the event is about; absent for a Workflow-level event.
          type: string
        type:
          type: string
      required:
        - id
        - operationId
        - type
        - message
        - createdAt
      type: object
    Zone:
      description: 'A swallow-owned, Site-scoped grouping of Servers (glossary Zone) as a migrated resource (infrastructure.md, decision 071): the spec is its name and description, and the status its realization on every provisioner of the Site.'
      properties:
        generation:
          description: Counts spec changes; 1 when created.
          format: int64
          type: integer
        id:
          type: string
        siteId:
          type: string
        spec:
          $ref: '#/components/schemas/GroupSpec'
        status:
          $ref: '#/components/schemas/GroupStatus'
      required:
        - id
        - siteId
        - generation
        - spec
        - status
      type: object
  securitySchemes:
    accessTokenQuery:
      description: A Session access token passed as a query parameter, for browser EventSource clients that cannot send an Authorization header. Accepted only by the Server stream.
      in: query
      name: access_token
      type: apiKey
    bearerAuth:
      description: A Session access token or an API Key secret (always prefixed `swk_`). Both act with the owning User's role (conventions.md, Authentication).
      scheme: bearer
      type: http
    machineToken:
      description: The installation machine token, or an admin access token. Accepted only by the machine-to-machine routes (discovery and /metrics).
      scheme: bearer
      type: http
