        - gpus
        - systemVendor
        - systemProduct
        - providerZone
        - providerResourcePool
        - providerPod
        - tags
        - automaticTags
        - hardware
        - deployment
        - provisioning
        - membership
        - health
        - platformClaim
        - absent
        - lastSeenAt
        - createdAt
        - updatedAt
