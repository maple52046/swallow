        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid machine token or access token (unauthorized).
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A valid access token whose role is not admin (forbidden).
        "500":
          content:
            application/json:
