        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a Site with this `name` already exists.'
        default:
          $ref: '#/components/responses/Error'
      summary: Create a Site.
      tags:
        - sites
  /api/v1/sites/{id}:
    delete:
      description: Requires role `admin`. Refused while any Integration still belongs to the Site, so the Servers projected through them are never orphaned.
      operationId: deleteSite
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAcknowledgement'
          description: The Site was deleted.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the Site still has Integrations; delete them first.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete a Site that no Integration references.
      tags:
        - sites
    get:
      description: Requires role `admin`.
      operationId: getSite
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: The Site.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read one Site.
      tags:
        - sites
    parameters:
      - description: The Site's `siteId`.
        in: path
        name: id
        required: true
        schema:
          type: string
    patch:
      description: Requires role `admin`. Only present fields change; `name` is trimmed before it is stored.
      operationId: updateSite
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                name:
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: The updated Site.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: another Site already has this `name`.'
        default:
          $ref: '#/components/responses/Error'
      summary: Change a Site's name or description.
      tags:
        - sites
  /api/v1/sites/{id}/automation:
    get:
      description: Requires role `admin` (site-automation.md). `credentialSource` is derived on every read from whether the installation's Deployment Key exists.
      operationId: getSiteAutomationConfiguration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationConfiguration'
          description: The Site's Automation Configuration.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site has no Automation Configuration yet, which is also the answer for a Site that does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read a Site's Automation Configuration (never its secret).
      tags:
        - sites
    parameters:
      - description: The Site's `siteId`.
        in: path
        name: id
        required: true
        schema:
          type: string
    put:
      description: 'Requires role `admin`. Every non-secret field is replaced: an omitted field takes its zero value (`enabled` false, `sshUser` and `knownHosts` empty, no `playbookMappings`), and an omitted or `0` `sshPort` becomes 22. `sshUser` and `knownHosts` are trimmed. The become password is untouched. A Site that does not exist currently fails with `500 internal_error` (site-automation.md, Errors).'
      operationId: replaceSiteAutomationConfiguration
      requestBody:
        content:
          application/json:
            schema:
              properties:
                enabled:
                  default: false
                  description: Whether Ansible Tasks may run for the Site; `true` requires `knownHosts`.
                  type: boolean
                knownHosts:
                  description: Known-hosts content; host-key verification cannot be disabled.
                  type: string
                playbookMappings:
                  additionalProperties:
                    type: string
                  description: Workflow kind (a built-in kind other than `custom`) to the name of a playbook registered in the release manifest.
                  type: object
                sshPort:
                  default: 22
                  description: SSH port; `0` or omitted means 22.
                  maximum: 65535
                  minimum: 0
                  type: integer
                sshUser:
                  description: Optional fallback login user, tried only for a Server whose deployed OS Image has no default user.
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationConfiguration'
          description: The stored Automation Configuration, read back.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON; `sshPort` is outside 1-65535; `enabled` is true without `knownHosts`; a mapped kind is unknown or `custom`; or a mapped playbook is not registered in the release manifest.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Create or replace a Site's non-secret Automation Configuration.
      tags:
        - sites
  /api/v1/sites/{id}/automation/credential:
    parameters:
      - description: The Site's `siteId`.
        in: path
        name: id
        required: true
        schema:
          type: string
    put:
      description: Requires role `admin`. The body replaces the Site's whole credential, which holds only the become password; `{}` or an empty `becomePassword` clears it. Automation always logs in with the Deployment Key, so a non-null `sshPrivateKey` is refused. No API returns the secret.
      operationId: replaceSiteAutomationCredential
      requestBody:
        content:
          application/json:
            schema:
              properties:
                becomePassword:
                  type: string
                  writeOnly: true
                sshPrivateKey:
                  deprecated: true
                  description: Removed by decision 041. Any non-null value is `400 validation_error`; replace the Deployment Key with `PUT /api/v1/ssh-keys/deployment` instead. `null` is ignored.
                  nullable: true
                  type: string
              type: object
        required: true
      responses:
        "204":
          description: The credential was replaced.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, or it carries a non-null `sshPrivateKey`.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Site has no Automation Configuration (configure it with PUT first).'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace the Site's write-only become password.
      tags:
        - sites
  /api/v1/software/assignments:
    get:
      description: Requires the `admin` role. Ordered by `serverId`, then `kind`; not paginated (one record per Server per kind). `absent` assignments are omitted unless `includeAbsent=true`.
      operationId: listSoftwareAssignments
      parameters:
        - description: Only assignments on this Server.
          in: query
          name: serverId
          required: false
          schema:
            type: string
        - description: 'Only assignments of this software kind. The value is not validated: a value that is not a catalog kind matches nothing.'
          in: query
          name: kind
          required: false
          schema:
            type: string
        - description: Include `absent` assignments. Only the literal `true` enables it.
          in: query
          name: includeAbsent
          required: false
          schema:
            default: false
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareAssignmentList'
          description: The matching Software Assignments.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List Software Assignments, optionally filtered by Server and kind.
      tags:
        - software
    post:
      description: Requires the `admin` role. Creates a durable Workflow and records a `pending` Software Assignment per target; progress is read through the workflows surface. Installing a kind that is already present is a convergent re-apply whose `spec` replaces the recorded one. The per-kind `spec` rules are in software.md.
      operationId: installSoftware
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftwareInstallRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
          description: The install Workflow was accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON; the kind is unknown; there is no target, a target has no `serverId`, or a target is listed twice; the roles do not fit the kind; a `spec` field is missing, malformed, of the wrong type, or not accepted by the kind (including targets running different container runtimes and a `scrapeServerIds` entry at another Site); or a target Server is absent or not in provisioning state `deployed`.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: a target Server, or a Prometheus `scrapeServerIds` entry, does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a mutually exclusive kind is present on a target; a target is a Kubernetes Platform member and the kind refuses members; a target has a Platform Claim and the kind refuses claimed Servers; a target lacks the AMD compute GPUs the kind requires; the `container` method''s runtime is not `installed` on a target or differs from `spec.containerRuntime`; or, when the Workflow is created, a target already has active durable work, is locked, or is not in the required provisioning state.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the targets'' Site cannot run the Workflow''s Ansible automation (no automation configuration, automation disabled, automation not logging in with the Deployment Key, or a playbook outside the release manifest), or the targets belong to more than one Site.'
        default:
          $ref: '#/components/responses/Error'
      summary: Install one software kind on one or more deployed Servers.
      tags:
        - software
  /api/v1/software/catalog:
    get:
      description: Requires the `admin` role. The catalog is fixed and small, so it is not paginated.
      operationId: getSoftwareCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareCatalog'
          description: Every catalog entry.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List the installable software kinds and their rules.
      tags:
        - software
  /api/v1/software/docker-ce/registry-credentials:
    get:
      description: Requires the `admin` role. A small, installation-wide set; not paginated. No response carries a password.
      operationId: listRegistryCredentials
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialList'
          description: Every Registry Credential.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List every Registry Credential, ordered by registry.
      tags:
        - software
    post:
      description: Requires the `admin` role. `registry` is normalized before it is stored (registry-credentials.md, Registry Names). The password is sealed at rest and never returned. No registry or host is contacted.
      operationId: createRegistryCredential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredentialCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredential'
          description: The stored credential, without its password.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, `registry` is not a host or host:port after normalization, or `username` (after trimming) or `password` is empty.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a credential for the normalized registry already exists.'
        default:
          $ref: '#/components/responses/Error'
      summary: Store a Registry Credential for one registry.
      tags:
        - software
  /api/v1/software/docker-ce/registry-credentials/{credentialId}:
    delete:
      description: Requires the `admin` role. Later pulls from that registry are anonymous.
      operationId: deleteRegistryCredential
      responses:
        "204":
          description: The credential was deleted.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: no credential has this id.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete a Registry Credential.
      tags:
        - software
    parameters:
      - $ref: '#/components/parameters/RegistryCredentialId'
    put:
      description: Requires the `admin` role. The registry of a credential cannot change. The stored password is replaced, never merged or echoed.
      operationId: replaceRegistryCredential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredentialReplaceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredential'
          description: The replaced credential, without its password.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, or `username` (after trimming) or `password` is empty.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: no credential has this id.'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace a Registry Credential's username and password.
      tags:
        - software
  /api/v1/software/uninstall:
    post:
      description: Requires the `admin` role. Creates a durable Workflow that runs the kind's uninstall playbook, marks the assignments `uninstalling`, and marks them `absent` on success. Duplicate `serverIds` are ignored.
      operationId: uninstallSoftware
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftwareUninstallRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
          description: The uninstall Workflow was accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, the kind is unknown, or `serverIds` is empty.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: a target has no Software Assignment of the kind (or only an `absent` one), or a target Server does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: a target has a Platform Claim and the kind refuses claimed Servers; or, when the Workflow is created, a target already has active durable work, is locked, or is not `deployed`.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the targets'' Site cannot run the Workflow''s Ansible automation (as for install), or the targets belong to more than one Site.'
        default:
          $ref: '#/components/responses/Error'
      summary: Uninstall one software kind from one or more Servers.
      tags:
        - software
  /api/v1/ssh-keys:
    get:
      description: 'Requires role `admin`. Returns a plain array: the Deployment Key first (when the installation step has created it), then the caller''s Access Keys ordered by `createdAt`.'
      operationId: listSshKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SshKey'
                type: array
          description: The SSH Keys visible to the caller.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List the Deployment Key and the caller's Access Keys.
      tags:
        - auth
    post:
      description: Requires role `admin`. The SSH Key controller realizes the key in the background, so the response's per-provisioner conditions are still empty.
      operationId: importSshKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SshKeyImportRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKey'
          description: The Access Key was stored.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, the name is missing or longer than 100 characters, or the public key is malformed, has authorized_keys options, is not exactly one key, or is an unsupported type or an RSA key shorter than 2048 bits.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: an SSH Key with this fingerprint already exists (including the Deployment Key), or the caller already has an Access Key with this name (case-insensitive).'
        default:
          $ref: '#/components/responses/Error'
      summary: Import a public key as one of the caller's Access Keys.
      tags:
        - auth
  /api/v1/ssh-keys/{keyId}:
    delete:
      description: Requires role `admin`. The SSH Key controller removes it from the provisioners after the record is deleted, retrying an unreachable one. Already-deployed Servers keep the key.
      operationId: deleteSshKey
      responses:
        "204":
          description: The Access Key was deleted.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: no such key, or the key is another User''s Access Key.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the key is the Deployment Key, which is replaced or regenerated, never deleted.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete one of the caller's Access Keys and remove it from provisioners.
      tags:
        - auth
    get:
      description: Requires role `admin`. Same shape as a list item; lets a client follow one key's realization without re-reading the list.
      operationId: getSshKey
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKey'
          description: The SSH Key.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: no such key, or the key is another User''s Access Key (indistinguishable).'
        default:
          $ref: '#/components/responses/Error'
      summary: Read the Deployment Key or one of the caller's Access Keys.
      tags:
        - auth
    parameters:
      - description: The SSH Key's swallow-issued id.
        in: path
        name: keyId
        required: true
        schema:
          type: string
  /api/v1/ssh-keys/deployment:
    put:
      description: Requires role `admin`. The public key is derived from the private key; the key's `id` is preserved. The previous public key is removed from provisioners where swallow registered it and the new one is registered. Servers deployed earlier keep only the previous public key. The private key is never returned.
      operationId: replaceDeploymentKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentKeyReplaceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKey'
          description: The replaced Deployment Key.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON; the private key is missing, malformed, passphrase-protected, or an unsupported type; or the name is longer than 100 characters.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the installation has no Deployment Key yet (create it with the installation step).'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the key''s fingerprint equals an existing Access Key.'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace the Deployment Key with an existing private key.
      tags:
        - auth
  /api/v1/ssh-keys/deployment/regenerate:
    post:
      description: Requires role `admin`. No request body. The name and `id` are kept; the private key is never returned. Servers deployed earlier keep only the previous public key.
      operationId: regenerateDeploymentKey
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKey'
          description: The regenerated Deployment Key.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the installation has no Deployment Key yet (create it with the installation step).'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace the Deployment Key with a freshly generated ed25519 key pair.
      tags:
        - auth
  /api/v1/ssh-keys/generate:
    post:
      description: Requires role `admin`. Only the public key is stored; swallow keeps no copy of the private key and can never return it again.
      operationId: generateSshKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SshKeyGenerateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedSshKey'
          description: The Access Key was stored; the body carries its private key.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is not valid JSON, or the name is missing or longer than 100 characters.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the caller already has an Access Key with this name (case-insensitive).'
        default:
          $ref: '#/components/responses/Error'
      summary: Generate an ed25519 Access Key pair and return its private key exactly once.
      tags:
        - auth
  /api/v1/ssh-keys/sync:
    post:
      description: Requires role `admin`. No request body. Asks the SSH Key controller to converge every key now rather than at its next resync; the pass runs in the background, and results appear in each key's status on a later read.
      operationId: syncSshKeys
      responses:
        "202":
          content:
            text/plain:
              schema:
                type: string
          description: The pass was requested. The body is the plain-text status text `Accepted`, which carries no information; consumers must ignore it.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Request an immediate realization pass over every provisioner Integration.
      tags:
        - auth
  /api/v1/workflows:
    get:
      description: Requires the `admin` role. Merges schema-v3 Workflows and historical schema-v2 records, sorted by `requestedAt` descending, then pages the merged list. Every filter is optional and exact-match; `total` counts both schema versions.
      operationId: listWorkflows
      parameters:
        - $ref: '#/components/parameters/WorkflowSiteIdFilter'
        - $ref: '#/components/parameters/WorkflowPlatformIdFilter'
        - $ref: '#/components/parameters/WorkflowClusterIdFilter'
        - $ref: '#/components/parameters/WorkflowServerIdFilter'
        - $ref: '#/components/parameters/WorkflowKindFilter'
        - $ref: '#/components/parameters/WorkflowStatusFilter'
        - $ref: '#/components/parameters/WorkflowActiveFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
          description: One page of the merged history.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List schema-v3 Workflows and schema-v2 history, newest first.
      tags:
        - workflows
    post:
      description: Requires the `admin` role. Persists the intent as a pending schema-v3 Workflow with one `ansible-playbook` Task and returns 202 before Temporal starts it. The response is the Workflow in the compatibility (Operation) shape, `LegacyOperation` with `schemaVersion` 3, not the full `Workflow` projection; read `GET /api/v1/workflows/{id}` for status, Tasks' live state, leases, and the Temporal reference.
      operationId: createWorkflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyOperation'
          description: The intent was persisted; the Workflow starts asynchronously.
        "400":
          $ref: '#/components/responses/WorkflowCreateRejected'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowCreateTargetNotFound'
        "409":
          $ref: '#/components/responses/WorkflowCreateConflict'
        "503":
          $ref: '#/components/responses/WorkflowCreateAutomationUnavailable'
        default:
          $ref: '#/components/responses/Error'
      summary: Accept a single-Task Ansible Workflow against Servers of one Site.
      tags:
        - workflows
  /api/v1/workflows/{id}:
    get:
      description: Requires the `admin` role. A schema-v3 Workflow is returned as `Workflow`, including the resource leases it currently holds; an ID that is only a schema-v2 record is returned as `LegacyOperation` with `schemaVersion` 2.
      operationId: getWorkflow
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOrLegacyOperation'
          description: The Workflow.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowNotFound'
        default:
          $ref: '#/components/responses/Error'
      summary: Read one Workflow, or one historical schema-v2 record.
      tags:
        - workflows
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
  /api/v1/workflows/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      description: Requires the `admin` role. Returns 202 once Temporal accepted the request; the workflow itself records `canceling` then `canceled`. When the execution no longer exists, swallow releases its leases and records `canceled` itself, and still returns 202.
      operationId: cancelWorkflow
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
          description: The cancel request was accepted.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowV3NotFound'
        "409":
          $ref: '#/components/responses/WorkflowControlConflict'
        default:
          $ref: '#/components/responses/Error'
      summary: Ask a Workflow's durable execution to cancel.
      tags:
        - workflows
  /api/v1/workflows/{id}/rerun:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      description: Requires the `admin` role. Accepted for a `failed`, `partially_succeeded`, `canceled`, or `requires_attention` Workflow; the new Workflow's `retryOfOperationId` names the original. The new Workflow holds no leases yet, so `leases` is null in this response.
      operationId: rerunWorkflow
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          description: The replacement Workflow was persisted and starts asynchronously.
        "400":
          $ref: '#/components/responses/WorkflowRerunRejected'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowV3NotFound'
        "409":
          $ref: '#/components/responses/WorkflowRerunConflict'
        default:
          $ref: '#/components/responses/Error'
      summary: Recover a Workflow that cannot advance by launching a new one for the same intent.
      tags:
        - workflows
  /api/v1/workflows/{id}/tasks/{taskId}/artifacts:
    get:
      description: Requires the `admin` role. Metadata only; artifact bytes and server-side paths are never returned.
      operationId: listWorkflowTaskArtifacts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WorkflowTaskArtifact'
                type: array
          description: The artifact metadata; an empty array when the Task retained none.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'
      summary: List a Task's retained artifact metadata.
      tags:
        - workflows
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
  /api/v1/workflows/{id}/tasks/{taskId}/events:
    get:
      description: Requires the `admin` role. A non-Ansible Task, or one whose run has not started, returns an empty `events` list with an empty `runId`. Task output is never included.
      operationId: getWorkflowTaskEvents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskEvents'
          description: The per-host results and their counts.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'
      summary: Read an Ansible Task's per-host results, live while it runs.
      tags:
        - workflows
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
  /api/v1/workflows/{id}/tasks/{taskId}/logs:
    get:
      description: Requires the `admin` role. UTF-8 plain text; empty for a non-Ansible Task or one whose run has not started.
      operationId: getWorkflowTaskLogs
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: The runner output.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'
      summary: Read an Ansible Task's retained runner output.
      tags:
        - workflows
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
  /api/v1/workflows/{id}/tasks/{taskId}/retry:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
    post:
      description: Requires the `admin` role. Accepted only when the Task is `failed` or `requires_attention` and its normalized error has `retryable` true.
      operationId: retryWorkflowTask
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskRetryAccepted'
          description: The retry was delivered to the Workflow's execution.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowTaskNotFound'
        "409":
          $ref: '#/components/responses/WorkflowTaskRetryConflict'
        default:
          $ref: '#/components/responses/Error'
      summary: Retry one failed, retryable Task in place, at its next attempt.
      tags:
        - workflows
  /api/v1/workflows/{id}/tasks/{taskId}/stderr:
    get:
      description: Requires the `admin` role. UTF-8 plain text with one block per failed or unreachable ansible task; empty when the Task recorded no failure or is not an Ansible Task.
      operationId: getWorkflowTaskStderr
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: The error-only report.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowTaskNotFound'
        default:
          $ref: '#/components/responses/Error'
      summary: Read an Ansible Task's error-only report.
      tags:
        - workflows
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowTaskId'
  /api/v1/workflows/{id}/timeline:
    get:
      description: Requires the `admin` role. Events are ordered by `createdAt`, then ID. A schema-v2 record has no timeline and is `not_found`.
      operationId: getWorkflowTimeline
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WorkflowTimelineEvent'
                type: array
          description: The timeline; an empty array when nothing has been recorded.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/WorkflowV3NotFound'
        default:
          $ref: '#/components/responses/Error'
      summary: Read a Workflow's normalized, immutable state-transition events.
      tags:
        - workflows
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
  /boot-media/ipxe/{id}/swallow-ipxe.iso:
    get:
      description: Unauthenticated, because a BMC mounts the URL with no way to send a token; the file holds no secret. HEAD is answered too (BMCs send it first). Supports byte ranges, conditional requests, and `Last-Modified`, which BMC HTTP virtual media requires.
      operationId: downloadBootIsoFile
      responses:
        "200":
          content:
            application/x-iso9660-image:
              schema:
                format: binary
                type: string
          description: The whole ISO.
          headers:
            Accept-Ranges:
              schema:
                enum:
                  - bytes
                type: string
            Cache-Control:
              schema:
                enum:
                  - no-cache
                type: string
        "206":
          content:
            application/x-iso9660-image:
              schema:
                format: binary
                type: string
            multipart/byteranges:
              schema:
                format: binary
                type: string
          description: The requested byte range; several ranges come as `multipart/byteranges`.
        "304":
          description: Not modified since `If-Modified-Since`.
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Not a Boot ISO id, or the Boot ISO has no file.
        "412":
          description: An `If-Unmodified-Since` precondition failed.
        "416":
          content:
            text/plain:
              schema:
                type: string
          description: The requested range cannot be satisfied.
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: Serve a Boot ISO's file to a BMC or hypervisor, without authentication.
      tags:
        - provisioning
    parameters:
      - description: The Boot ISO's id. Anything that is not a Boot ISO id is `404` before a path is built, so the route can only read a Boot ISO file.
        in: path
        name: id
        required: true
        schema:
          type: string
  /downloads/swallow:
    get:
      description: Unauthenticated, for the enrollment script. Serves the file at `api.cliBinary`, read per request and streamed. HEAD and byte ranges are answered too.
      operationId: downloadSwallowCli
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The CLI binary.
          headers:
            Content-Disposition:
              schema:
                enum:
                  - attachment; filename="swallow"
                type: string
        "206":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The requested byte range of the CLI binary.
        "304":
          description: Not modified since `If-Modified-Since`.
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: The installation does not serve its CLI (`api.cliBinary` is not set) or the file is missing; the body is a plain-text reason the enrollment script shows.
        "416":
          content:
            text/plain:
              schema:
                type: string
          description: The requested range cannot be satisfied.
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: Serve the linux-amd64 swallow CLI binary, without authentication.
      tags:
        - provisioning
  /downloads/swallow-enroll.sh:
    get:
      description: Unauthenticated, because the host being enrolled has no swallow credential; the script holds none. Its built-in CLI download address is the scheme (from `X-Forwarded-Proto`) and host of this request.
      operationId: downloadServerEnrollmentScript
      responses:
        "200":
          content:
            text/x-shellscript:
              schema:
                type: string
          description: The POSIX shell script.
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-cache
                type: string
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: Serve the Server Enrollment script, without authentication.
      tags:
        - provisioning
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: Ready.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReady'
          description: Not ready.
      security: []
      summary: Alias of /readyz.
      tags:
        - system
  /livez:
    get:
      operationId: getLiveness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
          description: The process is alive.
      security: []
      summary: Report that the API process is running.
      tags:
        - system
  /metrics:
    get:
      operationId: getProcessMetrics
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Prometheus text format 0.0.4.
        default:
          $ref: '#/components/responses/Error'
      security:
        - machineToken: []
      summary: Prometheus text exposition of the API process's own request counter and build info.
      tags:
        - system
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: Ready.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReady'
          description: Not ready.
      security: []
      summary: Report whether the API process can serve requests (MongoDB reachable and migrated).
      tags:
        - system
components:
  headers:
    Deprecation:
      description: '`true` on a response served through a deprecated route, alias, or parameter. Clients should move to the successor named by the Link header.'
      schema:
        enum:
          - "true"
        type: string
    NoStore:
      description: 'Always `no-store`: the response carries a credential or private key, or live state read from the system that owns it, and must not be cached by a browser or an intermediary.'
      schema:
        enum:
          - no-store
        type: string
    SuccessorLink:
      description: The canonical successor of a deprecated route, as `<path>; rel="successor-version"`.
      schema:
        type: string
  parameters:
    DiscoveryProvisioningState:
      description: Keep only Servers in this provisioning state. Defaults to `deployed`; the literal `all` removes the filter.
      in: query
      name: provisioningState
      required: false
      schema:
        default: deployed
        type: string
    DockerContainerId:
      description: The container `id` from the list (a name is also accepted by the Engine), URL-encoded.
      in: path
      name: containerId
      required: true
      schema:
        type: string
    DockerHostServerId:
      description: The Server whose Docker Engine is addressed.
      in: path
      name: id
      required: true
      schema:
        type: string
    KubernetesApplicationKind:
      description: The Kubernetes Application kind; any other value is 400.
      in: path
      name: kind
      required: true
      schema:
        $ref: '#/components/schemas/KubernetesApplicationKind'
    KubernetesIncludeSystem:
      description: Include system namespaces (`kube-system`, `kube-public`, `kube-node-lease`) when `namespace` is omitted. Only the literal `true` enables it.
      in: query
      name: includeSystem
      required: false
      schema:
        default: false
        type: boolean
    KubernetesNamespaceName:
      description: The Kubernetes namespace.
      in: path
      name: namespace
      required: true
      schema:
        type: string
    KubernetesNamespaceScope:
      description: Return only objects in this namespace. When omitted, every namespace is read and system namespaces are excluded unless `includeSystem` is true.
      in: query
      name: namespace
      required: false
      schema:
        type: string
    KubernetesNodeName:
      description: The Kubernetes node name.
      in: path
      name: node
      required: true
      schema:
        type: string
    KubernetesObjectName:
      description: The object's name within the namespace.
      in: path
      name: name
      required: true
      schema:
        type: string
    MetricNames:
      description: Comma-separated metric names to evaluate; every name when omitted.
      explode: false
      in: query
      name: metrics
      required: false
      schema:
        items:
          $ref: '#/components/schemas/MetricName'
        type: array
      style: form
    OperationStepId:
      description: Deprecated name of the Task ID on the /operations alias.
      in: path
      name: stepId
      required: true
      schema:
        type: string
    OsImageArchitecture:
      description: The image's architecture as the catalog returns it; one image id can back several.
      in: query
      name: architecture
      required: true
      schema:
        type: string
    OsImageId:
      description: The OS Image's provider id as the catalog returns it; it can contain a slash.
      in: query
      name: imageId
      required: true
      schema:
        type: string
    OsImageIntegrationId:
      description: The provisioner Integration whose catalog holds the image.
      in: query
      name: integrationId
      required: true
      schema:
        type: string
    Page:
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
    PageSize:
      in: query
      name: pageSize
      required: false
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    PlatformId:
      description: The Platform's opaque id.
      in: path
      name: id
      required: true
      schema:
        type: string
    RegistryCredentialId:
      description: The Registry Credential `id`.
      in: path
      name: credentialId
      required: true
      schema:
        type: string
    SessionRefreshCookie:
      description: The browser refresh-token cookie set by login (HttpOnly, SameSite=Strict, Path /api/v1/auth). Used when the body carries no `refreshToken`.
      in: cookie
      name: swallow_refresh
      required: false
      schema:
        type: string
    WorkflowActiveFilter:
      description: '`true` keeps only unfinished Workflows. Any other value, or absence, applies no constraint.'
      in: query
      name: active
      required: false
      schema:
        type: string
    WorkflowClusterIdFilter:
      deprecated: true
      description: Deprecated alias of `platformId`, used only when `platformId` is absent.
      in: query
      name: clusterId
      required: false
      schema:
        type: string
    WorkflowId:
      description: The Workflow ID. Read endpoints also accept the ID of a historical schema-v2 record where they say so.
      in: path
      name: id
      required: true
      schema:
        type: string
    WorkflowKindFilter:
      description: Only Workflows of this kind.
      in: query
      name: kind
      required: false
      schema:
        type: string
    WorkflowPlatformIdFilter:
      description: Only Workflows of this Platform. Wins over `clusterId` when both are set.
      in: query
      name: platformId
      required: false
      schema:
        type: string
    WorkflowServerIdFilter:
      description: Only Workflows whose `targetServerIds` contain this Server.
      in: query
      name: serverId
      required: false
      schema:
        type: string
    WorkflowSiteIdFilter:
      description: Only Workflows of this Site.
      in: query
      name: siteId
      required: false
      schema:
        type: string
    WorkflowStatusFilter:
      description: 'Only Workflows in this status: a `WorkflowStatus` for schema-v3 Workflows, or a schema-v2 run status (`pending | running | succeeded | failed | canceled | indeterminate`) for historical records.'
      in: query
      name: status
      required: false
      schema:
        type: string
    WorkflowTaskId:
      description: The Task ID within the Workflow (a Task's `id` in `steps[]`).
      in: path
      name: taskId
      required: true
      schema:
        type: string
  responses:
    DockerExplorerNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: '`not_found`: the Server does not exist, or the Engine reports that the addressed image, container, volume, or network does not exist (for a pull, a repository the registry does not know).'
    DockerExplorerReadConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: '`conflict`: the Server is not eligible for the Docker Host Explorer (absent, not `deployed`, no known address, no `installed` `docker-ce` Software Assignment, or that assignment''s `spec.enableApi` is not `true`), or the Engine reports a conflict. A consumer treats an eligibility `409` as "not available".'
    DockerExplorerReadUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: '`provider_unavailable`: the Engine is unreachable, timed out, or failed internally (Engine 5xx).'
    DockerExplorerRejected:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: '`validation_error`: the body is not valid JSON, the request breaks the route''s rules, or the Engine rejected the request parameters (Engine 400 or another 4xx).'
    DockerExplorerWriteConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: '`conflict`: the Server is not eligible for the Docker Host Explorer (as for reads), the provisioner confirms the Server is locked, or the Engine reports that the object is in use, its name is taken, or it is protected (Engine 409 or 403).'
    DockerExplorerWriteUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: '`provider_unavailable`: the Server''s lock state cannot be confirmed, or the Engine is unreachable, timed out, or failed internally (for a pull, also a registry refusal or a failure while downloading).'
    Error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The shared error envelope (conventions.md).
    OperationV2NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: No schema-v2 record has this ID (`not_found`). This includes the ID of a schema-v3 Workflow, which exposes this per Task instead.
    WorkflowControlConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The Workflow already finished, or its execution cannot accept the control in its current state (`conflict`).
    WorkflowCreateAutomationUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Site automation is disabled, the Deployment Key does not exist, the Site credential is not configured, or the live Server Lock state cannot be established (`provider_unavailable`).
    WorkflowCreateConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: A target is already in unfinished work, a target is protected by its Server Lock, or the intent contradicts a Platform policy (`conflict`).
    WorkflowCreateRejected:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 'The request is invalid (`validation_error`): a malformed body, an unknown `kind`, no `targetServerIds`, targets in more than one Site, a target not in the provisioning state the kind requires, `custom` without `playbookName`, no playbook mapped for the kind, a playbook not in the release manifest, or durable orchestration unavailable.'
    WorkflowCreateTargetNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: A target Server, the Site's Automation Configuration, or an Integration the check needs does not exist (`not_found`).
    WorkflowNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: No Workflow or schema-v2 record has this ID (`not_found`).
    WorkflowRerunConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The Workflow succeeded or is still advancing (`pending`, `running`, `waiting_external`, `waiting_dependency`, `canceling`), or a target became busy with other work (`conflict`).
    WorkflowRerunRejected:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Secret storage is unavailable to carry the original's sealed values (`validation_error`).
    WorkflowTaskNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: No schema-v3 Workflow has this ID, or it has no Task with this ID (`not_found`).
    WorkflowTaskRetryConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The Task is not `failed` or `requires_attention` with a retryable error, or the Workflow's execution no longer exists and cannot receive the retry (`conflict`).
    WorkflowV3NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: No schema-v3 Workflow has this ID (`not_found`); a historical schema-v2 record has no timeline, controls, or Tasks here.
  schemas:
    AlertAcknowledgement:
      description: What to silence and for how long.
      properties:
        comment:
          description: The silence comment; `Acknowledged in swallow` when omitted or empty.
          type: string
        duration:
          description: A positive Go duration such as `4h`; `4h` when omitted or empty.
          type: string
        matchers:
          additionalProperties:
            type: string
          description: Label name to exact value; the silence matches these labels, usually `alertname` plus `server_id`.
          minProperties: 1
          type: object
      required:
        - matchers
      type: object
    AlertSilence:
      properties:
        silenceId:
          description: Alertmanager's id of the created silence.
          type: string
      required:
        - silenceId
      type: object
    AnsibleGroup:
      properties:
        hosts:
          description: The Server ids in the group.
          items:
            type: string
          minItems: 1
          type: array
      required:
        - hosts
      type: object
    AnsibleHostVars:
      additionalProperties: true
      description: One host's variables (platform-deployment.md, Dynamic inventory). Optional keys are present only when the fact is known.
      properties:
        ansible_host:
          description: The Server's primary address.
          type: string
        architecture:
          type: string
        cpu_cores:
          type: integer
        default_user:
          description: The effective Server Default User; present only when known.
          type: string
        distro_series:
          description: Present when the provisioning axis is observed.
          type: string
        fqdn:
          type: string
        gpu_vendors:
          description: Lower-case vendors of compute GPUs only; present when there is one.
          items:
            type: string
          type: array
        hostname:
          type: string
        image_default_user:
          description: The deployed OS Image's default user; present only when known.
          type: string
        integration_id:
          type: string
        memory_mib:
          format: int64
          type: integer
        os_system:
          description: Present when the provisioning axis is observed.
          type: string
        platform_id:
          description: Present when the membership axis is observed.
          type: string
        platform_node_name:
          description: Present when the membership axis is observed.
          type: string
        platform_role:
          description: Present when the membership axis is observed.
          type: string
        provider_machine_id:
          type: string
        provisioning_state:
          description: Present when the provisioning axis is observed.
          type: string
        server_id:
          type: string
        server_tags:
          description: The Server's tags; present when it has any.
          items:
            type: string
          type: array
        site_id:
          type: string
      required:
        - ansible_host
        - server_id
        - site_id
        - integration_id
        - provider_machine_id
        - hostname
        - fqdn
        - architecture
        - cpu_cores
        - memory_mib
      type: object
    AnsibleInventory:
      additionalProperties:
        $ref: '#/components/schemas/AnsibleGroup'
      description: 'Ansible''s dynamic-inventory JSON: the reserved `_meta` and `all` keys plus one key per group (`site_<id>`, `provisioning_<state>`, `platform_<id>`, `role_<role>`, `gpu_<vendor>`, `tag_<tag>`, every character outside `[a-z0-9_]` replaced by `_`).'
      properties:
        _meta:
          properties:
            hostvars:
              additionalProperties:
                $ref: '#/components/schemas/AnsibleHostVars'
              description: Host variables keyed by Server id.
              type: object
          required:
            - hostvars
          type: object
        all:
          properties:
            children:
              description: Every group name, sorted; an empty array when there are no hosts.
              items:
                type: string
              type: array
          required:
            - children
          type: object
      required:
        - _meta
        - all
      type: object
    AnsibleTaskEvent:
      description: One ansible task's result on one host, from inside a Task's playbook run (not a swallow Task).
      properties:
        changed:
          type: boolean
        endedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        host:
          description: The target's serverId.
          type: string
        play:
          type: string
        startedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        status:
          enum:
            - ok
            - failed
            - skipped
            - unreachable
          type: string
        task:
          description: The ansible task name.
          type: string
      required:
        - play
        - task
        - host
        - status
        - changed
        - startedAt
        - endedAt
      type: object
    ApiKey:
      description: One of the caller's API Keys. The secret is never part of the resource.
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: '`null` for a key that never expires.'
          nullable: true
        id:
          description: Swallow-issued identifier used in the path.
          type: string
        lastUsedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: '`null` until first use; updated at most once per minute.'
          nullable: true
        name:
          description: Unique (case-insensitively) among the caller's keys.
          type: string
        prefix:
          description: The first characters of the secret (`swk_` plus eight), for recognising a key; it cannot authenticate.
          type: string
      required:
        - id
        - name
        - prefix
        - createdAt
        - expiresAt
        - lastUsedAt
      type: object
    ApiKeyCreateRequest:
      properties:
        expiresAt:
          description: A future RFC 3339 timestamp; omit or send `null` for a key that never expires.
          format: date-time
          nullable: true
          type: string
        name:
          description: Trimmed, then 1–64 characters without control characters.
          type: string
      required:
        - name
      type: object
    AutomationConfiguration:
      description: A Site's settings for swallow's embedded Ansible execution (glossary Automation Configuration). Secret material never appears.
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        credentialSource:
          description: 'The key automation uses for the Site: `deploymentKey` when the installation''s Deployment Key exists, `none` before the installation step has created it.'
          enum:
            - deploymentKey
            - none
          type: string
        enabled:
          type: boolean
        hasCredential:
          description: Whether the Site stores a become password (site-automation.md).
          type: boolean
        knownHosts:
          type: string
        playbookMappings:
          additionalProperties:
            type: string
          description: Workflow kind to release-manifest playbook name; `{}` when none are mapped.
          type: object
        siteId:
          type: string
        sshPort:
          type: integer
        sshUser:
          description: The fallback login user; `""` when none is set.
          type: string
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - siteId
        - enabled
        - sshUser
        - sshPort
        - knownHosts
        - playbookMappings
        - hasCredential
        - credentialSource
        - createdAt
        - updatedAt
      type: object
    BootIso:
      description: A swallow-built iPXE Boot ISO that chains to one provisioner Integration's MAAS rack.
      properties:
        chainUrl:
          description: What iPXE chains to on BIOS firmware.
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          description: The username that built it; omitted when unknown.
          type: string
        grubConfig:
          description: The rendered GRUB configuration; empty for an ISO that predates it. Display only.
          type: string
        id:
          type: string
        inUseBy:
          description: Servers with Boot Media enabled with this ISO.
          minimum: 0
          type: integer
        integrationId:
          type: string
        ipxeVersion:
          type: string
        name:
          description: Unique per Integration (case-insensitive), 1–63 characters.
          type: string
        rackAddress:
          description: The MAAS rack as given, an IPv4 address or hostname with an optional `:port`.
          type: string
        rebuiltAt:
          $ref: '#/components/schemas/Timestamp'
        rebuiltBy:
          description: Omitted, like `rebuiltAt`, when the ISO was never rebuilt.
          type: string
        script:
          description: The rendered iPXE script; display only.
          type: string
        sha256:
          type: string
        siteId:
          description: The Integration's Site; empty when the Integration no longer exists.
          type: string
        sizeBytes:
          format: int64
          minimum: 0
          type: integer
        uefiChainUrl:
          description: What the ISO's GRUB loads on UEFI firmware; empty for an ISO without a GRUB.
          type: string
        url:
          description: Where BMCs mount the ISO; empty when the installation has no Boot Media base URL.
          type: string
      required:
        - id
        - name
        - siteId
        - integrationId
        - rackAddress
        - chainUrl
        - uefiChainUrl
        - script
        - grubConfig
        - ipxeVersion
        - sizeBytes
        - sha256
        - url
        - inUseBy
        - createdAt
      type: object
    BootIsoBuilder:
      properties:
        available:
          type: boolean
        reason:
          description: Why this installation cannot build Boot ISOs; omitted when `available`.
          type: string
      required:
        - available
      type: object
    BootIsoCreateRequest:
      properties:
        integrationId:
          type: string
        name:
          maxLength: 63
          minLength: 1
          type: string
        rackAddress:
          description: An IPv4 address or hostname, optionally with `:port` (1–65535); swallow neither resolves nor contacts it.
          type: string
      required:
        - name
        - integrationId
        - rackAddress
      type: object
    BootIsoList:
      properties:
        builder:
          $ref: '#/components/schemas/BootIsoBuilder'
        items:
          items:
            $ref: '#/components/schemas/BootIso'
          type: array
      required:
        - builder
        - items
      type: object
    BootMedia:
      description: A Server's Boot Media setting, stored probes, and running preflight.
      properties:
        apply:
          allOf:
            - $ref: '#/components/schemas/BootMediaApply'
          nullable: true
        image:
          allOf:
            - $ref: '#/components/schemas/BootMediaImage'
          nullable: true
        libvirt:
          allOf:
            - $ref: '#/components/schemas/LibvirtCapability'
          nullable: true
        live:
          allOf:
            - $ref: '#/components/schemas/BootMediaLiveState'
          nullable: true
        liveError:
          description: Why a requested live read failed; omitted otherwise.
          type: string
        method:
          description: Null when the stored probes found neither method.
          enum:
            - redfish
            - libvirt
          nullable: true
          type: string
        redfish:
          allOf:
            - $ref: '#/components/schemas/RedfishCapability'
          nullable: true
        serverId:
          type: string
        setting:
          allOf:
            - $ref: '#/components/schemas/BootMediaSetting'
          nullable: true
      required:
        - serverId
        - method
        - image
        - setting
        - redfish
        - libvirt
        - live
        - apply
      type: object
    BootMediaApply:
      description: The enable preflight running now.
      properties:
        isoId:
          type: string
        phase:
          enum:
            - probing
            - ejecting
            - mounting
            - settling
            - directing
            - verifying
          type: string
        phaseEndsAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        phaseStartedAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - isoId
        - phase
        - startedAt
        - phaseStartedAt
        - phaseEndsAt
      type: object
    BootMediaChange:
      description: The Boot Media after an enable or disable, plus the disable's revert outcome.
      properties:
        apply:
          allOf:
            - $ref: '#/components/schemas/BootMediaApply'
          nullable: true
        image:
          allOf:
            - $ref: '#/components/schemas/BootMediaImage'
          nullable: true
        libvirt:
          allOf:
            - $ref: '#/components/schemas/LibvirtCapability'
          nullable: true
        live:
          allOf:
            - $ref: '#/components/schemas/BootMediaLiveState'
          nullable: true
        liveError:
          type: string
        method:
          enum:
            - redfish
            - libvirt
          nullable: true
          type: string
        redfish:
          allOf:
            - $ref: '#/components/schemas/RedfishCapability'
          nullable: true
        revertError:
          description: Why a disable could not reset the BMC or hypervisor; omitted otherwise.
          type: string
        reverted:
          description: Present on a disable; true when the BMC or hypervisor was reset.
          type: boolean
        serverId:
          type: string
        setting:
          allOf:
            - $ref: '#/components/schemas/BootMediaSetting'
          nullable: true
      required:
        - serverId
        - method
        - image
        - setting
        - redfish
        - libvirt
        - live
        - apply
      type: object
    BootMediaImage:
      description: The Boot ISO the setting names.
      properties:
        available:
          type: boolean
        id:
          type: string
        name:
          type: string
        reason:
          description: Why `available` is false; omitted otherwise.
          type: string
        url:
          type: string
      required:
        - id
        - name
        - url
        - available
      type: object
    BootMediaLiveState:
      description: The BMC's or hypervisor's live state, read for this response only.
      properties:
        mediaImage:
          type: string
        mediaInserted:
          type: boolean
        overrideEnabled:
          type: string
        overrideTarget:
          type: string
        ready:
          description: The next boot starts from the Boot ISO.
          type: boolean
      required:
        - mediaInserted
        - ready
      type: object
    BootMediaProbe:
      properties:
        libvirt:
          allOf:
            - $ref: '#/components/schemas/LibvirtCapability'
          nullable: true
        redfish:
          allOf:
            - $ref: '#/components/schemas/RedfishCapability'
          nullable: true
      required:
        - redfish
        - libvirt
      type: object
    BootMediaSetting:
      description: The swallow-owned Boot Media setting with the last apply's outcome.
      properties:
        bootOverride:
          description: The persistence the BMC accepted, `Continuous` or `Once`.
          type: string
        enabled:
          type: boolean
        isoId:
          nullable: true
          type: string
        lastAppliedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        lastAppliedBy:
          enum:
            - preflight
            - ensure
          type: string
        lastError:
          type: string
        lastErrorAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - enabled
        - isoId
        - updatedAt
        - lastAppliedAt
        - lastErrorAt
      type: object
    Condition:
      description: One named judgement in a migrated resource's status, written only by its controller (desired-state-model.md §4.2; glossary Condition). The shared types keep the same meaning on every resource; a resource may add its own types and reasons, so consumers ignore values they do not recognise.
      properties:
        lastTransitionTime:
          $ref: '#/components/schemas/Timestamp'
        message:
          description: Human-readable detail; empty when there is nothing to add.
          type: string
        observedGeneration:
          description: The spec generation this judgement was made for.
          format: int64
          type: integer
        reason:
          description: A short machine-branchable code, for example `converged`, `capability_missing`, `server_locked`.
          type: string
        status:
          enum:
            - "true"
            - "false"
            - unknown
          type: string
        type:
          description: '`realized`, `drifted`, `requires_attention`, `held`, or a resource-specific type.'
          type: string
      required:
        - type
        - status
        - reason
        - message
        - lastTransitionTime
        - observedGeneration
      type: object
    ContainerRuntime:
      description: The container runtime a Slurm deploy installs on its compute and login nodes.
      enum:
        - docker-ce
        - podman
      type: string
    CreateWorkflowRequest:
      description: Operator intent for a single-Task Ansible Workflow. Unknown fields are ignored.
      properties:
        clusterId:
          deprecated: true
          description: Deprecated alias of `platformId`, used only when `platformId` is empty.
          nullable: true
          type: string
        extraVars:
          additionalProperties: true
          description: Extra variables for the playbook. Keys starting with `swallow_` are dropped, so a client cannot forge the variables swallow sets.
          nullable: true
          type: object
        intent:
          description: Operator-facing summary, stored trimmed.
          type: string
        kind:
          $ref: '#/components/schemas/WorkflowKind'
        platformId:
          description: The Platform the work belongs to, if any.
          nullable: true
          type: string
        playbookName:
          description: A release-manifest playbook. Required for `custom`; other kinds use the Site's playbook mapping when it is empty.
          type: string
        targetServerIds:
          description: The Servers to act on; they must all belong to one Site.
          items:
            type: string
          minItems: 1
          type: array
      required:
        - kind
        - targetServerIds
      type: object
    CreatedApiKey:
      description: The create response, the only place the secret ever appears.
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        secret:
          description: The bearer secret, `swk_` followed by URL-safe characters. swallow keeps only a one-way hash and can never show it again.
          type: string
      required:
        - key
        - secret
      type: object
    CurrentUser:
      description: The authenticated caller, read from the User record.
      properties:
        authMethod:
          description: 'The credential that authenticated this request: a Session access token or an API Key. Consumers must treat an unrecognised value as `session`.'
          enum:
            - session
            - api_key
          type: string
        id:
          type: string
        role:
          description: Consumers must treat an unrecognised role as least-privileged.
          enum:
            - admin
            - owner
            - user
          type: string
        username:
          type: string
      required:
        - id
        - username
        - role
        - authMethod
      type: object
    DeploymentKeyReplaceRequest:
      properties:
        name:
          description: Omitted or blank keeps the current name; otherwise import's name rules.
          type: string
        privateKey:
          description: An unencrypted private key in OpenSSH, PKCS#1, PKCS#8, or SEC1 PEM form, of a type import accepts.
          type: string
      required:
        - privateKey
      type: object
    DeploymentTargetIssue:
      description: One operator-remediable reason a target cannot be deployed now.
      properties:
        code:
          enum:
            - integration_mismatch
            - absent
            - not_ready
            - locked
            - provider_machine_missing
            - provider_not_ready
          type: string
        message:
          type: string
        serverId:
          type: string
      required:
        - serverId
        - code
        - message
      type: object
    DeploymentTargetPreflight:
      properties:
        integrationId:
          description: The Integration of the first target, which every target must share.
          type: string
        issues:
          items:
            $ref: '#/components/schemas/DeploymentTargetIssue'
          type: array
        valid:
          description: True when no target has an issue.
          type: boolean
      required:
        - valid
        - integrationId
        - issues
      type: object
    DeploymentTargetPreflightRequest:
      properties:
        serverIds:
          items:
            minLength: 1
            type: string
          maxItems: 100
          minItems: 1
          type: array
          uniqueItems: true
      required:
        - serverIds
      type: object
    DeploymentTemplate:
      description: Swallow-owned, Integration-scoped deployment intent. User data is write-only and never returned.
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        description:
          type: string
        ephemeral:
          description: The Deploy Target at the wire boundary (`false` is `disk`, `true` is `ram`).
          type: boolean
        hasUserData:
          type: boolean
        id:
          type: string
        imageId:
          type: string
        integrationId:
          type: string
        name:
          description: Trimmed and unique within the Integration, case-insensitively.
          type: string
        network:
          $ref: '#/components/schemas/DeploymentTemplateNetwork'
        siteId:
          description: The Site of the template's Integration.
          type: string
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - siteId
        - integrationId
        - name
        - description
        - imageId
        - ephemeral
        - network
        - hasUserData
        - createdAt
        - updatedAt
      type: object
    DeploymentTemplateCreateRequest:
      properties:
        deployTarget:
          description: The preferred deploy-mode field (matched case-insensitively); wins over `ephemeral`.
          enum:
            - disk
            - ram
          type: string
        description:
          type: string
        ephemeral:
          deprecated: true
          description: Deprecated alias of `deployTarget` (`false` is `disk`, `true` is `ram`).
          type: boolean
        imageId:
          description: Must be in the provisioner's live catalog.
          type: string
        integrationId:
          type: string
        name:
          type: string
        network:
          $ref: '#/components/schemas/DeploymentTemplateNetworkIntent'
        userData:
          description: Optional cloud-init user data, sealed at rest and never returned.
          type: string
          writeOnly: true
      required:
        - integrationId
        - name
        - imageId
      type: object
    DeploymentTemplateNetwork:
      description: Reusable network intent; never a NIC id or a target-specific static IP.
      properties:
        defaultGateway:
          type: boolean
        mode:
          description: Deployment network mode; a template stored without network intent reads as `automatic`.
          enum:
            - automatic
            - dhcp
            - static
          type: string
        subnetId:
          description: A live provider subnet, or empty.
          type: string
      required:
        - mode
        - subnetId
        - defaultGateway
      type: object
    DeploymentTemplateNetworkIntent:
      description: Network intent sent with a template; a missing `mode` means `automatic`.
      properties:
        defaultGateway:
          description: Valid only for `static`; defaults to false.
          type: boolean
        mode:
          enum:
            - automatic
            - dhcp
            - static
          type: string
        subnetId:
          description: Required for `static`.
          type: string
      type: object
    DeploymentTemplateUpdateRequest:
      description: Any subset of the template's non-secret intent; omitted fields are unchanged.
      properties:
        deployTarget:
          description: The preferred deploy-mode field (matched case-insensitively); wins over `ephemeral`.
          enum:
            - disk
