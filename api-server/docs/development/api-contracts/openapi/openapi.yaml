        "204":
          description: The template was deleted.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the template does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete a Deployment Template and its sealed user data.
      tags:
        - provisioning
    get:
      description: Requires role `admin`.
      operationId: getDeploymentTemplate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentTemplate'
          description: The template.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the template, or its Integration, does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Read one Deployment Template's metadata, without its user data.
      tags:
        - provisioning
    parameters:
      - description: The Deployment Template's swallow-issued id.
        in: path
        name: id
        required: true
        schema:
          type: string
    patch:
      description: Requires role `admin`. Cannot change `integrationId` and never accepts `userData`. A changed image or network is validated against the live provisioner before it is stored.
      operationId: updateDeploymentTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentTemplateUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentTemplate'
          description: The updated template.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid; `name` or `imageId` is empty; `deployTarget` is not `disk` or `ram`; or the image, subnet, or network intent is invalid for the provisioner.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the template, or its Integration, does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: another template of the Integration has the new name, or a network change was sent to a provisioner that offers no network configuration.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the provisioner catalog cannot be read.'
        default:
          $ref: '#/components/responses/Error'
      summary: Change any subset of a Deployment Template's non-secret intent.
      tags:
        - provisioning
  /api/v1/provisioning/templates/{id}/user-data:
    delete:
      description: Requires role `admin`.
      operationId: clearDeploymentTemplateUserData
      responses:
        "204":
          description: The template has no user data.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the template does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Clear a Deployment Template's sealed user data.
      tags:
        - provisioning
    parameters:
      - description: The Deployment Template's swallow-issued id.
        in: path
        name: id
        required: true
        schema:
          type: string
    put:
      description: Requires role `admin`. The value is sealed at rest and never readable through the API; read the template again for the updated `hasUserData`.
      operationId: replaceDeploymentTemplateUserData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentTemplateUserDataRequest'
        required: true
      responses:
        "204":
          description: The user data was replaced.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid or `userData` is empty.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the template does not exist.'
        default:
          $ref: '#/components/responses/Error'
      summary: Replace a Deployment Template's write-only cloud-init user data.
      tags:
        - provisioning
  /api/v1/provisioning/virtual-machine-enrollments:
    post:
      description: Requires role `admin`. Starts one `enroll-virtual-machines` Workflow that targets the Hypervisor Server, with one `enroll-virtual-machine` Task per domain.
      operationId: createVirtualMachineEnrollment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualMachineEnrollmentRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachineEnrollmentAccepted'
          description: The Workflow was created.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`validation_error`: the body is invalid; a required field is missing; `domains` is empty, repeats a name, or a name breaks the domain-name rules; the account is not a POSIX login name; the Integration is not a provisioner or cannot register machines with a Power Configuration; or the Boot ISO belongs to another provisioner.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_found`: the Integration, the Hypervisor Server, or the Boot ISO does not exist.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`conflict`: the Hypervisor is absent, not `deployed`, has no address, is locked, or is not in the Integration''s Site; the installation has no Deployment Key; the Boot ISO is not served; or another Workflow holds the Hypervisor.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`provider_unavailable`: the Hypervisor''s live lock state is unavailable, the Integration has no credential, or virtual-machine enrollment is not wired up.'
        default:
          $ref: '#/components/responses/Error'
      summary: Enroll libvirt virtual machines of a swallow Hypervisor into a provisioner.
      tags:
        - provisioning
  /api/v1/servers:
    get:
      description: Requires role `admin`. Filters are conjunctive. An unknown filter value matches nothing (200 with no items) rather than failing; a `page` or `pageSize` that is not a positive integer, or a `pageSize` above 100, falls back to its default instead of being refused. The route is also served with a trailing slash (`/api/v1/servers/`).
      operationId: listServers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - description: Servers observed through integrations at this Site.
          in: query
          name: siteId
          required: false
          schema:
            type: string
        - description: Servers observed through this integration.
          in: query
          name: integrationId
          required: false
          schema:
            type: string
        - description: The provisioning axis state. A projection stored with the retired value `commissioning` matches `inspecting`.
          in: query
          name: provisioningState
          required: false
          schema:
            $ref: '#/components/schemas/OSProvisioningState'
        - description: Servers whose membership axis names this Platform.
          in: query
          name: platformId
          required: false
          schema:
            type: string
        - deprecated: true
          description: One-release alias of `platformId`; ignored when `platformId` is present.
          in: query
          name: clusterId
          required: false
          schema:
            type: string
        - description: Case-insensitive match on hostname, FQDN, address, serial number, or system UUID.
          in: query
          name: keyword
          required: false
          schema:
            type: string
        - description: Include projections absent from the latest provider inventory. Only the literal `true` enables it; any other value is false.
          in: query
          name: includeAbsent
          required: false
          schema:
            default: false
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerPage'
          description: One page of Server projections.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: List Server projections with filtering and pagination.
      tags:
        - servers
  /api/v1/servers/{id}:
    delete:
      description: 'Requires role `admin`. Provider-first and synchronous: the Machine is deleted before the projection, and a Machine the provisioner reports as already missing still succeeds. 400 when the provisioner cannot remove machines or refused; 404 for an unknown Server; 409 when a Platform claims the Server or it is locked; 503 when the provisioner or the lock state is unavailable.'
      operationId: deleteServer
      responses:
        "204":
          description: The Machine and the Server projection are gone.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Delete a Server together with its backing provisioner Machine.
      tags:
        - servers
    get:
      description: Requires role `admin`. An unknown Server is 404.
      operationId: getServer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
          description: The complete Server projection, the same shape as a list item.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Read one Server projection.
      tags:
        - servers
    parameters:
      - description: The swallow-issued Server ID.
        in: path
        name: id
        required: true
        schema:
          type: string
  /api/v1/servers/{id}/abort:
    parameters:
      - description: The swallow-issued Server ID.
        in: path
        name: id
        required: true
        schema:
          type: string
    post:
      description: Requires role `admin`. The response is the provisioning snapshot the provisioner returned on accepting the action; the reconciler tracks it from there. 400 when the provisioner does not offer the action or refused it; 404 for an unknown Server or Machine; 409 for a locked Server or a provisioning state that does not allow the action; 503 when the provisioner or the lock state is unavailable.
      operationId: abortServerLifecycleAction
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerProvisioningSnapshot'
          description: The provisioner accepted the action.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Stop an in-progress inspection, test, or deployment (needs `hardwareValidation`).
      tags:
        - servers
  /api/v1/servers/{id}/boot-media:
    get:
      description: Requires role `admin`. With `live=true` the BMC or hypervisor is also read; a failed live read is still 200 with `liveError`. 404 for an unknown Server.
      operationId: getServerBootMedia
      parameters:
        - description: Also read the BMC's or the hypervisor's current media and boot override.
          in: query
          name: live
          required: false
          schema:
            default: false
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootMedia'
          description: The Server's Boot Media.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Read the Server's Boot Media setting, probes, and running preflight.
      tags:
        - servers
    parameters:
      - description: The swallow-issued Server ID.
        in: path
        name: id
        required: true
        schema:
          type: string
    put:
      description: Requires role `admin`. Enabling is a preflight that can take minutes; its progress is the Read's `apply`. 400 when the body has no boolean `enabled`, enabling has no `isoId`, or the Boot ISO belongs to another Integration; 404 for an unknown Server or Boot ISO; 409 when a preflight already runs, the Server or its hypervisor is locked, the Boot ISO is not served, the Server has no Boot Media method, or the BMC or hypervisor refused; 503 when the BMC, hypervisor, provisioner, or lock state is unavailable.
      operationId: setServerBootMedia
      requestBody:
        content:
          application/json:
            schema:
              properties:
                enabled:
                  type: boolean
                isoId:
                  description: The Boot ISO to enable with, built for the Server's own provisioner Integration. Required to enable; ignored when disabling.
                  type: string
              required:
                - enabled
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootMediaChange'
          description: The Boot Media after the change.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Enable Boot Media with a Boot ISO (preflight), switch it, or disable it.
      tags:
        - servers
  /api/v1/servers/{id}/default-user:
    delete:
      description: Requires role `admin`. Succeeds also when nothing was set and never touches the host. 404 for an unknown Server; 409 for a locked Server; 503 when the lock state is unavailable.
      operationId: clearServerDefaultUser
      responses:
        "204":
          description: The OS Image's default user applies again.
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Clear the Server Default User set on the Server.
      tags:
        - servers
    parameters:
      - description: The swallow-issued Server ID.
        in: path
        name: id
        required: true
        schema:
          type: string
    put:
      description: Requires role `admin`. The value is saved only after a Deployment Key login as `user` succeeds. 400 when `user` is not a login name or the host rejected the password; 404 for an unknown Server; 409 when the Server is not deployed, has no address, or is locked, the installation has no Deployment Key, or the host rejected the key; 503 when the host is unreachable or the lock state is unavailable.
      operationId: setServerDefaultUser
      requestBody:
        content:
          application/json:
            schema:
              properties:
                password:
                  description: The account's password, used once to install the Deployment Key; never stored, logged, or returned.
                  type: string
                  writeOnly: true
                user:
                  description: 'A POSIX login name: lowercase letters, digits, `_` or `-`, starting with a letter or `_`, up to 32 characters.'
                  type: string
              required:
                - user
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDefaultUserOutcome'
          description: The effective Server Default User after the change.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Set the Server Default User, optionally installing the Deployment Key first.
      tags:
        - servers
  /api/v1/servers/{id}/deploy:
    parameters:
      - description: The swallow-issued Server ID.
        in: path
        name: id
        required: true
        schema:
          type: string
    post:
      deprecated: true
      description: 'Requires role `admin`. Deprecated in favour of `POST /api/v1/provisioning/deployment-operations`; every response carries `Deprecation: true` and a successor `Link`. 400 for an invalid body, a missing `distroSeries`, an unknown `deployTarget`, an unsupported RAM deployment, or a provisioner refusal; 404 for an unknown Server or Machine; 409 for a locked Server or a missing Deployment Key; 503 when the provisioner, its SSH Key registration, or the lock state is unavailable.'
      operationId: deployServer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                deployTarget:
                  description: The preferred deploy-mode field; wins over `ephemeral`.
                  enum:
                    - disk
                    - ram
                  type: string
                distroSeries:
                  description: The release to deploy, for example `jammy`.
                  type: string
                ephemeral:
                  deprecated: true
                  description: Alias of `deployTarget` (`false` is `disk`, `true` is `ram`).
                  type: boolean
                osSystem:
                  type: string
                userData:
                  description: Optional cloud-init user data in plain text.
                  type: string
              required:
                - distroSeries
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerProvisioningSnapshot'
          description: The provisioner accepted the deployment.
          headers:
            Deprecation:
              schema:
                enum:
                  - "true"
                type: string
            Link:
              description: The successor route, `</api/v1/provisioning/deployment-operations>; rel="successor-version"`.
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Deploy an operating system on one Server directly.
      tags:
        - servers
  /api/v1/servers/{id}/docker:
    get:
      description: 'Requires the `admin` role. Read route of the Docker Host Explorer: available on a locked Server. Eligibility and Engine error mapping are in servers-docker.md.'
      operationId: getDockerEngineSummary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerEngineSummary'
          description: The Engine header.
        "400":
          $ref: '#/components/responses/DockerExplorerRejected'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/DockerExplorerNotFound'
        "409":
          $ref: '#/components/responses/DockerExplorerReadConflict'
        "503":
          $ref: '#/components/responses/DockerExplorerReadUnavailable'
        default:
          $ref: '#/components/responses/Error'
      summary: Read the live header of a Server's Docker Engine.
      tags:
        - software
    parameters:
      - $ref: '#/components/parameters/DockerHostServerId'
  /api/v1/servers/{id}/docker/containers:
    get:
      description: Requires the `admin` role. Read route; available on a locked Server.
      operationId: listDockerContainers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerContainerList'
          description: The host's containers.
        "400":
          $ref: '#/components/responses/DockerExplorerRejected'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/DockerExplorerNotFound'
        "409":
          $ref: '#/components/responses/DockerExplorerReadConflict'
        "503":
          $ref: '#/components/responses/DockerExplorerReadUnavailable'
        default:
          $ref: '#/components/responses/Error'
      summary: List every container on the host, running or not, by name.
      tags:
        - software
    parameters:
      - $ref: '#/components/parameters/DockerHostServerId'
    post:
      description: 'Requires the `admin` role. Write route: refused on a locked Server. The request rules (servers-docker.md, Create Container) are checked before eligibility. When the container was created but could not be started, the container remains and the response is the start failure''s error.'
      operationId: createDockerContainer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DockerContainerCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerContainerCreated'
          description: The container was created (and started unless `start` was `false`).
        "400":
          $ref: '#/components/responses/DockerExplorerRejected'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/DockerExplorerNotFound'
        "409":
          $ref: '#/components/responses/DockerExplorerWriteConflict'
        "503":
          $ref: '#/components/responses/DockerExplorerWriteUnavailable'
        default:
          $ref: '#/components/responses/Error'
      summary: Create a container from a local image and, by default, start it.
      tags:
        - software
  /api/v1/servers/{id}/docker/containers/{containerId}:
    delete:
      description: 'Requires the `admin` role. Write route: refused on a locked Server. Removing a running container without `force` is `409`. Named volumes are never removed.'
      operationId: removeDockerContainer
      parameters:
        - description: Kill a running container first. Only the literal `true` enables it.
          in: query
          name: force
          required: false
          schema:
            default: false
            type: boolean
        - description: Also remove the container's anonymous volumes. Only the literal `true` enables it.
          in: query
          name: removeVolumes
          required: false
          schema:
            default: false
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAcknowledgement'
          description: The container was removed.
        "400":
          $ref: '#/components/responses/DockerExplorerRejected'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/DockerExplorerNotFound'
        "409":
          $ref: '#/components/responses/DockerExplorerWriteConflict'
        "503":
          $ref: '#/components/responses/DockerExplorerWriteUnavailable'
        default:
          $ref: '#/components/responses/Error'
      summary: Remove one container.
      tags:
        - software
    parameters:
      - $ref: '#/components/parameters/DockerHostServerId'
      - $ref: '#/components/parameters/DockerContainerId'
  /api/v1/servers/{id}/docker/containers/{containerId}/logs:
    get:
      description: 'Requires the `admin` role. Read route; available on a locked Server. A snapshot, not a stream: both streams in arrival order, truncated at 4 MiB.'
      operationId: getDockerContainerLogs
      parameters:
        - description: How many trailing lines to return. Values above 2000 are capped at 2000; a non-positive or non-integer value is `400`.
          in: query
          name: tailLines
          required: false
          schema:
            default: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerContainerLogs'
          description: The log snapshot.
        "400":
          $ref: '#/components/responses/DockerExplorerRejected'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/DockerExplorerNotFound'
        "409":
          $ref: '#/components/responses/DockerExplorerReadConflict'
        "503":
          $ref: '#/components/responses/DockerExplorerReadUnavailable'
        default:
          $ref: '#/components/responses/Error'
      summary: Read a bounded snapshot of a container's standard output and standard error.
      tags:
        - software
    parameters:
      - $ref: '#/components/parameters/DockerHostServerId'
      - $ref: '#/components/parameters/DockerContainerId'
  /api/v1/servers/{id}/docker/containers/{containerId}/restart:
    parameters:
      - $ref: '#/components/parameters/DockerHostServerId'
      - $ref: '#/components/parameters/DockerContainerId'
    post:
      description: 'Requires the `admin` role. Write route: refused on a locked Server. Stops with the same 10-second grace as stop, then starts. Takes no body.'
      operationId: restartDockerContainer
      responses:
        "200":
          content:
