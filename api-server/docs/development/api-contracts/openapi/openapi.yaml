    name: sites
  - description: Install and uninstall single host software (Managed Software) on deployed Servers and read the swallow-owned Software Assignments; manage the Registry Credentials the Docker Host Explorer attaches to private pulls; and manage a Server's Docker Engine live through the Docker Host Explorer.
    name: software
  - description: Liveness, readiness, and process metrics of the API process.
    name: system
  - description: Durable Workflows (a DAG of Tasks run by Runners), their timeline and per-Task diagnostics, and the deprecated /operations alias.
