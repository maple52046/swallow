      deprecated: true
      description: 'Requires role `admin`. Deprecated in favour of `POST /api/v1/provisioning/release-operations`; every response carries `Deprecation: true` and a successor `Link`. The body is optional. 400 for an invalid body, erase refinements without `erase`, release options the provisioner does not support, or a provisioner refusal; 404 for an unknown Server or Machine; 409 when a Platform claims the Server, it is locked, or `unbindStaticIPs` is asked of a provisioner that cannot configure networks; 503 when the provisioner or the lock state is unavailable.'
      operationId: releaseServer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                erase:
                  description: Wipe the disks; `false` releases without wiping.
                  type: boolean
                quickErase:
                  description: Wipe only the beginning and end of each disk; requires `erase`.
                  type: boolean
                secureErase:
                  description: Use the device's hardware erase; requires `erase`.
                  type: boolean
                unbindStaticIPs:
                  description: Remove the pre-release static links once the Server is Ready, through a Provisioning Task whose id the response carries as `taskId`.
                  type: boolean
              type: object
        required: false
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerProvisioningSnapshot'
          description: The provisioner accepted the release.
          headers:
            Deprecation:
              schema:
                enum:
                  - "true"
                type: string
            Link:
              description: The successor route, `</api/v1/provisioning/release-operations>; rel="successor-version"`.
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      summary: Release one Server to the provider's available pool directly.
      tags:
        - servers
