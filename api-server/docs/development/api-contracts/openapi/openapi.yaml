      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: 'An unbounded SSE stream (`Cache-Control: no-cache`). Each `data:` frame is a `ServerChange` JSON object.'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
