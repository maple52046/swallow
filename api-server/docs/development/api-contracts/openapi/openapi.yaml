          default: cookie
          description: 'How the refresh token reaches the client: `cookie` (browsers; the body carries no `refreshToken`) or `body` (CLI and other non-browser clients; no cookie is set). An empty string is treated as omitted.'
          enum:
            - cookie
            - body
          type: string
        username:
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    SessionRefreshTokenRequest:
      properties:
        refreshToken:
          description: The Session's refresh token for body delivery. Omitted or empty falls back to the `swallow_refresh` cookie.
          type: string
      type: object
    SessionTokens:
      description: The credentials of a Session, issued by login and refresh.
      properties:
        accessToken:
          description: 'Short-lived bearer credential (`Authorization: Bearer <accessToken>`). Opaque: consumers must not parse it.'
          type: string
        accessTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        refreshToken:
          description: Opaque secret that obtains new access tokens. Present only with body delivery, and on refresh only when the token was rotated (absent within the rotation grace).
          type: string
      required:
        - accessToken
        - accessTokenExpiresAt
      type: object
    Site:
      description: A swallow-owned location that owns its own infrastructure (glossary Site).
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        description:
          description: '`""` when none was given.'
          type: string
        id:
          description: The opaque `siteId`.
          type: string
        name:
          description: Unique across Sites.
          type: string
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - name
        - description
        - createdAt
        - updatedAt
      type: object
    SlurmClusterState:
