            - up
            - down
            - unknown
          type: string
      required:
        - hostname
        - primary
        - status
      type: object
    SlurmDeployRequest:
      description: Builds Slurm on the node assignments. An enabled `gpuOperator` is 400 (Slurm has no in-platform GPU operator).
      properties:
        containerRuntime:
          $ref: '#/components/schemas/SlurmContainerRuntime'
        deviceMetricsExporter:
          allOf:
            - $ref: '#/components/schemas/SlurmMonitoringFeature'
          description: Install AMD's Device Metrics Exporter on the GPU compute nodes; mutually exclusive with an enabled `omnistat`.
        gpuDriver:
          $ref: '#/components/schemas/PlatformGPUDriver'
        gpuStackOwner:
          allOf:
            - $ref: '#/components/schemas/GPUStackOwner'
          default: provisioning
        machinePreparation:
          $ref: '#/components/schemas/PlatformMachinePreparation'
        name:
          description: Unique within the Site.
          type: string
        omnistat:
          allOf:
            - $ref: '#/components/schemas/SlurmMonitoringFeature'
          description: Install Omnistat; mutually exclusive with an enabled `deviceMetricsExporter`.
        siteId:
          type: string
        slurm:
          $ref: '#/components/schemas/SlurmDeploymentSpec'
        timeSyncCheck:
          allOf:
            - $ref: '#/components/schemas/TimeSyncCheck'
          default: enforce
        type:
          enum:
            - slurm
          type: string
      required:
        - siteId
        - name
        - type
        - slurm
      type: object
    SlurmDeploymentSpec:
      description: The Slurm topology and options; every field except `nodeAssignments` is optional.
      properties:
        apiVersion:
          description: The slurmrestd endpoint version recorded in the credential, for example `v0.0.42`.
          type: string
        clusterName:
          description: Defaults to a sanitized Platform name.
          type: string
        gpuGresType:
          description: The GRES type of every GPU node; omitted derives it from the GPU architecture.
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
          type: string
        nodeAssignments:
          description: At least one controller and one compute Server; each Server once and with at least one role. The first controller is the primary.
          items:
            $ref: '#/components/schemas/SlurmNodeAssignment'
          minItems: 1
          type: array
        ociContainers:
          default: false
          type: boolean
        pmix:
          default: false
          type: boolean
        stateSaveLocation:
          description: Overrides the slurmctld state directory.
          type: string
        workloadStorage:
          $ref: '#/components/schemas/SlurmWorkloadStorage'
      required:
        - nodeAssignments
      type: object
    SlurmMonitoringFeature:
      description: 'An optional Slurm monitoring feature; omitted or `enabled: false` installs nothing.'
      properties:
        enabled:
          default: false
          type: boolean
        installMethod:
          allOf:
            - $ref: '#/components/schemas/ObservabilityInstallMethod'
          default: container
      type: object
    SlurmNode:
      properties:
        address:
          type: string
        cpus:
          type: integer
        gres:
          description: The node's GRES, for example `gpu:8`.
          type: string
        name:
          type: string
        partitions:
          items:
            type: string
          type: array
        realMemoryMiB:
          format: int64
          type: integer
        state:
          description: 'The collapsed scheduler state: a down, drain, or fail flag wins, otherwise the first flag (for example `idle`, `allocated`, `mixed`); `unknown` when Slurm reports none.'
          type: string
      required:
        - name
        - state
        - cpus
        - realMemoryMiB
        - gres
        - partitions
        - address
      type: object
    SlurmNodeAssignment:
      properties:
        compute:
          default: false
          description: Runs slurmd.
          type: boolean
        controller:
          default: false
          description: Runs slurmctld.
          type: boolean
        login:
          default: false
          description: A submission host that runs no cluster daemon.
          type: boolean
        serverId:
          type: string
      required:
        - serverId
      type: object
    SlurmPartition:
      properties:
        name:
          type: string
        nodeSpec:
          description: The configured node list, for example `compute[1-4]`.
          type: string
        state:
          description: The partition's state flags, lower-case and comma-separated.
          type: string
        totalNodes:
          type: integer
      required:
        - name
        - state
        - nodeSpec
        - totalNodes
      type: object
    SlurmWorkloadStorage:
      description: A shared filesystem for user and job data, mounted on every node.
      properties:
        mode:
          description: '`self-hosted` exports NFS from the login node (so it requires one); `external` mounts `nfs.url`.'
          enum:
            - self-hosted
            - external
          type: string
        mountPath:
          default: /shared
          description: An absolute path other than `/` and `/home`.
          type: string
        nfs:
          description: The NFS source; `url` is required for `external`.
          properties:
            mountOptions:
              type: string
            url:
              description: '`host:/path`.'
