        - machineToken: []
      summary: Serve the Ansible dynamic inventory projection of the Server inventory.
      tags:
        - monitoring
  /api/v1/discovery/prometheus:
    get:
      description: 'Machine authentication: the installation machine token, or an admin access token (API Keys are not accepted). Never paginated. A Server with no known address is omitted; a locked Server stays discoverable (discovery-prometheus.md).'
      operationId: listPrometheusTargets
      parameters:
        - description: Exporter port placed in each target (9100 node-exporter, 5000 RDC exporter).
          in: query
          name: port
          required: false
          schema:
            default: 9100
            maximum: 65535
            minimum: 1
            type: integer
        - description: Keep only Servers carrying this provisioner tag (e.g. `amd-gpu`).
          in: query
          name: tag
          required: false
          schema:
            type: string
        - description: Keep only Servers of this Site.
          in: query
          name: siteId
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/DiscoveryProvisioningState'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PrometheusTarget'
                type: array
