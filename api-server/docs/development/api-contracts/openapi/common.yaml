# Shared part of the api-server OpenAPI contract: document metadata, security schemes, and the
# conventions every endpoint shares (conventions.md). Endpoint paths live in areas/*.yaml.
# openapi.yaml in this directory is generated from these files; do not edit it by hand.
openapi: 3.0.3
info:
  title: swallow API
  version: v1
  description: >-
    Wire shape of the HTTP API owned by api-server: paths, methods, parameters, request and
    response schemas, status codes, and authentication. Behavior semantics live in the Markdown
    contracts under api-contracts/api-server/. When they describe the same field, both must
    agree; this document is the machine-checked one.
servers:
  - url: /
security:
  - bearerAuth: []
tags: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A Session access token or an API Key secret (always prefixed `swk_`). Both act with the
        owning User's role (conventions.md, Authentication).
    machineToken:
      type: http
      scheme: bearer
      description: >-
        The installation machine token, or an admin access token. Accepted only by the
        machine-to-machine routes (discovery and /metrics).
    accessTokenQuery:
      type: apiKey
      in: query
      name: access_token
      description: >-
        A Session access token passed as a query parameter, for browser EventSource clients that
        cannot send an Authorization header. Accepted only by the Server stream.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Error:
      type: object
      description: The error envelope every non-success response uses (conventions.md, Error Response).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable category; the only field a consumer may branch on.
              enum:
                - validation_error
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - internal_error
                - provider_unavailable
            message:
              type: string
              description: Human-readable; must not be parsed.
            requestId:
              type: string
              description: >-
                Opaque correlation ID matching the X-Request-ID response header. Always present
                in a running installation; absent only when no request-ID middleware runs.
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 in UTC (conventions.md, Timestamps).
    SuccessAcknowledgement:
      type: object
      description: The body of a request that completed and has nothing else to report.
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
  headers:
    NoStore:
      description: >-
        Always `no-store`: the response carries a credential or private key, or live state read
        from the system that owns it, and must not be cached by a browser or an intermediary.
      schema:
        type: string
        enum:
          - no-store
    Deprecation:
      description: >-
        `true` on a response served through a deprecated route, alias, or parameter. Clients
        should move to the successor named by the Link header.
      schema:
        type: string
        enum:
          - 'true'
    SuccessorLink:
      description: The canonical successor of a deprecated route, as `<path>; rel="successor-version"`.
      schema:
        type: string
  responses:
    Error:
      description: The shared error envelope (conventions.md).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
