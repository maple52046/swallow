# swallow config example
#
# This file covers only how the process runs. What swallow talks to — provisioners,
# metrics stores, platforms — is registered at runtime as
# integration records, because a fleet has many of each and they change without a
# redeploy. Site automation is configured through the API and executed locally.
#
# Values shown are for local development. Production must override jwtSecret,
# credentialKey, machineToken, bootstrapAdminPassword, and mongoUri.

api:
  # Promoted SemVer reported by health and metrics. Release installers set this;
  # source builds default to the compile-time version.
  releaseVersion: ""

  # HTTP listen address.
  addr: ":30051"

  # MongoDB connection string.
  mongoUri: "mongodb://localhost:27017"

  # MongoDB database name.
  mongoDb: "swallow"

  # HMAC secret for signing JWT tokens. Must be kept private.
  jwtSecret: "dev-secret-change-in-production"

  # Session lifetimes (decision 042). Access tokens are short-lived because logout cannot revoke
  # one already issued; refresh tokens renew them until the Session is idle for refreshTokenTTL or
  # reaches sessionMaxAge. accessTokenTTL must be shorter than refreshTokenTTL.
  accessTokenTTL: 15m
  refreshTokenTTL: 168h
  sessionMaxAge: 720h

  # Deprecated and ignored (it set the old single 24-hour token); the API warns when it is set.
  # jwtExpiryHours: 24

  # Admin user seeded on first startup. Ignored if the user already exists.
  bootstrapAdminUsername: "admin"
  bootstrapAdminPassword: "admin"

  # Base64-encoded 32-byte key that seals integration credentials at rest.
  # Required, with no default: a shipped default encryption key looks like protection
  # and is not. Generate one with:  openssl rand -base64 32
  # Never log or commit this value. Changing it makes existing stored credentials
  # unreadable, so rotating it means re-entering every integration credential.
  credentialKey: "REPLACE-ME-openssl-rand-base64-32"

  # Static bearer token for Prometheus metrics/discovery and external Ansible diagnostics.
  #
  # Optional. When unset those endpoints require an admin JWT, which is fine for
  # inspecting them by hand but not for Prometheus, which cannot refresh one.
  # Accepted only on those endpoints. Never log or commit this value.
  machineToken: ""

  # How often each enabled provisioner is polled to refresh server projections, and
  # each registered platform to refresh membership.
  reconcileInterval: "30s"

  # How often the attached-hardware inventory (GPUs) is refreshed. Much longer than
  # reconcileInterval because attached devices cost a call per machine and change only at
  # commissioning, so polling them as often as lifecycle state would multiply request
  # count for near-static data.
  inventoryInterval: "15m"

  # How often the API re-realizes every SSH Key (the Deployment Key and Access Keys) in each
  # key-capable provisioner. Key changes and OS deployments already trigger a sync, so this
  # pass only repairs drift. Env: SWALLOW_API_SSH_KEY_SYNC_INTERVAL.
  sshKeySyncInterval: "5m"

  # Boot Media (decisions 047 and 049): Boot ISOs are built on the dashboard's Provisioning page,
  # written under dir (one subdirectory each), and served unauthenticated at
  # <baseURL>/boot-media/ipxe/<isoId>/swallow-ipxe.iso for BMCs to mount as virtual media.
  # Optional: without baseURL no Boot ISO can be built. Many BMCs mount only plain http:// on
  # port 80. ipxeDir holds the prebuilt iPXE assets the image installs. isoPath is retired.
  # Env: SWALLOW_API_BOOT_MEDIA_BASE_URL, SWALLOW_API_BOOT_MEDIA_DIR, SWALLOW_API_IPXE_DIR.
  bootMedia:
    baseURL: ""
    dir: "/var/lib/swallow/boot-media"
    ipxeDir: "/usr/share/swallow/ipxe"
  # The linux-amd64 swallow CLI served without authentication at /downloads/swallow, which the
  # Server Enrollment script downloads on a host that keeps its OS. Optional; the production
  # bundle ships it at bin/swallow. Env: SWALLOW_API_CLI_BINARY.
  cliBinary: ""
  # How often Servers without a current Redfish capability probe (newly enrolled ones) are
  # probed, and how long a probe stays current.
  # Env: SWALLOW_API_REDFISH_PROBE_INTERVAL, SWALLOW_API_REDFISH_PROBE_MAX_AGE.
  redfishProbeInterval: "10m"
  redfishProbeMaxAge: "24h"

  # Operation orchestration. The embedded dispatcher drains legacy schema-v2 work; new
  # automation runs as durable schema-v3 Operations coordinated by Temporal. The same
  # config serves three commands: `swallow-api api` (HTTP + reconcile), `swallow-api worker`
  # (Temporal workflow/activity worker + start reconciler), and `swallow-api ansible-executor`
  # (owns the ansible-runner subprocesses via the Mongo-backed execution queue).
  operationDispatchInterval: "1s"
  operationLeaseDuration: "90s"
  # Per-Operation Step fan-out ceiling (provider, PXE, image-mirror, and history load).
  operationMaxParallelism: 4

  # Durable workflow service shared by the api, worker, and ansible-executor commands.
  temporalAddress: "localhost:7233"
  temporalNamespace: "default"
  temporalTaskQueue: "swallow-operations"
  # How often the API and worker reconcile persisted pending Operations into workflows.
  temporalStartInterval: "1s"

  # Immutable release playbooks and mutable runner paths.
  ansibleRunnerCommand: "ansible-runner"
  playbookManifest: "automation/manifest.json"
  playbookDir: "automation/playbooks"
  jobRuntimeDir: "/tmp/swallow/jobs"
  jobArtifactDir: "./var/jobs"

  # Empty means same-origin only. Dev may list explicit origins, comma-separated; they may send
  # credentials (the refresh cookie), so "*" is rejected.
  allowedOrigins: ""
