---
# Remove the Node Exporter that swallow installed as Managed Software, leaving the host OS intact
# (docs/development/software-deployment.md). Idempotent: a host without it reruns with no changes.
# swallow marks the Software Assignment absent on success.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Uninstall the Node Exporter
  hosts: all
  gather_facts: true
  roles:
    - role: node_exporter
      vars:
        node_exporter_state: absent

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
