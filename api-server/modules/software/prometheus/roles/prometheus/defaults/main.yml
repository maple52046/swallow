---
# Prometheus Managed Software (decision 063). Intent arrives as trusted swallow_prometheus_* vars;
# the defaults only keep a hand-run play working. Prometheus listens on the loopback address (or the
# Server's management address when asked) and runs by one of two install methods:
#   container  the pinned official image, under a Docker Compose project (docker-ce) or a Podman
#              Quadlet unit (podman); the runtime must already be installed
#   native     the pinned official release binary under a Swallow-owned systemd unit
prometheus_state: present
prometheus_install_method: "{{ swallow_prometheus_install_method | default('container', true) }}"
prometheus_container_runtime: "{{ swallow_prometheus_container_runtime | default('docker-ce', true) }}"
prometheus_version: "{{ swallow_prometheus_version | default('3.15.0', true) | regex_replace('^v', '') }}"
prometheus_port: "{{ swallow_prometheus_port | default(9090) | int }}"
prometheus_scrape_job: "{{ swallow_prometheus_scrape_job | default('swallow', true) }}"
prometheus_scrape_targets: "{{ swallow_prometheus_scrape_targets | default([]) }}"
# Swallow Servers scraped on prometheus_scrape_port, resolved from this run's inventory snapshot
# (ansible_host is the Server's current primary address), so a redeploy that changes an address
# converges on the next run.
prometheus_scrape_server_ids: "{{ swallow_prometheus_scrape_server_ids | default([]) }}"
prometheus_scrape_port: "{{ swallow_prometheus_scrape_port | default(0) | int }}"
# Scrape every 15 s with a 10 s timeout, the interval Omnistat's dashboards are verified with.
prometheus_scrape_interval: 15s
prometheus_scrape_timeout: 10s
prometheus_retention: "{{ swallow_prometheus_retention | default('15d', true) }}"
# Prometheus has no authentication of its own, so it binds the loopback address unless the spec
# asks for the management address; never 0.0.0.0. Every install method uses the host network, so
# the address means the same thing for a container and a native process.
prometheus_listen: "{{ swallow_prometheus_listen | default('loopback', true) }}"
prometheus_listen_address: "{{ '127.0.0.1' if prometheus_listen == 'loopback' else ansible_host }}"
# Where Grafana on the same Server finds this Prometheus (read by the grafana role).
prometheus_endpoint_file: "{{ prometheus_config_dir }}/endpoint"
prometheus_config_dir: /etc/swallow/prometheus
prometheus_data_dir: /var/lib/swallow/prometheus

# container method
prometheus_image: "docker.io/prom/prometheus:v{{ prometheus_version }}"
prometheus_container_name: swallow-prometheus
prometheus_project: swallow-prometheus
# The Quadlet unit gets its own name so it can never shadow the native unit.
prometheus_quadlet_unit: swallow-prometheus-container
# The official image runs as nobody (65534); the data directory must be writable by it.
prometheus_container_uid: 65534

# native method
prometheus_native_unit: swallow-prometheus.service
prometheus_native_user: swallow-prometheus
prometheus_native_root: /opt/swallow/prometheus
prometheus_native_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
prometheus_release_url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}"
prometheus_release_archive: "prometheus-{{ prometheus_version }}.linux-{{ prometheus_native_arch }}.tar.gz"
