---
# Remove the Podman Quadlet unit and its container. Tolerates a host whose Podman is already gone.

- name: Read the Prometheus Quadlet unit
  ansible.builtin.stat:
    path: "/etc/containers/systemd/{{ prometheus_quadlet_unit }}.container"
  register: prometheus_quadlet_file

- name: Stop and remove the Prometheus Quadlet container
  when: prometheus_quadlet_file.stat.exists
  block:
    - name: Stop the Prometheus Quadlet unit
      ansible.builtin.systemd_service:
        name: "{{ prometheus_quadlet_unit }}.service"
        state: stopped
      failed_when: false

    - name: Remove the Prometheus Quadlet unit
      ansible.builtin.file:
        path: "/etc/containers/systemd/{{ prometheus_quadlet_unit }}.container"
        state: absent

    - name: Reload systemd without the Prometheus Quadlet unit
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Remove any leftover Prometheus container
      ansible.builtin.command:
        argv: [podman, rm, --force, --ignore, "{{ prometheus_container_name }}"]
      changed_when: false
      failed_when: false
