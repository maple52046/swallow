---
# Remove the native install. The swallow drop-in marks a package swallow installed, so a Grafana the
# user installed outside swallow is never removed. The drop-in goes last: a removal that stops halfway
# still finds it, and the next run finishes the job.

- name: Read the Grafana drop-in
  ansible.builtin.stat:
    path: "{{ grafana_native_dropin }}"
  register: grafana_native_dropin_stat

- name: Remove the native Grafana
  when: grafana_native_dropin_stat.stat.exists
  block:
    - name: Stop and disable Grafana
      ansible.builtin.systemd_service:
        name: "{{ grafana_native_unit }}"
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the Grafana package (apt)
      ansible.builtin.apt:
        name: grafana
        state: absent
        purge: true
        lock_timeout: 300
      register: grafana_apt_remove
      until: grafana_apt_remove is succeeded
      retries: 60
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Remove the Grafana apt repository
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/grafana.list
        - /etc/apt/keyrings/grafana.asc
      when: ansible_facts['os_family'] == 'Debian'

    - name: Remove the Grafana package (dnf)
      ansible.builtin.dnf:
        name: grafana
        state: absent
      register: grafana_dnf_removal
      until: grafana_dnf_removal is succeeded
      retries: 60
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Remove the Grafana yum repository
      ansible.builtin.yum_repository:
        name: grafana
        state: absent
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Remove the directories the Grafana package leaves
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ grafana_native_package_dirs }}"

    - name: Remove the Grafana package's system user
      # Packages keep the system users they create; nothing else runs as this one.
      ansible.builtin.user:
        name: "{{ grafana_native_user }}"
        state: absent

    - name: Remove the Grafana package's system group
      ansible.builtin.group:
        name: "{{ grafana_native_user }}"
        state: absent

    - name: Remove the Grafana drop-in
      ansible.builtin.file:
        path: "{{ grafana_native_dropin | dirname }}"
        state: absent

    - name: Reload systemd without Grafana
      ansible.builtin.systemd_service:
        daemon_reload: true
