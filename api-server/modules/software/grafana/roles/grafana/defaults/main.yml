---
# Grafana Managed Software (decision 063). Intent arrives as trusted swallow_grafana_* vars; the
# defaults only keep a hand-run play working. Grafana listens on the Server's management address
# and runs by one of two install methods:
#   container  the pinned official image from the Site's Local Repository, under a Docker Compose
#              project (docker-ce) or a Podman Quadlet unit (podman); the runtime must already be
#              installed
#   native     the pinned package, configured by a systemd drop-in: on Debian from the Local
#              Repository's grafana source, on the RHEL family from Grafana's official yum
#              repository
# Either way it is read-only by design: anonymous Viewer access, no login form, no basic auth, and
# no initial admin, so it holds no secret; the datasource and dashboards come only from
# provisioning.
grafana_state: present
grafana_install_method: "{{ swallow_grafana_install_method | default('container', true) }}"
grafana_container_runtime: "{{ swallow_grafana_container_runtime | default('docker-ce', true) }}"
grafana_version: "{{ swallow_grafana_version | default('12.4.12', true) | regex_replace('^v', '') }}"
grafana_port: "{{ swallow_grafana_port | default(3000) | int }}"
# Empty reads the Prometheus on the same Server: the address its role recorded in
# grafana_local_prometheus_endpoint, else the loopback address on its port.
grafana_prometheus_url: "{{ swallow_grafana_prometheus_url | default('', true) }}"
grafana_local_prometheus_endpoint: /etc/swallow/prometheus/endpoint
# A bearer token the datasource sends (a Platform's monitoring token for swallow's gateway), passed
# as a secret var; empty sends none. It is kept only in a root-only environment file that systemd or
# the container runtime reads as root, and the datasource names the variable, so Grafana's own
# files never hold it.
grafana_datasource_token: "{{ swallow_grafana_datasource_token | default('', true) }}"
grafana_datasource_env_file: "{{ grafana_config_dir }}/datasource.env"
grafana_local_prometheus_port: "{{ swallow_grafana_prometheus_port | default(9090) }}"
grafana_dashboards: "{{ swallow_grafana_dashboards | default([]) }}"
# Grafana is the read-only UI people open, so it listens on the management address. Every install
# method uses the host network, so it also reaches a loopback-only Prometheus on the same Server.
grafana_listen_address: "{{ ansible_host }}"
grafana_config_dir: /etc/swallow/grafana
grafana_data_dir: /var/lib/swallow/grafana
# The datasource, its uid, the dashboard bundles, and their folders are the shared
# grafana_provisioning role's.
# Settings every install method applies; the address, port, and paths are added per method.
grafana_environment:
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
  GF_AUTH_DISABLE_LOGIN_FORM: "true"
  GF_AUTH_BASIC_ENABLED: "false"
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
  GF_NEWS_NEWS_FEED_ENABLED: "false"

# container method: the Local Repository's registry serves each upstream registry under its name.
grafana_image: "{{ swallow_local_repository.registry }}/docker.io/grafana/grafana:{{ grafana_version }}"
grafana_container_name: swallow-grafana
grafana_project: swallow-grafana
# The Quadlet unit gets its own name so it can never shadow the package's unit.
grafana_quadlet_unit: swallow-grafana-container
# The official image runs as grafana (472).
grafana_container_uid: 472
# Where the container sees the dashboard bundles.
grafana_container_dashboards_dir: /var/lib/swallow-dashboards

# native method
grafana_native_unit: grafana-server.service
grafana_native_user: grafana
grafana_native_dropin: /etc/systemd/system/grafana-server.service.d/10-swallow.conf
# The Local Repository's deb source the grafana module declares (Grafana's official apt repository).
grafana_apt_source: grafana
grafana_rpm_repo_url: https://rpm.grafana.com
