---
# Remove Docker CE that swallow installed as Managed Software, leaving the host OS intact
# (docs/development/software-deployment.md). Idempotent: a host without Docker reruns with no
# changes. It removes swallow's Docker Engine API listener (and its firewalld port), stops and
# disables the daemon, and removes the Docker CE packages; swallow marks the Software Assignment
# absent on success.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Uninstall Docker CE
  hosts: all
  gather_facts: true
  roles:
    - role: docker_ce
      vars:
        docker_ce_state: absent
        docker_ce_api_port: "{{ swallow_docker_api_port | default(2375) | int }}"

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
