---
# Install or remove Docker CE. OS-aware and builtin-only: Debian/Ubuntu use apt and the docker-ce
# deb source the module declares (the playbook's artifact_sources wrote the apt sources and, with
# the Local Repository, Docker's insecure registry); RHEL family (Rocky/RHEL/Alibaba Cloud Linux)
# use dnf + the Docker CE yum repository. Idempotent: a converged host produces no changes. os_family branching mirrors the
# platform playbooks, so one software kind serves both image families under one Site.
#
# This role is the single source of the Docker CE install path so the standalone software deploy and
# every platform composition (today a Slurm deploy with Omnistat, decision 063) share one
# implementation.

- name: Install Docker CE (Debian family)
  when: docker_ce_state == 'present' and ansible_facts['os_family'] == 'Debian'
  become: true
  block:
    - name: Refuse a run without the Docker CE source
      ansible.builtin.fail:
        msg: >-
          [artifact_source_missing] The run's artifact sources have no {{ docker_ce_apt_source }} deb
          source, which the docker-ce module declares, so apt cannot install Docker CE. Start the
          Workflow again so swallow hands the run its Site's current sources.
      when: docker_ce_apt_source not in (swallow_artifacts.deb | map(attribute='name'))

    - name: Install Docker CE packages (apt)
      # An empty docker_ce_version installs the latest available; a pinned version applies the
      # "=<version>" apt selector to every package so a redeploy converges to that version.
      ansible.builtin.apt:
        name: >-
          {{ docker_ce_packages
             if (docker_ce_version | length == 0)
             else (docker_ce_packages | map('regex_replace', '$', '=' ~ docker_ce_version) | list) }}
        state: present
        update_cache: true
        lock_timeout: 300
      register: docker_ce_apt_install
      until: docker_ce_apt_install is succeeded
      retries: 60
      delay: 5

- name: Install Docker CE (RHEL family)
  when: docker_ce_state == 'present' and ansible_facts['os_family'] == 'RedHat'
  become: true
  block:
    - name: Ensure dnf config-manager is available
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present
      register: docker_ce_dnf_plugins
      until: docker_ce_dnf_plugins is succeeded
      retries: 60
      delay: 5

    - name: Register the Docker CE yum repository
      # The centos repo serves the RHEL-compatible packages Rocky/RHEL use; $releasever/$basearch
      # resolve to this host's major version and architecture so the right el<N> packages are pulled.
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg

    - name: Install Docker CE packages (dnf)
      # Version pinning is honoured for apt; on dnf the latest available in the repo is installed,
      # which is sufficient for the supported first-cut cases.
      ansible.builtin.dnf:
        name: "{{ docker_ce_packages }}"
        state: present
      register: docker_ce_dnf_install
      until: docker_ce_dnf_install is succeeded
      retries: 60
      delay: 5

# Replacing another Docker package (the docker.io that the host exporters install) rewrites
# docker.socket while it is listening. systemd then keeps the unit active without a socket until it
# is restarted, and dockerd, started with -H fd://, exits with "no sockets found via socket
# activation". The package's own start already failed against that socket and hit the units' start
# limit, so the failures are cleared before the socket restarts.
- name: Clear the Docker units' failures after a package change
  when: >-
    docker_ce_state == 'present' and
    ((docker_ce_apt_install is defined and docker_ce_apt_install is changed) or
     (docker_ce_dnf_install is defined and docker_ce_dnf_install is changed))
  become: true
  ansible.builtin.command: systemctl reset-failed docker.service docker.socket
  changed_when: false
  failed_when: false

- name: Restart the Docker socket after a package change
  when: >-
    docker_ce_state == 'present' and
    ((docker_ce_apt_install is defined and docker_ce_apt_install is changed) or
     (docker_ce_dnf_install is defined and docker_ce_dnf_install is changed))
  become: true
  ansible.builtin.systemd_service:
    name: docker.socket
    daemon_reload: true
    state: restarted

- name: Enable and start the Docker service
  when: docker_ce_state == 'present'
  become: true
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# The Server's default user is the account users use on this host, so granting it the docker
# group lets them run Docker without sudo. append keeps its other groups; the membership applies
# from the account's next login. Removal leaves the membership alone (the group may outlive the
# packages, and the account is not swallow's to edit beyond this grant).
- name: Add the Server's default user to the docker group
  when:
    - docker_ce_state == 'present'
    - docker_ce_group_user | length > 0
    - docker_ce_group_user != 'root'
  become: true
  ansible.builtin.user:
    name: "{{ docker_ce_group_user }}"
    groups: docker
    append: true

# Placed between the install and removal paths on purpose: on install the daemon is already running
# so a listener change restarts it, and on removal swallow's listener is gone before the packages are.
- name: Converge the Docker Engine API listener
  ansible.builtin.include_tasks: api.yml

- name: Remove Docker CE (Debian family)
  when: docker_ce_state == 'absent' and ansible_facts['os_family'] == 'Debian'
  become: true
  block:
    - name: Stop and disable the Docker service
      ansible.builtin.systemd_service:
        name: docker
        enabled: false
        state: stopped
      failed_when: false

    - name: Remove Docker CE packages (apt)
      ansible.builtin.apt:
        name: "{{ docker_ce_packages }}"
        state: absent
        purge: false
        lock_timeout: 300
      register: docker_ce_apt_remove
      until: docker_ce_apt_remove is succeeded
      retries: 60
      delay: 5

- name: Remove Docker CE (RHEL family)
  when: docker_ce_state == 'absent' and ansible_facts['os_family'] == 'RedHat'
  become: true
  block:
    - name: Stop and disable the Docker service
      ansible.builtin.systemd_service:
        name: docker
        enabled: false
        state: stopped
      failed_when: false

    - name: Remove Docker CE packages (dnf)
      ansible.builtin.dnf:
        name: "{{ docker_ce_packages }}"
        state: absent
      register: docker_ce_dnf_remove
      until: docker_ce_dnf_remove is succeeded
      retries: 60
      delay: 5
