---
# Remove libvirt (QEMU/KVM) that swallow installed as Managed Software, leaving the host OS intact
# (docs/development/software-deployment.md). A host that still defines virtual machines is refused
# before anything is removed; disk images under /var/lib/libvirt stay. Idempotent: a host without
# libvirt reruns with no changes. swallow marks the Software Assignment absent on success.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Uninstall libvirt
  hosts: all
  gather_facts: true
  roles:
    - role: libvirt
      vars:
        libvirt_state: absent

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
