---
# Remove the directory client that swallow installed as Managed Software: sshd stops asking SSSD for
# keys, the name service and sudo stop reading the Directory, and the packages are removed. Local
# accounts and the home directories Users left are kept. Idempotent: a host without it reruns with
# no changes. swallow marks the Software Assignment absent on success.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Uninstall the directory client
  hosts: all
  gather_facts: true
  roles:
    - role: sssd_client
      vars:
        sssd_client_state: absent

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
