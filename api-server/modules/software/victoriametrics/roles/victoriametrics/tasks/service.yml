---
# Run the pinned release under swallow's systemd unit as an unprivileged system user that can write
# only its data directory, and wait until it answers where it listens.

- name: Create the VictoriaMetrics system user
  ansible.builtin.user:
    name: "{{ victoriametrics_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: "{{ victoriametrics_data_dir }}"

- name: Keep swallow's shared data directory owned by root
  ansible.builtin.include_role:
    name: shared_data_dir

- name: Create the VictoriaMetrics data directory
  ansible.builtin.file:
    path: "{{ victoriametrics_data_dir }}"
    state: directory
    owner: "{{ victoriametrics_user }}"
    group: "{{ victoriametrics_user }}"
    mode: "0750"

- name: Render the VictoriaMetrics systemd unit
  ansible.builtin.template:
    src: swallow-victoriametrics.service.j2
    dest: "/etc/systemd/system/{{ victoriametrics_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: victoriametrics_unit_file

- name: Enable and start VictoriaMetrics
  # A changed unit (release, listen address, or retention) or a replaced binary takes effect only
  # on a restart.
  ansible.builtin.systemd_service:
    name: "{{ victoriametrics_unit }}"
    state: >-
      {{ 'restarted' if (victoriametrics_unit_file is changed or victoriametrics_release_changed | bool) else 'started' }}
    enabled: true
    daemon_reload: "{{ victoriametrics_unit_file is changed }}"

- name: Wait for VictoriaMetrics to answer
  ansible.builtin.uri:
    url: "http://{{ victoriametrics_listen_address }}:{{ victoriametrics_port }}/health"
    status_code: 200
  register: victoriametrics_health
  until: victoriametrics_health.status == 200
  retries: 30
  delay: 2
