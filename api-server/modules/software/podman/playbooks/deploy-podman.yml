---
# Install Podman on already-provisioned Servers as a standalone Managed Software
# (docs/development/software-deployment.md). The deploy target is one software (Podman), not a
# platform. Idempotent: a converged host reruns with no changes. An optional pinned version
# arrives as swallow_podman_version. The package comes from the distribution's archive, directly or
# through the Site's Local Repository (swallow_artifacts); with the Local Repository, the installed
# Podman may pull from its registry.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Point every target at the run's artifact sources
  hosts: all
  gather_facts: false
  roles:
    - role: artifact_sources
      vars:
        artifact_sources_podman: true

- name: Install Podman
  hosts: all
  gather_facts: true
  vars:
    podman_version: "{{ swallow_podman_version | default('', true) }}"
  roles:
    - role: podman

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
