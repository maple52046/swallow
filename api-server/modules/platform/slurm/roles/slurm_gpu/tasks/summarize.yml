---
# What the controller's slurm.conf and gres.conf read about a compute node's GPUs, from slurm_gpus
# (the detected GPUs) and slurm_gpu_health.model_features (the GPU models AMD SMI names on the node)
# with the deployment's trusted variables. It reads nothing from the host, so a reconfigure derives
# the same values from the GPUs slurm_node_hardware recorded as a detection would.

- name: Name this node's GPU GRES type
  # The type is derived from the GPU architecture unless the deployment names one type for every
  # GPU node (swallow_slurm_gpu_gres_type, for example mi308x_vf).
  ansible.builtin.set_fact:
    slurm_gpus: "{{ slurm_gpus | map('combine', {'type': swallow_slurm_gpu_gres_type}) | list }}"
  when: (swallow_slurm_gpu_gres_type | default('')) | length > 0

- name: Summarize this node's GPU GRES for slurm.conf
  # For example gpu:gfx942:8; a node with several GPU models lists one entry per gfx target.
  ansible.builtin.set_fact:
    slurm_node_gres: >-
      {%- set entries = [] -%}
      {%- for type in slurm_gpus | map(attribute='type') | unique -%}
      {%- set _ = entries.append('gpu:' ~ type ~ ':' ~ (slurm_gpus | selectattr('type', 'equalto', type) | list | length)) -%}
      {%- endfor -%}
      {{ entries | join(',') }}
    # The request a job makes for every GPU of this node: typed when the node has one GPU type.
    slurm_node_gres_full: >-
      {{ ('gpu:' ~ (slurm_gpus | map(attribute='type') | first) ~ ':' ~ (slurm_gpus | length))
         if (slurm_gpus | map(attribute='type') | unique | list | length) == 1
         else ('gpu:' ~ (slurm_gpus | length)) }}

- name: Mark a node that has fewer GPUs than its group expects
  # The node still joins with the GPUs it has; gpu_degraded and a high Weight make the scheduler
  # use it last, and the deployment reports it without failing (decision 083).
  ansible.builtin.set_fact:
    slurm_node_degraded: >-
      {{ (swallow_slurm_expected_gpus | default({}))[inventory_hostname] | default(0) | int > 0
         and (slurm_gpus | length) < ((swallow_slurm_expected_gpus | default({}))[inventory_hostname] | int) }}

- name: Report a degraded node
  ansible.builtin.debug:
    msg: >-
      [gpu_degraded] {{ slurm_node_name }} has {{ slurm_gpus | length }} of the
      {{ (swallow_slurm_expected_gpus | default({}))[inventory_hostname] }} GPUs its node group expects; it is marked
      {{ swallow_slurm_degraded_feature | default('gpu_degraded') }} and scheduled last.
  when: slurm_node_degraded | bool

- name: Name this node's Slurm Features
  # The node group's features (GPU model, group name) and the gfx targets KFD reports, so a job can
  # ask for a kind of node with --constraint.
  ansible.builtin.set_fact:
    # The node's features: what the module made of its group and GPU Inventory, the GPU models AMD SMI
    # names on the node itself (a virtual function's inventory often has no model), its GPU types
    # (gfx targets), and gpu_degraded when it has fewer GPUs than its group expects.
    slurm_node_features: >-
      {{ (((swallow_slurm_node_features | default({}))[inventory_hostname] | default([]))
         + (slurm_gpu_health.model_features | default([]))
         + (slurm_gpus | map(attribute='type') | list)
         + ([swallow_slurm_degraded_feature | default('gpu_degraded')] if slurm_node_degraded | bool else [])) | unique | list }}
    slurm_node_weight: "{{ (swallow_slurm_degraded_weight | default(100)) if slurm_node_degraded | bool else '' }}"
