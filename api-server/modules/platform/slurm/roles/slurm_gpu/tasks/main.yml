---
# Prepare a compute node's GPUs for Slurm GRES and record them as facts the controller's
# slurm.conf and gres.conf read (decision 063):
#   slurm_is_gpu_compute  whether swallow selected this node as a GPU node
#   slurm_gpus            [{minor, type}] from the KFD topology, sorted by render minor
#   slurm_node_gres       the slurm.conf Gres= value, for example gpu:gfx942:8 ('' without GPUs)
#   slurm_node_gres_full  the GRES request for every GPU of the node, for example gpu:gfx942:8
# Every GPU of a GPU node must pass the HIP probe (role gpu_probe) before it joins the cluster.
# A GPU node loads amdgpu through the shared post-boot loader (the image may keep the driver out of
# the boot path) with slurmd ordered after it; a CPU node stops loading it, so a rerun converges
# both ways.

- name: Resolve whether this compute node schedules AMD GPUs
  ansible.builtin.set_fact:
    slurm_is_gpu_compute: "{{ inventory_hostname in (swallow_slurm_gpu_compute_ids | default([])) }}"

- name: Open the GPU device nodes to job users, Slurm's device cgroup being the boundary
  ansible.builtin.copy:
    dest: "{{ slurm_gpu_udev_rule }}"
    content: |
      # Managed by Swallow (Slurm GPU GRES, decision 063). Slurm's device cgroup
      # (ConstrainDevices=yes) admits a job only to the GPUs allocated to it, so every job user
      # may open the GPU device nodes.
      KERNEL=="kfd", MODE="0666"
      SUBSYSTEM=="drm", KERNEL=="renderD*", MODE="0666"
    owner: root
    group: root
    mode: "0644"
  register: slurm_gpu_rule_installed
  when: slurm_is_gpu_compute | bool

- name: Remove the GPU device rule from a CPU compute node
  ansible.builtin.file:
    path: "{{ slurm_gpu_udev_rule }}"
    state: absent
  register: slurm_gpu_rule_removed
  when: not (slurm_is_gpu_compute | bool)

- name: Reload the udev rules
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  when: slurm_gpu_rule_installed is changed or slurm_gpu_rule_removed is changed

- name: Load amdgpu on a GPU compute node, or stop loading it on a CPU one
  ansible.builtin.include_role:
    name: amdgpu_loader
    apply:
      become: true
  vars:
    amdgpu_loader_state: "{{ 'present' if slurm_is_gpu_compute | bool else 'absent' }}"
    amdgpu_loader_dependents:
      - slurmd
    amdgpu_loader_owner: Slurm GPU GRES

- name: Apply the GPU device rule to devices that already exist
  # A driver loaded before the rule existed created its nodes with the default mode.
  ansible.builtin.command:
    cmd: udevadm trigger --action=change --subsystem-match=drm --subsystem-match=kfd
  when: slurm_gpu_rule_installed is changed or slurm_gpu_rule_removed is changed

- name: Read the GPUs from the KFD topology
  # One KFD node per logical GPU (an XCP partition is its own logical GPU); CPU nodes have no
  # gfx target. drm_render_minor is the render node HIP uses, so counting /dev/dri/renderD*
  # would be wrong. The type is the gfx target (90402 -> gfx942). KFD fills the topology a
  # moment after /dev/kfd appears, so the script waits briefly for a stable GPU list.
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import glob, json, time
        def read():
            gpus = []
            for path in glob.glob('/sys/class/kfd/kfd/topology/nodes/*/properties'):
                props = {}
                with open(path) as handle:
                    for line in handle:
                        parts = line.split()
                        if len(parts) == 2:
                            props[parts[0]] = parts[1]
                version = int(props.get('gfx_target_version', '0'))
                minor = int(props.get('drm_render_minor', '0'))
                if version > 0 and minor > 0:
                    name = 'gfx%d%d%x' % (version // 10000, version // 100 % 100, version % 100)
                    gpus.append({'minor': minor, 'type': name})
            return sorted(gpus, key=lambda gpu: gpu['minor'])
        previous = None
        for _ in range(15):
            current = read()
            if current and current == previous:
                break
            previous = current
            time.sleep(2)
        print(json.dumps(previous or []))
  register: slurm_kfd_gpus
  changed_when: false
  when: slurm_is_gpu_compute | bool

- name: Remember this node's GPUs
  ansible.builtin.set_fact:
    slurm_gpus: "{{ (slurm_kfd_gpus.stdout | from_json) if slurm_is_gpu_compute | bool else [] }}"

- name: Name this node's GPU GRES type
  # The type is derived from the GPU architecture unless the deployment names one type for every
  # GPU node (swallow_slurm_gpu_gres_type, for example mi308x_vf).
  ansible.builtin.set_fact:
    slurm_gpus: "{{ slurm_gpus | map('combine', {'type': swallow_slurm_gpu_gres_type}) | list }}"
  when: (swallow_slurm_gpu_gres_type | default('')) | length > 0

- name: Refuse a GPU compute node whose KFD topology shows no GPU
  ansible.builtin.fail:
    msg: >-
      [slurm_gpu_missing] {{ slurm_node_name }} has AMD compute GPUs in its inventory but
      its KFD topology lists none after loading amdgpu, so Slurm cannot schedule them. Check
      "dmesg | grep amdgpu" and the module options in /etc/modprobe.d on the node.
  when:
    - slurm_is_gpu_compute | bool
    - slurm_gpus | length == 0

- name: Summarize this node's GPU GRES for slurm.conf
  # For example gpu:gfx942:8; a node with several GPU models lists one entry per gfx target.
  ansible.builtin.set_fact:
    slurm_node_gres: >-
      {%- set entries = [] -%}
      {%- for type in slurm_gpus | map(attribute='type') | unique -%}
      {%- set _ = entries.append('gpu:' ~ type ~ ':' ~ (slurm_gpus | selectattr('type', 'equalto', type) | list | length)) -%}
      {%- endfor -%}
      {{ entries | join(',') }}
    # The request a job makes for every GPU of this node: typed when the node has one GPU type.
    slurm_node_gres_full: >-
      {{ ('gpu:' ~ (slurm_gpus | map(attribute='type') | first) ~ ':' ~ (slurm_gpus | length))
         if (slurm_gpus | map(attribute='type') | unique | list | length) == 1
         else ('gpu:' ~ (slurm_gpus | length)) }}

- name: Check the GPUs' health through AMD SMI
  # The hard gate needs only the amdgpu driver and the AMD SMI library the image ships with it
  # (decision 083): the device list, uncorrectable ECC errors, and readable firmware. A query the device
  # does not support (a virtual function hides ECC and firmware) is recorded as unsupported, not
  # as a failure.
  ansible.builtin.script:
    cmd: amd_smi_health.py --kfd-gpus {{ slurm_gpus | length }}
    executable: /usr/bin/python3
  register: slurm_gpu_health_run
  changed_when: false
  failed_when: false
  when: slurm_is_gpu_compute | bool

- name: Read the AMD SMI health report
  ansible.builtin.set_fact:
    slurm_gpu_health: >-
      {{ (slurm_gpu_health_run.stdout_lines | last | from_json)
         if (slurm_gpu_health_run.stdout_lines | default([]) | length > 0 and (slurm_gpu_health_run.stdout_lines | last).startswith('{'))
         else {'available': false, 'healthy': false, 'error': slurm_gpu_health_run.stderr | default('the health check printed no report')} }}
  when: slurm_is_gpu_compute | bool

- name: Refuse a GPU node without AMD SMI
  ansible.builtin.fail:
    msg: >-
      [amd_smi_missing] {{ slurm_node_name }}: amd-smi is not installed or cannot load its library
      ({{ slurm_gpu_health.error | default('') }}). The image must ship AMD SMI with the amdgpu driver.
  when: slurm_is_gpu_compute | bool and not (slurm_gpu_health.available | default(false) | bool)

- name: Refuse a GPU node whose GPUs AMD SMI reports unhealthy
  ansible.builtin.fail:
    msg: >-
      [amd_smi_unhealthy] {{ slurm_node_name }}: {{ slurm_gpu_health.problems | default([]) | join('; ') }}
  when: slurm_is_gpu_compute | bool and not (slurm_gpu_health.healthy | default(false) | bool)

- name: Report what AMD SMI could not check
  ansible.builtin.debug:
    msg: "{{ slurm_node_name }}: AMD SMI {{ slurm_gpu_health.devices | default(0) }} devices; not supported here: {{ slurm_gpu_health.unsupported | default([]) | join(', ') or 'nothing' }}; notes: {{ slurm_gpu_health.notes | default([]) | join('; ') or 'none' }}"
  when: slurm_is_gpu_compute | bool

- name: Record whether the host HIP runtime can use the GPUs
  # Workloads run in containers that bring their own ROCm, so the host's HIP is only a record
  # (decision 083): a host ROCm built for other gfx targets must not fail the node. The result is kept
  # on the node and reported, never drained or failed on.
  ansible.builtin.include_role:
    name: gpu_probe
    apply:
      become: true
  vars:
    gpu_probe_expect: "{{ slurm_gpus | length }}"
    gpu_probe_fail: false
    gpu_probe_node_name: "{{ slurm_node_name }}"
  when: slurm_is_gpu_compute | bool

- name: Keep the shared data directory root-owned
  ansible.builtin.include_role:
    name: shared_data_dir
  when: slurm_is_gpu_compute | bool

- name: Create the directory for the GPU records
  ansible.builtin.file:
    path: "{{ slurm_gpu_hip_probe_record | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: slurm_is_gpu_compute | bool

- name: Keep the host HIP probe's result on the node
  ansible.builtin.copy:
    dest: "{{ slurm_gpu_hip_probe_record }}"
    content: "{{ {'ok': gpu_probe_ok | default(false) | bool, 'report': gpu_probe_report | default({})} | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  when: slurm_is_gpu_compute | bool

- name: Report a host HIP runtime that cannot use the GPUs
  ansible.builtin.debug:
    msg: >-
      [gpu_probe_recorded] {{ slurm_node_name }}: the host HIP probe did not pass
      ({{ gpu_probe_report.error | default('see ' ~ slurm_gpu_hip_probe_record) }}); containers bring their own
      ROCm, so the node joins anyway.
  when: slurm_is_gpu_compute | bool and not (gpu_probe_ok | default(true)) | bool

- name: Mark a node that has fewer GPUs than its group expects
  # The node still joins with the GPUs it has; gpu_degraded and a high Weight make the scheduler
  # use it last, and the deployment reports it without failing (decision 083).
  ansible.builtin.set_fact:
    slurm_node_degraded: >-
      {{ (swallow_slurm_expected_gpus | default({}))[inventory_hostname] | default(0) | int > 0
         and (slurm_gpus | length) < ((swallow_slurm_expected_gpus | default({}))[inventory_hostname] | int) }}

- name: Report a degraded node
  ansible.builtin.debug:
    msg: >-
      [gpu_degraded] {{ slurm_node_name }} has {{ slurm_gpus | length }} of the
      {{ (swallow_slurm_expected_gpus | default({}))[inventory_hostname] }} GPUs its node group expects; it is marked
      {{ swallow_slurm_degraded_feature | default('gpu_degraded') }} and scheduled last.
  when: slurm_node_degraded | bool

- name: Name this node's Slurm Features
  # The node group's features (GPU model, group name) and the gfx targets KFD reports, so a job can
  # ask for a kind of node with --constraint.
  ansible.builtin.set_fact:
    slurm_node_features: >-
      {{ ((swallow_slurm_node_features | default({}))[inventory_hostname] | default([]))
         + (slurm_gpus | map(attribute='type') | unique | list)
         + ([swallow_slurm_degraded_feature | default('gpu_degraded')] if slurm_node_degraded | bool else []) }}
    slurm_node_weight: "{{ (swallow_slurm_degraded_weight | default(100)) if slurm_node_degraded | bool else '' }}"
