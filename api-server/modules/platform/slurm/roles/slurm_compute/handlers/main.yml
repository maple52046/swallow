---
- name: Restart slurmd
  # Notified when the configless conf-server list changes so slurmd re-fetches configuration
  # from the current controllers. Retried like the slurmctld restart: a concurrent
  # unattended-upgrades run can briefly reset systemd's D-Bus connection on a fresh image.
  ansible.builtin.systemd:
    name: slurmd
    state: restarted
    daemon_reload: true
  become: true
  register: slurm_compute_restart
  until: slurm_compute_restart is succeeded
  retries: 5
  delay: 6
