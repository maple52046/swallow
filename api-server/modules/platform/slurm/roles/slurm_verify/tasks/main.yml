---
# Verify the cluster formed: the controller answers and every compute node registered in a
# schedulable state. Whether it works (a step on every node, shared nodes, OCI containers, MPI with
# PMIx, GPU GRES) is the slurm-acceptance Validation Suite, which every Slurm deployment composes
# as its gate after this playbook (docs/development/validation.md §5).

- name: Confirm the controller is up
  ansible.builtin.command:
    cmd: scontrol ping
  become: true
  register: slurm_verify_ping
  until: slurm_verify_ping.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Wait for every compute node to register in a schedulable state
  ansible.builtin.command:
    cmd: sinfo --noheader --Node --format=%T
  become: true
  register: slurm_verify_sinfo
  until:
    - slurm_verify_sinfo.rc == 0
    - slurm_verify_sinfo.stdout_lines | length >= (swallow_slurm_compute_ids | length)
    - slurm_verify_sinfo.stdout_lines | reject('match', '^(idle|mixed|allocated)') | list | length == 0
  retries: 24
  delay: 5
  changed_when: false
