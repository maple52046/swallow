---
# Omnistat system-mode exporter on a Slurm compute node (decision 063). Intent arrives as trusted
# swallow_omnistat_* vars from the Slurm deployment; nothing here is a user choice.
omnistat_version: "{{ swallow_omnistat_version | default('1.15.0', true) }}"
# Pinned upstream source per version: the GitHub tag archive's declared path (its key in
# swallow_artifacts.files) and its SHA-256 (the slurm module declares the same file artifact, which
# a content test keeps in step), the patches swallow maintains for it (decision 064: each is
# checked and applied on its own, so a patch added later reaches a node that already carries the
# earlier ones), and the hash lock of its environment. uv installs the lock from the index the
# host's configuration names (artifact_sources: the Local Repository's, or PyPI from the upstreams).
omnistat_sources:
  "1.15.0":
    path: omnistat/v1.15.0.tar.gz
    sha256: 899c681179b8dfe5b3ccebde360c7a39ef2fe13cd0fdebb34d088963ad32f96f
    patches:
      - omnistat-1.15.0-sriov-vf.patch
      - omnistat-1.15.0-query-step.patch
    requirements: omnistat-1.15.0-requirements.txt
# The layout is also the contract with OS images that bring Omnistat (decision 080): an environment
# at <home>/<version>/venv that the probe accepts is used as it is, and another version's tree is
# left in place while current moves to this one.
omnistat_home: /opt/omnistat
omnistat_prefix: "{{ omnistat_home }}/{{ omnistat_version }}"
omnistat_src: "{{ omnistat_prefix }}/src"
omnistat_venv: "{{ omnistat_prefix }}/venv"
# The Slurm Prolog calls omnistat-rms-env through this version-independent link.
omnistat_current_link: "{{ omnistat_home }}/current"
omnistat_config_dir: /etc/omnistat
omnistat_config: "{{ omnistat_config_dir }}/omnistat.conf"
omnistat_user: omnistat
omnistat_port: "{{ swallow_omnistat_port | default(8001) | int }}"
omnistat_rocm_path: /opt/rocm
# The node-wide job file the Slurm Prolog writes and the Epilog removes.
omnistat_job_file: /tmp/omni_rmsjobinfo
omnistat_system_name: "{{ swallow_omnistat_system_name | default('slurm', true) }}"
# The Site Prometheus scrapes the exporter from these addresses (as this node sees them); with the
# node itself they are the only addresses the exporter answers.
omnistat_scrape_addresses: "{{ swallow_omnistat_scrape_addresses | default([]) }}"
# The observability Server (the primary controller) hosts the Platform's Grafana, whose read-only
# datasource proxy omnistat-query reads the Site Prometheus through.
omnistat_observability_id: "{{ swallow_omnistat_observability_id }}"
omnistat_observability_address: "{{ hostvars[omnistat_observability_id].ansible_host }}"
omnistat_grafana_port: "{{ swallow_omnistat_grafana_port | default(3000) | int }}"
# The UID of that Grafana's datasource (grafana_provisioning_datasource_uid in the shared
# grafana_provisioning role).
omnistat_grafana_datasource_uid: prometheus
# A GPU compute node collects through AMD SMI and starts after the shared amdgpu loader.
omnistat_gpu: "{{ inventory_hostname in (swallow_slurm_gpu_compute_ids | default([])) }}"
omnistat_amdgpu_unit: swallow-amdgpu-load.service

# Hardware counters (decision 063): the deployment asks for them; a node collects them only when
# its own checks and an isolated probe pass (tasks/hardware_counters.yml), and otherwise reports why
# not and keeps its exporter without them. The counters and the profile name Omnistat samples.
omnistat_hardware_counters: "{{ swallow_omnistat_hardware_counters | default(false) | bool }}"
omnistat_counters: [VALUBusy]
omnistat_counter_profile: valubusy
# The ROCProfiler-SDK extension swallow's release builds once per ROCm minor (decision 079), by
# Omnistat version and ROCm minor: its declared path (its key in swallow_artifacts.files) and SHA-256
# (the slurm module declares the same file artifact, which a content test keeps in step), the
# ROCProfiler-SDK it was built against, and the glibc of its builder, the oldest a node may have.
omnistat_rocprof_extensions:
  "1.15.0":
    "10.0":
      path: omnistat-rocprof/1.15.0-r1/omnistat-rocprof-1.15.0-rocm10.0-cp312-x86_64.tar.gz
      sha256: 119054096941f964e6661619e5b176775ff9a11dd13760f91f0950c0d6819e3b
      rocprofiler_sdk: "1.3.5"
      builder_glibc: "2.28"
    "10.1":
      path: omnistat-rocprof/1.15.0-r1/omnistat-rocprof-1.15.0-rocm10.1-cp312-x86_64.tar.gz
      sha256: 345195f43ef6397fa0c9dc88678bfb501cc5b012377d18dca0fb04f811a9fc7d
      rocprofiler_sdk: "1.4.1"
      builder_glibc: "2.28"
# The module the omnistat package loads, as every asset carries it.
omnistat_rocprof_module: rocprofiler_sdk_extension.cpython-312-x86_64-linux-gnu.so
# An OS image may bring the extension in <root>/<omnistat version>/rocm<X.Y>/ (decision 080); it is
# copied from there instead of downloaded. A downloaded asset is unpacked under the version's prefix.
omnistat_rocprof_prebaked_root: /opt/swallow/omnistat-rocprof
omnistat_rocprof_home: "{{ omnistat_prefix }}/rocprof"
# Names the extension swallow copied into the omnistat package, so turning the counters off removes
# that one and leaves an extension the environment came with.
omnistat_rocprof_marker: "{{ omnistat_rocprof_home }}/installed"
omnistat_rocprof_download_retries: 3
# The probe runs as the exporter will (its user and groups, CAP_PERFMON, the unit's library path),
# in its own process with a deadline, because a failing counter can end or abort the process.
omnistat_counter_probe: ["{{ omnistat_venv }}/bin/python", "{{ omnistat_prefix }}/omnistat-counter-probe.py"]
omnistat_counter_probe_runner:
  - setpriv
  - "--reuid={{ omnistat_user }}"
  - "--regid={{ omnistat_user }}"
  - --init-groups
  - --inh-caps=+perfmon
  - --ambient-caps=+perfmon
  - --
omnistat_counter_probe_timeout: 120
# The exporter's capability drop-in, present only while the node collects the counters.
omnistat_perfmon_dropin: /etc/systemd/system/omnistat.service.d/10-swallow-perfmon.conf
