---
# Install the Omnistat system-mode exporter on a compute node: a versioned environment, a dedicated
# user, the configuration, and a systemd service. The environment converges probe-first
# (converge.yml): one that already is the expected Omnistat, whether a previous run or the OS image
# built it, is used as it is. A converged node reruns with no changes; a rebuilt environment or a
# changed configuration restarts the exporter.

- name: Converge the Omnistat environment
  ansible.builtin.include_tasks: converge.yml

- name: Create the Omnistat group
  ansible.builtin.group:
    name: "{{ omnistat_user }}"
    system: true

- name: Create the Omnistat service user
  # render and video grant the GPU device nodes AMD SMI opens.
  ansible.builtin.user:
    name: "{{ omnistat_user }}"
    group: "{{ omnistat_user }}"
    groups: [render, video]
    append: true
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: Create the Omnistat configuration directory
  ansible.builtin.file:
    path: "{{ omnistat_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the Omnistat configuration
  ansible.builtin.template:
    src: omnistat.conf.j2
    dest: "{{ omnistat_config }}"
    owner: root
    group: root
    mode: "0644"
  register: omnistat_config_file

- name: Install the Omnistat service
  ansible.builtin.template:
    src: omnistat.service.j2
    dest: /etc/systemd/system/omnistat.service
    owner: root
    group: root
    mode: "0644"
  register: omnistat_unit

- name: Enable and start the Omnistat exporter
  ansible.builtin.systemd:
    name: omnistat
    enabled: true
    state: started
    daemon_reload: true
  register: omnistat_started

- name: Restart the exporter after a rebuilt environment, configuration, or unit
  ansible.builtin.systemd:
    name: omnistat
    state: restarted
    daemon_reload: true
  when:
    - omnistat_started is not changed
    - omnistat_environment_rebuilt | bool or omnistat_config_file is changed or omnistat_unit is changed

- name: Wait for the exporter to serve metrics
  # A GPU node must report its GPU count; every node reports the job-attribution series.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ omnistat_port }}/metrics"
    return_content: true
  register: omnistat_metrics
  until:
    - omnistat_metrics.status == 200
    - "'rmsjob_info' in omnistat_metrics.content"
    - not (omnistat_gpu | bool) or 'rocm_num_gpus' in omnistat_metrics.content
  retries: 30
  delay: 4
