---
- name: Restart munge
  # Restart when the shared key changed so the running daemon uses the new key before Slurm
  # daemons authenticate with it. Retried like the slurmctld restart: a concurrent package
  # upgrade can briefly reset systemd's D-Bus connection.
  ansible.builtin.systemd:
    name: munge
    state: restarted
  become: true
  register: slurm_munge_restart
  until: slurm_munge_restart is succeeded
  retries: 5
  delay: 6
