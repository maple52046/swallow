---
- name: Restart slurmctld
  # Notified by slurm_config when slurm.conf, cgroup.conf, gres.conf, or the JWT key changed, so
  # the controller picks up the new configuration. Defined here but shared across the controller
  # play's roles, since handlers are play-wide. A package upgrade that restarts polkit or D-Bus
  # (the deploy holds the OS's own maintenance, but not a user's) briefly resets systemd's
  # D-Bus connection, so a transient restart failure is retried instead of failing the deployment.
  ansible.builtin.systemd:
    name: slurmctld
    state: restarted
    daemon_reload: true
  become: true
  register: slurm_controller_restart
  until: slurm_controller_restart is succeeded
  retries: 5
  delay: 6

- name: Apply the Slurm configuration
  # Notified by slurm_config when slurm.conf or gres.conf changed. A running slurmctld re-reads
  # them with scontrol reconfigure, which in Slurm 23.11 and later also makes every slurmd
  # re-read the configless configuration, so a node added to or removed from the cluster restarts
  # nothing by hand (decision 083); a controller that is not running yet, or a deployment that turns
  # slurm_reconfigure_in_place off, restarts it instead.
  ansible.builtin.shell:
    cmd: >-
      if [ "{{ slurm_reconfigure_in_place | default(true) | bool | lower }}" = "true" ] &&
      systemctl is-active --quiet slurmctld; then scontrol reconfigure; else systemctl restart slurmctld; fi
    executable: /bin/bash
  become: true
  register: slurm_controller_apply
  until: slurm_controller_apply is succeeded
  retries: 5
  delay: 6
