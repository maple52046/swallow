---
# Make the GPU probe image available under its declared name on this node (decision 083), pulling it only
# when the node does not have it yet. The commands are spelled out per runtime, so they say what
# they run.

- name: Check whether the GPU probe image is on the node
  ansible.builtin.command:
    cmd: "{{ slurm_gpu_probe_cli }} image inspect {{ slurm_gpu_probe_image }}"
  register: slurm_gpu_probe_present
  changed_when: false
  failed_when: false
  become: true

- name: Pull the GPU probe image with Docker
  ansible.builtin.command:
    cmd: docker pull {{ slurm_gpu_probe_pull }}
  register: slurm_gpu_probe_docker_pull
  until: slurm_gpu_probe_docker_pull is succeeded
  retries: 3
  delay: 10
  failed_when: false
  become: true
  when: slurm_gpu_probe_present.rc != 0 and slurm_gpu_probe_cli == 'docker'

- name: Pull the GPU probe image with Podman
  ansible.builtin.command:
    cmd: podman pull {{ slurm_gpu_probe_pull }}
  register: slurm_gpu_probe_podman_pull
  until: slurm_gpu_probe_podman_pull is succeeded
  retries: 3
  delay: 10
  failed_when: false
  become: true
  when: slurm_gpu_probe_present.rc != 0 and slurm_gpu_probe_cli == 'podman'

- name: Refuse a node the GPU probe image cannot reach
  vars:
    slurm_gpu_probe_pulled: "{{ slurm_gpu_probe_docker_pull if slurm_gpu_probe_cli == 'docker' else slurm_gpu_probe_podman_pull }}"
  ansible.builtin.fail:
    msg: >-
      [gpu_probe_image_unavailable] {{ inventory_hostname }}: {{ slurm_gpu_probe_pull }} could not be pulled
      ({{ slurm_gpu_probe_pulled.stderr | default('') | trim }}).
  when: slurm_gpu_probe_present.rc != 0 and slurm_gpu_probe_pulled.rc | default(1) != 0

- name: Name the pulled image as the module declares it
  ansible.builtin.command:
    cmd: "{{ slurm_gpu_probe_cli }} tag {{ slurm_gpu_probe_pull }} {{ slurm_gpu_probe_image }}"
  become: true
  changed_when: true
  when: slurm_gpu_probe_present.rc != 0 and slurm_gpu_probe_pull != slurm_gpu_probe_image
