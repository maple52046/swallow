---
# Drain the nodes that leave a Slurm Platform before it is reconfigured without them (the scale-in
# of decision 083). The inventory is the leaving nodes and the primary controller; the leaving nodes only
# report their hostname (the Slurm node name), and the primary drains them and waits, bounded by
# each node's drainTimeoutSeconds, until no job runs on them. A node whose removal forces it has
# its jobs canceled at the timeout; one that does not fails the run with [slurm_drain_timeout] and
# stays drained, so retrying the Task waits again. Running it again on drained nodes is a no-op.

- name: Read the Slurm node name of every leaving node
  hosts: all
  gather_facts: true
  tasks:
    - name: Remember this host's Slurm node name
      # Slurm names a node by its hostname (see deploy-slurm).
      ansible.builtin.set_fact:
        slurm_node_name: "{{ ansible_hostname }}"

- name: Drain the leaving nodes and wait for their jobs
  hosts: all
  gather_facts: false
  tasks:
    - name: Run only on the primary controller
      ansible.builtin.meta: end_host
      when: inventory_hostname != swallow_slurm_primary_controller_id

    - name: Drain the leaving nodes
      ansible.builtin.include_role:
        name: slurm_drain
