---
# Remove the Slurm configuration and daemons swallow deployed while preserving the host OS and
# the image-supplied slurm-smd packages. Every node runs the same cleanup a node leaving its
# Platform runs (role slurm_node_cleanup), so the playbook is safe to rerun and runs uniformly on
# every target regardless of the daemon roles it had.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Uninstall Slurm from the original deployment targets
  hosts: all
  gather_facts: false
  become: true
  roles:
    - role: slurm_node_cleanup

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
