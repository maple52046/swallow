---
# Pull the GPU probe image onto the GPU compute nodes a Slurm deployment validates, before its
# gate runs the container GPU checks (decision 083). The image carries its own ROCm with a HIP probe
# built for every Instinct gfx target, so a node needs only the amdgpu driver and its container
# runtime. Intent arrives only through trusted variables:
#   swallow_slurm_gpu_probe_image    the image as the Slurm module declares it
#   swallow_slurm_gpu_probe_runtime  docker-ce or podman (installed by the deployment before this)
#   swallow_artifacts                where the image comes from
# The image is tagged with its declared name, so the gate runs it without pulling. Idempotent.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Point every target at the run's artifact sources
  hosts: all
  gather_facts: false
  roles:
    - role: artifact_sources
      vars:
        artifact_sources_docker: "{{ swallow_slurm_gpu_probe_runtime | default('docker-ce') == 'docker-ce' }}"
        artifact_sources_podman: "{{ swallow_slurm_gpu_probe_runtime | default('docker-ce') == 'podman' }}"

- name: Pull the GPU probe image
  hosts: all
  gather_facts: false
  roles:
    - role: slurm_gpu_probe_image

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
