---
# Install Omnistat on a swallow-deployed Slurm Platform (decision 063). It runs as the last Job of
# a configure-slurm Workflow, after deploy-slurm (which renders the Slurm side: Prolog/Epilog,
# PrologFlags=Alloc, exclusive partition) and after the Platform's Grafana, when it has one, was
# composed onto the primary controller. Topology arrives only through trusted variables:
#   swallow_omnistat_version          pinned Omnistat release
#   swallow_omnistat_port             exporter port on every compute node
#   swallow_omnistat_compute_ids      compute nodes (serverIds) that run the exporter
#   swallow_omnistat_scrape_addresses addresses the Site Prometheus scrapes from; with the node
#                                     itself, the only ones the exporter answers
#   swallow_omnistat_observability_id primary controller, whose Grafana omnistat-query reads
#   swallow_omnistat_grafana_port     that Grafana's port
#   swallow_omnistat_system_name      label for omnistat-query reports
#   swallow_slurm_gpu_compute_ids     compute nodes with AMD GPUs (AMD SMI collection)
# The Site Prometheus scrapes the exporters, so each compute node proves only that its own exporter
# answers on the loopback address. On success it writes {grafanaUrl} to the run's result file.
# Idempotent.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Classify the Omnistat hosts
  hosts: all
  gather_facts: true
  tasks:
    - name: Group the exporter hosts
      ansible.builtin.group_by:
        key: "omnistat_{{ 'exporter' if inventory_hostname in swallow_omnistat_compute_ids else 'other' }}"

    - name: Group the observability host
      ansible.builtin.group_by:
        key: "omnistat_{{ 'observability' if inventory_hostname == swallow_omnistat_observability_id else 'member' }}"

- name: Install the Omnistat exporter on every compute node
  # The role ends by waiting until the node's own exporter serves metrics on 127.0.0.1.
  hosts: omnistat_exporter
  gather_facts: false
  become: true
  roles:
    - role: omnistat

- name: Record the Grafana URL
  hosts: omnistat_observability
  gather_facts: false
  vars:
    omnistat_grafana_url: "http://{{ ansible_host }}:{{ swallow_omnistat_grafana_port | default(3000) }}"
  tasks:
    - name: Write the Omnistat result for Swallow
      ansible.builtin.copy:
        dest: "{{ swallow_result_path }}"
        content: "{{ {'grafanaUrl': omnistat_grafana_url} | to_json }}"
        mode: "0600"
      delegate_to: localhost
      when: swallow_result_path is defined and swallow_result_path | length > 0

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
