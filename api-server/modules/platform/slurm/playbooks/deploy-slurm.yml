---
# Deploy Slurm onto already-provisioned Servers. Topology is supplied only through trusted
# variables (see docs/development/platform-deployment.md): per-daemon controller/compute id
# lists, an ordered controller list whose first entry is the primary, plus optional HA state
# directory and slurmrestd API version. The Slurm packages are expected to be present from the
# operator's image (SchedMD slurm-smd), so this playbook only configures and starts the
# cluster and returns a slurmrestd reader credential. It is idempotent: a converged cluster
# reruns with no changes.
#
# Addresses, not DNS: every host is keyed by serverId (inventory_hostname); slurm.conf uses
# the connection address (ansible_host) via SlurmctldHost host(ip) and NodeAddr, so the
# cluster forms without depending on site DNS.

- name: Classify Slurm nodes by assigned daemon
  hosts: all
  gather_facts: true
  # pre_tasks, not tasks: a play runs roles BEFORE tasks, so the role phase (slurm_preflight,
  # slurm_packages_verify) must see these facts and groups already set. Putting them in tasks
  # would leave slurm_is_controller undefined when the roles run.
  pre_tasks:
    - name: Resolve this host's Slurm roles and shared paths
      ansible.builtin.set_fact:
        slurm_is_controller: "{{ inventory_hostname in swallow_slurm_controller_ids }}"
        slurm_is_compute: "{{ inventory_hostname in swallow_slurm_compute_ids }}"
        slurm_is_primary: "{{ inventory_hostname == swallow_slurm_primary_controller_id }}"
        # The state server (HA only) hosts the NFS-exported shared StateSaveLocation; swallow
        # selects it off-controller when possible. Empty in a single-controller deploy.
        slurm_is_state_server: "{{ inventory_hostname == (swallow_slurm_state_server_id | default('')) }}"
        # Slurm names a node by its hostname, which is what appears in sinfo and the node
        # registration, not the serverId that keys the inventory.
        slurm_node_name: "{{ ansible_hostname }}"
        # HA controllers share one StateSaveLocation over NFS (mode shared); a single
        # controller keeps it local (mode local). The default path differs accordingly, and an
        # operator-supplied swallow_slurm_state_save_location overrides either.
        slurm_controller_state_mode: "{{ 'shared' if (swallow_slurm_high_availability | default(false) | bool) else 'local' }}"
        slurm_state_save_location: >-
          {{ swallow_slurm_state_save_location
             | default('/var/lib/slurm/slurmctld' if (swallow_slurm_high_availability | default(false) | bool) else '/var/spool/slurmctld', true) }}
        slurm_state_export: "{{ swallow_slurm_state_export | default('/srv/slurm-state', true) }}"
        # host:/export the controllers mount; resolved from the state server's connection
        # address. Empty when no state server is set (single controller).
        slurm_state_source: >-
          {{ (hostvars[swallow_slurm_state_server_id].ansible_host ~ ':' ~ (swallow_slurm_state_export | default('/srv/slurm-state', true)))
             if (swallow_slurm_state_server_id | default('')) | length > 0 else '' }}
        # A standalone tmpfs export on an ephemeral state server is directly addressable via
        # NFSv3. NFSv4 would require a separate pseudo-root namespace and cannot resolve this
        # absolute export path, so the Swallow-managed state share pins the proven protocol.
        slurm_state_fstype: nfs
        slurm_state_mount_options: rw,_netdev,hard,timeo=600,retrans=2,vers=3
        # Login (submission/client) capability. A pure login host uses configless + sackd by
        # default; a controller+login host must retain its authoritative local slurm.conf.
        slurm_is_login: "{{ inventory_hostname in (swallow_slurm_login_ids | default([])) }}"
        slurm_login_config_mode: "{{ swallow_slurm_login_config_mode | default('configless', true) }}"
        slurm_login_use_sackd: "{{ swallow_slurm_login_use_sackd | default(true) }}"
        # Shared workload filesystem (user/job data), distinct from controller state. Enabled
        # only when the operator configured it; self-hosted exports from the login node, while
        # external uses an operator-supplied NFS source. Mounted on every node at the mount path.
        slurm_workload_enabled: "{{ swallow_slurm_workload_enabled | default(false) | bool }}"
        slurm_is_workload_server: "{{ inventory_hostname == (swallow_slurm_workload_server_id | default('')) }}"
        slurm_workload_export: "{{ swallow_slurm_workload_export | default('/srv/slurm-workspace', true) }}"
        slurm_workload_mount_path: "{{ swallow_slurm_workload_mount_path | default('/shared', true) }}"
        slurm_workload_source: >-
          {{ swallow_slurm_workload_source
             | default((hostvars[swallow_slurm_workload_server_id].ansible_host ~ ':' ~ (swallow_slurm_workload_export | default('/srv/slurm-workspace', true)))
                       if (swallow_slurm_workload_server_id | default('')) | length > 0 else '', true) }}
        # Self-hosted storage may be a standalone tmpfs on an ephemeral root and therefore
        # uses the directly-addressable NFSv3 export. Derive this from the immutable workload
        # mode so an existing Workflow retry also receives the compatibility fix; external
        # storage continues to honor its captured fstype and mount options.
        slurm_workload_fstype: >-
          {{ 'nfs'
             if (swallow_slurm_workload_mode | default('')) == 'self-hosted'
             else (swallow_slurm_workload_fstype | default('nfs4', true)) }}
        slurm_workload_mount_options: >-
          {{ 'rw,_netdev,hard,timeo=600,retrans=2,vers=3'
             if (swallow_slurm_workload_mode | default('')) == 'self-hosted'
             else (swallow_slurm_workload_mount_options | default('rw,_netdev,hard,timeo=600,retrans=2', true)) }}
        slurm_conf_dir: /etc/slurm
        slurm_log_dir: /var/log/slurm
        slurm_jwt_key_path: /etc/slurm/jwt_hs256.key
        slurmrestd_port: 6820
        # Omnistat (decision 063): deploy-slurm owns the Slurm side of the overlay (its job hook,
        # PrologFlags=Alloc, exclusive partition) so a redeploy re-applies it; configure-omnistat
        # installs the exporter the hook hands the job to.
        slurm_omnistat_enabled: "{{ swallow_slurm_omnistat_enabled | default(false) | bool }}"
        # The job hooks Swallow's Prolog/Epilog dispatchers run (role slurm_job_hooks). Every
        # integration that attributes jobs adds its hook here rather than its own Prolog=.
        slurm_job_hooks_enabled: >-
          {{ (['omnistat'] if (swallow_slurm_omnistat_enabled | default(false) | bool) else [])
             + (['device-metrics-exporter'] if (swallow_slurm_device_metrics_exporter_enabled | default(false) | bool) else []) }}
        # Memory every compute node keeps for the operating system and its daemons (sshd, slurmd,
        # exporters, page cache): 5% of what slurmd detects, at least 2 GiB and at most 16 GiB.
        # Slurm schedules only the rest (RealMemory), so a full node of jobs cannot starve the host.
        slurm_memory_reserve_percent: "{{ swallow_slurm_memory_reserve_percent | default(5) | int }}"
        slurm_memory_reserve_min_mib: "{{ swallow_slurm_memory_reserve_min_mib | default(2048) | int }}"
        slurm_memory_reserve_max_mib: "{{ swallow_slurm_memory_reserve_max_mib | default(16384) | int }}"
        # Native OCI containers and the host MPI stack (decision 066); both converge both ways.
        slurm_oci_containers: "{{ swallow_slurm_oci_containers | default(false) | bool }}"
        slurm_pmix: "{{ swallow_slurm_pmix | default(false) | bool }}"
        # oci.conf's paths: the per-user state crun keeps and the per-step spool (see oci.conf.j2).
        slurm_oci_crun: /usr/bin/crun
        slurm_oci_runtime_root: /run/user/%U/
        slurm_oci_container_path: /run/user/%U/slurm-oci
        # The bundle deploy-slurm builds on every compute node from the node's own filesystem, used
        # to prove the container path; it is not a workload image.
        slurm_oci_probe_bundle: /var/lib/swallow/oci/probe
        # The MPI probe deploy-slurm installs on every compute node to prove srun --mpi=pmix_v5.
        slurm_pmix_probe: /usr/local/libexec/swallow/mpi-probe

    - name: Fail on a host with no Slurm role
      ansible.builtin.fail:
        msg: "server {{ inventory_hostname }} has no Slurm role (controller, compute, or login)"
      when:
        - not (slurm_is_controller | bool)
        - not (slurm_is_compute | bool)
        - not (slurm_is_login | bool)

    # group_by only sorts hosts in memory, so it never reports a change: a converged cluster reruns
    # with changed=0.
    - name: Group controllers
      ansible.builtin.group_by:
        key: "slurm_{{ 'controller' if slurm_is_controller | bool else 'noncontroller' }}"
      changed_when: false

    - name: Group compute nodes
      ansible.builtin.group_by:
        key: "slurm_{{ 'compute' if slurm_is_compute | bool else 'noncompute' }}"
      changed_when: false

    - name: Group login nodes
      ansible.builtin.group_by:
        key: "slurm_{{ 'login' if slurm_is_login | bool else 'nonlogin' }}"
      changed_when: false

    - name: Group the primary controller
      ansible.builtin.group_by:
        key: "slurm_{{ 'primary' if slurm_is_primary | bool else 'secondary' }}"
      changed_when: false

    - name: Group the shared-state server
      # Creates the slurm_state_server group only in HA (when a state server was selected), so
      # the state-server play below no-ops for a single-controller deploy.
      ansible.builtin.group_by:
        key: "slurm_{{ 'state_server' if slurm_is_state_server | bool else 'nonstate' }}"
      changed_when: false

    - name: Group the workload storage server
      # Only the selected self-hosted server host (the login node) joins; empty for external or
      # no workload storage, so the workload-server play no-ops.
      ansible.builtin.group_by:
        key: "slurm_{{ 'workload_server' if (slurm_workload_enabled | bool and slurm_is_workload_server | bool) else 'nonworkload_server' }}"
      changed_when: false

    - name: Group workload storage clients
      # Every node mounts the workload filesystem when it is enabled; empty otherwise.
      ansible.builtin.group_by:
        key: "slurm_{{ 'workload_client' if slurm_workload_enabled | bool else 'nonworkload_client' }}"
      changed_when: false

    - name: Wait for image-started package operations to release dpkg locks
      # Fresh ephemeral boots may still be finishing unattended-upgrades when automation
      # connects. apt.lock_timeout is not consistently honoured by every ansible-core/apt
      # combination, so establish one explicit readiness gate before any Slurm role installs
      # MUNGE or NFS packages. fuser returns 1 only when none of the locks has an owner.
      ansible.builtin.command:
        argv:
          - /usr/bin/fuser
          - /var/lib/dpkg/lock-frontend
          - /var/lib/dpkg/lock
          - /var/cache/apt/archives/lock
      register: slurm_dpkg_locks
      until: slurm_dpkg_locks.rc != 0
      retries: 120
      delay: 5
      changed_when: false
      failed_when: false
      become: true
  roles:
    # MUNGE rejects credentials between nodes whose clocks disagree, so every node's clock is
    # checked first (decision 065; swallow_time_sync_check decides enforce or warn).
    - role: time_sync_check
    - role: slurm_preflight
    - role: slurm_packages_verify

- name: Establish MUNGE authentication across the cluster
  hosts: all
  gather_facts: false
  roles:
    - role: slurm_munge

- name: Detect compute node hardware for the controller configuration
  hosts: slurm_compute
  gather_facts: false
  tasks:
    - name: Read the slurmd-detected node line
      # slurmd -C prints the CPU/socket/core/memory Slurm actually detects on this host; using
      # it verbatim avoids a NodeName that disagrees with hardware and drops the node to INVAL.
      ansible.builtin.command:
        cmd: /usr/sbin/slurmd -C
      register: slurm_node_detect
      changed_when: false
      become: true
    - name: Remember this node's detected NodeName line
      ansible.builtin.set_fact:
        slurm_node_line: "{{ slurm_node_detect.stdout_lines | select('match', '^NodeName=') | first }}"

    - name: Keep the operating system's memory out of what Slurm schedules
      # A node never gives up more than half of its memory, however small it is.
      vars:
        detected_mib: "{{ slurm_node_line | regex_search('RealMemory=(\\d+)', '\\1') | first | int }}"
        reserve_mib: >-
          {{ [[(detected_mib | int) * (slurm_memory_reserve_percent | int) // 100,
               slurm_memory_reserve_min_mib | int] | max,
              slurm_memory_reserve_max_mib | int] | min }}
      ansible.builtin.set_fact:
        slurm_node_cpus: "{{ slurm_node_line | regex_search('CPUs=(\\d+)', '\\1') | first | int }}"
        slurm_node_schedulable_memory: "{{ [(detected_mib | int) - (reserve_mib | int), (detected_mib | int) // 2] | max }}"

    - name: Load amdgpu and map the GPUs of a GPU compute node
      # GPU GRES (decision 063): see the slurm_gpu role. A CPU compute node stops loading amdgpu
      # and reports no GPUs, so a rerun converges both ways.
      ansible.builtin.include_role:
        name: slurm_gpu
        apply:
          become: true

- name: Provision the shared controller-state NFS export
  # HA only: no host joins slurm_state_server for a single-controller deploy, so this no-ops.
  # Runs before the controllers mount, so the export exists when slurm_controller_state mounts.
  hosts: slurm_state_server
  gather_facts: false
  roles:
    - role: slurm_state_server

- name: Place controller state and enforce the shared-state mount
  # Runs before slurmctld starts so an HA controller mounts (and is guarded by) the shared
  # StateSaveLocation, and a single controller gets its local state directory. serial:1 mirrors
  # the controller-config play's ordering.
  hosts: slurm_controller
  gather_facts: false
  serial: 1
  roles:
    - role: slurm_controller_state

- name: Configure the primary controller and start slurmctld first
  # The primary must render its slurm.conf, start, and become active (writing the shared
  # heartbeat) before any backup starts. A backup that starts first comes up in standby and
  # waits forever for a heartbeat the not-yet-configured primary cannot write; its scontrol
  # ping then fails and aborts the run before the primary is even given slurm.conf, so the
  # cluster never forms. group_by does not preserve primary-first order, so the primary runs in
  # its own play here rather than relying on serial ordering within one controller play.
  hosts: slurm_primary
  gather_facts: false
  roles:
    - role: slurm_config
    - role: slurm_controller

- name: Configure and start the backup controllers
  # Backups only start after the primary is active, so they immediately find the shared
  # heartbeat and settle into standby. A single-controller deploy has no hosts here.
  hosts: slurm_controller:!slurm_primary
  gather_facts: false
  serial: 1
  roles:
    - role: slurm_config
    - role: slurm_controller

- name: Configure compute nodes and start slurmd
  hosts: slurm_compute
  gather_facts: false
  roles:
    # Before slurmd (re)starts: slurm.conf names the dispatchers, and a missing Prolog drains a node.
    - role: slurm_job_hooks
    - role: slurm_oci
    - role: slurm_pmix
    - role: slurm_compute

- name: Configure login (submission) hosts
  # Pure client hosts use configless discovery from the controllers (sackd cache by default).
  # A controller may also carry the login role; slurm_login preserves its authoritative local
  # configuration. Runs after the controllers are up so discovery succeeds.
  hosts: slurm_login
  gather_facts: false
  roles:
    - role: slurm_login
    # Login hosts build and launch MPI programs too; a compute+login host already has it.
    - role: slurm_pmix

- name: Provision the shared workload NFS export
  # Self-hosted workload storage only: the login node exports the workload filesystem to every
  # node. No hosts for external or no workload storage, so this no-ops. Runs before clients mount.
  hosts: slurm_workload_server
  gather_facts: false
  roles:
    - role: slurm_workload_storage_server
      # Defence in depth: the dynamic group should already be empty while the feature is off,
      # but provider inventory may contain a colliding group name. Never touch NFS or its path
      # unless this Workflow's frozen intent explicitly enabled workload storage.
      when: (swallow_slurm_workload_enabled | default(false) | bool) and (slurm_is_workload_server | bool)

- name: Mount the shared workload filesystem on every node
  # Runs on all nodes when workload storage is enabled (self-hosted or external). No hosts when
  # workload storage is disabled.
  hosts: slurm_workload_client
  gather_facts: false
  roles:
    - role: slurm_workload_storage_client
      # Do not rely on group membership alone. This guard also makes retries of disabled-storage
      # Workflows safe if an inventory source happens to expose a slurm_workload_client group.
      when: swallow_slurm_workload_enabled | default(false) | bool

- name: Expose slurmrestd, verify the cluster, and record the Swallow credential
  hosts: slurm_primary
  gather_facts: false
  roles:
    - role: slurm_slurmrestd
    - role: slurm_verify
    - role: slurm_cluster_credential
