---
# Reconfigure a deployed Slurm cluster in place (decision 083): render the controllers' configuration
# from the trusted topology variables and apply it with scontrol reconfigure, which reaches the
# configless compute and login nodes. It installs nothing and leaves the nodes' daemons, driver, and
# jobs alone: each compute node's hardware comes from what its last detection recorded
# (slurm_node_hardware), except the nodes in swallow_slurm_rescan_ids, which are detected again
# (their GPUs loaded and checked) and have slurmd brought up afterwards. It carries a change that only
# concerns scheduling (node groups, partitions, expected GPUs), the reconfigure of a scale-in, and a
# rescan.

- name: Hold the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: package_maintenance_hold

- name: Classify Slurm nodes by assigned daemon
  hosts: all
  gather_facts: true
  roles:
    - role: slurm_facts

- name: Read the compute nodes' hardware
  hosts: slurm_compute
  gather_facts: false
  tasks:
    - name: Detect the rescanned nodes and read the others' records
      ansible.builtin.include_role:
        name: slurm_node_hardware
        tasks_from: "{{ 'main' if inventory_hostname in (swallow_slurm_rescan_ids | default([])) else 'recorded' }}"

- name: Reconfigure the primary controller
  # The primary renders slurm.conf and gres.conf first, as in deploy-slurm, so a backup never
  # carries a configuration the primary does not.
  hosts: slurm_primary
  gather_facts: false
  roles:
    - role: slurm_config
    - role: slurm_controller

- name: Reconfigure the backup controllers
  hosts: slurm_controller:!slurm_primary
  gather_facts: false
  serial: 1
  roles:
    - role: slurm_config
    - role: slurm_controller

- name: Bring slurmd up on the rescanned nodes
  # Detecting the GPUs may load amdgpu again, which stops slurmd while the driver reloads.
  hosts: slurm_compute
  gather_facts: false
  tasks:
    - name: Configure and start slurmd
      ansible.builtin.include_role:
        name: slurm_compute
      when: inventory_hostname in (swallow_slurm_rescan_ids | default([]))

- name: Verify the cluster
  hosts: slurm_primary
  gather_facts: false
  roles:
    - role: slurm_verify

- name: Release the OS's automatic package maintenance
  hosts: all
  gather_facts: false
  tasks:
    - name: Release the package maintenance hold
      ansible.builtin.include_role:
        name: package_maintenance_hold
        tasks_from: release
