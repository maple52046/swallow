---
# Join a worker using a worker token minted on the initial controller. As with a
# controller, the token file must survive until the node is Ready, or the service loops.

- name: Check for an existing worker service
  ansible.builtin.stat:
    path: /etc/systemd/system/k0sworker.service
  register: k0s_worker_unit

- name: Ensure /etc/k0s exists
  ansible.builtin.file:
    path: /etc/k0s
    state: directory
    mode: "0755"
  become: true
  when: not k0s_worker_unit.stat.exists

- name: Generate a worker join token on the initial controller
  ansible.builtin.command:
    cmd: /usr/local/bin/k0s token create --role=worker --expiry=1h
  become: true
  delegate_to: "{{ swallow_k0s_initial_controller_id }}"
  register: k0s_worker_token
  no_log: true
  changed_when: false
  when: not k0s_worker_unit.stat.exists

- name: Write the join token
  ansible.builtin.copy:
    content: "{{ k0s_worker_token.stdout }}"
    dest: /etc/k0s/join-token
    mode: "0600"
  become: true
  no_log: true
  when: not k0s_worker_unit.stat.exists

- name: Install the worker with the join token
  # Pin the Kubernetes node name to the swallow node name (the MAAS short hostname) via
  # --hostname-override. Without it the kubelet registers under the OS hostname, which on
  # RHEL/Rocky is the FQDN (e.g. lab-compute-1.maas) rather than the short name Ubuntu uses;
  # the readiness wait and membership sync both key on the short name, so the node would
  # otherwise be reported NotFound. This makes node naming deterministic across OS families.
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/k0s install worker --token-file /etc/k0s/join-token
      --kubelet-extra-args=--hostname-override={{ k0s_node_name | default(inventory_hostname) }}
  become: true
  when: not k0s_worker_unit.stat.exists
  changed_when: true

- name: Start k0s
  ansible.builtin.systemd:
    name: k0sworker
    state: started
    enabled: true
    daemon_reload: true
  become: true

# On RHEL/Rocky, k0s extracts its bundled containerd/runc into /var/lib/k0s/bin at first
# start; those files land unlabeled, so SELinux blocks containerd until they are relabeled.
# The fcontext rules were installed during preflight; here we relabel the now-extracted
# paths and restart the worker once. Only a brand-new worker needs this (idempotent).

- name: Wait for embedded containerd extraction on new RHEL workers
  ansible.builtin.wait_for:
    path: /var/lib/k0s/bin/containerd
    timeout: 120
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not k0s_worker_unit.stat.exists

- name: Stat k0s paths that need SELinux relabeling on new RHEL workers
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /var/lib/k0s/bin
    - /var/lib/k0s/containerd
    - /etc/cni
    - /opt/cni
  register: k0s_worker_selinux_paths
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not k0s_worker_unit.stat.exists

- name: Restore SELinux labels on the extracted k0s paths
  ansible.builtin.command:
    argv:
      - restorecon
      - -R
      - -v
      - "{{ item.item }}"
  loop: "{{ k0s_worker_selinux_paths.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('skipped') }}"
  become: true
  register: k0s_worker_restorecon
  changed_when: k0s_worker_restorecon.stdout | length > 0
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not k0s_worker_unit.stat.exists
    - not (item.skipped | default(false))
    - item.stat.exists | default(false)

- name: Restart the new RHEL worker after labeling containerd
  ansible.builtin.systemd:
    name: k0sworker
    state: restarted
  become: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not k0s_worker_unit.stat.exists

- name: Wait for the node to become Ready
  # k0s kubectl wait avoids the jsonpath-quote trap and tolerates the first CNI image pull,
  # which can take a couple of minutes.
  ansible.builtin.command:
    cmd: /usr/local/bin/k0s kubectl wait --for=condition=Ready node/{{ k0s_node_name }} --timeout=120s
  become: true
  delegate_to: "{{ swallow_k0s_initial_controller_id }}"
  register: k0s_worker_ready
  until: k0s_worker_ready.rc == 0
  retries: 10
  delay: 15
  changed_when: false

- name: Remove the join token now that the worker has joined
  ansible.builtin.file:
    path: /etc/k0s/join-token
    state: absent
  become: true
