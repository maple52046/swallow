---
# Run a user-defined Validation Suite (docs/development/validation.md §2.2, §3.1) on each target
# Server as the Linux account of the User who started the run (swallow_validation_requester), for at
# most the suite's timeout, through that User's passwordless sudo when the suite asks for it.
#
# The automation user logs in as usual. Root creates a private 0700 directory, writes the script
# into it while root still owns it, hands it to the requester's uid, and removes it at the end. Only
# the sudo check and the script run as the requester (become_user), pipelined so that no file is
# transferred to them (the hosts have no ACL support, and Ansible cannot hand a temporary file to
# another unprivileged user without it); ansible_remote_tmp keeps the module's own temporary files
# out of the requester's home. Nothing else on the host changes: the playbook never creates a home
# or installs anything.
#
# Exit code 0 passes the script check and any other code fails it; a script that runs past its
# timeout is an error, and so is a host where the requester's account cannot run it, with a summary
# that starts with its code (validation.md §4.3):
#   [validation_account_missing]   the host has no account with the requester's name
#   [validation_account_mismatch]  that account has another uid (a local account of the same name)
#   [validation_become_failed]     the automation user may not run commands as the requester
#   [validation_sudo_unavailable]  the suite needs sudo and the requester's `sudo -n` fails here
#   [validation_script_unplaced]   the script could not be put on the host
# The tail of the script's output becomes the result's evidence, which the API redacts again.
#
# Two variables exist only for the content test (validation_playbook_test.go), which runs without
# root: script_validation_become_root turns root's become off, and script_validation_sudo_command
# replaces the sudo the requester runs. The launcher never sets them.

- name: Run the validation script as the requester
  hosts: all
  gather_facts: false
  vars:
    script_validation_timeout: "{{ swallow_validation_timeout_seconds | default(600) | int }}"
    script_validation_user: "{{ swallow_validation_requester.username }}"
    script_validation_uid: "{{ swallow_validation_requester.uidNumber | int }}"
    script_validation_sudo: "{{ swallow_validation_sudo | default(false) | bool }}"
    # A script without an interpreter line runs under /bin/sh.
    script_validation_shebang: "{{ swallow_validation_script | default('') is match('#!') }}"
    script_validation_max_evidence: 8000
    script_validation_become_root: true
    script_validation_sudo_command: sudo
    # Ansible's message when become fails reads like the requester's password problem; the cause is
    # the automation user's own sudo rules.
    script_validation_become_failed: >-
      [validation_become_failed] the automation user cannot run commands as {{ swallow_validation_requester.username }}
  tasks:
    # The automation user, no become: identity lookups need no privilege.
    - name: Look up the requester's account
      ansible.builtin.command:
        argv: [getent, passwd, "{{ script_validation_user }}"]
      register: script_validation_account
      changed_when: false
      failed_when: false

    - name: Judge the account
      ansible.builtin.set_fact:
        script_validation_entry: "{{ script_validation_account.stdout.split(':') }}"
        script_validation_problem: >-
          {{ '[validation_account_missing] ' ~ script_validation_user ~ ' has no account on this host'
             if script_validation_account.rc != 0
             else ('[validation_account_mismatch] ' ~ script_validation_user ~ ' is uid '
                   ~ script_validation_account.stdout.split(':')[2] ~ ' here, not ' ~ script_validation_uid
                   if script_validation_account.stdout.split(':')[2] | int != script_validation_uid | int
                   else '') }}

    # A home that exists but belongs to another uid (left by a deleted User of the same name: uids are
    # never reused) is not the requester's, so the script gets the private directory as HOME instead.
    - name: Check the requester's home directory
      ansible.builtin.stat:
        path: "{{ script_validation_entry[5] }}"
      register: script_validation_home
      when: script_validation_problem == ''

    # The requester, pipelined. ignore_errors is required: a refused become fails the task before the
    # module runs, which failed_when does not clear; `cmd is defined` tells whether the command ran.
    - name: Check the requester's passwordless sudo
      ansible.builtin.command:
        argv: ["{{ script_validation_sudo_command }}", -n, --, /bin/true]
      become: true
      become_user: "{{ script_validation_user }}"
      vars:
        ansible_pipelining: true
        ansible_remote_tmp: /tmp
      register: script_validation_sudo_check
      changed_when: false
      failed_when: false
      ignore_errors: true
      when: script_validation_problem == '' and script_validation_sudo | bool

    - name: Judge the sudo check
      ansible.builtin.set_fact:
        script_validation_problem: >-
          {{ script_validation_become_failed
             if script_validation_sudo_check.cmd is not defined
             else '[validation_sudo_unavailable] ' ~ script_validation_user ~ ' has no passwordless sudo here: '
                  ~ script_validation_sudo_check.stderr | default('') | trim }}
      when:
        - script_validation_problem == ''
        - script_validation_sudo | bool
        - script_validation_sudo_check.cmd is not defined or script_validation_sudo_check.rc != 0

    - name: Run the script
      when: script_validation_problem == ''
      block:
        # Root.
        - name: Create a private directory for the script
          ansible.builtin.tempfile:
            state: directory
            suffix: .swallow-validation
          become: "{{ script_validation_become_root | bool }}"
          register: script_validation_dir

        - name: Write the script
          ansible.builtin.copy:
            dest: "{{ script_validation_dir.path }}/script"
            content: "{{ swallow_validation_script }}"
            owner: "{{ script_validation_uid }}"
            mode: "0700"
          become: "{{ script_validation_become_root | bool }}"
          # The script is the suite's, readable through the API; it need not fill the job's log too.
          no_log: true

        - name: Hand the directory to the requester
          ansible.builtin.file:
            path: "{{ script_validation_dir.path }}"
            owner: "{{ script_validation_uid }}"
            mode: "0700"
          become: "{{ script_validation_become_root | bool }}"

        # The requester, pipelined; the timeout sits inside any sudo, so it can stop root's children.
        - name: Run the script as the requester
          ansible.builtin.command:
            argv: >-
              {{ ([script_validation_sudo_command, '-n', '--'] if script_validation_sudo | bool else [])
                 + ['timeout', '--kill-after=10', script_validation_timeout | string]
                 + ([] if script_validation_shebang | bool else ['/bin/sh'])
                 + [script_validation_dir.path ~ '/script'] }}
            chdir: "{{ script_validation_dir.path }}"
          become: true
          become_user: "{{ script_validation_user }}"
          vars:
            ansible_pipelining: true
            ansible_remote_tmp: "{{ script_validation_dir.path }}"
          environment:
            HOME: >-
              {{ script_validation_entry[5]
                 if script_validation_home.stat.isdir | default(false)
                    and script_validation_home.stat.uid | default(-1) | int == script_validation_uid | int
                 else script_validation_dir.path }}
          register: script_validation_run
          changed_when: false
          failed_when: false
          ignore_errors: true
      rescue:
        - name: Note that the script could not be put on the host
          ansible.builtin.set_fact:
            script_validation_problem: "[validation_script_unplaced] {{ ansible_failed_result.msg | default('') }}"
      always:
        # Root.
        - name: Remove the script
          ansible.builtin.file:
            path: "{{ script_validation_dir.path }}"
            state: absent
          become: "{{ script_validation_become_root | bool }}"
          changed_when: false
          when: script_validation_dir.path is defined

    - name: Judge the script
      ansible.builtin.include_role:
        name: validation_report
        tasks_from: record
      vars:
        script_validation_ran: "{{ script_validation_problem == '' and script_validation_run.cmd is defined }}"
        script_validation_rc: "{{ script_validation_run.rc | default(-1) if script_validation_ran | bool else -1 }}"
        # timeout exits 124 when the script ran out of time, 137 when it also had to be killed.
        script_validation_timed_out: "{{ script_validation_ran | bool and script_validation_rc | int in [124, 137] }}"
        validation_report_check: script
        validation_report_verdict: >-
          {{ 'error' if not script_validation_ran | bool or script_validation_timed_out | bool
             else ('passed' if script_validation_rc | int == 0 else 'failed') }}
        validation_report_summary: >-
          {{ script_validation_problem if script_validation_problem != ''
             else (script_validation_become_failed
                   if not script_validation_ran | bool
             else ('the script ran past its timeout of ' ~ script_validation_timeout ~ ' s'
                   if script_validation_timed_out | bool
             else 'the script exited ' ~ script_validation_rc ~ ' as ' ~ script_validation_user
                  ~ (' via sudo' if script_validation_sudo | bool else ''))) }}
        validation_report_evidence: "{{ ([script_validation_run.stdout | default(''), script_validation_run.stderr | default('')]
          | select | join('\n'))[-(script_validation_max_evidence | int):] }}"
        validation_report_measurements: >-
          {{ [{'name': 'exit_code', 'value': script_validation_rc | int, 'unit': 'code', 'expected': '0'}]
             if script_validation_ran | bool else [] }}

    - name: Write the results for Swallow
      ansible.builtin.include_role:
        name: validation_report
