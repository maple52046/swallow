---
# The provisioning every swallow-installed Grafana shares (monitoring.md §6.2): one Prometheus
# datasource and the dashboard bundles a release ships (files/dashboards/<bundle>). The Grafana
# Managed Software role delivers them as provisioning files (tasks/files.yml) and the Kubernetes
# Platform Grafana as Helm values and ConfigMaps (tasks/kubernetes.yml); both read this one copy.
#
# Inputs, set by the including role:
#   grafana_provisioning_url              the datasource URL
#   grafana_provisioning_token            whether the datasource sends a bearer token, which the
#                                         Grafana process reads from grafana_provisioning_token_variable
#   grafana_provisioning_bundles          the dashboard bundles to provision
#   grafana_provisioning_dashboards_path  where Grafana reads the bundle directories
# The including role reads grafana_provisioning_landing_path (below) after the include, for the URL
# it reports; the include's vars end with the include, so that task sets
# grafana_provisioning_bundles again from the role's own bundle list.
grafana_provisioning_token: false
grafana_provisioning_bundles: []
# Every shipped bundle reads its datasource by this uid (Omnistat's through its ${source} variable).
grafana_provisioning_datasource_uid: prometheus
# The environment variable holding "Bearer <token>"; the datasource names it, so no provisioning
# file or Kubernetes object other than the token's own Secret holds the token.
grafana_provisioning_token_variable: SWALLOW_DATASOURCE_AUTHORIZATION
# Folder each shipped bundle is provisioned into.
grafana_provisioning_folders:
  omnistat: Omnistat RMS
  device-metrics-exporter: Device Metrics Exporter
  node-exporter: Servers
# The dashboard a Grafana opens on for each shipped bundle: the uid fixed in the bundle's JSON, so
# the address stays valid across releases and restarts, and the slug Grafana derives from that
# dashboard's title, so the link is the dashboard's own address rather than one Grafana redirects:
# Device Metrics Exporter's Overview, Omnistat's Global - RMS, and swallow's Servers. A changed uid
# or title in a bundle changes it here too (grafana_role_test.go checks both against the JSON).
grafana_provisioning_landing_dashboards:
  device-metrics-exporter: {uid: fe0ayyeeoxvy8f, slug: overview}
  omnistat: {uid: edqnz7pce7togc-rms, slug: global-rms}
  node-exporter: {uid: swallow-node-exporter, slug: servers}
# With several bundles, the first one in this order is the landing one: the GPU or job monitoring
# a Platform has (the Device Metrics Exporter before Omnistat) before the Servers every Platform
# Grafana carries.
grafana_provisioning_landing_order: [device-metrics-exporter, omnistat, node-exporter]
# The landing dashboard's path below the Grafana root, /d/<uid>/<slug>, for
# grafana_provisioning_bundles; empty, so the root, when no bundle is provisioned. The including
# role appends it to the root in the URL it reports as the Platform Grafana Monitoring Link; its
# health checks keep the root.
grafana_provisioning_landing_path: >-
  {%- set landing = grafana_provisioning_landing_order | select('in', grafana_provisioning_bundles) | first | default('') -%}
  {%- set dashboard = grafana_provisioning_landing_dashboards[landing] if landing else {} -%}
  {{ ('/d/' ~ dashboard.uid ~ '/' ~ dashboard.slug) if landing else '' }}
