---
# Debian family: the Local Repository's deb sources replace every other apt source of the host, and
# apt reaches them directly even where the host's apt goes through a proxy (MAAS configures one).

- name: Point apt at the Local Repository
  become: true
  block:
    - name: Ensure the apt keyring directory exists
      ansible.builtin.file:
        path: "{{ local_repo_client_root }}{{ local_repo_client_keyring | dirname }}"
        state: directory
        mode: "0755"

    - name: Install the Local Repository's signing key
      ansible.builtin.copy:
        dest: "{{ local_repo_client_root }}{{ local_repo_client_keyring }}"
        content: "{{ swallow_local_repository.deb_signing_key | trim }}\n"
        mode: "0644"

    - name: Write the Local Repository's apt sources
      ansible.builtin.template:
        src: swallow-local-repository.sources.j2
        dest: "{{ local_repo_client_root }}{{ local_repo_client_apt_sources }}"
        mode: "0644"

    - name: Reach the Local Repository without the host's apt proxy
      ansible.builtin.template:
        src: apt-direct.conf.j2
        dest: "{{ local_repo_client_root }}{{ local_repo_client_apt_conf }}"
        mode: "0644"

    - name: Find the host's other apt sources
      ansible.builtin.find:
        paths: "{{ local_repo_client_root }}{{ local_repo_client_apt_sources_dir }}"
        patterns: ["*.list", "*.sources"]
        excludes: ["{{ local_repo_client_apt_sources | basename }}"]
      register: local_repo_client_found_sources

    - name: Read the host's other apt sources
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: >-
        {{ [local_repo_client_root ~ local_repo_client_apt_sources_list]
           + (local_repo_client_found_sources.files | map(attribute='path') | sort) }}
      register: local_repo_client_other_sources
      failed_when: false

    - name: Disable the host's other apt sources
      ansible.builtin.command:
        argv:
          - mv
          - -f
          - "{{ item.item }}"
          - "{{ item.item }}{{ local_repo_client_disabled_suffix }}"
      loop: "{{ local_repo_client_other_sources.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.content is defined
        - (item.content | b64decode) is search('(?m)^[ \t]*[^#\s]')
      changed_when: true

    - name: Refresh the package index from the Local Repository
      # Every run refreshes it: the cache may still hold what the distribution's sources served.
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 300
      register: local_repo_client_index
      until: local_repo_client_index is succeeded
      retries: 30
      delay: 10
      changed_when: false
      when: local_repo_client_root | length == 0
