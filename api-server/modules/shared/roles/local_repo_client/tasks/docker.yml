---
# Docker Engine pulls from the Local Repository's registry, which serves plain HTTP, by its address
# (<registry>/docker.io/<image>). The role only adds that registry to insecure-registries: every
# other key and entry in daemon.json stays as the user or the image wrote it.

- name: Let Docker pull from the Local Repository's registry
  become: true
  block:
    - name: Read Docker's daemon configuration
      ansible.builtin.slurp:
        src: "{{ local_repo_client_root }}{{ local_repo_client_docker_daemon }}"
      register: local_repo_client_daemon
      failed_when: false

    - name: Parse Docker's daemon configuration
      ansible.builtin.set_fact:
        local_repo_client_daemon_config: >-
          {{ (local_repo_client_daemon.content | b64decode | trim | default('{}', true) | from_json)
             if local_repo_client_daemon.content is defined else {} }}

    - name: Ensure Docker's configuration directory exists
      ansible.builtin.file:
        path: "{{ local_repo_client_root }}{{ local_repo_client_docker_daemon | dirname }}"
        state: directory
        mode: "0755"

    - name: Add the Local Repository's registry to Docker's insecure registries
      ansible.builtin.copy:
        dest: "{{ local_repo_client_root }}{{ local_repo_client_docker_daemon }}"
        content: |
          {{ local_repo_client_daemon_config
             | combine({'insecure-registries': (local_repo_client_daemon_config['insecure-registries'] | default([]))
                                               + [swallow_local_repository.registry]})
             | to_nice_json }}
        mode: "0644"
      register: local_repo_client_daemon_written
      when: >-
        swallow_local_repository.registry not in
        (local_repo_client_daemon_config['insecure-registries'] | default([]))

    - name: Read whether Docker is running
      ansible.builtin.command:
        argv: [systemctl, is-active, docker.service]
      register: local_repo_client_docker_active
      changed_when: false
      failed_when: false
      when:
        - local_repo_client_daemon_written is changed
        - local_repo_client_root | length == 0

    - name: Reload Docker to read the registry
      # dockerd rereads insecure-registries on SIGHUP, so its containers keep running. A Docker that
      # is not running, or not installed yet, reads the file when it starts.
      ansible.builtin.systemd_service:
        name: docker.service
        state: reloaded
      when:
        - local_repo_client_daemon_written is changed
        - local_repo_client_root | length == 0
        - local_repo_client_docker_active.stdout | default('') | trim == 'active'
