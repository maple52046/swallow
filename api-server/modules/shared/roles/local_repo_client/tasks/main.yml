---
# Point this host at the Site's Local Repository (defaults/main.yml). Idempotent: a converged host
# reruns with no changes, although the package index is refreshed on every run.

- name: Refuse a run without the Site's Local Repository
  ansible.builtin.fail:
    msg: >-
      [local_repository_missing] This playbook installs and downloads only from the Site's Local
      Repository, but the run carries no swallow_local_repository. Register the Site's repository
      Integration, wait until its sources are ready, and start the Workflow again.
  when: swallow_local_repository is not defined or swallow_local_repository is not mapping

- name: Read the host's operating system
  ansible.builtin.setup:
    gather_subset: [min]
  when: ansible_facts['os_family'] is not defined

- name: Point apt at the Local Repository
  ansible.builtin.include_tasks: apt.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Point pip at the Local Repository's Python index
  become: true
  ansible.builtin.template:
    src: pip.conf.j2
    dest: "{{ local_repo_client_root }}{{ local_repo_client_pip_conf }}"
    mode: "0644"

- name: Pull k0s's images through the Local Repository
  ansible.builtin.include_tasks: containerd.yml
  when: local_repo_client_containerd | bool

- name: Let Docker pull from the Local Repository's registry
  ansible.builtin.include_tasks: docker.yml
  when: local_repo_client_docker | bool

- name: Let Podman pull from the Local Repository's registry
  when: local_repo_client_podman | bool
  become: true
  block:
    - name: Ensure Podman's registries drop-in directory exists
      ansible.builtin.file:
        path: "{{ local_repo_client_root }}{{ local_repo_client_podman_registries | dirname }}"
        state: directory
        mode: "0755"

    - name: Mark the Local Repository's registry as plain HTTP
      ansible.builtin.template:
        src: podman-registries.conf.j2
        dest: "{{ local_repo_client_root }}{{ local_repo_client_podman_registries }}"
        mode: "0644"
