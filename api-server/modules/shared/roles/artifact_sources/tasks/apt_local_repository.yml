---
# The Local Repository's deb sources replace every other apt source of the host, and apt reaches
# them directly even where the host's apt goes through a proxy (MAAS configures one).

- name: Point apt at the Local Repository
  become: true
  block:
    - name: Install the Local Repository's signing key
      ansible.builtin.copy:
        dest: "{{ artifact_sources_root }}{{ artifact_sources_keyring }}"
        content: "{{ swallow_artifacts.deb_signing_key | trim }}\n"
        mode: "0644"

    - name: Reach the Local Repository without the host's apt proxy
      ansible.builtin.template:
        src: apt-direct.conf.j2
        dest: "{{ artifact_sources_root }}{{ artifact_sources_apt_conf }}"
        mode: "0644"

    - name: Find the host's other apt sources
      ansible.builtin.find:
        paths: "{{ artifact_sources_root }}{{ artifact_sources_apt_sources_dir }}"
        patterns: ["*.list", "*.sources"]
        excludes: ["{{ artifact_sources_apt_sources | basename }}"]
      register: artifact_sources_found_sources

    - name: Read the host's other apt sources
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: >-
        {{ [artifact_sources_root ~ artifact_sources_apt_sources_list]
           + (artifact_sources_found_sources.files | map(attribute='path') | sort) }}
      register: artifact_sources_other_sources
      failed_when: false

    - name: Disable the host's other apt sources
      ansible.builtin.command:
        argv:
          - mv
          - -f
          - "{{ item.item }}"
          - "{{ item.item }}{{ artifact_sources_disabled_suffix }}"
      loop: "{{ artifact_sources_other_sources.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.content is defined
        - (item.content | b64decode) is search('(?m)^[ \t]*[^#\s]')
      changed_when: true

    - name: Add every deb source the Local Repository serves
      ansible.builtin.set_fact:
        artifact_sources_deb: "{{ swallow_artifacts.deb }}"
