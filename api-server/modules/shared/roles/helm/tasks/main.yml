---
# Install the pinned helm on this host and set helm_binary to its path. Idempotent: a host that
# has the verified release changes nothing. Needs the host's facts (architecture).

- name: Resolve the pinned helm release
  ansible.builtin.set_fact:
    helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] | default(ansible_architecture) }}"
    helm_binary: "{{ helm_home }}/{{ helm_version }}/helm"

- name: Refuse an architecture without a pinned helm checksum
  ansible.builtin.fail:
    msg: "[helm_unsupported_architecture] swallow pins helm {{ helm_version }} for {{ helm_checksums.keys() | join(', ') }}, not {{ helm_arch }}"
  when: helm_arch not in helm_checksums

- name: Create swallow's helm directory
  ansible.builtin.file:
    path: "{{ helm_home }}/{{ helm_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the pinned helm release
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: "{{ helm_home }}/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    checksum: "sha256:{{ helm_checksums[helm_arch] }}"
    mode: "0644"

- name: Unpack helm
  ansible.builtin.unarchive:
    src: "{{ helm_home }}/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: "{{ helm_home }}/{{ helm_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
      - "linux-{{ helm_arch }}/helm"
    creates: "{{ helm_binary }}"
