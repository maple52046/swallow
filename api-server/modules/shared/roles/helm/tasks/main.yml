---
# Install the pinned helm on this host and set helm_binary to its path. Idempotent: a host that
# has the verified release changes nothing. Needs the host's facts (architecture).

- name: Resolve the pinned helm release
  ansible.builtin.set_fact:
    helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] | default(ansible_architecture) }}"
    helm_binary: "{{ helm_home }}/{{ helm_version }}/helm"

- name: Refuse an architecture the Local Repository holds no helm for
  ansible.builtin.fail:
    msg: "[helm_unsupported_architecture] swallow pins helm {{ helm_version }} for {{ helm_archives.keys() | join(', ') }}, not {{ helm_arch }}"
  when: helm_arch not in helm_archives

- name: Create swallow's helm directory
  ansible.builtin.file:
    path: "{{ helm_home }}/{{ helm_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the pinned helm release from the Local Repository
  ansible.builtin.get_url:
    url: "{{ swallow_local_repository.files }}{{ helm_archives[helm_arch].path }}"
    dest: "{{ helm_home }}/{{ helm_archives[helm_arch].path | basename }}"
    checksum: "sha256:{{ helm_archives[helm_arch].sha256 }}"
    mode: "0644"
  register: helm_download
  until: helm_download is succeeded
  retries: 5
  delay: 10

- name: Unpack helm
  ansible.builtin.unarchive:
    src: "{{ helm_home }}/{{ helm_archives[helm_arch].path | basename }}"
    dest: "{{ helm_home }}/{{ helm_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
      - "linux-{{ helm_arch }}/helm"
    creates: "{{ helm_binary }}"
