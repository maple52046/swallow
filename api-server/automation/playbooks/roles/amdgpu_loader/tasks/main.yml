---
# Converge the post-boot amdgpu loader, its module options, and the ordering of the units that need
# GPUs. present installs and starts the loader with the operator's options plus the options a
# topology rule derives, loading the driver again when it runs with other parameters (apply.yml,
# reload.yml), and fails the node when an option name is unknown, the driver does not load, or it
# ignores an option; absent disables and removes it together with the drop-ins and the options,
# leaving a loaded driver loaded.

- name: Find the units that need the GPUs
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}.service"
  loop: "{{ amdgpu_loader_dependents }}"
  register: amdgpu_loader_dependent_stats

- name: Find the packaged units that need the GPUs
  # Packaged daemons (slurmd) live under /lib/systemd/system rather than /etc/systemd/system.
  ansible.builtin.stat:
    path: "/lib/systemd/system/{{ item }}.service"
  loop: "{{ amdgpu_loader_dependents }}"
  register: amdgpu_loader_packaged_stats

- name: Install and start the amdgpu loader
  when: amdgpu_loader_state == 'present'
  block:
    - name: Install the post-boot amdgpu loader
      ansible.builtin.template:
        src: amdgpu-load.service.j2
        dest: "/etc/systemd/system/{{ amdgpu_loader_unit }}"
        mode: "0644"

    - name: Create the dependent unit drop-in directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.0.item }}.service.d"
        state: directory
        mode: "0755"
      loop: "{{ amdgpu_loader_dependent_stats.results | zip(amdgpu_loader_packaged_stats.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when: item.0.stat.exists or item.1.stat.exists

    - name: Order the dependent units after the amdgpu loader
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.0.item }}.service.d/{{ amdgpu_loader_dropin }}"
        content: |
          # Managed by Swallow ({{ amdgpu_loader_owner }}): start once the GPUs are initialized.
          [Unit]
          {{ 'Requires' if amdgpu_loader_strict | bool else 'Wants' }}={{ amdgpu_loader_unit }}
          After={{ amdgpu_loader_unit }}
        mode: "0644"
      loop: "{{ amdgpu_loader_dependent_stats.results | zip(amdgpu_loader_packaged_stats.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when: item.0.stat.exists or item.1.stat.exists

    - name: Enable the amdgpu loader
      ansible.builtin.systemd:
        name: "{{ amdgpu_loader_unit }}"
        enabled: true
        daemon_reload: true

    - name: Read the options a rule applied earlier
      ansible.builtin.slurp:
        src: "{{ amdgpu_loader_state_file }}"
      register: amdgpu_loader_saved
      failed_when: false

    - name: Remember the rule options
      ansible.builtin.set_fact:
        amdgpu_loader_saved_rules: >-
          {{ ((amdgpu_loader_saved.content | b64decode | from_json).rules | default({}))
             if amdgpu_loader_saved.content is defined else {} }}

    - name: Decide the amdgpu module options
      # Rule options persist until the operator names the same option; the operator always wins.
      ansible.builtin.set_fact:
        amdgpu_loader_desired: >-
          {%- set options = {} -%}
          {%- for name, rule in amdgpu_loader_saved_rules.items() if name not in amdgpu_loader_module_options -%}
          {%- set _ = options.update({name: rule.value | string}) -%}
          {%- endfor -%}
          {%- for name, value in amdgpu_loader_module_options.items() -%}
          {%- set _ = options.update({name: value | string}) -%}
          {%- endfor -%}
          {{ options }}
        amdgpu_loader_option_sources: >-
          {%- set sources = {} -%}
          {%- for name, rule in amdgpu_loader_saved_rules.items() if name not in amdgpu_loader_module_options -%}
          {%- set _ = sources.update({name: rule.reason | default('topology rule')}) -%}
          {%- endfor -%}
          {{ sources }}

    - name: Load the driver with the decided options
      ansible.builtin.include_tasks: apply.yml

    - name: Apply the topology rules
      when: amdgpu_loader_topology_rules | bool
      block:
        - name: Find the options the topology calls for
          # The report was read after the driver loaded with the options decided so far.
          ansible.builtin.set_fact:
            amdgpu_loader_new_rules: >-
              {%- set report = amdgpu_loader_after.stdout | from_json -%}
              {%- set found = {} -%}
              {%- for name, value in report.rules.items()
                    if name not in amdgpu_loader_module_options and name not in amdgpu_loader_saved_rules -%}
              {%- set _ = found.update({name: {'value': value, 'reason': report.ruleReasons[name]}}) -%}
              {%- endfor -%}
              {{ found }}

        - name: Apply the options a topology rule calls for
          when: amdgpu_loader_new_rules | length > 0
          block:
            - name: Create the loader state directory
              ansible.builtin.file:
                path: "{{ amdgpu_loader_state_file | dirname }}"
                state: directory
                owner: root
                group: root
                mode: "0755"

            - name: Record the rule options
              ansible.builtin.copy:
                dest: "{{ amdgpu_loader_state_file }}"
                content: "{{ {'rules': amdgpu_loader_saved_rules | combine(amdgpu_loader_new_rules)} | to_nice_json }}\n"
                owner: root
                group: root
                mode: "0644"

            - name: Add the rule options
              ansible.builtin.set_fact:
                amdgpu_loader_desired: >-
                  {%- set options = dict(amdgpu_loader_desired) -%}
                  {%- for name, rule in amdgpu_loader_new_rules.items() -%}
                  {%- set _ = options.update({name: rule.value | string}) -%}
                  {%- endfor -%}
                  {{ options }}
                amdgpu_loader_option_sources: >-
                  {%- set sources = dict(amdgpu_loader_option_sources) -%}
                  {%- for name, rule in amdgpu_loader_new_rules.items() -%}
                  {%- set _ = sources.update({name: rule.reason}) -%}
                  {%- endfor -%}
                  {{ sources }}

            - name: Reload the driver with the rule options
              ansible.builtin.include_tasks: apply.yml

    - name: Report the amdgpu module options
      vars:
        amdgpu_loader_unverifiable: "{{ (amdgpu_loader_after.stdout | from_json).unverifiable }}"
      ansible.builtin.debug:
        msg: >-
          amdgpu on {{ amdgpu_loader_node_name }} runs with {{ amdgpu_loader_desired | to_json }}
          ({{ amdgpu_loader_option_sources | to_json }})
          {%- if amdgpu_loader_applied_by is defined %}; loaded again by {{ amdgpu_loader_applied_by }}{% endif %}
          {%- if amdgpu_loader_unverifiable %}; not readable to verify: {{ amdgpu_loader_unverifiable | join(', ') }}{% endif %}

- name: Stop loading amdgpu at boot
  when: amdgpu_loader_state == 'absent'
  block:
    - name: Read the amdgpu loader unit
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ amdgpu_loader_unit }}"
      register: amdgpu_loader_unit_stat

    - name: Disable the amdgpu loader
      # Only the next boot changes; the loaded driver stays.
      ansible.builtin.systemd:
        name: "{{ amdgpu_loader_unit }}"
        enabled: false
      when: amdgpu_loader_unit_stat.stat.exists

    - name: Remove the amdgpu loader and its options
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/systemd/system/{{ amdgpu_loader_unit }}"
        - "{{ amdgpu_loader_options_file }}"
        - "{{ amdgpu_loader_state_file }}"
      register: amdgpu_loader_removed

    - name: Remove the dependent units' ordering after the amdgpu loader
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.service.d/{{ amdgpu_loader_dropin }}"
        state: absent
      loop: "{{ amdgpu_loader_dependents }}"
      register: amdgpu_loader_ordering_removed

    - name: Reload systemd after removing the amdgpu loader
      ansible.builtin.systemd:
        daemon_reload: true
      when: amdgpu_loader_removed is changed or amdgpu_loader_ordering_removed is changed
