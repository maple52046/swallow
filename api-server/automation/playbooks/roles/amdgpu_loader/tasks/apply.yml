---
# Make the amdgpu driver run with amdgpu_loader_desired: refuse an option the installed driver does
# not have before anything is written, write the options file, load the driver when it is not
# loaded, and load it again (reload.yml) when it runs with other parameters. Ends with the driver
# loaded, /dev/kfd present, and every readable option verified.

- name: Read the amdgpu driver state
  ansible.builtin.script:
    cmd: "amdgpu_node_state.py --desired {{ amdgpu_loader_desired | to_json | b64encode }}"
    executable: /usr/bin/python3
  register: amdgpu_loader_before
  changed_when: false

- name: Refuse an option the amdgpu driver does not have
  vars:
    amdgpu_loader_report: "{{ amdgpu_loader_before.stdout | from_json }}"
  ansible.builtin.fail:
    msg: >-
      [amdgpu_option_unknown] the amdgpu driver on {{ amdgpu_loader_node_name }} has no option
      {{ amdgpu_loader_report.unknown | join(', ') }}
      {%- if amdgpu_loader_report.suggestions %} (did you mean
      {{ amdgpu_loader_report.suggestions.values() | join(', ') }}?){% endif %}. "modinfo -p amdgpu"
      on the node lists the options it has.
  when: (amdgpu_loader_report.unknown | length) > 0

- name: Write the amdgpu module options
  ansible.builtin.template:
    src: swallow-amdgpu.conf.j2
    dest: "{{ amdgpu_loader_options_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Load the amdgpu driver
  # modprobe reads the options file, so a first load already carries the options. Restarting the
  # oneshot unit runs modprobe again even when an earlier run left it active.
  ansible.builtin.systemd:
    name: "{{ amdgpu_loader_unit }}"
    state: restarted
  register: amdgpu_loader_load
  failed_when: false
  when: not (amdgpu_loader_before.stdout | from_json).loaded

- name: Refuse a node whose amdgpu driver did not load
  ansible.builtin.fail:
    msg: >-
      [amdgpu_driver_missing] the amdgpu driver did not load on {{ amdgpu_loader_node_name }}:
      {{ amdgpu_loader_load.msg | default('modprobe amdgpu failed') }}. Check
      "journalctl -u {{ amdgpu_loader_unit }}" on the node.
  when: amdgpu_loader_load is failed

- name: Load the amdgpu driver again with its new options
  ansible.builtin.include_tasks: reload.yml
  when:
    - (amdgpu_loader_before.stdout | from_json).loaded
    - ((amdgpu_loader_before.stdout | from_json).mismatched | length) > 0

- name: Wait for the KFD device
  ansible.builtin.stat:
    path: /dev/kfd
  register: amdgpu_loader_kfd
  until: amdgpu_loader_kfd.stat.exists
  retries: 60
  delay: 5
  failed_when: false

- name: Refuse a node without the KFD device
  ansible.builtin.fail:
    msg: >-
      [amdgpu_driver_missing] {{ amdgpu_loader_node_name }} loaded amdgpu but has no
      /dev/kfd, so no GPU can run workloads. Check the driver messages in the node's kernel
      log.
  when: not amdgpu_loader_kfd.stat.exists

- name: Read the loaded amdgpu parameters
  ansible.builtin.script:
    cmd: "amdgpu_node_state.py --desired {{ amdgpu_loader_desired | to_json | b64encode }}"
    executable: /usr/bin/python3
  register: amdgpu_loader_after
  changed_when: false

- name: Refuse a driver that did not take its options
  vars:
    amdgpu_loader_report: "{{ amdgpu_loader_after.stdout | from_json }}"
  ansible.builtin.fail:
    msg: >-
      [amdgpu_option_not_applied] amdgpu on {{ amdgpu_loader_node_name }} runs with
      {{ amdgpu_loader_report.parameters | to_json }} instead of {{ amdgpu_loader_desired | to_json }}.
      A driver loaded from the initramfs ignores {{ amdgpu_loader_options_file }}; keep amdgpu out
      of the initramfs.
  when: not amdgpu_loader_report.loaded or (amdgpu_loader_report.mismatched | length) > 0

- name: Refuse an option the driver does not expose
  # Only reachable when the driver's option list could not be read, so the names were not checked.
  vars:
    amdgpu_loader_report: "{{ amdgpu_loader_after.stdout | from_json }}"
  ansible.builtin.fail:
    msg: >-
      [amdgpu_option_not_applied] amdgpu on {{ amdgpu_loader_node_name }} does not expose
      {{ amdgpu_loader_report.missing | join(', ') }}; check the names against "modinfo -p amdgpu".
  when: (amdgpu_loader_report.missing | length) > 0
