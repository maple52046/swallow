---
# Verify the requested topology: every control-plane Server is an etcd member and every
# workload-capable Server, including a co-located controller, is a Kubernetes node.

- name: Read the etcd member list
  ansible.builtin.command:
    cmd: /usr/local/bin/k0s etcd member-list
  become: true
  register: k0s_verify_etcd
  changed_when: false

- name: Assert every controller is an etcd member
  ansible.builtin.assert:
    that:
      - (k0s_verify_etcd.stdout | from_json).members | length == swallow_k0s_controller_ids | length
    fail_msg: >-
      expected {{ swallow_k0s_controller_ids | length }} etcd members,
      found {{ (k0s_verify_etcd.stdout | from_json).members | length }}

- name: Read Kubernetes workload nodes
  ansible.builtin.command:
    cmd: /usr/local/bin/k0s kubectl get nodes --no-headers
  become: true
  register: k0s_verify_nodes
  changed_when: false

- name: Assert every workload-capable Server registered as a node
  ansible.builtin.assert:
    that:
      - k0s_verify_nodes.stdout_lines | length == (swallow_k0s_workload_ids | default(swallow_k0s_worker_ids)) | length
    fail_msg: >-
      expected {{ (swallow_k0s_workload_ids | default(swallow_k0s_worker_ids)) | length }} workload nodes,
      found {{ k0s_verify_nodes.stdout_lines | length }}
