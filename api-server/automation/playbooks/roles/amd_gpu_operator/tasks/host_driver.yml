---
# Keep the image's amdgpu driver loaded on every managed node (decision 062). An image may keep
# amdgpu out of the boot path (modprobe.blacklist=amdgpu, AMD's guidance for Instinct hosts and
# SR-IOV guests) and expect it to be loaded afterwards. A managed node therefore gets the shared
# Swallow loader unit (role amdgpu_loader, also used by Slurm GPU GRES), and k0s is ordered after
# it so the operator's device plugin or DRA driver finds the GPUs when it starts. A node Swallow
# does not manage loses the unit and the ordering; a loaded driver is never unloaded.

- name: Converge the shared amdgpu loader and the k0s ordering
  ansible.builtin.include_role:
    name: amdgpu_loader
  vars:
    amdgpu_loader_state: "{{ 'present' if amd_gpu_operator_managed | bool else 'absent' }}"
    amdgpu_loader_unit: "{{ amd_gpu_operator_driver_unit }}"
    amdgpu_loader_dependents: "{{ amd_gpu_operator_k0s_units }}"
    amdgpu_loader_dropin: "{{ amd_gpu_operator_driver_dropin }}"
    amdgpu_loader_owner: AMD GPU Operator
    amdgpu_loader_node_name: "{{ amd_gpu_operator_node_name }}"
    amdgpu_loader_timeout: "{{ amd_gpu_operator_driver_load_timeout }}"
