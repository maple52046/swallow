---
- name: Restart slurmrestd
  # Notified when the listen/auth drop-in changes so slurmrestd re-binds with the new options.
  # Retried like the slurmctld restart: a concurrent unattended-upgrades run can briefly reset
  # systemd's D-Bus connection on a fresh image.
  ansible.builtin.systemd:
    name: slurmrestd
    state: restarted
    daemon_reload: true
  become: true
  register: slurm_slurmrestd_restart
  until: slurm_slurmrestd_restart is succeeded
  retries: 5
  delay: 6
