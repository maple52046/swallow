---
# Expose slurmrestd on the primary controller so Swallow can read membership remotely. The
# packaged unit typically serves a local UNIX socket; a systemd drop-in overrides it to listen
# on a TCP port with JWT authentication.
#
# slurmrestd does not read the JWT signing key: it forwards the token to slurmctld/slurmdbd for
# verification, so it runs as a unique unprivileged user (systemd DynamicUser). SLURM_JWT=daemon
# in its environment activates JWT as the primary authentication mechanism (SchedMD REST guide).

- name: Detect the slurmrestd binary
  # slurmrestd ships in slurm-smd-slurmrestd, which an operator image may omit. It only powers
  # Swallow's membership reads, so its absence must not fail the deploy; the cluster is still
  # fully functional. When absent, this role and the credential role are skipped and the platform
  # deploys without a reader integration (membership will not populate until slurmrestd exists).
  ansible.builtin.stat:
    path: /usr/sbin/slurmrestd
  become: true
  register: slurm_slurmrestd_bin

- name: Record whether slurmrestd is available
  ansible.builtin.set_fact:
    slurm_have_slurmrestd: "{{ slurm_slurmrestd_bin.stat.exists | default(false) }}"

- name: Warn when slurmrestd is not installed
  ansible.builtin.debug:
    msg: >-
      slurmrestd (slurm-smd-slurmrestd) is not installed on this controller. The Slurm cluster
      is deployed and functional, but Swallow cannot read membership until the image includes
      slurm-smd-slurmrestd. Rebuild the image with that package to enable membership.
  when: not (slurm_have_slurmrestd | bool)

- name: Create the slurmrestd systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/slurmrestd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: slurm_have_slurmrestd | bool

- name: Declare the slurmrestd TCP and JWT runtime
  when: slurm_have_slurmrestd | bool
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/slurmrestd.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  register: slurm_slurmrestd_override

- name: Converge and verify the declared slurmrestd runtime
  when: slurm_have_slurmrestd | bool
  block:
    - name: Converge slurmrestd service to the declared unit
      # A changed declaration requires a restart now, not a deferred handler after verification.
      # An unchanged, healthy declaration stays idempotent and only asserts the service is started.
      ansible.builtin.systemd_service:
        name: slurmrestd
        state: "{{ 'restarted' if slurm_slurmrestd_override.changed else 'started' }}"
        enabled: true
        daemon_reload: true
      become: true
      register: slurm_slurmrestd_service
      until: slurm_slurmrestd_service is succeeded
      retries: 5
      delay: 6

    - name: Probe the desired slurmrestd TCP listener
      # A prior deployment may have written this exact drop-in and failed before restarting. The
      # file then has no diff on retry even though the live process still uses the packaged UNIX
      # socket. Treat a missing listener as runtime drift instead of restarting healthy services.
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ slurmrestd_port }}"
        connect_timeout: 1
        timeout: 1
        state: started
      register: slurm_slurmrestd_listener_probe
      changed_when: false
      failed_when: false

    - name: Reconcile slurmrestd runtime drift
      ansible.builtin.systemd_service:
        name: slurmrestd
        state: restarted
        enabled: true
        daemon_reload: true
      become: true
      register: slurm_slurmrestd_reconcile
      until: slurm_slurmrestd_reconcile is succeeded
      retries: 5
      delay: 6
      when: (slurm_slurmrestd_listener_probe.msg | default('') | length) > 0

    - name: Wait for slurmrestd to accept TCP connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ slurmrestd_port }}"
        timeout: 60
        state: started
  rescue:
    - name: Capture slurmrestd systemd status for diagnostics
      ansible.builtin.command:
        argv: [systemctl, status, slurmrestd, --no-pager, --full]
      become: true
      register: slurm_slurmrestd_status
      changed_when: false
      failed_when: false

    - name: Capture the recent slurmrestd journal for diagnostics
      ansible.builtin.command:
        argv: [journalctl, -u, slurmrestd, --no-pager, --lines=30]
      become: true
      register: slurm_slurmrestd_journal
      changed_when: false
      failed_when: false

    - name: Fail with the slurmrestd convergence diagnostics
      ansible.builtin.fail:
        msg: >-
          slurmrestd did not converge to the declared TCP listener
          127.0.0.1:{{ slurmrestd_port }} on {{ inventory_hostname }}.
          systemd status: {{ (slurm_slurmrestd_status.stdout_lines | default([]))[-8:] | join(' | ') | default('(status unavailable)', true) }}.
          journal tail: {{ (slurm_slurmrestd_journal.stdout_lines | default([]))[-12:] | join(' | ') | default('(journal unavailable)', true) }}
