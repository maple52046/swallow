---
# Mint the bearer token Swallow reads the cluster with, then return it only through the
# run's private result file. Every task touching the token remains no_log.

- name: Render the Swallow reader objects
  ansible.builtin.template:
    src: swallow-reader.yaml.j2
    dest: /etc/k0s/swallow-reader.yaml
    mode: "0600"
  become: true

- name: Apply the Swallow reader objects
  ansible.builtin.command:
    cmd: /usr/local/bin/k0s kubectl apply -f /etc/k0s/swallow-reader.yaml
  become: true
  changed_when: true

- name: Read the reader token secret
  ansible.builtin.command:
    cmd: /usr/local/bin/k0s kubectl -n kube-system get secret swallow-reader-token -o json
  become: true
  register: k0s_reader_secret
  no_log: true
  changed_when: false
  until: (k0s_reader_secret.stdout | from_json).data.token is defined
  retries: 12
  delay: 5

- name: Extract the reader token
  ansible.builtin.set_fact:
    k0s_reader_token: "{{ (k0s_reader_secret.stdout | from_json).data.token | b64decode }}"
  no_log: true

- name: Write the deployment result for Swallow
  ansible.builtin.copy:
    dest: "{{ swallow_result_path }}"
    content: >-
      {{ {'apiEndpoint': 'https://' ~ (swallow_k0s_api_address | default(swallow_k0s_api_vip)) ~ ':6443',
          'token': k0s_reader_token} | to_json }}
    mode: "0600"
  delegate_to: localhost
  no_log: true
  when: swallow_result_path is defined and swallow_result_path | length > 0
