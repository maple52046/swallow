---
# Remove the Docker Compose container. Tolerates a host whose Docker CE is already gone.

- name: Read the Grafana Compose project
  ansible.builtin.stat:
    path: "{{ grafana_config_dir }}/compose.yaml"
  register: grafana_compose_file

- name: Stop and remove the Grafana Compose container
  when: grafana_compose_file.stat.exists
  block:
    - name: Stop and remove the Grafana Compose container
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ grafana_config_dir }}/compose.yaml", down, --remove-orphans]
      register: grafana_compose_down
      changed_when: true
      failed_when: grafana_compose_down.rc != 0 and 'No such file or directory' not in (grafana_compose_down.msg | default(''))

    - name: Remove the Grafana Compose project
      ansible.builtin.file:
        path: "{{ grafana_config_dir }}/compose.yaml"
        state: absent
