---
# Bootstrap the first control-plane Server. Workload co-location uses --enable-worker and
# --no-taints instead of the non-expandable single-node flag so a standalone deployment can be expanded later.

- name: Check for an existing controller service
  ansible.builtin.stat:
    path: /etc/systemd/system/k0scontroller.service
  register: k0s_controller_unit

- name: Write the shared k0s config
  ansible.builtin.include_role:
    name: k0s_config

- name: Install the initial controller
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/k0s install controller -c /etc/k0s/k0s.yaml
      {{ '--enable-worker --no-taints' if (k0s_runs_workloads | bool) else '' }}
  become: true
  when: not k0s_controller_unit.stat.exists
  changed_when: true

- name: Start k0s
  ansible.builtin.systemd:
    name: k0scontroller
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for the control plane to become ready
  ansible.builtin.command:
    cmd: /usr/local/bin/k0s kubectl get --raw /readyz
  become: true
  register: k0s_readyz
  until: k0s_readyz.rc == 0 and 'ok' in k0s_readyz.stdout
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for the initial controller workload node to become Ready
  ansible.builtin.command:
    cmd: /usr/local/bin/k0s kubectl wait --for=condition=Ready node/{{ k0s_node_name }} --timeout=120s
  become: true
  register: k0s_initial_worker_ready
  until: k0s_initial_worker_ready.rc == 0
  retries: 10
  delay: 15
  changed_when: false
  when: k0s_runs_workloads | bool
