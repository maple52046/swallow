---
- name: Restart slurmctld
  # Notified by slurm_config when slurm.conf, cgroup.conf, gres.conf, or the JWT key changed, so
  # the controller picks up the new configuration. Defined here but shared across the controller
  # play's roles, since handlers are play-wide. A freshly booted image may run unattended-upgrades
  # at the same time; an upgrade that restarts polkit or D-Bus briefly resets systemd's D-Bus
  # connection, so a transient restart failure is retried instead of failing the deployment.
  ansible.builtin.systemd:
    name: slurmctld
    state: restarted
    daemon_reload: true
  become: true
  register: slurm_controller_restart
  until: slurm_controller_restart is succeeded
  retries: 5
  delay: 6
