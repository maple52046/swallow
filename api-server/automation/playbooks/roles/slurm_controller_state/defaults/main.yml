---
# Controller state placement. 'local' keeps StateSaveLocation on a controller-local disk (a
# single controller needs no sharing); 'shared' mounts one NFS export on every controller so a
# backup slurmctld can recover state on takeover. The playbook sets these from trusted vars.
slurm_controller_state_mode: local
# StateSaveLocation on this controller: the mount path in 'shared' mode, the local dir in
# 'local' mode. Matches slurm.conf's StateSaveLocation.
slurm_state_save_location: /var/spool/slurmctld
# NFS source (host:/export) for 'shared' mode; empty in 'local' mode.
slurm_state_source: ""
slurm_state_fstype: nfs4
# hard + _netdev so slurmctld blocks rather than corrupts state if the server blips, and the
# mount is treated as network storage ordered after the network is up.
slurm_state_mount_options: rw,_netdev,hard,timeo=600,retrans=2
