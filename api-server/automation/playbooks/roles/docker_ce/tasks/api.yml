---
# Converge the Docker Engine API TCP listener that the Docker Host Explorer dials (decision 043).
#
# The listener exists only while Docker CE is present and docker_ce_api_enabled is true; any other
# combination (disabled, or the role running with state=absent) removes swallow's configuration.
# It is a systemd drop-in that keeps the stock `-H fd://` socket and adds `-H tcp://...` — Docker's
# documented remote-access method — instead of a daemon.json "hosts" key, which would collide with
# the unit's -H flag and with any daemon.json the operator owns. A listener change restarts dockerd,
# which stops containers without a restart policy; the dashboard warns before toggling.

- name: Resolve whether the Docker Engine API should listen
  ansible.builtin.set_fact:
    docker_ce_api_listen: "{{ docker_ce_state == 'present' and (docker_ce_api_enabled | bool) }}"

- name: Ensure the Docker service drop-in directory exists
  when: docker_ce_api_listen | bool
  become: true
  ansible.builtin.file:
    path: "{{ docker_ce_api_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the swallow Docker Engine API listener drop-in
  when: docker_ce_api_listen | bool
  become: true
  ansible.builtin.copy:
    dest: "{{ docker_ce_api_dropin }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by swallow (Docker CE Managed Software, spec.enableApi). The next install ensure
      # rewrites or removes this file; do not edit it by hand.
      [Service]
      ExecStart=
      ExecStart=/usr/bin/dockerd -H fd:// -H tcp://0.0.0.0:{{ docker_ce_api_port }} --containerd=/run/containerd/containerd.sock
  register: docker_ce_api_dropin_write

- name: Remove the swallow Docker Engine API listener drop-in
  when: not (docker_ce_api_listen | bool)
  become: true
  ansible.builtin.file:
    path: "{{ docker_ce_api_dropin }}"
    state: absent
  register: docker_ce_api_dropin_remove

- name: Restart Docker to apply the listener change
  when:
    - docker_ce_state == 'present'
    - (docker_ce_api_dropin_write is changed) or (docker_ce_api_dropin_remove is changed)
  become: true
  ansible.builtin.systemd_service:
    name: docker
    daemon_reload: true
    state: restarted

- name: Reload systemd after removing the listener drop-in
  # Uninstall stops and removes the daemon next; reloading keeps systemd from holding the stale unit.
  when:
    - docker_ce_state == 'absent'
    - docker_ce_api_dropin_remove is changed
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Read whether firewalld is active
  # Only the RHEL family ships an active firewall on swallow's images; ufw on the MAAS Ubuntu images
  # is inactive by default and is not managed here.
  when: ansible_facts['os_family'] == 'RedHat'
  become: true
  ansible.builtin.command:
    argv: [systemctl, is-active, firewalld]
  register: docker_ce_firewalld_state
  changed_when: false
  failed_when: false

- name: Query the Docker Engine API port in firewalld (runtime and permanent)
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - (docker_ce_firewalld_state.stdout | default('')) == 'active'
  become: true
  ansible.builtin.command:
    argv: "{{ ['firewall-cmd'] + item + ['--query-port=' ~ docker_ce_api_port ~ '/tcp'] }}"
  loop:
    - []
    - ['--permanent']
  register: docker_ce_firewalld_query
  changed_when: false
  failed_when: docker_ce_firewalld_query.rc not in [0, 1]

- name: Open or close the Docker Engine API port in firewalld
  # The runtime and permanent sets are changed directly instead of reloading firewalld, because a
  # reload can flush the chains Docker programs for published container ports. Skipped items carry
  # no rc and are filtered out, so a host without an active firewalld loops over nothing.
  when: (item.rc == 0) != (docker_ce_api_listen | bool)
  become: true
  ansible.builtin.command:
    argv: "{{ ['firewall-cmd'] + item.item + [('--add-port=' if (docker_ce_api_listen | bool) else '--remove-port=') ~ docker_ce_api_port ~ '/tcp'] }}"
  loop: "{{ docker_ce_firewalld_query.results | default([]) | selectattr('rc', 'defined') | list }}"
  changed_when: true

- name: Wait for the Docker Engine API to listen
  # Fails the install clearly when dockerd did not come up with the listener, instead of leaving the
  # assignment `installed` while the explorer can never connect.
  when: docker_ce_api_listen | bool
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ docker_ce_api_port | int }}"
    timeout: 60
