---
# AMD Device Metrics Exporter on a GPU node (Managed Software device-metrics-exporter, decision
# 068). Intent arrives as trusted swallow_device_metrics_exporter_* vars from a standalone software
# install or a Slurm deployment; nothing here is an operator choice except the profiler, which only
# operations turn on for a bounded measurement.
device_metrics_exporter_version: "{{ swallow_device_metrics_exporter_version | default('1.5.3', true) }}"
# Which scheduler GPU metrics are attributed to: none (standalone) or slurm. A Slurm run accepted
# before decision 068 sends compute ids but no attribution, so it still reads as slurm.
device_metrics_exporter_job_attribution: >-
  {{ (swallow_device_metrics_exporter_job_attribution
      | default('slurm' if swallow_device_metrics_exporter_compute_ids is defined else 'none', true)) | trim }}
device_metrics_exporter_slurm: "{{ device_metrics_exporter_job_attribution == 'slurm' }}"
# AMD's native Ubuntu package per version: gpuagent and amd-metrics-exporter under systemd, with
# their runtime libraries embedded, so no privileged container and no apt repository is needed.
# config is the package's own /etc/metrics/config.json, kept unchanged as the base Swallow overrides.
device_metrics_exporter_packages:
  "1.5.3":
    url: https://repo.radeon.com/device-metrics-exporter/apt/1.5.3/pool/main/a/amdgpu-exporter/amdgpu-exporter_1.5.3~24.04_amd64.deb
    checksum: sha256:fa5cc3f949c89f3e944798bf6326cded16de7aca6449e80de7376d2b824886b7
    version: 1.5.3~24.04
    distribution_release: noble
    config: config-1.5.3.json
device_metrics_exporter_package: "{{ device_metrics_exporter_packages[device_metrics_exporter_version] }}"
device_metrics_exporter_cache_dir: /var/cache/swallow
# Swallow's own GPU exporter (RDC) owns port 5000 on a host (decision 003), AMD's default here.
device_metrics_exporter_port: "{{ swallow_device_metrics_exporter_port | default(5001) | int }}"
# The exporter answers on the address Prometheus scrapes, never on every interface.
device_metrics_exporter_bind: "{{ ansible_host }}"
device_metrics_exporter_cluster_name: "{{ swallow_device_metrics_exporter_cluster_name | default('slurm', true) }}"
device_metrics_exporter_config_dir: /etc/swallow/device-metrics-exporter
device_metrics_exporter_config: "{{ device_metrics_exporter_config_dir }}/config.json"
# The directory the Slurm job hook writes and the exporter watches (its compiled-in /var/run/exporter).
# Node-local runtime state: tmpfiles creates it at boot, and it never lives on shared storage.
device_metrics_exporter_job_dir: /run/exporter
device_metrics_exporter_tmpfiles: /etc/tmpfiles.d/swallow-device-metrics-exporter.conf
# Hardware profiler counters stay off: the hardware serves one profiler at a time, so they would
# take it from users' rocprof and Omnistat. Operations may turn them on for a bounded measurement
# (swallow_device_metrics_exporter_profiler=true) and must turn them off again.
device_metrics_exporter_profiler: "{{ swallow_device_metrics_exporter_profiler | default(false) | bool }}"
# Labels on every GPU metric: GPU identity, the Slurm job the GPU is attributed to, and the host.
# The Kubernetes labels (pod, namespace, container) have no meaning on a Slurm node, and the job
# labels (device_metrics_exporter_job_labels) none without Slurm attribution.
device_metrics_exporter_labels:
  - GPU_UUID
  - SERIAL_NUMBER
  - GPU_ID
  - JOB_ID
  - JOB_USER
  - JOB_PARTITION
  - CLUSTER_NAME
  - CARD_SERIES
  - CARD_MODEL
  - CARD_VENDOR
  - DRIVER_VERSION
  - VBIOS_VERSION
  - HOSTNAME
  - GPU_PARTITION_ID
  - GPU_COMPUTE_PARTITION_TYPE
  - GPU_MEMORY_PARTITION_TYPE
  - KFD_PROCESS_ID
  - DEPLOYMENT_MODE
device_metrics_exporter_job_labels:
  - JOB_ID
  - JOB_USER
  - JOB_PARTITION
  - CLUSTER_NAME
# The exporter starts after the GPU driver: gpuagent requires the shared post-boot amdgpu loader.
device_metrics_exporter_amdgpu_unit: swallow-amdgpu-load.service
device_metrics_exporter_dropin_name: 10-swallow.conf
# Compares the GPUs KFD lists with the GPU identities the exporter reports (the identity gate).
device_metrics_exporter_identity_check: /usr/local/libexec/swallow/dme-identity-check
