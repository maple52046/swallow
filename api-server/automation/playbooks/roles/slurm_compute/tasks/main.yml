---
# Configure and start slurmd on a compute node. A compute-only node is configless: it keeps no
# local slurm.conf and points slurmd at the controllers with --conf-server, fetching config at
# startup. A node that is also a controller uses the local slurm.conf that slurm_config wrote.

- name: Ensure slurmd runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
  become: true
  loop:
    - /var/spool/slurmd
    - "{{ slurm_log_dir }}"

- name: Compute the ordered configless conf-server list
  # Compute nodes try controllers in SlurmctldHost order; addresses (not hostnames) keep the
  # fetch working without site DNS.
  ansible.builtin.set_fact:
    slurm_conf_servers: >-
      {{ swallow_slurm_controller_ids
         | map('extract', hostvars, 'ansible_host')
         | map('regex_replace', '^(.*)$', '\1:6817')
         | join(',') }}

- name: Remove any local slurm.conf on a configless compute-only node
  # Configless requires no authoritative local slurm.conf; an image may ship a sample, so
  # remove it. A controller+compute node keeps its local config and is skipped.
  ansible.builtin.file:
    path: "{{ slurm_conf_dir }}/slurm.conf"
    state: absent
  become: true
  when: not (slurm_is_controller | bool)

- name: Point slurmd at the controllers for configless startup
  ansible.builtin.copy:
    dest: /etc/default/slurmd
    content: |
      # Managed by Swallow (deploy-slurm): configless slurmd.
      SLURMD_OPTIONS="--conf-server {{ slurm_conf_servers }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not (slurm_is_controller | bool)
  notify: Restart slurmd

- name: Install the Omnistat job-attribution Prolog and Epilog
  # slurmd runs these on the compute node at allocation start and end (decision 063). The Prolog
  # succeeds without attribution until configure-omnistat has installed the exporter, so the
  # order of the deployment's Jobs never fails a job or drains the node.
  ansible.builtin.copy:
    dest: "{{ slurm_conf_dir }}/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - name: "{{ slurm_omnistat_prolog }}"
      content: |
        #!/bin/bash
        # Managed by Swallow (deploy-slurm): Omnistat job attribution Prolog.
        set -u
        readonly rms_env=/opt/omnistat/current/venv/bin/omnistat-rms-env
        readonly job_file=/tmp/omni_rmsjobinfo
        if [ ! -x "$rms_env" ] || ! id omnistat >/dev/null 2>&1; then
          exit 0
        fi
        exec /usr/sbin/runuser --user omnistat --preserve-environment -- "$rms_env" "$job_file"
    - name: "{{ slurm_omnistat_epilog }}"
      content: |
        #!/bin/bash
        # Managed by Swallow (deploy-slurm): Omnistat job attribution Epilog.
        rm -f /tmp/omni_rmsjobinfo
        exit 0
  loop_control:
    label: "{{ item.name }}"
  when: slurm_omnistat_enabled | bool

- name: Remove the Omnistat Prolog and Epilog when Omnistat is off
  ansible.builtin.file:
    path: "{{ slurm_conf_dir }}/{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ slurm_omnistat_prolog }}"
    - "{{ slurm_omnistat_epilog }}"
  when: not (slurm_omnistat_enabled | bool)

- name: Enable and start slurmd
  ansible.builtin.systemd:
    name: slurmd
    state: started
    enabled: true
    daemon_reload: true
  become: true
  register: slurm_compute_started

- name: Restart slurmd to fetch a changed configuration
  # A slurmd that was already running keeps the configless slurm.conf/gres.conf it fetched at
  # start; one this run just started already has the new files.
  ansible.builtin.systemd:
    name: slurmd
    state: restarted
  become: true
  when:
    - slurm_compute_started is not changed
    - hostvars[swallow_slurm_primary_controller_id].slurm_config_changed | default(false) | bool
