---
# Remove the k0s installation created by Swallow while preserving the host OS,
# operator data, conntrack, and unrelated packages. Every task tolerates a node that
# was only partly installed or was already cleaned by an earlier attempt.

- name: Uninstall k0s from the original deployment targets
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Check for the k0s binary
      ansible.builtin.stat:
        path: /usr/local/bin/k0s
      register: k0s_uninstall_binary

    - name: Check for the controller service
      ansible.builtin.stat:
        path: /etc/systemd/system/k0scontroller.service
      register: k0s_uninstall_controller

    - name: Check for the worker service
      ansible.builtin.stat:
        path: /etc/systemd/system/k0sworker.service
      register: k0s_uninstall_worker

    - name: Check for k0s configuration
      ansible.builtin.stat:
        path: /etc/k0s
      register: k0s_uninstall_config

    - name: Check for k0s runtime state
      ansible.builtin.stat:
        path: /var/lib/k0s
      register: k0s_uninstall_state

    - name: Stop and disable installed k0s services
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        state: stopped
        enabled: false
      loop:
        - name: k0scontroller
          installed: "{{ k0s_uninstall_controller.stat.exists }}"
        - name: k0sworker
          installed: "{{ k0s_uninstall_worker.stat.exists }}"
      when: item.installed | bool

    - name: Reset k0s state
      ansible.builtin.command:
        cmd: /usr/local/bin/k0s reset
      register: k0s_uninstall_reset
      changed_when: >-
        k0s_uninstall_controller.stat.exists or
        k0s_uninstall_worker.stat.exists or
        k0s_uninstall_config.stat.exists or
        k0s_uninstall_state.stat.exists
      when:
        - k0s_uninstall_binary.stat.exists
        - >-
          k0s_uninstall_controller.stat.exists or
          k0s_uninstall_worker.stat.exists or
          k0s_uninstall_config.stat.exists or
          k0s_uninstall_state.stat.exists

    - name: Remove Swallow-created k0s artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/k0s
        - /var/lib/k0s
        - /etc/systemd/system/k0scontroller.service
        - /etc/systemd/system/k0sworker.service
        - /etc/systemd/system/multi-user.target.wants/k0scontroller.service
        - /etc/systemd/system/multi-user.target.wants/k0sworker.service
        - /tmp/get-k0s.sh
        - /usr/local/bin/k0s

    - name: Read the GPU Operator's DRA link paths
      # k0s reset removed the operator with the cluster, but the DRA links live outside k0s
      # state (decision 062). Only the exact links Swallow creates are removed.
      ansible.builtin.stat:
        path: "{{ item.link }}"
        follow: false
      loop:
        - link: /var/lib/kubelet/plugins
          target: /var/lib/k0s/kubelet/plugins
        - link: /var/lib/kubelet/plugins_registry
          target: /var/lib/k0s/kubelet/plugins_registry
      register: k0s_uninstall_dra_links

    - name: Remove the GPU Operator's DRA links
      ansible.builtin.file:
        path: "{{ item.item.link }}"
        state: absent
      loop: "{{ k0s_uninstall_dra_links.results }}"
      loop_control:
        label: "{{ item.item.link }}"
      when:
        - item.stat.exists
        - item.stat.islnk
        - item.stat.lnk_source == item.item.target

    - name: Remove the GPU Operator's DRA common CDI spec
      # The DRA driver writes it outside k0s state; k0s reset leaves it behind.
      ansible.builtin.file:
        path: /var/run/cdi/k8s.gpu.amd.com-gpu_common.yaml
        state: absent

    - name: Remove the GPU Operator's helm and chart
      ansible.builtin.file:
        path: /usr/local/lib/swallow/amd-gpu-operator
        state: absent

    - name: Read the GPU Operator's amdgpu loader
      ansible.builtin.stat:
        path: /etc/systemd/system/swallow-amdgpu-load.service
      register: k0s_uninstall_amdgpu_loader

    - name: Disable the GPU Operator's amdgpu loader
      # The loaded driver stays; only the next boot goes back to the image's own policy.
      ansible.builtin.systemd:
        name: swallow-amdgpu-load.service
        enabled: false
      when: k0s_uninstall_amdgpu_loader.stat.exists

    - name: Remove the GPU Operator's amdgpu loader, its module options, and its k0s ordering
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/swallow-amdgpu-load.service
        - /etc/modprobe.d/swallow-amdgpu.conf
        - /var/lib/swallow/amdgpu/options.json
        - /etc/systemd/system/k0scontroller.service.d/10-swallow-after-amdgpu.conf
        - /etc/systemd/system/k0sworker.service.d/10-swallow-after-amdgpu.conf

    - name: Reload systemd after removing k0s units
      ansible.builtin.systemd:
        daemon_reload: true
