---
# Remove Podman that swallow installed as Managed Software, leaving the host OS intact
# (docs/development/software-deployment.md). Idempotent: a host without Podman reruns with no
# changes. swallow marks the Software Assignment absent on success.

- name: Uninstall Podman
  hosts: all
  gather_facts: true
  roles:
    - role: podman
      vars:
        podman_state: absent
