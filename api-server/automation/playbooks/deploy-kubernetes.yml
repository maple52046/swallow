---
# Deploy k0s onto already-provisioned Servers. Topology is supplied only through trusted
# variables: one control-plane Server is non-HA, while three or more odd control-plane
# Servers enable the keepalived path in the shared configuration.

- name: Classify k0s nodes by assigned role
  hosts: all
  gather_facts: false
  tasks:
    - name: Resolve this host's role and workload placement
      ansible.builtin.set_fact:
        k0s_role: "{{ swallow_k0s_roles[inventory_hostname] }}"
        k0s_is_initial: "{{ inventory_hostname == swallow_k0s_initial_controller_id }}"
        k0s_runs_workloads: >-
          {{ swallow_k0s_roles[inventory_hostname] == 'worker' or
             inventory_hostname in (swallow_k0s_workload_controller_ids | default([])) }}

    - name: Fail on an unassigned host
      ansible.builtin.fail:
        msg: "server {{ inventory_hostname }} has no role assignment"
      when: k0s_role is not defined or k0s_role | length == 0

    - name: Group by k0s membership
      ansible.builtin.group_by:
        key: >-
          {{ 'k0s_initial_controller' if k0s_is_initial
             else ('k0s_controller' if k0s_role == 'control-plane' else 'k0s_worker') }}

- name: Prepare every node
  hosts: all
  gather_facts: true
  tasks:
    - name: Remember this node's kubernetes name
      # k0s names a node by its hostname, which is the key used in etcd member-list and in
      # the node list, not the serverId that keys the inventory.
      ansible.builtin.set_fact:
        k0s_node_name: "{{ ansible_hostname }}"
  roles:
    - role: k0s_prereq
    - role: k0s_binary

- name: Bootstrap the initial controller
  hosts: k0s_initial_controller
  gather_facts: false
  roles:
    - role: k0s_controller_bootstrap

- name: Join the remaining controllers one at a time
  hosts: k0s_controller
  gather_facts: false
  serial: 1
  roles:
    - role: k0s_controller_join

- name: Join the workload-only nodes
  hosts: k0s_worker
  gather_facts: false
  roles:
    - role: k0s_worker_join

- name: Record Swallow's read credential and verify the cluster
  hosts: k0s_initial_controller
  gather_facts: false
  roles:
    - role: k0s_cluster_credential
    - role: k0s_verify
