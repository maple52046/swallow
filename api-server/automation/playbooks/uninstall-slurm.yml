---
# Remove the Slurm configuration and daemons Swallow deployed while preserving the host OS and
# the image-supplied slurm-smd packages. Every task tolerates a node that was only partly
# configured or already cleaned by an earlier attempt, so the playbook is safe to rerun and
# runs uniformly on every target regardless of the daemon roles it had.

- name: Uninstall Slurm from the original deployment targets
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Stop and disable Slurm and MUNGE daemons
      # Order matters on shutdown: stop the REST and node daemons before the controller, and
      # MUNGE last. Missing units are tolerated (a node may never have run a given daemon).
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - slurmrestd
        - slurmd
        - slurmctld
        - munge

    - name: Remove the Swallow slurmrestd systemd drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/slurmrestd.service.d/override.conf
        state: absent

    - name: Reload systemd after removing the drop-in
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Remove Swallow-managed Slurm configuration, keys, and state
      # slurm.conf/cgroup.conf and the JWT key are Swallow-rendered; the default controller
      # StateSaveLocation and slurmd spool are Swallow-created runtime state. The MUNGE key is
      # removed so a later redeploy mints a fresh shared key. Image-supplied packages are left
      # installed. A non-default (HA) StateSaveLocation on shared storage is intentionally not
      # touched here.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/slurm/slurm.conf
        - /etc/slurm/cgroup.conf
        - /etc/slurm/gres.conf
        - /etc/slurm/oci.conf
        - /var/lib/swallow/oci
        - /etc/slurm/swallow-omnistat-prolog
        - /etc/slurm/swallow-omnistat-epilog
        - /etc/slurm/swallow-prolog
        - /etc/slurm/swallow-epilog
        - /etc/slurm/prolog.d/10-omnistat
        - /etc/slurm/epilog.d/10-omnistat
        - /etc/slurm/prolog.d/20-device-metrics-exporter
        - /etc/slurm/epilog.d/20-device-metrics-exporter
        - /etc/slurm/jwt_hs256.key
        - /etc/udev/rules.d/70-swallow-slurm-gpu.rules
        - /etc/default/slurmd
        - /var/spool/slurmctld
        - /var/spool/slurmd
        - /etc/munge/munge.key

    - name: Remove the job hook directories unless an operator keeps their own hooks there
      ansible.builtin.command:
        argv: [rmdir, --ignore-fail-on-non-empty, /etc/slurm/prolog.d, /etc/slurm/epilog.d]
        removes: /etc/slurm/prolog.d
      failed_when: false

    - name: Stop and disable the Omnistat exporter
      # Omnistat is part of the Slurm Platform (decision 063); a node that never ran it is fine.
      ansible.builtin.systemd:
        name: omnistat
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the Omnistat exporter, its configuration, its job file, and the HIP probe
      # Prometheus, Grafana, and Docker CE are Managed Software with their own assignments and are
      # left for the software uninstall.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/omnistat.service
        - /etc/omnistat
        - /opt/omnistat
        - /tmp/omni_rmsjobinfo
        - /usr/local/libexec/swallow/hip-probe
        - /usr/local/libexec/swallow/mpi-probe

    - name: Remove the Device Metrics Exporter
      # Part of the Slurm Platform's feature (decision 068): the exporter goes from every target,
      # and a successful uninstall marks those Servers' device-metrics-exporter assignments absent.
      # A node that never ran it is fine.
      ansible.builtin.include_role:
        name: device_metrics_exporter
        tasks_from: uninstall

    - name: Stop loading amdgpu for Slurm and remove slurmd's ordering after it
      ansible.builtin.include_role:
        name: amdgpu_loader
      vars:
        amdgpu_loader_state: absent
        amdgpu_loader_dependents:
          - slurmd
