# swallow config example
# Values shown here are for local development only.
# Production deployments must override jwtSecret, bootstrapAdminPassword,
# mongoUri, nodeAuthToken, and agent.authToken with real credentials — never commit secrets.

api:
  # HTTP listen address for the API server.
  addr: ":30051"

  # gRPC listen address for the agent stream service.
  grpcAddr: ":50051"

  # MongoDB connection string.
  mongoUri: "mongodb://localhost:27017"

  # MongoDB database name.
  mongoDb: "swallow"

  # HMAC secret for signing JWT tokens. Must be kept private.
  jwtSecret: "dev-secret-change-in-production"

  # JWT token validity window in hours.
  jwtExpiryHours: 24

  # Admin user seeded on first startup. Ignored if the user already exists.
  bootstrapAdminUsername: "admin"
  bootstrapAdminPassword: "admin"

  # Shared secret that all agents must present when establishing gRPC connections.
  # Must match agent.authToken on every node. Never log or commit this value.
  nodeAuthToken: "changeme-node-secret"

agent:
  # Pre-configured node ID. When empty, the agent reads from stateFile
  # or auto-generates a UUID (which must then be registered in the API server).
  nodeId: ""

  # gRPC address of the API server this agent connects to.
  serverAddress: "localhost:50051"

  # How often the agent sends a heartbeat over the gRPC stream.
  heartbeatInterval: "30s"

  # Path to the local state file used to persist the auto-generated node ID.
  stateFile: "/var/lib/swallow/agent-state.json"

  # Bearer token sent to the API server when establishing the gRPC connection.
  # Must match api.nodeAuthToken on the server side. Must be kept private; do not commit.
  authToken: "changeme-node-secret"
