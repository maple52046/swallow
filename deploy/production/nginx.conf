worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Docker's embedded DNS. Recreating the api-server container alone (an upgrade that changes only
  # its image) gives it a new address; the upstream re-resolves it instead of keeping the address
  # it saw at startup, and keeps its keepalive pool.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream swallow_api {
    zone swallow_api 64k;
    server api-server:30051 resolve;
    keepalive 16;
  }

  # The installation serves plain HTTP; TLS, when required, terminates in front of it and
  # forwards X-Forwarded-Proto, which is passed through unchanged.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    # Every API request body is at most 4 MiB (the api-server enforces the same limit). Server-Sent
    # Events (servers/stream) pass through unbuffered and may stay open for long.
    location /api/ {
      proxy_pass http://swallow_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
      proxy_read_timeout 1h;
      client_max_body_size 4m;
      error_page 413 = @api_payload_too_large;
    }

    # The OS image upload content is the one multi-gigabyte body: it streams to the api-server
    # unbuffered and unlimited here, because the api-server requires it to be exactly the size the
    # upload declared, within the installation's image upload limit.
    location ~ ^/api/v1/provisioning/image-uploads/[^/]+/content$ {
      proxy_pass http://swallow_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1h;
      client_max_body_size 0;
    }

    # A body over the /api/ limit is refused here in the API's error envelope, so clients see the
    # same payload_too_large they get from the api-server; the request ID is the one nginx would
    # have forwarded. A location's add_header replaces the server's, so those are repeated.
    location @api_payload_too_large {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Request-ID $request_id always;
      return 413 '{"error":{"code":"payload_too_large","message":"The request body exceeds the size this route accepts.","requestId":"$request_id"}}';
    }

    location = /healthz { proxy_pass http://swallow_api/healthz; }
    location = /livez { proxy_pass http://swallow_api/livez; }
    location = /readyz { proxy_pass http://swallow_api/readyz; }
    location = /metrics { proxy_pass http://swallow_api/metrics; }

    # Boot Media iPXE ISO (decision 047): BMCs mount it over plain HTTP on this port without a
    # credential and read it in byte ranges at every boot, so Range headers pass through.
    location /boot-media/ {
      proxy_pass http://swallow_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
    }

    # Server Enrollment downloads (decision 053): the enrollment script and the CLI, fetched without
    # a credential by hosts that keep their OS. The full Host (with its port) is passed because the
    # script points its CLI download at the address it was fetched from.
    location /downloads/ {
      proxy_pass http://swallow_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
