worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  upstream swallow_api {
    server api-server:30051;
    keepalive 16;
  }

  # The installation serves plain HTTP; TLS, when required, terminates in front of it and
  # forwards X-Forwarded-Proto, which is passed through unchanged.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://swallow_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      # Server-Sent Events (servers/stream) and multi-gigabyte OS image uploads pass
      # through unbuffered; the API enforces its own upload limit.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1h;
      client_max_body_size 0;
    }

    location = /healthz { proxy_pass http://swallow_api/healthz; }
    location = /livez { proxy_pass http://swallow_api/livez; }
    location = /readyz { proxy_pass http://swallow_api/readyz; }
    location = /metrics { proxy_pass http://swallow_api/metrics; }

    # Boot Media iPXE ISO (decision 047): BMCs mount it over plain HTTP on this port without a
    # credential and read it in byte ranges at every boot, so Range headers pass through.
    location /boot-media/ {
      proxy_pass http://swallow_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
