worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  upstream swallow_api {
    server api-server:30051;
    keepalive 16;
  }

  server {
    listen 8080;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://swallow_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /healthz { proxy_pass http://swallow_api/healthz; }
    location = /livez { proxy_pass http://swallow_api/livez; }
    location = /readyz { proxy_pass http://swallow_api/readyz; }
    location = /metrics { proxy_pass http://swallow_api/metrics; }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
