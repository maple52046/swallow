server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /etc/swallow/tls/tls.crt;
    ssl_certificate_key /etc/swallow/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/swallow/current/dashboard;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:30051;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
    location = /healthz { proxy_pass http://127.0.0.1:30051/healthz; }
    location = /livez { proxy_pass http://127.0.0.1:30051/livez; }
    location = /readyz { proxy_pass http://127.0.0.1:30051/readyz; }
    location = /metrics { proxy_pass http://127.0.0.1:30051/metrics; }
    location / { try_files $uri $uri/ /index.html; }
}
