server {
    listen 80;
    server_name _;
    # Boot Media iPXE ISO (decision 047): many BMCs mount only plain http:// on port 80, so this
    # one path is served here instead of being redirected to HTTPS.
    location /boot-media/ {
        proxy_pass http://127.0.0.1:30051;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /etc/swallow/tls/tls.crt;
    ssl_certificate_key /etc/swallow/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/swallow/current/dashboard;
    index index.html;

    # Every API request body is at most 4 MiB (the api-server enforces the same limit). Server-Sent
    # Events (servers/stream) pass through unbuffered and may stay open for long.
    location /api/ {
        proxy_pass http://127.0.0.1:30051;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 4m;
        error_page 413 = @api_payload_too_large;
    }
    # The OS image upload content is the one multi-gigabyte body: it streams to the api-server
    # unbuffered and unlimited here, because the api-server requires it to be exactly the size the
    # upload declared, within the installation's image upload limit.
    location ~ ^/api/v1/provisioning/image-uploads/[^/]+/content$ {
        proxy_pass http://127.0.0.1:30051;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 0;
    }
    # A body over the /api/ limit is refused here in the API's error envelope.
    location @api_payload_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":{"code":"payload_too_large","message":"The request body exceeds the size this route accepts.","requestId":"$request_id"}}';
    }
    location = /healthz { proxy_pass http://127.0.0.1:30051/healthz; }
    location = /livez { proxy_pass http://127.0.0.1:30051/livez; }
    location = /readyz { proxy_pass http://127.0.0.1:30051/readyz; }
    location = /metrics { proxy_pass http://127.0.0.1:30051/metrics; }
    # Server Enrollment downloads (decision 053), fetched without a credential.
    location /downloads/ {
        proxy_pass http://127.0.0.1:30051;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { try_files $uri $uri/ /index.html; }
}
