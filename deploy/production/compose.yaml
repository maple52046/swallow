name: swallow-production

# Single-VM production installation. Two listeners are public, both plain HTTP: Dashboard/Nginx
# (the Dashboard and the API) and pulp-web (the Site's Local Repository, for deployed Servers).
# MongoDB and Temporal stay on the internal `control` network. The API, worker, and Ansible
# executor also join `egress` so they can reach the co-located MAAS (through host.docker.internal)
# and the Servers they deploy and configure; Prometheus joins it to scrape the exporters on those
# Servers, and Pulp to fetch from the upstream sources it mirrors. prom-label-proxy stays on
# `control`.

x-backend-hosts: &backend-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

# The Site's Local Repository (Pulp 3): pulp-minimal runs the API, the content app, and the workers
# as separate services on the shared PostgreSQL; pulp-web routes them under one address.
x-pulp: &pulp
  image: ${SWALLOW_PULP_IMAGE:?set a digest-pinned SWALLOW_PULP_IMAGE}
  user: pulp
  environment:
    # The address deployed Servers reach pulp-web at; Pulp writes absolute URLs on it.
    SWALLOW_PULP_ORIGIN: http://${SWALLOW_ADDRESS:-localhost}:${SWALLOW_PULP_PORT:-8080}
  secrets:
    - pulp_db_password
    - pulp_secret_key
  volumes:
    - ./pulp/settings.py:/etc/pulp/settings.py:ro
    - ./pulp/sign-deb-release.sh:/usr/local/share/swallow/sign-deb-release.sh:ro
    - pulp-certs:/etc/pulp/certs
    - pulp-data:/var/lib/pulp
  networks: [control, egress]
  security_opt: [no-new-privileges:true]

services:
  # A single-node replica set (rs0) with keyFile authentication: swallow needs transactions and
  # change streams (decision 069). mongo-entrypoint.sh starts mongod with a private keyFile copy
  # and, as the healthcheck, initiates the replica set on first start.
  mongo:
    image: ${SWALLOW_MONGO_IMAGE:?set a digest-pinned SWALLOW_MONGO_IMAGE}
    restart: unless-stopped
    entrypoint: ["bash", "/opt/swallow/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_username
      - mongo_root_password
      - mongo_keyfile
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo-entrypoint.sh:/opt/swallow/mongo-entrypoint.sh:ro
    read_only: true
    tmpfs: [/tmp]
    networks: [control]
    healthcheck:
      test: ["CMD", "bash", "/opt/swallow/mongo-entrypoint.sh", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]

  # One PostgreSQL instance serves Temporal (temporal_core, temporal_visibility), Pulp (role and
  # database `pulp`, created by swallowctl before Pulp starts) and, on the single-VM installation,
  # the co-located MAAS region (role `maas`, database `maasdb`, created by local-maas.sh). Each has
  # its own database and role; nothing is shared below the instance. The port is published on
  # loopback only, for the MAAS snap on this host.
  postgres:
    image: ${SWALLOW_POSTGRES_IMAGE:?set a digest-pinned SWALLOW_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD_FILE: /run/secrets/temporal_db_password
    secrets:
      - temporal_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SWALLOW_POSTGRES_HOST_PORT:-5432}:5432"
    networks: [control, host-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]

  temporal:
    image: ${SWALLOW_TEMPORAL_SERVER_IMAGE:?set a digest-pinned SWALLOW_TEMPORAL_SERVER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export POSTGRES_PWD="$$(cat /run/secrets/temporal_db_password)"
        exec /etc/temporal/entrypoint.sh autosetup
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: temporal_core
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_USER: temporal
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    secrets:
      - temporal_db_password
    networks: [control]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: [no-new-privileges:true]

  # Optional diagnostics UI: start it with `docker compose --profile diagnostics up -d`
  # after setting SWALLOW_TEMPORAL_UI_IMAGE. It listens on loopback only.
  temporal-ui:
    image: ${SWALLOW_TEMPORAL_UI_IMAGE:-}
    profiles: [diagnostics]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${SWALLOW_TEMPORAL_UI_PORT:-8233}:8080"
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api-server:
    image: ${SWALLOW_API_IMAGE:?set a digest-pinned SWALLOW_API_IMAGE}
    restart: unless-stopped
    <<: *backend-hosts
    # The API stores Workflows and their commands; only the worker and the ansible-executor
    # connect to Temporal (decision 072).
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_RELEASE_VERSION: ${SWALLOW_RELEASE_VERSION:?set promoted SemVer}
      SWALLOW_API_MONGO_URI_FILE: /run/secrets/mongo_uri
      SWALLOW_API_MONGO_DB: swallow
      SWALLOW_API_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: admin
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      SWALLOW_API_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      SWALLOW_API_MACHINE_TOKEN_FILE: /run/secrets/machine_token
      # Boot Media (decision 047), optional: Boot ISOs built on the Provisioning page are
      # kept in the boot-media volume and served at
      # <SWALLOW_BOOT_MEDIA_BASE_URL>/boot-media/ipxe/<isoId>/swallow-ipxe.iso through the
      # dashboard's port 80. An empty base URL keeps Boot Media off.
      SWALLOW_API_BOOT_MEDIA_DIR: /var/lib/swallow/boot-media
      SWALLOW_API_BOOT_MEDIA_BASE_URL: ${SWALLOW_BOOT_MEDIA_BASE_URL:-}
      # Every provisioned Server is pointed at the Control-Plane NTP Server on this host, at the
      # address machines reach it by (decision 065).
      SWALLOW_API_NTP_SERVER: ${SWALLOW_ADDRESS:-}
      # A Platform's Grafana reads the Platform metrics gateway through the dashboard's port at this
      # URL, and Omnistat admits the Site Prometheus, which scrapes from this host's address
      # (monitoring.md §6.2, §7). Both are planned into Platform deployments.
      SWALLOW_API_PUBLIC_URL: ${SWALLOW_ADDRESS:+http://${SWALLOW_ADDRESS}:${SWALLOW_HTTP_PORT:-80}}
      SWALLOW_API_MONITORING_SCRAPE_ADDRESSES: ${SWALLOW_ADDRESS:-}
      # Server Enrollment (decision 053): hosts that keep their OS download the bundled CLI from
      # /downloads/swallow, so the bundle's bin/ is mounted read-only.
      SWALLOW_API_CLI_BINARY: /usr/local/share/swallow/bin/swallow
      # The Directory (decision 082): the worker writes accounts, keys, and sudo rules to the bundled
      # LDAP server; the Servers' directory client reads them at SWALLOW_ADDRESS:636 over LDAPS,
      # verified with the installation CA.
      SWALLOW_API_DIRECTORY_URL: ldaps://ldap:636
      SWALLOW_API_DIRECTORY_HOST_URL: ldaps://${SWALLOW_ADDRESS:?set SWALLOW_ADDRESS}:${SWALLOW_LDAP_PORT:-636}
      SWALLOW_API_DIRECTORY_BIND_PASSWORD_FILE: /run/secrets/ldap_admin_password
      SWALLOW_API_DIRECTORY_READER_PASSWORD_FILE: /run/secrets/ldap_reader_password
      SWALLOW_API_DIRECTORY_CA_FILE: /run/secrets/installation_ca
    secrets:
      - mongo_uri
      - jwt_secret
      - bootstrap_admin_password
      - credential_key
      - machine_token
      - ldap_admin_password
      - ldap_reader_password
      - installation_ca
    volumes:
      - job-artifacts:/var/lib/swallow/jobs
      - boot-media:/var/lib/swallow/boot-media
      - ./bin:/usr/local/share/swallow/bin:ro
    tmpfs:
      - /run/swallow/jobs:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    networks: [control, egress]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30051/livez', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  worker:
    image: ${SWALLOW_API_IMAGE:?set a digest-pinned SWALLOW_API_IMAGE}
    command: ["worker"]
    restart: unless-stopped
    <<: *backend-hosts
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
      ldap:
        condition: service_healthy
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_RELEASE_VERSION: ${SWALLOW_RELEASE_VERSION:?set promoted SemVer}
      SWALLOW_API_MONGO_URI_FILE: /run/secrets/mongo_uri
      SWALLOW_API_MONGO_DB: swallow
      SWALLOW_API_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: admin
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      SWALLOW_API_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      SWALLOW_API_MACHINE_TOKEN_FILE: /run/secrets/machine_token
      SWALLOW_API_TEMPORAL_ADDRESS: temporal:7233
      SWALLOW_API_TEMPORAL_NAMESPACE: default
      SWALLOW_API_TEMPORAL_TASK_QUEUE: swallow-operations
      SWALLOW_API_ANSIBLE_TASK_QUEUE: swallow-ansible
      # Hardware inspection resolves a Server's Boot ISO when its ensure-boot-media Task runs
      # (decision 053), so the worker reads the Boot ISO files and their URL like the API does.
      SWALLOW_API_BOOT_MEDIA_DIR: /var/lib/swallow/boot-media
      SWALLOW_API_BOOT_MEDIA_BASE_URL: ${SWALLOW_BOOT_MEDIA_BASE_URL:-}
      # Every provisioned Server is pointed at the Control-Plane NTP Server on this host, at the
      # address machines reach it by (decision 065).
      SWALLOW_API_NTP_SERVER: ${SWALLOW_ADDRESS:-}
      # A Platform's Grafana reads the Platform metrics gateway through the dashboard's port at this
      # URL, and Omnistat admits the Site Prometheus, which scrapes from this host's address
      # (monitoring.md §6.2, §7). Both are planned into Platform deployments.
      SWALLOW_API_PUBLIC_URL: ${SWALLOW_ADDRESS:+http://${SWALLOW_ADDRESS}:${SWALLOW_HTTP_PORT:-80}}
      SWALLOW_API_MONITORING_SCRAPE_ADDRESSES: ${SWALLOW_ADDRESS:-}
      # The Directory (decision 082): the worker writes accounts, keys, and sudo rules to the bundled
      # LDAP server; the Servers' directory client reads them at SWALLOW_ADDRESS:636 over LDAPS,
      # verified with the installation CA.
      SWALLOW_API_DIRECTORY_URL: ldaps://ldap:636
      SWALLOW_API_DIRECTORY_HOST_URL: ldaps://${SWALLOW_ADDRESS:?set SWALLOW_ADDRESS}:${SWALLOW_LDAP_PORT:-636}
      SWALLOW_API_DIRECTORY_BIND_PASSWORD_FILE: /run/secrets/ldap_admin_password
      SWALLOW_API_DIRECTORY_READER_PASSWORD_FILE: /run/secrets/ldap_reader_password
      SWALLOW_API_DIRECTORY_CA_FILE: /run/secrets/installation_ca
    secrets:
      - mongo_uri
      - jwt_secret
      - bootstrap_admin_password
      - credential_key
      - machine_token
      - ldap_admin_password
      - ldap_reader_password
      - installation_ca
    volumes:
      - boot-media:/var/lib/swallow/boot-media:ro
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    networks: [control, egress]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ansible-executor:
    image: ${SWALLOW_API_IMAGE:?set a digest-pinned SWALLOW_API_IMAGE}
    command: ["ansible-executor"]
    restart: unless-stopped
    # ansible-runner leaves its ssh-agent to be reaped by PID 1; Docker's init reaps it and
    # forwards signals, so finished runs do not accumulate zombies.
    init: true
    <<: *backend-hosts
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_RELEASE_VERSION: ${SWALLOW_RELEASE_VERSION:?set promoted SemVer}
      SWALLOW_API_MONGO_URI_FILE: /run/secrets/mongo_uri
      SWALLOW_API_MONGO_DB: swallow
      SWALLOW_API_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: admin
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      SWALLOW_API_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      SWALLOW_API_MACHINE_TOKEN_FILE: /run/secrets/machine_token
      SWALLOW_API_TEMPORAL_ADDRESS: temporal:7233
      SWALLOW_API_TEMPORAL_NAMESPACE: default
      SWALLOW_API_TEMPORAL_TASK_QUEUE: swallow-operations
      SWALLOW_API_ANSIBLE_TASK_QUEUE: swallow-ansible
      SWALLOW_API_JOB_RUNTIME_DIR: /run/swallow/jobs
      SWALLOW_API_JOB_ARTIFACT_DIR: /var/lib/swallow/jobs
      SWALLOW_API_JOB_ARTIFACT_RETENTION: 720h
    secrets:
      - mongo_uri
      - jwt_secret
      - bootstrap_admin_password
      - credential_key
      - machine_token
    volumes:
      - job-artifacts:/var/lib/swallow/jobs
    tmpfs:
      - /run/swallow/jobs:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    networks: [control, egress]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # The installation Site's Prometheus (monitoring.md §5.1). It scrapes swallow's /metrics and the
  # exporters the API lists for the installation Site; the api-server reads it at
  # http://prometheus:9090, and it is not published on the host. prometheus.yml is shipped;
  # swallowctl renders the Site's discovery job into state/prometheus/ once bootstrap.sh created
  # the Site, and Prometheus loads only what that directory holds. Its data is disposable and
  # never backed up.
  prometheus:
    image: ${SWALLOW_PROMETHEUS_IMAGE:?set a digest-pinned SWALLOW_PROMETHEUS_IMAGE}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${SWALLOW_PROMETHEUS_RETENTION:-30d}
      - --web.listen-address=:9090
    secrets:
      - machine_token
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./state/prometheus:/etc/prometheus/site:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs: [/tmp]
    networks: [control, egress]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Platform tenancy in front of the Site Prometheus (monitoring.md §7): every query is confined to
  # the series whose platform_id is the X-Swallow-Platform-Id header's value, and a request without
  # the header is refused. It authenticates nobody, so it is on `control` only and never published;
  # the api-server reaches it at http://prom-label-proxy:8080, the metrics Integration's
  # labelProxyUrl setting. It needs Prometheus only per request, so it waits for it to start, not
  # to be healthy.
  prom-label-proxy:
    image: ${SWALLOW_PROM_LABEL_PROXY_IMAGE:?set a digest-pinned SWALLOW_PROM_LABEL_PROXY_IMAGE}
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    command:
      - --insecure-listen-address=0.0.0.0:8080
      - --upstream=http://prometheus:9090
      - --label=platform_id
      - --header-name=X-Swallow-Platform-Id
      - --enable-label-apis
    read_only: true
    networks: [control]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Keys, schema migrations, admin password, and the deb signing service; then exits. It runs on
  # every start, so a new Pulp image migrates its database at the next `up`.
  pulp-init:
    <<: *pulp
    user: root
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/usr/local/share/swallow/init.sh"]
    secrets:
      - pulp_db_password
      - pulp_secret_key
      - pulp_admin_password
    volumes:
      - ./pulp/settings.py:/etc/pulp/settings.py:ro
      - ./pulp/sign-deb-release.sh:/usr/local/share/swallow/sign-deb-release.sh:ro
      - ./pulp/init.sh:/usr/local/share/swallow/init.sh:ro
      - pulp-certs:/etc/pulp/certs
      - pulp-data:/var/lib/pulp
    networks: [control]

  pulp-api:
    <<: *pulp
    restart: unless-stopped
    depends_on:
      pulp-init:
        condition: service_completed_successfully
    command: ["pulp-api"]
    healthcheck:
      test: ["CMD", "readyz.py", "/pulp/api/v3/status/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    cap_drop: [ALL]

  pulp-content:
    <<: *pulp
    restart: unless-stopped
    depends_on:
      pulp-init:
        condition: service_completed_successfully
    command: ["pulp-content"]
    healthcheck:
      test: ["CMD", "readyz.py", "/pulp/content/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    cap_drop: [ALL]

  pulp-worker:
    <<: *pulp
    restart: unless-stopped
    depends_on:
      pulp-init:
        condition: service_completed_successfully
    command: ["pulp-worker"]
    deploy:
      replicas: 2
    cap_drop: [ALL]

  # The one address of the Local Repository: Pulp's API (/pulp/api/v3/, admin only), the registry
  # (/v2/ and /token/), the Python index (/pypi/), and content (/pulp/content/). Published on every
  # interface, because deployed Servers fetch from it; the registry must be at the root of its own
  # host and port, so it cannot share the Dashboard's. The api-server calls it at
  # http://pulp-web:8080 over `control`, the repository Integration's endpoint.
  pulp-web:
    image: ${SWALLOW_PULP_WEB_IMAGE:?set a digest-pinned SWALLOW_PULP_WEB_IMAGE}
    restart: unless-stopped
    user: root
    depends_on:
      pulp-api:
        condition: service_healthy
      pulp-content:
        condition: service_healthy
    command: ["bash", "/usr/bin/nginx.sh"]
    volumes:
      - ./pulp/nginx.sh:/usr/bin/nginx.sh:ro
      - ./pulp/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    ports:
      - "${SWALLOW_PULP_PORT:-8080}:8080"
    networks: [edge, control]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/pulp/api/v3/status/"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]

  # The installation's Directory (decision 082): OpenLDAP on LDAPS only, written by the worker and
  # read by every Server's directory client. Its database is rebuilt from MongoDB by the Directory
  # controller, so ldap-data is outside the backup scope; the CA and passwords are backed up.
  ldap:
    image: ${SWALLOW_LDAP_IMAGE:?set a digest-pinned SWALLOW_LDAP_IMAGE}
    restart: unless-stopped
    # The server certificate names `ldap`, the address the worker connects to.
    hostname: ldap
    environment:
      LDAP_BASE_DN: dc=swallow,dc=internal
      LDAP_ADMIN_PASSWORD_FILE: /run/secrets/ldap_admin_password
      LDAP_READER_PASSWORD_FILE: /run/secrets/ldap_reader_password
      LDAP_TLS_CERT_FILE: /run/secrets/ldap_tls_cert
      LDAP_TLS_KEY_FILE: /run/secrets/ldap_tls_key
      LDAP_TLS_CA_FILE: /run/secrets/installation_ca
    secrets:
      - ldap_admin_password
      - ldap_reader_password
      - ldap_tls_cert
      - ldap_tls_key
      - installation_ca
    volumes:
      - ldap-data:/var/lib/ldap
    ports:
      - "${SWALLOW_LDAP_PORT:-636}:636"
    networks: [edge, control]
    healthcheck:
      test: ["CMD", "ldapwhoami", "-Q", "-Y", "EXTERNAL", "-H", "ldapi:///"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]

  dashboard:
    image: ${SWALLOW_DASHBOARD_IMAGE:?set a digest-pinned SWALLOW_DASHBOARD_IMAGE}
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "${SWALLOW_HTTP_PORT:-80}:8080"
    networks: [edge, control]
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  edge:
  control:
    internal: true
  egress:
  host-postgres:

volumes:
  mongo-data:
  mongo-config:
  job-artifacts:
  # Boot ISOs (decision 047); first mounted over the image's directory, so owned by the service user.
  boot-media:
  postgres-data:
  # Metrics only, outside the backup scope: losing it loses usage history, never swallow state.
  prometheus-data:
  # Pulp's keys (database field encryption, registry tokens) and the GPG home of its signing key:
  # backed up with the pulp database, which they belong to.
  pulp-certs:
  # Pulp's artifacts, outside the backup scope: restore has Pulp fetch missing ones from upstream.
  pulp-data:
  # The Directory's database, outside the backup scope: the Directory controller rewrites it from
  # MongoDB.
  ldap-data:

secrets:
  mongo_root_username:
    file: ./secrets/mongo-root-username
  mongo_root_password:
    file: ./secrets/mongo-root-password
  mongo_keyfile:
    file: ./secrets/mongo-keyfile
  mongo_uri:
    file: ./secrets/mongo-uri
  temporal_db_password:
    file: ./secrets/temporal-db-password
  jwt_secret:
    file: ./secrets/jwt-secret
  bootstrap_admin_password:
    file: ./secrets/bootstrap-admin-password
  credential_key:
    file: ./secrets/credential-key
  machine_token:
    file: ./secrets/machine-token
  pulp_db_password:
    file: ./secrets/pulp-db-password
  pulp_admin_password:
    file: ./secrets/pulp-admin-password
  pulp_secret_key:
