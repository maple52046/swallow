name: swallow-production

services:
  mongo:
    image: ${SWALLOW_MONGO_IMAGE:?set a digest-pinned SWALLOW_MONGO_IMAGE}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_username
      - mongo_root_password
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    read_only: true
    tmpfs: [/tmp]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]

  api-server:
    image: ${SWALLOW_API_IMAGE:?set a digest-pinned SWALLOW_API_IMAGE}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_RELEASE_VERSION: ${SWALLOW_RELEASE_VERSION:?set promoted SemVer}
      SWALLOW_API_MONGO_URI_FILE: /run/secrets/mongo_uri
      SWALLOW_API_MONGO_DB: swallow
      SWALLOW_API_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: admin
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      SWALLOW_API_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      SWALLOW_API_MACHINE_TOKEN_FILE: /run/secrets/machine_token
      SWALLOW_API_OPERATION_DISPATCH_INTERVAL: 1s
      SWALLOW_API_OPERATION_LEASE_DURATION: 90s
      SWALLOW_API_JOB_ARTIFACT_RETENTION: 720h
    secrets:
      - mongo_uri
      - jwt_secret
      - bootstrap_admin_password
      - credential_key
      - machine_token
    volumes:
      - job-artifacts:/var/lib/swallow/jobs
    tmpfs:
      - /run/swallow/jobs:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    networks: [control]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30051/livez', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  dashboard:
    image: ${SWALLOW_DASHBOARD_IMAGE:?set a digest-pinned SWALLOW_DASHBOARD_IMAGE}
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "${SWALLOW_HTTP_PORT:-80}:8080"
      - "${SWALLOW_HTTPS_PORT:-443}:8443"
    secrets:
      - tls_certificate
      - tls_private_key
    networks: [edge, control]
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  edge:
  control:
    internal: true

volumes:
  mongo-data:
  mongo-config:
  job-artifacts:

secrets:
  mongo_root_username:
    file: ./secrets/mongo-root-username
  mongo_root_password:
    file: ./secrets/mongo-root-password
  mongo_uri:
    file: ./secrets/mongo-uri
  jwt_secret:
    file: ./secrets/jwt-secret
  bootstrap_admin_password:
    file: ./secrets/bootstrap-admin-password
  credential_key:
    file: ./secrets/credential-key
  machine_token:
    file: ./secrets/machine-token
  tls_certificate:
    file: ./secrets/tls.crt
  tls_private_key:
    file: ./secrets/tls.key
