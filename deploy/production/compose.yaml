name: swallow-production

# Single-VM production installation. Dashboard/Nginx is the only public listener (plain
# HTTP). MongoDB and Temporal stay on the internal `control` network. The API, worker, and
# Ansible executor also join `egress` so they can reach the co-located MAAS (through
# host.docker.internal) and the Servers they deploy and configure.

x-backend-hosts: &backend-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  mongo:
    image: ${SWALLOW_MONGO_IMAGE:?set a digest-pinned SWALLOW_MONGO_IMAGE}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_username
      - mongo_root_password
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    read_only: true
    tmpfs: [/tmp]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]

  # One PostgreSQL instance serves Temporal (temporal_core, temporal_visibility) and, on the
  # single-VM installation, the co-located MAAS region (role `maas`, database `maasdb`,
  # created by local-maas.sh). Each has its own database and role; nothing is shared below
  # the instance. The port is published on loopback only, for the MAAS snap on this host.
  temporal-postgresql:
    image: ${SWALLOW_TEMPORAL_POSTGRES_IMAGE:?set a digest-pinned SWALLOW_TEMPORAL_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD_FILE: /run/secrets/temporal_db_password
    secrets:
      - temporal_db_password
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SWALLOW_POSTGRES_HOST_PORT:-5432}:5432"
    networks: [control, host-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]

  temporal:
    image: ${SWALLOW_TEMPORAL_SERVER_IMAGE:?set a digest-pinned SWALLOW_TEMPORAL_SERVER_IMAGE}
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export POSTGRES_PWD="$$(cat /run/secrets/temporal_db_password)"
        exec /etc/temporal/entrypoint.sh autosetup
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: temporal_core
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_USER: temporal
      POSTGRES_SEEDS: temporal-postgresql
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    secrets:
      - temporal_db_password
    networks: [control]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: [no-new-privileges:true]

  # Optional diagnostics UI: start it with `docker compose --profile diagnostics up -d`
  # after setting SWALLOW_TEMPORAL_UI_IMAGE. It listens on loopback only.
  temporal-ui:
    image: ${SWALLOW_TEMPORAL_UI_IMAGE:-}
    profiles: [diagnostics]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${SWALLOW_TEMPORAL_UI_PORT:-8233}:8080"
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api-server:
    image: ${SWALLOW_API_IMAGE:?set a digest-pinned SWALLOW_API_IMAGE}
    restart: unless-stopped
    <<: *backend-hosts
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_RELEASE_VERSION: ${SWALLOW_RELEASE_VERSION:?set promoted SemVer}
      SWALLOW_API_MONGO_URI_FILE: /run/secrets/mongo_uri
      SWALLOW_API_MONGO_DB: swallow
      SWALLOW_API_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: admin
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      SWALLOW_API_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      SWALLOW_API_MACHINE_TOKEN_FILE: /run/secrets/machine_token
      SWALLOW_API_OPERATION_DISPATCH_INTERVAL: 1s
      SWALLOW_API_OPERATION_LEASE_DURATION: 90s
      SWALLOW_API_TEMPORAL_ADDRESS: temporal:7233
      SWALLOW_API_TEMPORAL_NAMESPACE: default
      SWALLOW_API_TEMPORAL_TASK_QUEUE: swallow-operations
      SWALLOW_API_JOB_ARTIFACT_RETENTION: 720h
      # Boot Media (decisions 047 and 049), optional: Boot ISOs built on the Provisioning page are
      # kept in the boot-media volume and served at
      # <SWALLOW_BOOT_MEDIA_BASE_URL>/boot-media/ipxe/<isoId>/swallow-ipxe.iso through the
      # dashboard's port 80. An empty base URL keeps Boot Media off.
      SWALLOW_API_BOOT_MEDIA_DIR: /var/lib/swallow/boot-media
      SWALLOW_API_BOOT_MEDIA_BASE_URL: ${SWALLOW_BOOT_MEDIA_BASE_URL:-}
    secrets:
      - mongo_uri
      - jwt_secret
      - bootstrap_admin_password
      - credential_key
      - machine_token
    volumes:
      - job-artifacts:/var/lib/swallow/jobs
      - boot-media:/var/lib/swallow/boot-media
    tmpfs:
      - /run/swallow/jobs:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    networks: [control, egress]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30051/livez', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  worker:
    image: ${SWALLOW_API_IMAGE:?set a digest-pinned SWALLOW_API_IMAGE}
    command: ["worker"]
    restart: unless-stopped
    <<: *backend-hosts
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_RELEASE_VERSION: ${SWALLOW_RELEASE_VERSION:?set promoted SemVer}
      SWALLOW_API_MONGO_URI_FILE: /run/secrets/mongo_uri
      SWALLOW_API_MONGO_DB: swallow
      SWALLOW_API_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: admin
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      SWALLOW_API_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      SWALLOW_API_MACHINE_TOKEN_FILE: /run/secrets/machine_token
      SWALLOW_API_OPERATION_DISPATCH_INTERVAL: 1s
      SWALLOW_API_OPERATION_LEASE_DURATION: 90s
      SWALLOW_API_TEMPORAL_ADDRESS: temporal:7233
      SWALLOW_API_TEMPORAL_NAMESPACE: default
      SWALLOW_API_TEMPORAL_TASK_QUEUE: swallow-operations
      SWALLOW_API_JOB_ARTIFACT_DIR: /var/lib/swallow/jobs
    secrets:
      - mongo_uri
      - jwt_secret
      - bootstrap_admin_password
      - credential_key
      - machine_token
    volumes:
      - job-artifacts:/var/lib/swallow/jobs:ro
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    networks: [control, egress]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ansible-executor:
    image: ${SWALLOW_API_IMAGE:?set a digest-pinned SWALLOW_API_IMAGE}
    command: ["ansible-executor"]
    restart: unless-stopped
    <<: *backend-hosts
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_RELEASE_VERSION: ${SWALLOW_RELEASE_VERSION:?set promoted SemVer}
      SWALLOW_API_MONGO_URI_FILE: /run/secrets/mongo_uri
      SWALLOW_API_MONGO_DB: swallow
      SWALLOW_API_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: admin
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      SWALLOW_API_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      SWALLOW_API_MACHINE_TOKEN_FILE: /run/secrets/machine_token
      SWALLOW_API_OPERATION_DISPATCH_INTERVAL: 1s
      SWALLOW_API_OPERATION_LEASE_DURATION: 90s
      SWALLOW_API_TEMPORAL_ADDRESS: temporal:7233
      SWALLOW_API_TEMPORAL_NAMESPACE: default
      SWALLOW_API_TEMPORAL_TASK_QUEUE: swallow-operations
      SWALLOW_API_JOB_RUNTIME_DIR: /run/swallow/jobs
      SWALLOW_API_JOB_ARTIFACT_DIR: /var/lib/swallow/jobs
      SWALLOW_API_JOB_ARTIFACT_RETENTION: 720h
    secrets:
      - mongo_uri
      - jwt_secret
      - bootstrap_admin_password
      - credential_key
      - machine_token
    volumes:
      - job-artifacts:/var/lib/swallow/jobs
    tmpfs:
      - /run/swallow/jobs:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    networks: [control, egress]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  dashboard:
    image: ${SWALLOW_DASHBOARD_IMAGE:?set a digest-pinned SWALLOW_DASHBOARD_IMAGE}
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "${SWALLOW_HTTP_PORT:-80}:8080"
    networks: [edge, control]
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  edge:
  control:
    internal: true
  egress:
  host-postgres:

volumes:
  mongo-data:
  mongo-config:
  job-artifacts:
  # Boot ISOs (decision 049); first mounted over the image's directory, so owned by the service user.
  boot-media:
  temporal-postgres-data:

secrets:
  mongo_root_username:
    file: ./secrets/mongo-root-username
  mongo_root_password:
    file: ./secrets/mongo-root-password
  mongo_uri:
    file: ./secrets/mongo-uri
  temporal_db_password:
    file: ./secrets/temporal-db-password
  jwt_secret:
    file: ./secrets/jwt-secret
  bootstrap_admin_password:
    file: ./secrets/bootstrap-admin-password
  credential_key:
    file: ./secrets/credential-key
  machine_token:
    file: ./secrets/machine-token
