# Hot-reload config for the api-server dev container.
# Build artefacts go to /tmp inside the container so the bind-mounted
# submodule working tree stays clean.

root = "/app"
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/swallow ./cmd/swallow"
  bin = "/tmp/air/swallow"
  args_bin = ["api"]
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["bin", "docs", "tests"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = false
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
