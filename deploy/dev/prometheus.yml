# Development Prometheus config: the same two jobs as the production installation's Site
# Prometheus (deploy/production/prometheus.yml and prometheus-exporters.yml.template), talking to
# the dev api-server over plain HTTP inside the compose network.
#
# The dev stack is single-Site, so the exporters job's http_sd URL omits siteId and lists the
# exporters of every Site; production renders the installation Site's id into it.
#
# NOTE: Prometheus does not expand environment variables in this file, so the bearer token
# below is the literal dev default (SWALLOW_API_MACHINE_TOKEN=dev-machine-token). If you
# override that token in .env, update the two `credentials:` values here to match.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # swallow's own metrics.
  - job_name: swallow-api
    metrics_path: /metrics
    static_configs:
      - targets: [api-server:30051]
    authorization:
      credentials: dev-machine-token

  # The exporters swallow knows are installed, each target labelled server_id, site,
  # platform_id (when the Server has a Platform Claim), and exporter.
  - job_name: swallow-exporters
    scrape_interval: 30s
    http_sd_configs:
      - url: http://api-server:30051/api/v1/discovery/prometheus/exporters
        refresh_interval: 60s
        authorization:
          credentials: dev-machine-token
