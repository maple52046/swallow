# Development Prometheus config.
#
# Unlike the per-site production config (deploy/third-party/prometheus), this talks to the
# dev api-server over plain HTTP inside the compose network and authenticates with the
# fixed dev machine token. It discovers exporters through swallow's http_sd so scraped
# series carry server_id/site/cluster with no extra relabelling.
#
# NOTE: Prometheus does not expand environment variables in this file, so the bearer token
# below is the literal dev default (SWALLOW_API_MACHINE_TOKEN=dev-machine-token). If you
# override that token in .env, update the three `credentials:` values here to match.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # node-exporter on every deployed server (port 9100).
  - job_name: dev-node-exporter
    http_sd_configs:
      - url: http://api-server:30051/api/v1/discovery/prometheus?port=9100
        refresh_interval: 30s
        authorization:
          credentials: dev-machine-token

  # RDC exporter on AMD GPU servers only (port 5000, tag=amd-gpu).
  - job_name: dev-rdc-exporter
    http_sd_configs:
      - url: http://api-server:30051/api/v1/discovery/prometheus?port=5000&tag=amd-gpu
        refresh_interval: 30s
        authorization:
          credentials: dev-machine-token

  # swallow's own build/request metrics, so the dev stack has something to scrape even
  # before any exporter is installed.
  - job_name: swallow-api
    metrics_path: /metrics
    static_configs:
      - targets: [api-server:30051]
    authorization:
      credentials: dev-machine-token
