name: swallow-dev

# Local development stack for the whole platform: MongoDB plus every component
# in src/, each running from a bind-mounted working tree with hot reload.
# Every setting below has a development default, so the stack starts without a
# .env file; copy .env.example to .env only when you need to override something.

# The dev Site's Local Repository (Pulp 3, docs/development/local-repository.md): one image runs
# the API, the content app, and the workers; pulp-web routes them under one address.
x-pulp: &pulp
  image: ${PULP_IMAGE:-docker.io/pulp/pulp-minimal:3.123.1}
  user: pulp
  environment: &pulp-environment
    # The address deployed Servers reach Pulp at (PULP_HTTP_PORT on this host). Set PULP_ORIGIN in
    # .env to this host's LAN address for a lab.
    SWALLOW_PULP_ORIGIN: "${PULP_ORIGIN:-http://localhost:8080}"
    SWALLOW_PULP_SECRET_KEY: "dev-pulp-secret-key-not-for-production-0123456789"
    SWALLOW_PULP_DB_HOST: temporal-postgresql
    SWALLOW_PULP_DB_PASSWORD: pulp
    SWALLOW_PULP_ADMIN_PASSWORD: "${PULP_ADMIN_PASSWORD:-admin}"
  volumes:
    - ./pulp/settings.py:/etc/pulp/settings.py:ro
    - ./pulp/sign-deb-release.sh:/usr/local/share/swallow/sign-deb-release.sh:ro
    - pulp-certs:/etc/pulp/certs
    - pulp-data:/var/lib/pulp

services:
  # A single-node replica set (rs0), the store topology swallow requires (decision 069). The dev
  # stack runs without authentication, so it needs no keyFile. Tools on the host reach it with
  # mongodb://localhost:27017/?directConnection=true, because the member is named mongo:27017.
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # Every collection and index is a file, and the integration tests each create a database
    # (internal/adapters/store/mongodb/mongotest): at the default open-files limit of 1024 a parallel
    # `go test ./...` exhausts the descriptors and mongod restarts.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    # The healthcheck initiates the replica set on first start (an existing standalone data
    # directory keeps its data) and is healthy only while this member is the writable primary.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          if (e.codeName !== 'NotYetInitialized') throw e;
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: temporal_core
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"

  api-server:
    build:
      context: ../..
      dockerfile: deploy/dev/api-server.Dockerfile
      args:
        UID: ${DEV_UID:-1001}
        GID: ${DEV_GID:-1001}
    restart: unless-stopped
    # The API stores Workflows and their commands; only the worker and the ansible-executor
    # connect to Temporal (decision 072).
    depends_on:
      mongo:
        condition: service_healthy
    # This api-server runs on the default bridge network, where `localhost` means the
    # container itself. Map host.docker.internal to the host gateway so an integration
    # endpoint that lives on the host (e.g. a MAAS at http://host.docker.internal:5240/MAAS)
    # is reachable. Integrations on the LAN or other baremetal are reached by their own
    # routable address and need nothing here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_MONGO_URI: "mongodb://mongo:27017"
      SWALLOW_API_MONGO_DB: "${SWALLOW_API_MONGO_DB:-swallow}"
      SWALLOW_API_JWT_SECRET: "${SWALLOW_API_JWT_SECRET:-dev-secret-change-me}"
      SWALLOW_API_ACCESS_TOKEN_TTL: "${SWALLOW_API_ACCESS_TOKEN_TTL:-15m}"
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: "${SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD: "${SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      # Seals integration credentials at rest. Required: without it an integration
      # cannot be registered, and starting anyway would defer that failure to the
      # first user who tries. The dev default is a fixed key on purpose — it is
      # not a secret, and a real installation must supply its own.
      SWALLOW_API_CREDENTIAL_KEY: "${SWALLOW_API_CREDENTIAL_KEY:-K7i9npJw/Fx/XbU31LyNx4vOFKFFV7PmJT0XW8eH8/s=}"
      # Static bearer token for machine-to-machine discovery.
      SWALLOW_API_MACHINE_TOKEN: "${SWALLOW_API_MACHINE_TOKEN:-dev-machine-token}"
      SWALLOW_API_JOB_RUNTIME_DIR: "/tmp/swallow/jobs"
      SWALLOW_API_JOB_ARTIFACT_DIR: "/var/lib/swallow/jobs"
      # Boot Media (decision 047): Boot ISOs built on the Provisioning page are written
      # to ./boot-media/<isoId>/ and mounted by BMCs at
      # <base URL>/boot-media/ipxe/<isoId>/swallow-ipxe.iso. Empty base URL leaves Boot Media off.
      SWALLOW_API_BOOT_MEDIA_DIR: "/var/lib/swallow/boot-media"
      SWALLOW_API_BOOT_MEDIA_BASE_URL: "${SWALLOW_API_BOOT_MEDIA_BASE_URL:-}"
      # The NTP server every provisioned Server is pointed at (decision 065): the address machines
      # reach this host by. Empty refuses OS deployments until it is set in .env.
      SWALLOW_API_NTP_SERVER: "${SWALLOW_API_NTP_SERVER:-}"
      # How deployed Servers and the Site Prometheus reach each other (monitoring.md §6.2, §7): the
      # URL a Platform's Grafana reads the metrics gateway at, and the addresses the Prometheus
      # scrapes from as the Servers see them. Empty refuses a Slurm deployment's Grafana and
      # Omnistat until they are set in .env.
      SWALLOW_API_PUBLIC_URL: "${SWALLOW_API_PUBLIC_URL:-}"
      SWALLOW_API_MONITORING_SCRAPE_ADDRESSES: "${SWALLOW_API_MONITORING_SCRAPE_ADDRESSES:-}"
      # Server Enrollment (decision 053) serves the CLI at /downloads/swallow. Build it into
      # ./bin first: `cd cli && CGO_ENABLED=0 go build -o ../deploy/dev/bin/swallow ./cmd/swallow`.
      SWALLOW_API_CLI_BINARY: "/usr/local/share/swallow/bin/swallow"
      # The Directory (decision 082), off unless .env sets SWALLOW_API_DIRECTORY_URL=ldaps://ldap:636
      # and SWALLOW_API_DIRECTORY_HOST_URL=ldaps://<this host's LAN address>:636 after
      # ./ldap-secrets.sh, with `docker compose --profile directory up -d`.
      SWALLOW_API_DIRECTORY_URL: "${SWALLOW_API_DIRECTORY_URL:-}"
      SWALLOW_API_DIRECTORY_HOST_URL: "${SWALLOW_API_DIRECTORY_HOST_URL:-}"
      SWALLOW_API_DIRECTORY_BIND_PASSWORD_FILE: "/run/swallow/ldap/admin-password"
      SWALLOW_API_DIRECTORY_READER_PASSWORD_FILE: "/run/swallow/ldap/reader-password"
      SWALLOW_API_DIRECTORY_CA_FILE: "/run/swallow/ldap/ca.crt"
    ports:
      - "${API_HTTP_PORT:-30051}:30051"
      # Many BMCs mount only http:// on port 80, so the API is also published where BMCs reach it.
      # Loopback by default; set BOOT_MEDIA_HTTP_PUBLISH (for example 10.0.0.5:80) for a lab.
      - "${BOOT_MEDIA_HTTP_PUBLISH:-127.0.0.1:30080}:30051"
    volumes:
      - ../../api-server:/app
      - ./boot-media:/var/lib/swallow/boot-media
      - ./bin:/usr/local/share/swallow/bin:ro
      - ./air.toml:/etc/swallow/air.toml:ro
      - ./ldap:/run/swallow/ldap:ro
      - job-artifacts:/var/lib/swallow/jobs
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/cache
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/30051"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    build:
      context: ../..
      dockerfile: deploy/dev/api-server.Dockerfile
      args:
        UID: ${DEV_UID:-1001}
        GID: ${DEV_GID:-1001}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_MONGO_URI: "mongodb://mongo:27017"
      SWALLOW_API_MONGO_DB: "${SWALLOW_API_MONGO_DB:-swallow}"
      SWALLOW_API_JWT_SECRET: "${SWALLOW_API_JWT_SECRET:-dev-secret-change-me}"
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: "${SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD: "${SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      SWALLOW_API_CREDENTIAL_KEY: "${SWALLOW_API_CREDENTIAL_KEY:-K7i9npJw/Fx/XbU31LyNx4vOFKFFV7PmJT0XW8eH8/s=}"
      SWALLOW_API_MACHINE_TOKEN: "${SWALLOW_API_MACHINE_TOKEN:-dev-machine-token}"
      SWALLOW_API_TEMPORAL_ADDRESS: "temporal:7233"
      SWALLOW_API_TEMPORAL_NAMESPACE: "default"
      SWALLOW_API_TEMPORAL_TASK_QUEUE: "swallow-operations"
      SWALLOW_API_ANSIBLE_TASK_QUEUE: "swallow-ansible"
      # The worker's observation passes: provisioner reconcile (also Platform membership),
      # attached-hardware inventory, and the Redfish capability probe.
      SWALLOW_API_RECONCILE_INTERVAL: "${SWALLOW_API_RECONCILE_INTERVAL:-30s}"
      SWALLOW_API_INVENTORY_INTERVAL: "${SWALLOW_API_INVENTORY_INTERVAL:-15m}"
      SWALLOW_API_REDFISH_PROBE_INTERVAL: "${SWALLOW_API_REDFISH_PROBE_INTERVAL:-10m}"
      # Hardware inspection resolves a Server's Boot ISO when its ensure-boot-media Task runs
      # (decision 053), so the worker sees the Boot ISO files and their URL like the API does.
      SWALLOW_API_BOOT_MEDIA_DIR: "/var/lib/swallow/boot-media"
      SWALLOW_API_BOOT_MEDIA_BASE_URL: "${SWALLOW_API_BOOT_MEDIA_BASE_URL:-}"
      # The NTP server every provisioned Server is pointed at (decision 065): the address machines
      # reach this host by. Empty refuses OS deployments until it is set in .env.
      SWALLOW_API_NTP_SERVER: "${SWALLOW_API_NTP_SERVER:-}"
      # How deployed Servers and the Site Prometheus reach each other (monitoring.md §6.2, §7): the
      # URL a Platform's Grafana reads the metrics gateway at, and the addresses the Prometheus
      # scrapes from as the Servers see them. Empty refuses a Slurm deployment's Grafana and
      # Omnistat until they are set in .env.
      SWALLOW_API_PUBLIC_URL: "${SWALLOW_API_PUBLIC_URL:-}"
      SWALLOW_API_MONITORING_SCRAPE_ADDRESSES: "${SWALLOW_API_MONITORING_SCRAPE_ADDRESSES:-}"
      # The Node Exporter controller installs the Node Exporter on every deployed Server of a Site
      # with automation enabled (software-deployment.md, Node Exporter). The dev stack shares lab
      # machines, so it is off unless .env turns it on.
      SWALLOW_WORKER_NODE_EXPORTER_ENSURE: "${SWALLOW_WORKER_NODE_EXPORTER_ENSURE:-false}"
      # With a Directory, the directory client controller installs SSSD on every deployed lab Server
      # swallow automates; off unless .env turns it on, so a drill installs it on chosen Servers.
      SWALLOW_WORKER_DIRECTORY_CLIENT_ENSURE: "${SWALLOW_WORKER_DIRECTORY_CLIENT_ENSURE:-false}"
      # The Directory (decision 082), off unless .env sets SWALLOW_API_DIRECTORY_URL=ldaps://ldap:636
      # and SWALLOW_API_DIRECTORY_HOST_URL=ldaps://<this host's LAN address>:636 after
      # ./ldap-secrets.sh, with `docker compose --profile directory up -d`.
      SWALLOW_API_DIRECTORY_URL: "${SWALLOW_API_DIRECTORY_URL:-}"
      SWALLOW_API_DIRECTORY_HOST_URL: "${SWALLOW_API_DIRECTORY_HOST_URL:-}"
      SWALLOW_API_DIRECTORY_BIND_PASSWORD_FILE: "/run/swallow/ldap/admin-password"
      SWALLOW_API_DIRECTORY_READER_PASSWORD_FILE: "/run/swallow/ldap/reader-password"
      SWALLOW_API_DIRECTORY_CA_FILE: "/run/swallow/ldap/ca.crt"
    volumes:
      - ../../api-server:/app
      - ./air-worker.toml:/etc/swallow/air.toml:ro
      - ./ldap:/run/swallow/ldap:ro
      - ./boot-media:/var/lib/swallow/boot-media:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/cache

  ansible-executor:
    build:
      context: ../..
      dockerfile: deploy/dev/api-server.Dockerfile
      args:
        UID: ${DEV_UID:-1001}
        GID: ${DEV_GID:-1001}
    restart: unless-stopped
    # ansible-runner leaves its ssh-agent to be reaped by PID 1; Docker's init reaps it and
    # forwards signals, so finished runs do not accumulate zombies.
    init: true
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_MONGO_URI: "mongodb://mongo:27017"
      SWALLOW_API_MONGO_DB: "${SWALLOW_API_MONGO_DB:-swallow}"
      SWALLOW_API_JWT_SECRET: "${SWALLOW_API_JWT_SECRET:-dev-secret-change-me}"
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: "${SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD: "${SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      SWALLOW_API_CREDENTIAL_KEY: "${SWALLOW_API_CREDENTIAL_KEY:-K7i9npJw/Fx/XbU31LyNx4vOFKFFV7PmJT0XW8eH8/s=}"
      SWALLOW_API_MACHINE_TOKEN: "${SWALLOW_API_MACHINE_TOKEN:-dev-machine-token}"
      SWALLOW_API_TEMPORAL_ADDRESS: "temporal:7233"
      SWALLOW_API_TEMPORAL_NAMESPACE: "default"
      SWALLOW_API_TEMPORAL_TASK_QUEUE: "swallow-operations"
      SWALLOW_API_ANSIBLE_TASK_QUEUE: "swallow-ansible"
      SWALLOW_API_JOB_RUNTIME_DIR: "/tmp/swallow/jobs"
      SWALLOW_API_JOB_ARTIFACT_DIR: "/var/lib/swallow/jobs"
      # The executor prunes the job artifacts it writes, and their streamed task events.
      SWALLOW_API_JOB_ARTIFACT_RETENTION: "${SWALLOW_API_JOB_ARTIFACT_RETENTION:-720h}"
    volumes:
      - ../../api-server:/app
      - ./air-ansible-executor.toml:/etc/swallow/air.toml:ro
      - job-artifacts:/var/lib/swallow/jobs
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/cache

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    restart: unless-stopped
    depends_on:
      - api-server
    # The dev Site's Prometheus, with the same two jobs as the production installation's
    # (prometheus.yml). It reaches the api-server over the compose network for http_sd, and the
    # exporters on lab Servers by their own routable LAN address. host-gateway is mapped for
    # exporters that happen to live on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  # The dev Site's prom-label-proxy, with the production installation's arguments: every query is
  # confined to the platform_id in the X-Swallow-Platform-Id header. The api-server reaches it at
  # http://prom-label-proxy:8080; it is also published on loopback only (PROM_LABEL_PROXY_PORT) for
  # trying tenancy by hand, because it authenticates nobody.
  prom-label-proxy:
    image: ${PROM_LABEL_PROXY_IMAGE:-quay.io/prometheuscommunity/prom-label-proxy:v0.15.1}
    restart: unless-stopped
    depends_on:
      - prometheus
    command:
      - --insecure-listen-address=0.0.0.0:8080
      - --upstream=http://prometheus:9090
      - --label=platform_id
      - --header-name=X-Swallow-Platform-Id
      - --enable-label-apis
    ports:
      - "127.0.0.1:${PROM_LABEL_PROXY_PORT:-9091}:8080"

  # Creates Pulp's role and database in the dev PostgreSQL, then exits.
  pulp-db:
    image: postgres:16
    restart: "no"
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      PGHOST: temporal-postgresql
      PGUSER: temporal
      PGPASSWORD: temporal
    entrypoint:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE ROLE pulp LOGIN PASSWORD ''pulp''' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'pulp')\gexec
        SELECT 'CREATE DATABASE pulp OWNER pulp' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'pulp')\gexec
        SQL

  # Keys, schema migrations, admin password, and the deb signing service; then exits.
  pulp-init:
    <<: *pulp
    user: root
    restart: "no"
    depends_on:
      pulp-db:
        condition: service_completed_successfully
    command: ["/usr/local/share/swallow/init.sh"]
    volumes:
      - ./pulp/settings.py:/etc/pulp/settings.py:ro
      - ./pulp/sign-deb-release.sh:/usr/local/share/swallow/sign-deb-release.sh:ro
      - ./pulp/init.sh:/usr/local/share/swallow/init.sh:ro
      - pulp-certs:/etc/pulp/certs
      - pulp-data:/var/lib/pulp

  pulp-api:
    <<: *pulp
    restart: unless-stopped
    depends_on:
      pulp-init:
        condition: service_completed_successfully
    command: ["pulp-api"]
    healthcheck:
      test: ["CMD", "readyz.py", "/pulp/api/v3/status/"]
      interval: 10s
      timeout: 5s
      retries: 12

  pulp-content:
    <<: *pulp
    restart: unless-stopped
    depends_on:
      pulp-init:
        condition: service_completed_successfully
    command: ["pulp-content"]
    healthcheck:
      test: ["CMD", "readyz.py", "/pulp/content/"]
      interval: 10s
      timeout: 5s
      retries: 12

  pulp-worker:
    <<: *pulp
    restart: unless-stopped
    depends_on:
      pulp-init:
        condition: service_completed_successfully
    command: ["pulp-worker"]
    deploy:
      replicas: 2

  # The one address of the dev Pulp: API, registry (/v2/), Python index (/pypi/), and content.
  # Published on every interface, because lab Servers fetch from it.
  pulp-web:
    image: ${PULP_WEB_IMAGE:-docker.io/pulp/pulp-web:3.123.1}
    restart: unless-stopped
    user: root
    depends_on:
      pulp-api:
        condition: service_healthy
      pulp-content:
        condition: service_healthy
    command: ["/usr/bin/nginx.sh"]
    volumes:
      - ./pulp/nginx.sh:/usr/bin/nginx.sh:ro
      - ./pulp/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    ports:
      - "${PULP_HTTP_PORT:-8080}:8080"

  # The dev Directory (decision 082): the same OpenLDAP image a production installation runs, on
  # LDAPS only. Optional: run ./ldap-secrets.sh, then start it with the `directory` profile. Lab
  # Servers reach it at this host's port 636 (LDAP_PUBLISH).
  ldap:
    profiles: [directory]
    build:
      context: ../..
      dockerfile: deploy/production/ldap.Dockerfile
    restart: unless-stopped
    # The certificate names `ldap`, the name the worker connects to.
    hostname: ldap
    environment:
      LDAP_BASE_DN: "dc=swallow,dc=internal"
      LDAP_ADMIN_PASSWORD_FILE: /run/swallow/ldap/admin-password
      LDAP_READER_PASSWORD_FILE: /run/swallow/ldap/reader-password
      LDAP_TLS_CERT_FILE: /run/swallow/ldap/server.crt
      LDAP_TLS_KEY_FILE: /run/swallow/ldap/server.key
      LDAP_TLS_CA_FILE: /run/swallow/ldap/ca.crt
    volumes:
      - ./ldap:/run/swallow/ldap:ro
      - ldap-data:/var/lib/ldap
    ports:
      - "${LDAP_PUBLISH:-636}:636"
    healthcheck:
      test: ["CMD", "ldapwhoami", "-Q", "-Y", "EXTERNAL", "-H", "ldapi:///"]
      interval: 10s
      timeout: 5s
      retries: 6

  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
      args:
        UID: ${DEV_UID:-1001}
        GID: ${DEV_GID:-1001}
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      VITE_DEV_API_PROXY_TARGET: "http://api-server:30051"
      # Empty by default: the dashboard then derives the API address from whatever host
      # the browser used to reach it, which works from this host, from the LAN, and
      # through a tunnel without anyone having to remember to change it.
      #
      # Set it only when the API is somewhere the browser cannot infer — behind a
      # reverse proxy, or on a different port. Read by the browser, not the container,
      # so restart this service after changing it.
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    volumes:
      - ../../dashboard:/app
      - ./dashboard-entrypoint.sh:/etc/swallow/dashboard-entrypoint.sh:ro
      - npm-cache:/npm-cache

volumes:
  mongo-data:
  job-artifacts:
  go-mod-cache:
  go-build-cache:
  npm-cache:
  prometheus-data:
  temporal-postgres-data:
  pulp-certs:
  pulp-data:
  ldap-data:
