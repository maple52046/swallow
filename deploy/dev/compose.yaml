name: swallow-dev

# Local development stack for the whole platform: MongoDB plus every component
# in src/, each running from a bind-mounted working tree with hot reload.
# Every setting below has a development default, so the stack starts without a
# .env file; copy .env.example to .env only when you need to override something.

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: temporal_core
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"

  api-server:
    build:
      context: ../..
      dockerfile: deploy/dev/api-server.Dockerfile
      args:
        UID: ${DEV_UID:-1001}
        GID: ${DEV_GID:-1001}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    # This api-server runs on the default bridge network, where `localhost` means the
    # container itself. Map host.docker.internal to the host gateway so an integration
    # endpoint that lives on the host (e.g. a MAAS at http://host.docker.internal:5240/MAAS)
    # is reachable. Integrations on the LAN or other baremetal are reached by their own
    # routable address and need nothing here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_MONGO_URI: "mongodb://mongo:27017"
      SWALLOW_API_MONGO_DB: "${SWALLOW_API_MONGO_DB:-swallow}"
      SWALLOW_API_JWT_SECRET: "${SWALLOW_API_JWT_SECRET:-dev-secret-change-me}"
      SWALLOW_API_JWT_EXPIRY_HOURS: "${SWALLOW_API_JWT_EXPIRY_HOURS:-24}"
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: "${SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD: "${SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      # Seals integration credentials at rest. Required: without it an integration
      # cannot be registered, and starting anyway would defer that failure to the
      # first operator who tries. The dev default is a fixed key on purpose — it is
      # not a secret, and a real installation must supply its own.
      SWALLOW_API_CREDENTIAL_KEY: "${SWALLOW_API_CREDENTIAL_KEY:-K7i9npJw/Fx/XbU31LyNx4vOFKFFV7PmJT0XW8eH8/s=}"
      # Static bearer token for machine-to-machine discovery.
      SWALLOW_API_MACHINE_TOKEN: "${SWALLOW_API_MACHINE_TOKEN:-dev-machine-token}"
      # Reconciliation, hardware inventory, and embedded-operation dispatch cadence.
      SWALLOW_API_RECONCILE_INTERVAL: "${SWALLOW_API_RECONCILE_INTERVAL:-30s}"
      SWALLOW_API_INVENTORY_INTERVAL: "${SWALLOW_API_INVENTORY_INTERVAL:-15m}"
      SWALLOW_API_OPERATION_DISPATCH_INTERVAL: "${SWALLOW_API_OPERATION_DISPATCH_INTERVAL:-1s}"
      SWALLOW_API_OPERATION_LEASE_DURATION: "${SWALLOW_API_OPERATION_LEASE_DURATION:-90s}"
      SWALLOW_API_TEMPORAL_ADDRESS: "temporal:7233"
      SWALLOW_API_TEMPORAL_NAMESPACE: "default"
      SWALLOW_API_TEMPORAL_TASK_QUEUE: "swallow-operations"
      SWALLOW_API_JOB_RUNTIME_DIR: "/tmp/swallow/jobs"
      SWALLOW_API_JOB_ARTIFACT_DIR: "/var/lib/swallow/jobs"
      SWALLOW_API_JOB_ARTIFACT_RETENTION: "${SWALLOW_API_JOB_ARTIFACT_RETENTION:-720h}"
    ports:
      - "${API_HTTP_PORT:-30051}:30051"
    volumes:
      - ../../api-server:/app
      - ./air.toml:/etc/swallow/air.toml:ro
      - job-artifacts:/var/lib/swallow/jobs
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/cache
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/30051"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    build:
      context: ../..
      dockerfile: deploy/dev/api-server.Dockerfile
      args:
        UID: ${DEV_UID:-1001}
        GID: ${DEV_GID:-1001}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_MONGO_URI: "mongodb://mongo:27017"
      SWALLOW_API_MONGO_DB: "${SWALLOW_API_MONGO_DB:-swallow}"
      SWALLOW_API_JWT_SECRET: "${SWALLOW_API_JWT_SECRET:-dev-secret-change-me}"
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: "${SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD: "${SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      SWALLOW_API_CREDENTIAL_KEY: "${SWALLOW_API_CREDENTIAL_KEY:-K7i9npJw/Fx/XbU31LyNx4vOFKFFV7PmJT0XW8eH8/s=}"
      SWALLOW_API_MACHINE_TOKEN: "${SWALLOW_API_MACHINE_TOKEN:-dev-machine-token}"
      SWALLOW_API_OPERATION_DISPATCH_INTERVAL: "${SWALLOW_API_OPERATION_DISPATCH_INTERVAL:-1s}"
      SWALLOW_API_OPERATION_LEASE_DURATION: "${SWALLOW_API_OPERATION_LEASE_DURATION:-90s}"
      SWALLOW_API_TEMPORAL_ADDRESS: "temporal:7233"
      SWALLOW_API_TEMPORAL_NAMESPACE: "default"
      SWALLOW_API_TEMPORAL_TASK_QUEUE: "swallow-operations"
      SWALLOW_API_JOB_RUNTIME_DIR: "/tmp/swallow/jobs"
      SWALLOW_API_JOB_ARTIFACT_DIR: "/var/lib/swallow/jobs"
    volumes:
      - ../../api-server:/app
      - ./air-worker.toml:/etc/swallow/air.toml:ro
      - job-artifacts:/var/lib/swallow/jobs
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/cache

  ansible-executor:
    build:
      context: ../..
      dockerfile: deploy/dev/api-server.Dockerfile
      args:
        UID: ${DEV_UID:-1001}
        GID: ${DEV_GID:-1001}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SWALLOW_API_ADDR: ":30051"
      SWALLOW_API_MONGO_URI: "mongodb://mongo:27017"
      SWALLOW_API_MONGO_DB: "${SWALLOW_API_MONGO_DB:-swallow}"
      SWALLOW_API_JWT_SECRET: "${SWALLOW_API_JWT_SECRET:-dev-secret-change-me}"
      SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME: "${SWALLOW_API_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD: "${SWALLOW_API_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      SWALLOW_API_CREDENTIAL_KEY: "${SWALLOW_API_CREDENTIAL_KEY:-K7i9npJw/Fx/XbU31LyNx4vOFKFFV7PmJT0XW8eH8/s=}"
      SWALLOW_API_MACHINE_TOKEN: "${SWALLOW_API_MACHINE_TOKEN:-dev-machine-token}"
      SWALLOW_API_OPERATION_DISPATCH_INTERVAL: "${SWALLOW_API_OPERATION_DISPATCH_INTERVAL:-1s}"
      SWALLOW_API_OPERATION_LEASE_DURATION: "${SWALLOW_API_OPERATION_LEASE_DURATION:-90s}"
      SWALLOW_API_TEMPORAL_ADDRESS: "temporal:7233"
      SWALLOW_API_TEMPORAL_NAMESPACE: "default"
      SWALLOW_API_TEMPORAL_TASK_QUEUE: "swallow-operations"
      SWALLOW_API_JOB_RUNTIME_DIR: "/tmp/swallow/jobs"
      SWALLOW_API_JOB_ARTIFACT_DIR: "/var/lib/swallow/jobs"
    volumes:
      - ../../api-server:/app
      - ./air-ansible-executor.toml:/etc/swallow/air.toml:ro
      - job-artifacts:/var/lib/swallow/jobs
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/cache

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    restart: unless-stopped
    depends_on:
      - api-server
    # Reaches the api-server over the compose network for http_sd, and reaches lab VMs
    # (node-exporter/rdc-exporter targets) by their own routable LAN address. host-gateway
    # is mapped for exporters that happen to live on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
      args:
        UID: ${DEV_UID:-1001}
        GID: ${DEV_GID:-1001}
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      VITE_DEV_API_PROXY_TARGET: "http://api-server:30051"
      # Empty by default: the dashboard then derives the API address from whatever host
      # the browser used to reach it, which works from this host, from the LAN, and
      # through a tunnel without anyone having to remember to change it.
      #
      # Set it only when the API is somewhere the browser cannot infer — behind a
      # reverse proxy, or on a different port. Read by the browser, not the container,
      # so restart this service after changing it.
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    volumes:
      - ../../dashboard:/app
      - ./dashboard-entrypoint.sh:/etc/swallow/dashboard-entrypoint.sh:ro
      - npm-cache:/npm-cache

volumes:
  mongo-data:
  job-artifacts:
  go-mod-cache:
  go-build-cache:
  npm-cache:
  prometheus-data:
  temporal-postgres-data:
