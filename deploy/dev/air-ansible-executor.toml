# Hot-reload config for the api-server dev container.
# Build artefacts go to /tmp inside the container so the bind-mounted
# working tree stays clean.

root = "/app"
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/swallow-api ./cmd/swallow-api"
  bin = "/tmp/air/swallow-api"
  args_bin = ["ansible-executor"]
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["bin", "docs", "tests"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = false
  send_interrupt = true
  kill_delay = "2s"
  # An instance Air failed to stop (a rebuild during a failing build, a graceful stop that outlives
  # kill_delay) keeps running beside the new one: a worker or executor keeps its controller leases
  # and task polling with the old code, and an api-server keeps the port. End every instance first.
  pre_cmd = ["pkill -x swallow-api; sleep 2; pkill -9 -x swallow-api; true"]

[log]
  time = true

[misc]
  clean_on_exit = true
