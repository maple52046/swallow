global:
  scrape_interval: 30s
  evaluation_interval: 30s

# The production installation serves swallow over plain HTTP on port 80. When a TLS
# terminator fronts it, switch each URL to https and add a tls_config with its CA.
scrape_configs:
  - job_name: swallow-api
    scheme: http
    static_configs:
      - targets: [swallow.example.internal]
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/swallow-machine-token

  - job_name: site-node-exporter
    http_sd_configs:
      - url: http://swallow.example.internal/api/v1/discovery/prometheus?port=9100
        refresh_interval: 60s
        authorization:
          credentials_file: /run/secrets/swallow-machine-token

  # AMD GPU servers only: the tag filter selects machines tagged amd-gpu, so this job
  # never produces a failing target on a CPU-only host. The RDC exporter listens on 5000.
  - job_name: site-rdc-exporter
    http_sd_configs:
      - url: http://swallow.example.internal/api/v1/discovery/prometheus?port=5000&tag=amd-gpu
        refresh_interval: 60s
        authorization:
          credentials_file: /run/secrets/swallow-machine-token

# An installation may add remote_write here without changing Swallow's label contract.
