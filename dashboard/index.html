<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swallow</title>
    <script>
      try {
        var rawAppearance = window.localStorage.getItem('swallow.appearance') || 'system';
        var stored = rawAppearance.charAt(0) === '"' ? JSON.parse(rawAppearance) : rawAppearance;
        var appearance = stored === 'light' || stored === 'dark' ? stored : 'system';
        var dark = appearance === 'dark' || (appearance === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
