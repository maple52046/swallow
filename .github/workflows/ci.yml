name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api-server/go.mod
          cache-dependency-path: api-server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Go tests and vet
        working-directory: api-server
        run: |
          go test ./...
          go vet ./...
      - name: Dashboard lint and production build
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Validate Compose and release contracts
        env:
          SWALLOW_RELEASE_VERSION: 0.0.0-ci
          SWALLOW_API_IMAGE: ghcr.io/example/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SWALLOW_DASHBOARD_IMAGE: ghcr.io/example/dashboard@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SWALLOW_MONGO_IMAGE: mongo@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          PROMETHEUS_IMAGE: prom/prometheus@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          # The durable orchestration topology adds digest-pinned Temporal images; the
          # production and testing compose files require them, so config validation must
          # supply placeholders.
          SWALLOW_TEMPORAL_POSTGRES_IMAGE: postgres@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          SWALLOW_TEMPORAL_SERVER_IMAGE: temporalio/auto-setup@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          SWALLOW_TEMPORAL_UI_IMAGE: temporalio/ui@sha256:1111111111111111111111111111111111111111111111111111111111111111
        run: |
          docker compose -f deploy/dev/compose.yaml config --quiet
          docker compose -f deploy/production/compose.yaml config --quiet
          docker compose -f deploy/testing/compose.yaml config --quiet
          docker compose -f deploy/third-party/prometheus/compose.yaml config --quiet
          ./deploy/release/validate.sh
      - name: Build production images
        run: |
          docker build -f deploy/production/api-server.Dockerfile -t swallow-api:ci .
          docker build -f deploy/production/dashboard.Dockerfile -t swallow-dashboard:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: swallow-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan Dashboard image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: swallow-dashboard:ci
          format: sarif
          output: trivy-dashboard.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload API scan
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
      - name: Upload Dashboard scan
        if: always() && hashFiles('trivy-dashboard.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dashboard.sarif
