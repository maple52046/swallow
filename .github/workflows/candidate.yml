name: Candidate

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/swallow-api
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/swallow-dashboard
  MONGO_IMAGE: ${{ vars.SWALLOW_MONGO_IMAGE }}
  # Release-approved digests for the durable orchestration topology, consumed by
  # deploy/release/assemble-candidate.sh when it writes the candidate manifest.
  TEMPORAL_POSTGRES_IMAGE: ${{ vars.SWALLOW_TEMPORAL_POSTGRES_IMAGE }}
  TEMPORAL_SERVER_IMAGE: ${{ vars.SWALLOW_TEMPORAL_SERVER_IMAGE }}
  TEMPORAL_UI_IMAGE: ${{ vars.SWALLOW_TEMPORAL_UI_IMAGE }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      SWALLOW_RELEASE_VERSION: 0.0.0-candidate
      SWALLOW_API_IMAGE: ghcr.io/example/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SWALLOW_DASHBOARD_IMAGE: ghcr.io/example/dashboard@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      SWALLOW_MONGO_IMAGE: ${{ vars.SWALLOW_MONGO_IMAGE }}
      PROMETHEUS_IMAGE: prom/prometheus@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      SWALLOW_TEMPORAL_POSTGRES_IMAGE: postgres@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      SWALLOW_TEMPORAL_SERVER_IMAGE: temporalio/auto-setup@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      SWALLOW_TEMPORAL_UI_IMAGE: temporalio/ui@sha256:1111111111111111111111111111111111111111111111111111111111111111
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation
        run: python3 scripts/check-docs.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: api-server/go.mod
          cache-dependency-path: api-server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Test source and installation contracts
        run: |
          (cd api-server && go test ./... && go vet ./...)
          (cd dashboard && npm ci && npm run lint && npm run build)
          docker compose -f deploy/dev/compose.yaml config --quiet
          docker compose -f deploy/production/compose.yaml config --quiet
          docker compose -f deploy/testing/compose.yaml config --quiet
          docker compose -f deploy/third-party/prometheus/compose.yaml config --quiet
          ./deploy/release/validate.sh

  build_once:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
      dashboard-digest: ${{ steps.dashboard.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: deploy/production/api-server.Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=0.0.0-candidate
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}
      - uses: docker/build-push-action@v6
        id: dashboard
        with:
          context: .
          file: deploy/production/dashboard.Dockerfile
          push: true
          tags: ${{ env.DASHBOARD_IMAGE }}:sha-${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign immutable candidates
        run: |
          cosign sign --yes "${API_IMAGE}@${{ steps.api.outputs.digest }}"
          cosign sign --yes "${DASHBOARD_IMAGE}@${{ steps.dashboard.outputs.digest }}"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.API_IMAGE }}@${{ steps.api.outputs.digest }}
          format: spdx-json
          output-file: api.spdx.json
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DASHBOARD_IMAGE }}@${{ steps.dashboard.outputs.digest }}
          format: spdx-json
          output-file: dashboard.spdx.json
      - name: Assemble candidate artifacts
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.dashboard.outputs.digest }}
        run: ./deploy/release/assemble-candidate.sh "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: out/candidate/
          if-no-files-found: error
          retention-days: 30

  test_candidate:
    needs: build_once
    runs-on: ubuntu-24.04
    env:
      SWALLOW_API_IMAGE: ghcr.io/${{ github.repository_owner }}/swallow-api@${{ needs.build_once.outputs.api-digest }}
      SWALLOW_DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/swallow-dashboard@${{ needs.build_once.outputs.dashboard-digest }}
      SWALLOW_MONGO_IMAGE: ${{ vars.SWALLOW_MONGO_IMAGE }}
      SWALLOW_RELEASE_VERSION: 0.0.0-candidate
      SWALLOW_HTTP_PORT: "18080"
      SWALLOW_HTTPS_PORT: "18443"
      COMPOSE_PROJECT_NAME: swallow-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start exact candidate digests
        run: |
          ./deploy/testing/prepare.sh
          docker compose --project-directory deploy/testing -f deploy/testing/compose.yaml up -d
          for attempt in {1..60}; do
            if curl --fail --silent --insecure https://127.0.0.1:18443/readyz >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "60" ]]; then
              docker compose --project-directory deploy/testing -f deploy/testing/compose.yaml logs
              exit 1
            fi
            sleep 2
          done
          ./deploy/testing/seed.sh
          curl --fail --silent --insecure https://127.0.0.1:18443/livez |
            jq -e '.version == "0.0.0-candidate"'
      - name: Remove ephemeral testing stack
        if: always()
        run: docker compose --project-directory deploy/testing -f deploy/testing/compose.yaml down --volumes
